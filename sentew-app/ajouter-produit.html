<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajouter un produit - SEN TEW</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#f5f5f5;padding-bottom:100px}
.header{background:linear-gradient(135deg,#00a651,#008a44);color:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px}
.header h1{font-size:17px}
form{padding:16px;max-width:600px;margin:0 auto}
.field{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px}
.field label{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:6px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;padding:10px;border-radius:8px;font-size:15px;color:#222;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-slot{aspect-ratio:1;background:#f9f9f9;border:2px dashed #00a651;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#00a651;cursor:pointer}
.submit{width:100%;background:linear-gradient(135deg,#00a651,#008a44);color:#fff;border:none;padding:16px;border-radius:12px;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<header class="header">
  <button class="back" onclick="history.back()">←</button>
  <h1>➕ Nouveau produit</h1>
</header>
<form onsubmit="save(event)">
  <div class="field">
    <label>📸 Photos produit (max 5)</label>
    <div class="photo-grid">
      <div class="photo-slot" onclick="pick(0)">📷<input type="file" hidden accept="image/*"></div>
      <div class="photo-slot" onclick="pick(1)">📷</div>
      <div class="photo-slot" onclick="pick(2)">📷</div>
      <div class="photo-slot" onclick="pick(3)">📷</div>
      <div class="photo-slot" onclick="pick(4)">📷</div>
    </div>
  </div>
  <div class="field"><label>Nom du produit *</label><input required placeholder="Ex: Boubou traditionnel"></div>
  <div class="field"><label>Description *</label><textarea required placeholder="Description détaillée..."></textarea></div>
  <div class="row">
    <div class="field"><label>Prix (FCFA) *</label><input type="number" required placeholder="25000"></div>
    <div class="field"><label>Prix barré</label><input type="number" placeholder="35000"></div>
  </div>
  <div class="row">
    <div class="field"><label>Stock *</label><input type="number" required placeholder="10"></div>
    <div class="field"><label>Catégorie *</label>
      <select required>
        <option>Mode</option><option>Électronique</option><option>Beauté</option>
        <option>Alimentation</option><option>Maison</option><option>Enfants</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>🏷️ Étiquettes</label>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">
      <label style="font-size:13px"><input type="checkbox"> 🔥 Promo</label>
      <label style="font-size:13px"><input type="checkbox"> 📍 Local</label>
      <label style="font-size:13px"><input type="checkbox"> ⚡ Livraison rapide</label>
      <label style="font-size:13px"><input type="checkbox"> 🎥 LIVE éligible</label>
    </div>
  </div>
  <button class="submit" type="submit">✅ Publier le produit</button>
</form>
<script>
function pick(i){alert('📷 Photo '+(i+1)+' sélectionnée (démo)')}
function save(e){
  e.preventDefault();
  alert('✅ Produit publié avec succès !\n\nEn attente de validation par SEN TEW (24-48h).');
  location.href='vendeur.html';
}
</script>
</body></html>
