<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Studio — SEN TEW</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',sans-serif}
body{background:#000;color:#fff;overflow:hidden;height:100dvh}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.overlay{position:fixed;z-index:10}
#topBar{top:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:10px;background:linear-gradient(#000a,transparent)}
#topBar a{color:#fff;text-decoration:none;font-size:22px}
.badge-live{background:#e33;color:#fff;padding:5px 12px;border-radius:8px;font-weight:700;font-size:13px;display:none;align-items:center;gap:5px}
.badge-live.on{display:flex}
#viewers{background:#0008;padding:5px 12px;border-radius:8px;font-size:13px}
#timer{margin-left:auto;background:#0008;padding:5px 12px;border-radius:8px;font-size:13px;font-variant-numeric:tabular-nums}
#vendorInfo{position:fixed;top:60px;left:12px;display:flex;align-items:center;gap:8px;background:#0007;padding:6px 12px;border-radius:30px;z-index:10}
#vendorInfo img{width:34px;height:34px;border-radius:50%;object-fit:cover}
#vendorInfo b{font-size:13px}
#vendorInfo span{font-size:11px;color:#ccc;display:block}
#comments{position:fixed;left:10px;bottom:170px;width:72%;max-height:34vh;overflow-y:auto;z-index:10;display:flex;flex-direction:column;gap:6px;mask-image:linear-gradient(transparent,#000 20%)}
.cmt{background:#0009;padding:7px 12px;border-radius:14px;font-size:13px;width:fit-content;max-width:100%;animation:in .3s}
.cmt b{color:#ffd76a;margin-right:5px}
.cmt.order{background:#0b6b3a;color:#fff;font-weight:600}
.cmt.sys{background:#e33;color:#fff;font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#hearts{position:fixed;right:70px;bottom:200px;z-index:9;pointer-events:none}
.heart{position:absolute;font-size:26px;animation:up 2.4s ease-out forwards}
@keyframes up{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-220px) scale(1.3)}}
#sideBar{position:fixed;right:10px;bottom:180px;display:flex;flex-direction:column;gap:16px;z-index:10;text-align:center}
.side-btn{background:#0008;border:none;color:#fff;width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer}
.side-btn small{display:block;font-size:10px}
#products{position:fixed;left:0;right:0;bottom:86px;display:flex;gap:10px;padding:0 12px;overflow-x:auto;z-index:10}
.prod{background:#fff;color:#111;border-radius:12px;padding:8px;min-width:130px;display:flex;gap:8px;align-items:center}
.prod img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.prod b{font-size:12px;display:block}
.prod span{color:#0b6b3a;font-weight:700;font-size:12px}
#controls{position:fixed;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,#000c);z-index:11;display:flex;gap:10px}
.btn{flex:1;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer}
#btnStart{background:#e33;color:#fff}
#btnFlip{background:#ffffff22;color:#fff;flex:0 0 60px}
#btnShare{background:#0b6b3a;color:#fff;flex:0 0 60px}
#setup{position:fixed;inset:0;background:#0b1410;z-index:20;display:flex;flex-direction:column;padding:22px;gap:14px}
#setup h2{font-size:20px}
#setup label{font-size:12px;color:#9fb4a8;letter-spacing:.5px}
#setup select,#setup input{background:#12241c;border:1px solid #1e3a2e;color:#fff;padding:14px;border-radius:12px;font-size:15px;width:100%}
.hint{font-size:12px;color:#7a948a}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0b6b3a;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:50;display:none}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>

<div id="setup">
  <h2>🔴 Studio Live</h2>
  <label>BOUTIQUE</label>
  <select id="shopSel"><option value="">Chargement…</option></select>
  <label>TITRE DU LIVE</label>
  <input id="liveTitle" placeholder="Ex : Nouvelle collection Wax 2026" maxlength="80">
  <p class="hint">En direct depuis ton navigateur — aucune application. Garde cet onglet ouvert pendant tout le live.</p>
  <button class="btn" id="btnStart2" style="background:#0b6b3a;color:#fff">📷 Préparer ma caméra</button>
</div>

<div class="overlay" id="topBar">
  <a href="vendeur.html">←</a>
  <span class="badge-live" id="liveBadge">● LIVE</span>
  <span id="viewers">👁 0</span>
  <span id="timer">00:00</span>
</div>
<div id="vendorInfo"><img id="vAvatar" src="https://raw.githubusercontent.com/sen-ecosystem/Sen-landing-hub/main/sentew-app/assets/logo.png"><div><b id="vName">—</b><span id="vSubs">0 abonné</span></div></div>
<div id="comments"></div>
<div id="hearts"></div>
<div id="sideBar">
  <button class="side-btn" onclick="addHeart()">❤️<small id="likeCount">0</small></button>
  <button class="side-btn" onclick="shareLive()">🔗<small>Lien</small></button>
</div>
<div id="products"></div>
<div id="controls">
  <button class="btn" id="btnFlip" onclick="flipCam()">🔄</button>
  <button class="btn" id="btnStart" onclick="toggleLive()">🔴 Passer EN DIRECT</button>
  <button class="btn" id="btnShare" onclick="shareLive()">📤</button>
</div>
<div id="toast"></div>

<script>
const SUPA_URL="https://tjqkruhwmjzgfvtouqza.supabase.co";
const SUPA_KEY="sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j";
const WHIP="https://customer-k4ked423d85xz498.cloudflarestream.com/22984669988fefcad250cafac0644829/webRTC/publish";
const WATCH="https://sen-ecosystem.com/sentew-app/live.html";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let stream,pc,liveId,onAir=false,t0,clock,likes=0,facing="user",vendorName="",shopId="";

const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600);}
// Filtre anti-numéros / liens externes (protège la commission)
function sanitize(txt){
  let bad=/(\+?\d[\d\s.\-]{6,}\d)|wa\.me|whatsapp|t\.me|telegram/i.test(txt);
  if(bad) return {blocked:true};
  return {blocked:false, text:txt};
}
function addComment(author,text,cls){
  const d=document.createElement("div");d.className="cmt"+(cls?" "+cls:"");
  d.innerHTML="<b>"+author+"</b>"+text;
  const c=$("comments");c.appendChild(d);c.scrollTop=c.scrollHeight;
  while(c.children.length>25)c.removeChild(c.firstChild);
}
function addHeart(){likes++;$("likeCount").textContent=likes;
  const h=document.createElement("span");h.className="heart";h.textContent="❤️";
  h.style.left=(Math.random()*40)+"px";$("hearts").appendChild(h);setTimeout(()=>h.remove(),2400);
  if(liveId) sb.from("live_likes").insert({live_id:liveId}).then(()=>{});
}
async function loadShops(){
  try{
    const email=localStorage.getItem("st_email")||"";
    const {data}=await sb.from("shops").select("id,name,verified").eq("owner_email",email);
    const sel=$("shopSel");sel.innerHTML="";
    (data||[]).forEach(s=>{const o=document.createElement("option");o.value=s.id+"|"+s.name;o.textContent=s.name+(s.verified?" ✓":"");sel.appendChild(o);});
    if(!data||!data.length){sel.innerHTML="<option value='demo|Ma Boutique'>Ma Boutique</option>";}
  }catch(e){$("shopSel").innerHTML="<option value='demo|Ma Boutique'>Ma Boutique</option>";}
}
async function loadProducts(){
  if(!shopId)return;
  const {data}=await sb.from("products").select("id,name,price,image_url").eq("shop_id",shopId).limit(10);
  const bar=$("products");bar.innerHTML="";
  (data||[]).forEach(p=>{
    const d=document.createElement("div");d.className="prod";
    d.innerHTML=(p.image_url?`<img src="${p.image_url}">`:"")+`<div><b>${p.name}</b><span>${Number(p.price).toLocaleString("fr-FR")} F</span></div>`;
    bar.appendChild(d);
  });
}
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true});
    $("cam").srcObject=stream;
    $("setup").style.display="none";
  }catch(e){toast("Caméra refusée — autorise l'accès");}
}
async function flipCam(){
  facing=facing==="user"?"environment":"user";
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
  $("cam").srcObject=stream;
  if(onAir&&pc){const vt=stream.getVideoTracks()[0];const s=pc.getSenders().find(s=>s.track&&s.track.kind==="video");if(s)s.replaceTrack(vt);}
}
async function toggleLive(){
  if(!onAir){ // START
    const v=($("shopSel").value||"demo|Ma Boutique").split("|");
    shopId=v[0];vendorName=v[1];$("vName").textContent=vendorName;
    const title=$("liveTitle").value.trim()||"Live "+vendorName;
    try{
      pc=new RTCPeerConnection();
      stream.getTracks().forEach(t=>pc.addTrack(t,stream));
      await pc.setLocalDescription(await pc.createOffer({offerToReceiveVideo:false,offerToReceiveAudio:false}));
      const res=await fetch(WHIP,{method:"POST",headers:{"Content-Type":"application/sdp"},body:pc.localDescription.sdp});
      if(!res.ok)throw new Error("WHIP "+res.status);
      const sdp=await res.text();
      await pc.setRemoteDescription({type:"answer",sdp});
      // Live auto : aucune autorisation admin requise
      const {data}=await sb.from("live_streams").insert({title,vendor:vendorName,shop_id:shopId,status:"live"}).select().single();
      liveId=data?data.id:null;
      onAir=true;$("liveBadge").classList.add("on");$("btnStart").textContent="⏹ Terminer le live";$("btnStart").style.background="#333";
      t0=Date.now();clock=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");},1000);
      addComment("Système","Live démarré — bienvenue !","sys");
      subscribeLive();
      loadProducts();
    }catch(e){toast("Erreur diffusion : "+e.message);}
  }else{ // STOP
    if(pc)pc.close();
    if(liveId)await sb.from("live_streams").update({status:"ended"}).eq("id",liveId);
    onAir=false;clearInterval(clock);$("liveBadge").classList.remove("on");
    $("btnStart").textContent="🔴 Passer EN DIRECT";$("btnStart").style.background="#e33";
    addComment("Système","Live terminé. Merci !","sys");
  }
}
function subscribeLive(){
  if(!liveId)return;
  sb.channel("live-"+liveId)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"live_comments",filter:"live_id=eq."+liveId},pl=>{
      const c=pl.new; const chk=sanitize(c.text||"");
      addComment(c.author||"Client", chk.blocked?"🔒 message masqué":c.text);
    })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"live_likes",filter:"live_id=eq."+liveId},()=>{likes++;$("likeCount").textContent=likes;})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"orders",filter:"live_id=eq."+liveId},pl=>{
      addComment("🛒 Commande",(pl.new.product_name||"Produit")+" — "+(pl.new.total||"")+" F","order");
    })
    .subscribe();
  // Compteur spectateurs (estimation via table viewers)
  setInterval(async()=>{
    const {count}=await sb.from("live_viewers").select("*",{count:"exact",head:true}).eq("live_id",liveId);
    $("viewers").textContent="👁 "+(count||0);
  },8000);
}
function shareLive(){
  const url=WATCH+(liveId?"?id="+liveId:"");
  if(navigator.share){navigator.share({title:"Live SEN TEW",url});}
  else{navigator.clipboard.writeText(url);toast("Lien copié — partage-le sur WhatsApp");}
}
$("btnStart2").onclick=startCam;
loadShops();
</script>
</body>
</html>
