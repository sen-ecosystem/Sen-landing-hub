<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live Vendeur — SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1f17;color:#fff;font-family:system-ui;min-height:100vh}
header{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1f4a38}
h1{font-size:17px;margin:0}
main{max-width:520px;margin:0 auto;padding:14px 14px 60px}
.card{background:#122b21;border:1px solid #1f4a38;border-radius:16px;padding:16px;margin-bottom:14px}
select,input[type=text]{width:100%;padding:13px;border-radius:12px;background:#0a1f17;border:1px solid #1f4a38;color:#fff;font-size:14px;margin:6px 0 12px}
label{font-size:12px;color:#9db8ad}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:6px}
.btn-r{background:linear-gradient(135deg,#e02424,#c0392b);color:#fff}
.btn-g{background:linear-gradient(135deg,#0f6b4e,#12875f);color:#fff}
.btn-w{background:#25d366;color:#06281c}
.btn-o{background:transparent;border:1.5px solid #1f4a38;color:#cfe5da}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:9/16;max-height:50vh;object-fit:cover}
code{display:block;background:#0a1f17;border-radius:10px;padding:10px;font-size:11px;color:#4ade80;word-break:break-all;margin:6px 0}
.msg{font-size:13px;color:#f0b429;margin-top:10px;display:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e02424;animation:pu 1.2s infinite;margin-right:6px}
@keyframes pu{50%{opacity:.4}}
small{color:#7d968b;font-size:11px;line-height:1.5;display:block;margin-top:8px}
</style></head>
<body>
<header><a href="vendeur.html" style="color:#fff"><i data-lucide="arrow-left" class="icon"></i></a><h1>🔴 Lancer un live</h1></header>
<main>
<div class="card" id="step1">
<label>Boutique</label><select id="shop"><option>Chargement…</option></select>
<label>Titre du live</label><input id="title" placeholder="Ex : Nouvelle collection Wax 🔥">
<button class="btn btn-g" onclick="prep()">📷 Préparer ma caméra</button>
</div>
<div class="card" id="step2" style="display:none">
<video id="cam" autoplay playsinline muted></video>
<button class="btn btn-r" id="goBtn" onclick="goLive()">🔴 Passer EN DIRECT</button>
<div class="msg" id="m2"></div>
<small>Tu diffuses directement depuis cette page — aucune application à installer. Garde cet onglet ouvert pendant le live.</small>
</div>
<div class="card" id="step3" style="display:none">
<div style="font-weight:800;margin-bottom:8px"><span class="dot"></span>EN DIRECT</div>
<label>Lien spectateurs à partager :</label>
<code id="watch"></code>
<button class="btn btn-w" onclick="shareLive()">📤 Partager sur WhatsApp</button>
<button class="btn btn-o" onclick="cp()">📋 Copier le lien</button>
<button class="btn btn-o" style="border-color:#c0392b;color:#ff8a7a" onclick="endLive()">⏹ Terminer le live</button>
</div>
<div class="msg" id="msg"></div>
</main>
<script>
var SUPA="https://tjqkruhwmjzgfvtouqza.supabase.co",KEY="sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j";
var STREAM=null,PC=null,WHIP='',WHEP='',WATCH='';
function H(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};}
function $(i){return document.getElementById(i);}
function toast(m){var t=$('msg');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}
function m2(m){var t=$('m2');t.textContent=m;t.style.display='block';}
function cp(){if(navigator.clipboard)navigator.clipboard.writeText(WATCH);toast('Lien copié ✓');}
function shareLive(){window.open('https://wa.me/?text='+encodeURIComponent('🔴 EN DIRECT : '+($('title').value||'Live SEN TEW')+'\nRegarde maintenant : '+WATCH),'_blank');}
function loadShops(){fetch(SUPA+'/rest/v1/vendors?select=id,shop_name,slug&order=shop_name',{headers:H()}).then(function(r){return r.json();}).then(function(a){var s=$('shop');s.innerHTML='';(a||[]).forEach(function(v){var o=document.createElement('option');o.value=v.slug||v.id;o.textContent=v.shop_name;s.appendChild(o);});if(!a||!a.length)s.innerHTML='<option value="">Aucune boutique</option>';}).catch(function(){toast('Boutiques introuvables');});}
function loadKeys(){return fetch(SUPA+'/rest/v1/app_config?key=in.(whip_url,whep_url)&select=key,value',{headers:H()}).then(function(r){return r.json();}).then(function(a){(a||[]).forEach(function(c){if(c.key==='whip_url')WHIP=c.value;if(c.key==='whep_url')WHEP=c.value;});});}
function prep(){navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:1280}},audio:true}).then(function(st){STREAM=st;$('cam').srcObject=st;$('step2').style.display='block';window.scrollTo(0,0);}).catch(function(){m2('Caméra refusée — autorise l\'accès puis réessaie.');});}
function goLive(){if(!$('title').value.trim()){m2('Ajoute un titre (étape précédente).');return;}
if(!WHIP){m2('Diffusion navigateur non configurée — l\'admin doit coller l\'adresse WHIP (Cloudflare Stream) dans Réglages. Mode secours : utilise Larix avec le lien RTMP api.video.');return;}
m2('Connexion au direct…');$('goBtn').disabled=true;
PC=new RTCPeerConnection();
STREAM.getTracks().forEach(function(t){PC.addTrack(t,STREAM);});
PC.addTransceiver('video',{direction:'sendonly'});PC.addTransceiver('audio',{direction:'sendonly'});
PC.createOffer().then(function(o){return PC.setLocalDescription(o);}).then(function(){
return new Promise(function(res){if(PC.iceGatheringState==='complete')res();else{PC.addEventListener('icegatheringstatechange',function(){if(PC.iceGatheringState==='complete')res();});setTimeout(res,3000);}});
}).then(function(){return fetch(WHIP,{method:'POST',headers:{'Content-Type':'application/sdp'},body:PC.localDescription.sdp});})
.then(function(r){if(!r.ok&&r.status!==201)throw new Error('whip '+r.status);return r.text();})
.then(function(sdp){return PC.setRemoteDescription({type:'answer',sdp:sdp});})
.then(function(){
var slug=$('shop').value,titre=$('title').value;
WATCH=location.origin+location.pathname.replace('live-vendeur.html','')+'live.html?whep='+encodeURIComponent(WHEP)+'&t='+encodeURIComponent(titre)+'&s='+encodeURIComponent(slug);
$('watch').textContent=WATCH;
try{fetch(SUPA+'/rest/v1/live_streams',{method:'POST',headers:H(),body:JSON.stringify({title:titre,vendor:slug,watch_url:WATCH,status:'live'})});}catch(e){}
$('step2').style.display='none';$('step3').style.display='block';window.scrollTo(0,0);
}).catch(function(e){m2('Échec du direct ('+e.message+'). Vérifie l\'adresse WHIP ou ta connexion.');$('goBtn').disabled=false;});}
function endLive(){if(PC){try{PC.close();}catch(e){}}if(STREAM){STREAM.getTracks().forEach(function(t){t.stop();});}
try{fetch(SUPA+'/rest/v1/live_streams?watch_url=eq.'+encodeURIComponent(WATCH),{method:'PATCH',headers:H(),body:JSON.stringify({status:'ended'})});}catch(e){}
$('step3').style.display='none';$('step1').style.display='block';$('step2').style.display='none';toast('Live terminé');}
document.addEventListener('DOMContentLoaded',function(){lucide.createIcons();loadShops();loadKeys();});
</script></body></html>
