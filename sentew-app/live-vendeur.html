<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live Vendeur — SEN TEW</title><link rel="stylesheet" href="css/app.css?v=51"><script src="https://unpkg.com/lucide@latest"></script></head><body style="background:#0a1f17;min-height:100vh;color:#fff">
<header style="padding:16px;display:flex;align-items:center;gap:12px">
<a href="vendeur.html" style="color:#fff;text-decoration:none"><i data-lucide="arrow-left" class="icon"></i></a>
<h1 style="font-size:17px;font-weight:700;margin:0">🔴 Lancer un live</h1></header>
<main style="max-width:520px;margin:0 auto;padding:8px 16px 60px">
<div id="step1">
<label style="font-size:12px;color:#9db8ad">Boutique</label>
<select id="shop" style="width:100%;margin:6px 0 14px;padding:13px;border-radius:12px;background:#122b21;border:1px solid #1f4a38;color:#fff;font-size:14px"><option>Chargement…</option></select>
<label style="font-size:12px;color:#9db8ad">Titre du live</label>
<input id="title" placeholder="Ex : Nouvelle collection Wax 🔥" style="width:100%;margin:6px 0 14px;padding:13px;border-radius:12px;background:#122b21;border:1px solid #1f4a38;color:#fff;font-size:14px;box-sizing:border-box">
<button onclick="createLive()" style="width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#e02424,#c0392b);color:#fff;font-size:15px;font-weight:800;cursor:pointer">🔴 Créer mon live</button>
</div>
<div id="step2" style="display:none">
<div style="background:#122b21;border:1px solid #1f4a38;border-radius:16px;padding:16px;margin-bottom:14px">
<div style="font-weight:800;font-size:14px;margin-bottom:10px">📱 Dans l'app Larix Broadcaster (gratuite) :</div>
<div style="font-size:13px;line-height:2;color:#cfe5da">1. Ouvre Larix → ⚙️ Réglages → Connexions → <b>+</b> → RTMP<br>2. Colle cette adresse :</div>
<div style="background:#0a1f17;border-radius:10px;padding:10px;margin:8px 0;display:flex;align-items:center;gap:8px">
<code id="rtmp" style="font-size:11px;color:#4ade80;word-break:break-all;flex:1"></code>
<button onclick="cp('rtmp')" style="background:#0f6b4e;border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer">Copier</button></div>
<div style="font-size:13px;color:#cfe5da">3. Appuie sur le bouton rouge de Larix → <b>tu es en direct</b> 🎥</div></div>
<div style="background:#122b21;border:1px solid #1f4a38;border-radius:16px;padding:16px;margin-bottom:14px">
<div style="font-weight:800;font-size:14px;margin-bottom:8px">🔗 Lien spectateurs à partager :</div>
<div style="background:#0a1f17;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px">
<code id="watch" style="font-size:11px;color:#4ade80;word-break:break-all;flex:1"></code>
<button onclick="cp('watch')" style="background:#0f6b4e;border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer">Copier</button></div>
<button onclick="shareLive()" style="width:100%;margin-top:10px;padding:13px;border:none;border-radius:12px;background:#25d366;color:#06281c;font-weight:800;font-size:14px;cursor:pointer">📤 Partager sur WhatsApp</button></div>
<button onclick="endLive()" style="width:100%;padding:14px;border:1.5px solid #c0392b;border-radius:14px;background:transparent;color:#ff8a7a;font-weight:700;font-size:14px;cursor:pointer">⏹ Terminer le live</button>
</div>
<div id="msg" style="margin-top:14px;font-size:13px;color:#f0b429;display:none"></div></main>
<script>
var SUPA="https://tjqkruhwmjzgfvtouqza.supabase.co",KEY="sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j",LIVE=null;
function H(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};}
function toast(m){var t=document.getElementById('msg');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}
function cp(id){var v=document.getElementById(id).textContent;if(navigator.clipboard)navigator.clipboard.writeText(v);toast('Copié ✓');}
function getEmail(){try{var u=JSON.parse(localStorage.getItem('sentew_user')||'null');return u&&u.email?u.email:(localStorage.getItem('sentew_email')||'');}catch(e){return localStorage.getItem('sentew_email')||'';}}
function apiKey(){return fetch(SUPA+'/rest/v1/app_config?key=eq.apivideo_key&select=value',{headers:H()}).then(function(r){return r.json();}).then(function(a){return a[0]?a[0].value:'';});}
function loadShops(){fetch(SUPA+'/rest/v1/vendors?select=id,shop_name,slug&order=shop_name',{headers:H()}).then(function(r){return r.json();}).then(function(a){var s=document.getElementById('shop');s.innerHTML='';(a||[]).forEach(function(v){var o=document.createElement('option');o.value=v.slug||v.id;o.textContent=v.shop_name;o.dataset.vid=v.id;s.appendChild(o);});if(!a||!a.length)s.innerHTML='<option value="">Aucune boutique</option>';}).catch(function(){toast('Boutiques introuvables');});}
function createLive(){var t=document.getElementById('title').value.trim();if(!t){toast('Ajoute un titre');return;}
toast('Création du live…');
apiKey().then(function(k){if(!k){toast('Clé vidéo manquante — contacte l\'admin');throw 'k';}
return fetch('https://ws.api.video/live-streams',{method:'POST',headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({name:t,record:false})});}).then(function(r){return r.json();}).then(function(j){
if(!j.liveStreamId){toast('Erreur création live');return;}
LIVE=j;var slug=document.getElementById('shop').value;
document.getElementById('rtmp').textContent='rtmp://broadcast.api.video/s/'+j.streamKey;
var w=location.origin+location.pathname.replace('live-vendeur.html','')+'live.html?v='+j.liveStreamId+'&t='+encodeURIComponent(t)+'&s='+encodeURIComponent(slug);
document.getElementById('watch').textContent=w;
try{fetch(SUPA+'/rest/v1/live_streams',{method:'POST',headers:H(),body:JSON.stringify({title:t,vendor:slug,playback_url:'https://live.api.video/'+j.liveStreamId+'.m3u8',watch_url:w,status:'live'})});}catch(e){}
document.getElementById('step1').style.display='none';document.getElementById('step2').style.display='block';toast('Live prêt ✅ Ouvre Larix');window.scrollTo(0,0);
}).catch(function(e){if(e!=='k')toast('Erreur réseau — réessaie');});}
function shareLive(){var w=document.getElementById('watch').textContent;var t=document.getElementById('title').value;window.open('https://wa.me/?text='+encodeURIComponent('🔴 EN DIRECT : '+t+'\nRegarde maintenant sur SEN TEW : '+w),'_blank');}
function endLive(){if(!LIVE)return;apiKey().then(function(k){fetch('https://ws.api.video/live-streams/'+LIVE.liveStreamId,{method:'DELETE',headers:{'Authorization':'Bearer '+k}});});try{fetch(SUPA+"/rest/v1/live_streams?watch_url=eq."+encodeURIComponent(document.getElementById('watch').textContent),{method:'PATCH',headers:H(),body:JSON.stringify({status:'ended'})});}catch(e){}document.getElementById('step2').style.display='none';document.getElementById('step1').style.display='block';toast('Live terminé');}
document.addEventListener('DOMContentLoaded',function(){lucide.createIcons();loadShops();});
</script></body></html>
