<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Messages - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F6B4E">
<link rel="stylesheet" href="css/app.css">
<style>
.chat-modal{position:absolute;inset:0;background:#0A1F17;z-index:200;display:none;flex-direction:column}
.chat-modal.active{display:flex}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#0A1F17}
.bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4}
.bubble.them{background:rgba(255,255,255,.08);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:#0F6B4E;align-self:flex-end;border-bottom-right-radius:4px}
.chat-input{display:flex;padding:12px;gap:8px;background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.05)}
.chat-input input{flex:1;padding:12px 16px;border-radius:24px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:14px}
.chat-input button{background:#D4A574;color:#0A1F17;border:none;width:48px;height:48px;border-radius:50%;font-weight:800;cursor:pointer;font-size:16px}
</style>
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <div class="app-logo">💬 Messages</div>
    <button class="header-btn" onclick="alert('Nouveau message')">✏️</button>
  </header>

  <main class="app-content">
    <div class="search-box">
      <input type="text" placeholder="Rechercher..." oninput="search(this.value)">
    </div>
    <div id="msgList" style="padding:0 8px;"></div>
    <div style="height:20px;"></div>
  </main>

  <div class="chat-modal" id="chatModal">
    <header class="app-header">
      <button class="header-btn" onclick="closeChat()">←</button>
      <img id="chatAvatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;pointer-events:auto;">
      <div style="flex:1;">
        <div id="chatName" style="font-weight:700;font-size:14px;"></div>
        <div style="font-size:11px;color:#D4A574;">● En ligne</div>
      </div>
      <button class="header-btn" onclick="alert('Appel vidéo')">📹</button>
      <button class="header-btn" onclick="alert('Appel voix')">📞</button>
    </header>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input">
      <input id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">📊</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html" class="active"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script>
const convos = [
  {id:1,name:'Aminata Diop',avatar:'https://i.pravatar.cc/100?img=47',last:'Le sac est-il toujours dispo ?',time:'12:34',unread:2,online:true,msgs:[{f:'them',t:'Bonjour ! 👋'},{f:'them',t:'J\'ai vu votre sac cuir africain'},{f:'them',t:'Le sac est-il toujours dispo ?'}]},
  {id:2,name:'Moussa Sall',avatar:'https://i.pravatar.cc/100?img=68',last:'Merci pour la livraison rapide 🙏',time:'10:22',unread:0,online:true,msgs:[{f:'me',t:'Votre commande a été expédiée'},{f:'them',t:'Merci pour la livraison rapide 🙏'}]},
  {id:3,name:'Fatou Ndiaye',avatar:'https://i.pravatar.cc/100?img=45',last:'Le boubou wax est magnifique !',time:'Hier',unread:1,online:false,msgs:[{f:'them',t:'Le boubou wax est magnifique !'}]},
  {id:4,name:'SEN TEW Support',avatar:'https://i.pravatar.cc/100?img=15',last:'Nous restons disponibles 24/7',time:'Hier',unread:0,online:true,msgs:[{f:'them',t:'Bonjour, comment vous aider ?'}]},
  {id:5,name:'Ibrahima Ba',avatar:'https://i.pravatar.cc/100?img=52',last:'Pouvez-vous baisser le prix ?',time:'Lun',unread:0,online:false,msgs:[{f:'them',t:'Pouvez-vous baisser le prix ?'}]},
  {id:6,name:'Awa Mbaye',avatar:'https://i.pravatar.cc/100?img=44',last:'Livraison à Thiès possible ?',time:'Dim',unread:0,online:false,msgs:[{f:'them',t:'Livraison à Thiès possible ?'}]},
  {id:7,name:'Cheikh Diouf',avatar:'https://i.pravatar.cc/100?img=60',last:'Vous avez d\'autres modèles ?',time:'Sam',unread:0,online:false,msgs:[{f:'them',t:'Vous avez d\'autres modèles ?'}]}
];
let current=null;

function render(l=convos){
  document.getElementById('msgList').innerHTML = l.map(c=>`
    <div onclick="openChat(${c.id})" style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:.2s;" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background='transparent'">
      <div style="position:relative;">
        <img src="${c.avatar}" style="width:52px;height:52px;border-radius:50%;border:2px solid #D4A574;object-fit:cover;pointer-events:auto;">
        ${c.online?'<div style="position:absolute;bottom:0;right:0;width:14px;height:14px;background:#22c55e;border-radius:50%;border:2px solid #0A1F17;"></div>':''}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span style="font-weight:700;font-size:14px;">${c.name}</span>
          <span style="font-size:11px;color:#D4A574;">${c.time}</span>
        </div>
        <div style="font-size:13px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.last}</div>
      </div>
      ${c.unread?`<span style="background:#ef4444;color:#fff;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;">${c.unread}</span>`:''}
    </div>
  `).join('');
}
function openChat(id){
  current=convos.find(c=>c.id===id);
  document.getElementById('chatAvatar').src=current.avatar;
  document.getElementById('chatName').textContent=current.name;
  document.getElementById('chatMsgs').innerHTML=current.msgs.map(m=>`<div class="bubble ${m.f}">${m.t}</div>`).join('');
  document.getElementById('chatModal').classList.add('active');
  current.unread=0;render();
}
function closeChat(){document.getElementById('chatModal').classList.remove('active')}
function sendMsg(){
  const i=document.getElementById('msgInput');
  if(!i.value.trim())return;
  current.msgs.push({f:'me',t:i.value});current.last=i.value;
  i.value='';openChat(current.id);
  setTimeout(()=>{current.msgs.push({f:'them',t:'Merci ! Je vous réponds sous peu 👍'});openChat(current.id)},1500);
}
function search(q){render(convos.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())))}
render();
</script>
</body>
</html>
