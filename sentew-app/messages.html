<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Messages - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF7">
<link rel="stylesheet" href="css/app.css">
<style>
.msg-hero{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));padding:20px 16px 30px;position:relative;overflow:hidden}
.msg-hero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(212,165,116,.08) 0 15px,transparent 15px 30px)}
.msg-hero-title{color:#fff;font-size:24px;font-weight:900;position:relative;z-index:2;display:flex;align-items:center;gap:10px}
.msg-hero-sub{color:rgba(255,255,255,.9);font-size:12px;margin-top:4px;position:relative;z-index:2;font-weight:500}
.msg-stats{display:flex;gap:8px;margin:-16px 16px 12px;position:relative;z-index:3}
.msg-stat{flex:1;background:var(--white);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.msg-stat-val{font-size:20px;font-weight:900;color:var(--gold-dark)}
.msg-stat-lbl{font-size:10px;color:var(--text-muted);font-weight:600;margin-top:2px}
.msg-item{display:flex;align-items:center;gap:12px;padding:12px;margin:6px 12px;background:var(--white);border-radius:14px;cursor:pointer;transition:.2s;border:1px solid var(--border);box-shadow:var(--shadow);text-decoration:none;color:var(--text)}
.msg-item:active{transform:scale(.98);background:var(--bg)}
.msg-item.unread{border-left:4px solid var(--gold)}
.avatar-wrap{position:relative;flex-shrink:0}
.avatar-wrap img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;pointer-events:auto}
.online-dot{position:absolute;bottom:0;right:0;width:14px;height:14px;background:#22c55e;border-radius:50%;border:2.5px solid #fff}
.msg-content{flex:1;min-width:0}
.msg-header{display:flex;justify-content:space-between;margin-bottom:4px;align-items:center}
.msg-name{font-weight:700;font-size:14px;color:var(--text)}
.msg-time{font-size:11px;color:var(--gold-dark);font-weight:700;flex-shrink:0}
.msg-preview{font-size:13px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.msg-item.unread .msg-preview{color:var(--text);font-weight:600}
.msg-badge-unread{background:#ef4444;color:#fff;border-radius:14px;padding:3px 9px;font-size:11px;font-weight:800;flex-shrink:0}
.chat-modal{position:absolute;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
.chat-modal.active{display:flex}
.chat-header-msg{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-header-msg img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);pointer-events:auto}
.chat-header-msg .header-btn{background:rgba(255,255,255,.15);color:#fff;border:none}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;box-shadow:0 2px 4px rgba(0,0,0,.04)}
.bubble.them{background:var(--white);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--border)}
.bubble.me{background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-input-msg{display:flex;padding:12px;gap:8px;background:var(--white);border-top:1px solid var(--border);flex-shrink:0}
.chat-input-msg input{flex:1;padding:12px 16px;border-radius:24px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}
.chat-input-msg button{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--emerald-dark);border:none;width:48px;height:48px;border-radius:50%;font-weight:800;cursor:pointer;font-size:16px}
</style>
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <div style="flex:1;font-weight:800;color:var(--text);font-size:20px;display:flex;align-items:center;gap:8px;">
      <span style="color:var(--emerald);">💬</span> Messages
    </div>
    <button class="header-btn gold" onclick="alert('✏️ Nouveau message')">✏️</button>
  </header>

  <main class="app-content">
    <div class="msg-hero">
      <div class="msg-hero-title">💬 Vos conversations</div>
      <div class="msg-hero-sub">7 conversations · 3 non lues</div>
    </div>

    <div class="msg-stats">
      <div class="msg-stat">
        <div class="msg-stat-val">3</div>
        <div class="msg-stat-lbl">Non lus</div>
      </div>
      <div class="msg-stat">
        <div class="msg-stat-val">4</div>
        <div class="msg-stat-lbl">En ligne</div>
      </div>
      <div class="msg-stat">
        <div class="msg-stat-val">7</div>
        <div class="msg-stat-lbl">Total</div>
      </div>
    </div>

    <div class="search-box">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Rechercher..." oninput="search(this.value)">
      </div>
    </div>

    <div class="chips">
      <button class="chip active" onclick="filt('all',this)">Tous</button>
      <button class="chip" onclick="filt('unread',this)">Non lus (3)</button>
      <button class="chip" onclick="filt('online',this)">En ligne</button>
      <button class="chip" onclick="filt('sellers',this)">🏪 Vendeurs</button>
    </div>

    <div id="msgList"></div>
    <div style="height:20px;"></div>
  </main>

  <!-- Chat modal -->
  <div class="chat-modal" id="chatModal">
    <div class="chat-header-msg">
      <button class="header-btn" onclick="closeChat()">←</button>
      <img id="chatAvatar">
      <div style="flex:1;color:#fff;">
        <div id="chatName" style="font-weight:800;font-size:14px;"></div>
        <div style="font-size:11px;color:var(--gold);">● En ligne</div>
      </div>
      <button class="header-btn" onclick="alert('📞 Appel')">📞</button>
      <button class="header-btn" onclick="alert('📹 Vidéo')">📹</button>
    </div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-msg">
      <input id="msgInput" placeholder="Message..." onkeypress="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()">➤</button>
    </div>
  </div>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html" class="active"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script>
const convos = [
  {id:1,name:'Aminata Diop',avatar:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200',last:'Le sac est-il toujours dispo ?',time:'12:34',unread:2,online:true,seller:false,msgs:[{f:'them',t:'Bonjour ! 👋'},{f:'them',t:'J\'ai vu votre sac cuir'},{f:'them',t:'Le sac est-il toujours dispo ?'}]},
  {id:2,name:'Moussa Sall',avatar:'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=200',last:'Merci pour la livraison rapide 🙏',time:'10:22',unread:0,online:true,seller:false,msgs:[{f:'me',t:'Commande expédiée'},{f:'them',t:'Merci pour la livraison rapide 🙏'}]},
  {id:3,name:'Fatou Ndiaye Fashion',avatar:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=200',last:'Nouvelle collection wax disponible !',time:'Hier',unread:1,online:false,seller:true,msgs:[{f:'them',t:'Bonjour Ousseynou !'},{f:'them',t:'Nouvelle collection wax disponible !'}]},
  {id:4,name:'SEN TEW Support',avatar:'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=200',last:'Nous restons disponibles 24/7',time:'Hier',unread:0,online:true,seller:false,msgs:[{f:'them',t:'Bonjour, comment vous aider ?'}]},
  {id:5,name:'Ibrahima Ba',avatar:'https://images.unsplash.com/photo-1507081323647-4d250478b919?w=200',last:'Pouvez-vous baisser le prix ?',time:'Lun',unread:0,online:false,seller:false,msgs:[{f:'them',t:'Pouvez-vous baisser le prix ?'}]},
  {id:6,name:'Awa Mbaye',avatar:'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=200',last:'Livraison à Thiès possible ?',time:'Dim',unread:0,online:false,seller:false,msgs:[{f:'them',t:'Livraison à Thiès possible ?'}]},
  {id:7,name:'Aïcha Couture',avatar:'https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=200',last:'🔴 LIVE en cours - Boubou -30%',time:'Sam',unread:0,online:true,seller:true,live:true,msgs:[{f:'them',t:'🔴 LIVE en cours - Boubou -30%'}]}
];
let current=null,filtered=convos;

function render(list){
  document.getElementById('msgList').innerHTML = list.length ? list.map(c=>`
    <div onclick="openChat(${c.id})" class="msg-item ${c.unread?'unread':''}">
      <div class="avatar-wrap">
        <img src="${c.avatar}">
        ${c.online?'<div class="online-dot"></div>':''}
      </div>
      <div class="msg-content">
        <div class="msg-header">
          <span class="msg-name">${c.name}${c.seller?' <span style="color:var(--emerald);font-size:12px;">🏪</span>':''}${c.live?' <span style="background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;">LIVE</span>':''}</span>
          <span class="msg-time">${c.time}</span>
        </div>
        <div class="msg-preview">${c.last}</div>
      </div>
      ${c.unread?`<span class="msg-badge-unread">${c.unread}</span>`:''}
    </div>
  `).join('') : '<p style="text-align:center;color:var(--text-muted);padding:40px;">Aucun message</p>';
}

function openChat(id){
  current=convos.find(c=>c.id===id);
  document.getElementById('chatAvatar').src=current.avatar;
  document.getElementById('chatName').textContent=current.name;
  document.getElementById('chatMsgs').innerHTML=current.msgs.map(m=>`<div class="bubble ${m.f}">${m.t}</div>`).join('');
  document.getElementById('chatModal').classList.add('active');
  current.unread=0;render(filtered);
}
function closeChat(){document.getElementById('chatModal').classList.remove('active')}
function sendMsg(){
  const i=document.getElementById('msgInput');
  if(!i.value.trim())return;
  current.msgs.push({f:'me',t:i.value});current.last=i.value;
  i.value='';openChat(current.id);
  setTimeout(()=>{current.msgs.push({f:'them',t:'Merci ! Je vous réponds sous peu 👍'});openChat(current.id)},1500);
}
function filt(t,el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  if(t==='unread')filtered=convos.filter(c=>c.unread>0);
  else if(t==='online')filtered=convos.filter(c=>c.online);
  else if(t==='sellers')filtered=convos.filter(c=>c.seller);
  else filtered=convos;
  render(filtered);
}
function search(q){render(convos.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())))}
render(convos);
</script>
  <script src="js/dark-mode.js"></script>
<script src="js/role-guard.js"></script>

</body>
</html>
