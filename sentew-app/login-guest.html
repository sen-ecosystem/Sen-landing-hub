<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bienvenue - SEN TEW</title>
<style>
:root{--v:#00a651;--j:#fcd116;--o:#b8863a}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:linear-gradient(135deg,#00a651 0%,#008a44 40%,#005f2f 100%);min-height:100vh;color:#fff;display:flex;flex-direction:column;padding:0 24px;padding-top:env(safe-area-inset-top,20px);padding-bottom:env(safe-area-inset-bottom,20px);position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-100px;right:-100px;width:300px;height:300px;background:rgba(252,209,22,.15);border-radius:50%;filter:blur(40px)}
body::after{content:'';position:absolute;bottom:-100px;left:-100px;width:280px;height:280px;background:rgba(252,209,22,.1);border-radius:50%;filter:blur(40px)}
.content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.crown{font-size:80px;margin-bottom:16px;filter:drop-shadow(0 8px 20px rgba(252,209,22,.5));animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.brand{font-size:42px;font-weight:900;letter-spacing:4px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.2)}
.tagline{color:var(--j);font-size:13px;font-weight:700;letter-spacing:2px;margin-top:6px}
.hero-desc{margin-top:30px;font-size:16px;line-height:1.5;max-width:320px;opacity:.95}
.features{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.feature{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:10px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.2)}
.actions{padding:20px 0;position:relative;z-index:1}
.btn-primary{width:100%;background:#fff;color:var(--v);border:none;padding:16px;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.15);margin-bottom:10px}
.btn-secondary{width:100%;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4);padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:14px}
.guest-link{text-align:center;color:rgba(255,255,255,.85);font-size:13px}
.guest-link a{color:var(--j);font-weight:700;text-decoration:none}
.stats-strip{display:flex;justify-content:space-around;padding:14px 0;background:rgba(255,255,255,.1);border-radius:14px;margin-top:20px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15)}
.stat{text-align:center}
.stat b{display:block;font-size:18px;font-weight:800;color:var(--j)}
.stat span{font-size:10px;opacity:.9}
</style></head><body>

<div class="content">
  <div class="crown">👑</div>
  <div class="brand">SEN TEW</div>
  <div class="tagline">AFRICAN MARKETPLACE</div>

  <p class="hero-desc">La marketplace n°1 du Sénégal.<br>Achetez, vendez, livrez — tout dans une seule app.</p>

  <div class="features">
    <div class="feature">🛒 30 000+ produits</div>
    <div class="feature">🚚 Livraison 24h</div>
    <div class="feature">🎥 LIVE Shopping</div>
    <div class="feature">💳 Paiement sécurisé</div>
  </div>

  <div class="stats-strip">
    <div class="stat"><b>50k+</b><span>Utilisateurs</span></div>
    <div class="stat"><b>2 500+</b><span>Vendeurs</span></div>
    <div class="stat"><b>4.8⭐</b><span>Note app</span></div>
  </div>
</div>

<div class="actions">
  <button class="btn-primary" onclick="location.href='login.html'">🔐 Se connecter</button>
  <button class="btn-secondary" onclick="location.href='register.html'">✨ Créer un compte</button>
  <div class="guest-link">
    <a href="index.html">Continuer sans compte →</a>
  </div>
</div>
<script src="js/buttons-audit.js?v=51"></script>
</body></html>
