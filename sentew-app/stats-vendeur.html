<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mes Statistiques - SEN TEW Vendeur</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/security-shield.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#f5f5f0;font-family:'Segoe UI',-apple-system,sans-serif;padding-bottom:90px;color:#0a1f17}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:900;color:#0f6b4e;flex:1;display:flex;align-items:center;gap:8px}
.topbar h1 i{width:18px;height:18px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#f5f5f0;border:none;display:flex;align-items:center;justify-content:center;color:#0f6b4e;text-decoration:none}
.icon-btn i{width:17px;height:17px}
.period{display:flex;gap:7px;padding:12px 14px}
.period button{flex:1;padding:9px;border-radius:11px;border:1.5px solid #e5e7eb;background:#fff;font-size:11.5px;font-weight:800;color:#4b5563;cursor:pointer}
.period button.on{background:#0f6b4e;color:#fff;border-color:#0f6b4e}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
.kpi{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.kpi .ki{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.kpi .ki i{width:16px;height:16px}
.kpi .kv{font-size:18px;font-weight:900}
.kpi .kl{font-size:10px;color:#6b7280;font-weight:700;margin-top:2px}
.kpi .kt{font-size:9px;font-weight:800;margin-top:5px;display:inline-block;padding:2px 8px;border-radius:8px}
.kt.up{background:#d1fae5;color:#065f46}.kt.down{background:#fee2e2;color:#b91c1c}
.k-green{background:#d1fae5;color:#059669}.k-blue{background:#dbeafe;color:#1e40af}.k-amber{background:#fef3c7;color:#b45309}.k-purple{background:#ede9fe;color:#6d28d9}
.card{background:#fff;margin:12px 14px 0;border-radius:16px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h3{font-size:13px;font-weight:900;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 i{width:16px;height:16px;color:#0f6b4e}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.bar{width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#10b981,#0f6b4e);min-height:4px}
.bar-lab{font-size:8.5px;color:#9aa5a0;font-weight:700}
.top-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.top-row:last-child{border:none}
.top-num{width:24px;height:24px;border-radius:8px;background:#f0fdf4;color:#0f6b4e;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-row img{width:38px;height:38px;border-radius:10px;object-fit:cover;background:#f3f4f6;flex-shrink:0}
.top-row .tt{flex:1;min-width:0}
.top-row b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-row span{font-size:10px;color:#9aa5a0}
.top-row .tv{font-size:12px;font-weight:900;color:#0f6b4e;flex-shrink:0}
.rate-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.rate-row .rl{width:52px;font-size:10.5px;font-weight:800;color:#6b7280;flex-shrink:0}
.rate-row .rb{flex:1;height:9px;background:#f3f4f6;border-radius:5px;overflow:hidden}
.rate-row .rb i{display:block;height:100%;background:#f59e0b;border-radius:5px}
.rate-row .rv{width:34px;font-size:10px;font-weight:800;text-align:right;flex-shrink:0}
.tip{display:flex;gap:8px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 12px;margin:14px;font-size:11.5px;color:#92400e;cursor:pointer;line-height:1.55}
.empty{text-align:center;padding:24px;color:#9aa5a0;font-size:12px}
</style>
</head>
<body>

<div class="topbar">
  <a class="icon-btn" href="vendeur.html"><i data-lucide="arrow-left"></i></a>
  <h1><i data-lucide="bar-chart-3"></i>Mes statistiques</h1>
  <a class="icon-btn" href="promotions-vendeur.html"><i data-lucide="megaphone"></i></a>
</div>

<div class="period" id="periodBar">
  <button data-p="7" class="on">7 jours</button>
  <button data-p="30">30 jours</button>
  <button data-p="90">3 mois</button>
  <button data-p="all">Tout</button>
</div>

<div class="kpis" id="kpis"><div class="empty" style="grid-column:1/3">Chargement…</div></div>

<div class="card">
  <h3><i data-lucide="trending-up"></i>Ventes (7 derniers jours)</h3>
  <div class="bars" id="chartBars"><div class="empty" style="width:100%">…</div></div>
</div>

<div class="card">
  <h3><i data-lucide="trophy"></i>Top produits</h3>
  <div id="topProducts"><div class="empty">…</div></div>
</div>

<div class="card">
  <h3><i data-lucide="star"></i>Répartition de tes notes</h3>
  <div id="ratingsBox"><div class="empty">…</div></div>
</div>

<div class="tip" onclick="alert('Lire tes statistiques comme un pro\n\n• CA qui monte + panier moyen stable = croissance saine\n• Ticket moyen en baisse = propose des packs (2 articles = -10%)\n• Un produit en tête des ventes = booste-le, c\'est ta locomotive\n• Notes 4★ ou moins = relis les avis, corrige le point faible\n\nⓘ Regarde cette page chaque lundi : 5 minutes suffisent pour décider ta semaine.')"><span>ⓘ</span><span>Astuce : regarde tes stats <b>chaque lundi</b> — 5 minutes suffisent pour piloter ta semaine. Clique pour la méthode de lecture.</span></div>

<script>
lucide.createIcons();
var SUPA_URL='https://tjqkruhwmjzgfvtouqza.supabase.co';
var SUPA_KEY='sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j';
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
function fmt(n){return (n||0).toLocaleString('fr-FR')+' F'}
function $(id){return document.getElementById(id)}

var USER=null;
try{USER=JSON.parse(localStorage.getItem('st_user'))}catch(e){}
var VENDOR_ID=(USER&&USER.vendor_id)||'11111111-1111-1111-1111-111111111111';

var ORDERS=[],PRODUCTS=[],PERIOD=7;

function dateFrom(){
  if(PERIOD==='all')return new Date(2000,0,1);
  var d=new Date();d.setDate(d.getDate()-PERIOD);return d;
}

$('periodBar').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');PERIOD=b.dataset.p==='all'?'all':parseInt(b.dataset.p);
  render();
});

Promise.all([
  fetch(SUPA_URL+'/rest/v1/orders?select=id,total,status,created_at,items&order=created_at.desc&limit=200',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}}).then(function(r){return r.json()}),
  fetch(SUPA_URL+'/rest/v1/products?vendor_id=eq.'+VENDOR_ID+'&select=id,name,price,sold_count,rating,rating_5,rating_4,rating_3,rating_2,rating_1,images&order=sold_count.desc',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}}).then(function(r){return r.json()})
]).then(function(res){
  ORDERS=res[0]||[];PRODUCTS=res[1]||[];
  render();
}).catch(function(){
  $('kpis').innerHTML='<div class="empty" style="grid-column:1/3">Erreur réseau — recharge la page.</div>';
});

function render(){
  var from=dateFrom();
  var list=ORDERS.filter(function(o){return new Date(o.created_at)>=from&&o.status!=='cancelled'});
  var ca=list.reduce(function(s,o){return s+(o.total||0)},0);
  var nb=list.length;
  var deliv=list.filter(function(o){return o.status==='delivered'}).length;
  var tm=nb?Math.round(ca/nb):0;
  var taux=ORDERS.length?Math.round(list.filter(function(o){return o.status==='delivered'}).length/Math.max(1,ORDERS.filter(function(o){return new Date(o.created_at)>=from}).length)*100):0;

  $('kpis').innerHTML=
    kpi('k-green','banknote',fmt(ca),'Chiffre d\'affaires','up',(PERIOD==='all'?'total':PERIOD+' derniers jours'))+
    kpi('k-blue','shopping-bag',nb,'Commandes','up',deliv+' livrée(s)')+
    kpi('k-amber','receipt',fmt(tm),'Ticket moyen',tm>=15000?'up':'down',tm>=15000?'Excellent niveau':'Vise les packs 2 articles')+
    kpi('k-purple','check-circle',taux+'%','Taux de livraison',taux>=80?'up':'down',taux>=80?'Très fiable':'À améliorer');
  lucide.createIcons();

  /* Graphique 7 jours */
  var days=[],counts=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    days.push(d.toLocaleDateString('fr-FR',{weekday:'short'}));
    var key=d.toDateString();
    counts.push(ORDERS.filter(function(o){return new Date(o.created_at).toDateString()===key&&o.status!=='cancelled'}).length);
  }
  var max=Math.max.apply(null,counts.concat([1]));
  $('chartBars').innerHTML=days.map(function(l,i){
    return '<div class="bar-col"><div class="bar" style="height:'+Math.round(counts[i]/max*100)+'%" title="'+counts[i]+' vente(s)"></div><div class="bar-lab">'+l+'</div></div>';
  }).join('');

  /* Top produits */
  var top=PRODUCTS.slice(0,5);
  $('topProducts').innerHTML=top.length?top.map(function(p,i){
    var ca2=(p.price||0)*(p.sold_count||0);
    return '<div class="top-row"><div class="top-num">'+(i+1)+'</div>'+
      '<img src="'+((p.images||[])[0]||'')+'" onerror="this.style.display=\'none\'">'+
      '<div class="tt"><b>'+esc(p.name)+'</b><span>'+(p.sold_count||0)+' vendus · ★ '+(p.rating||0)+'</span></div>'+
      '<div class="tv">'+fmt(ca2)+'</div></div>';
  }).join(''):'<div class="empty">Aucun produit.</div>';

  /* Répartition des notes (agrégée sur tous les produits) */
  var r5=0,r4=0,r3=0,r2=0,r1=0;
  PRODUCTS.forEach(function(p){r5+=p.rating_5||0;r4+=p.rating_4||0;r3+=p.rating_3||0;r2+=p.rating_2||0;r1+=p.rating_1||0});
  var tot=Math.max(1,r5+r4+r3+r2+r1);
  var rows=[['5 ★',r5],['4 ★',r4],['3 ★',r3],['2 ★',r2],['1 ★',r1]];
  $('ratingsBox').innerHTML=tot>1?rows.map(function(r){
    var pct=Math.round(r[1]/tot*100);
    return '<div class="rate-row"><div class="rl">'+r[0]+'</div><div class="rb"><i style="width:'+pct+'%"></i></div><div class="rv">'+r[1]+'</div></div>';
  }).join(''):'<div class="empty">Pas encore d\'avis — les premières notes arrivent avec tes premières ventes.</div>';
}
function kpi(cls,ico,val,lab,tr,trt){
  return '<div class="kpi"><div class="ki '+cls+'"><i data-lucide="'+ico+'"></i></div><div class="kv">'+val+'</div><div class="kl">'+lab+'</div><span class="kt '+tr+'">'+trt+'</span></div>';
}
</script>
</body>
</html>
