<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Assistant IA - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F6B4E">
<link rel="stylesheet" href="css/app.css">
<style>
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;animation:fadeIn .3s;white-space:pre-wrap}
.bubble.ai{background:rgba(255,255,255,.08);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.user{background:linear-gradient(135deg,#0F6B4E,#0A4D38);align-self:flex-end;border-bottom-right-radius:4px}
.typing{background:rgba(255,255,255,.08);align-self:flex-start;padding:14px 18px;border-radius:16px}
.dots span{display:inline-block;width:6px;height:6px;background:#D4A574;border-radius:50%;margin:0 2px;animation:bounce 1.4s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.sugg{padding:0 12px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{background:rgba(212,165,116,.12);color:#D4A574;border:1px solid #D4A574;font-size:11px;flex-shrink:0}
.input-bar{background:rgba(0,0,0,.3);padding:10px;display:flex;gap:6px;border-top:1px solid rgba(255,255,255,.05)}
.input-bar input{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(212,165,116,.3);color:#fff;padding:11px 15px;border-radius:22px;font-size:13px}
.mic-btn{background:rgba(212,165,116,.15);border:1px solid #D4A574;color:#D4A574;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.send{background:linear-gradient(135deg,#0F6B4E,#D4A574);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer}
</style>
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header" style="background:linear-gradient(135deg,#0F6B4E,#D4A574);">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;">🤖</div>
    <div style="flex:1;">
      <div style="font-weight:800;font-size:14px;">Assistant SEN TEW</div>
      <div style="font-size:10px;opacity:.9;">● En ligne · 24/7</div>
    </div>
    <select class="select" id="lang" onchange="changeLang()">
      <option value="fr">🇫🇷</option>
      <option value="wo">🇸🇳</option>
      <option value="en">🇬🇧</option>
      <option value="ar">🇸🇦</option>
    </select>
  </header>

  <div class="chat" id="chat"></div>

  <div class="sugg" id="sugg"></div>

  <div class="input-bar">
    <button class="mic-btn" onclick="alert('🎙 Voice (bientôt)')">🎙</button>
    <input id="in" placeholder="Écrire..." onkeypress="if(event.key==='Enter')send()">
    <button class="send" onclick="send()">➤</button>
  </div>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">📊</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script>
const R={
  fr:{g:"Bonjour Ousseynou ! 👋 Je suis l'assistant SEN TEW. Comment puis-je vous aider ?",s:['📦 Suivre commande','💰 Mes points','🎁 Promos du jour','🔒 Sécurité','📱 Paiement'],d:"Voici ce que je peux faire : 📦 suivi commande, 💰 portefeuille, 🎁 offres, 🤝 aide vendeur.",cmd:"📦 Commande #SEN2026-0847 : Boubou wax expédié hier, livraison demain 27 juillet 10h-14h Dakar-Plateau.",pts:"💰 Vous avez 1 250 points SEN TEW GOLD = 12 500 FCFA de réduction !",prm:"🎁 Aujourd'hui 27 juillet 2026 :\n• -30% Écouteurs Pro\n• -25% Sacs cuir\n• LIVE 20h - Boubou -40%\n• Cashback 5% Wave"},
  wo:{g:"Asalaa malekum Ousseynou ! 👋 Man moy assistant SEN TEW. Naka mën naa la jappale ?",s:['📦 Commande','💰 Sama points','🎁 Rëy yi','🔒 Sûreté','📱 Paiement'],d:"Man ci ni : 📦 commande, 💰 xaalis, 🎁 offer.",cmd:"📦 Sa commande #SEN2026-0847 : Boubou wax dañu ko yebbi démb, ëllëg 27 juillet.",pts:"💰 Am nga 1 250 points GOLD = 12 500 FCFA !",prm:"🎁 Tay 27 juillet 2026 :\n• -30% écouteurs\n• -25% sacs\n• LIVE 20h -40%"},
  en:{g:"Hello Ousseynou! 👋 I'm SEN TEW assistant. How can I help?",s:['📦 Track order','💰 My points','🎁 Deals','🔒 Security','📱 Payment'],d:"I can help with: 📦 tracking, 💰 wallet, 🎁 offers.",cmd:"📦 Order #SEN2026-0847: Wax boubou shipped yesterday, delivery July 27.",pts:"💰 You have 1,250 GOLD points = 12,500 FCFA discount!",prm:"🎁 July 27, 2026:\n• -30% Earbuds\n• -25% Bags\n• LIVE 8pm -40%"},
  ar:{g:"مرحبا! 👋 أنا مساعد SEN TEW. كيف يمكنني مساعدتك؟",s:['📦 تتبع','💰 نقاط','🎁 عروض','🔒 أمان','📱 دفع'],d:"يمكنني: 📦 التتبع، 💰 المحفظة، 🎁 العروض.",cmd:"📦 طلب #SEN2026-0847: تم الشحن، التسليم غدا 27 يوليو.",pts:"💰 لديك 1250 نقطة = 12500 FCFA!",prm:"🎁 27 يوليو 2026:\n• -30% سماعات\n• -25% حقائب"}
};
let L='fr';
function add(t,f){const c=document.getElementById('chat');const d=document.createElement('div');d.className='bubble '+f;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
function typing(){const c=document.getElementById('chat');const d=document.createElement('div');d.id='t';d.className='typing';d.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';c.appendChild(d);c.scrollTop=c.scrollHeight}
function noType(){const t=document.getElementById('t');if(t)t.remove()}
function resp(t){const r=R[L],l=t.toLowerCase();if(l.match(/command|livrai|track|suiv/))return r.cmd;if(l.match(/point|fidél|cashback/))return r.pts;if(l.match(/promo|offer|deal|rëy/))return r.prm;return r.d}
function send(text){const i=document.getElementById('in');const t=text||i.value.trim();if(!t)return;add(t,'user');i.value='';typing();setTimeout(()=>{noType();add(resp(t),'ai')},1200)}
function suggs(){document.getElementById('sugg').innerHTML=R[L].s.map(x=>`<button class="chip" onclick="send('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}
function changeLang(){L=document.getElementById('lang').value;document.getElementById('chat').innerHTML='';add(R[L].g,'ai');suggs()}
add(R.fr.g,'ai');suggs();
</script>
</body>
</html>
