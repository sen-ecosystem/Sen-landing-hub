<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nio Far — Assistant IA SEN TEW</title>
<link rel="stylesheet" href="css/app.css?v=52">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/supabase.js"></script>
<script src="js/ai.js"></script>
<style>
body{background:#f5f5f0;margin:0;font-family:-apple-system,sans-serif;padding-bottom:150px}
.topbar{background:linear-gradient(135deg,#6b46c1,#4c1d95);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h1{color:#fff;font-size:16px;margin:0;flex:1}
.status{font-size:11px;color:#d1fae5}
.icon-btn{background:rgba(255,255,255,.2);border:none;cursor:pointer;padding:8px;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.ia-avatar{width:40px;height:40px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.4)}
.ia-avatar i{color:#fff}
.section-title{color:#b07a1f;font-size:11.5px;font-weight:800;padding:0 18px;margin:16px 0 8px;letter-spacing:1px;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#fff;border:1.5px solid #e5e7eb;border-radius:99px;padding:8px 13px;font-size:12px;font-weight:700;color:#4b5563;cursor:pointer;transition:.15s}
.chip:active{border-color:#6b46c1;color:#6b46c1;background:#f3efff}
.conversation{padding:4px 16px}
.bubble{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}
.bubble.user{justify-content:flex-end}
.bubble-avatar{width:30px;height:30px;background:#6b46c1;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bubble-avatar i{color:#fff;width:15px;height:15px}
.bubble.user .bubble-avatar{background:#0f6b4e}
.bubble-content{background:#fff;padding:10px 14px;border-radius:16px;border-bottom-left-radius:4px;max-width:78%;font-size:13.5px;color:#1a1a1a;box-shadow:0 2px 6px rgba(0,0,0,.05);line-height:1.55}
.bubble.user .bubble-content{background:#0f6b4e;color:#fff;border-radius:16px;border-bottom-right-radius:4px}
.bubble-time{font-size:9.5px;color:#9ca3af;margin-top:3px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing span{width:7px;height:7px;border-radius:99px;background:#6b46c1;animation:tp 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.input-bar{position:fixed;bottom:64px;left:0;right:0;background:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;border-top:1px solid #e5e7eb;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
.input-field{flex:1;padding:11px 16px;border:1.5px solid #e5e7eb;border-radius:22px;font-size:14px;outline:none;background:#fff}
.input-field:focus{border-color:#6b46c1}
.btn-send{background:linear-gradient(135deg,#6b46c1,#4c1d95);border:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(107,70,193,.4);flex-shrink:0}
.btn-send i{color:#fff;width:19px;height:19px}
.btn-send:disabled{opacity:.5}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #e5e7eb;z-index:5}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#666;font-size:11px}
.bottom-nav a.active{color:#0f6b4e}
.bottom-nav a i{width:22px;height:22px}
</style>
</head>
<body class="light-mode">

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <div class="ia-avatar"><i data-lucide="bot"></i></div>
  <div style="flex:1">
    <h1>Nio Far · Assistant IA</h1>
    <div class="status" id="statusLine">● En ligne · connaît tout le catalogue</div>
  </div>
  <button class="icon-btn" onclick="clearChat()"><i data-lucide="trash-2"></i></button>
</header>

<div class="section-title"><i data-lucide="sparkles" style="width:14px;height:14px"></i> Essaie une question</div>
<div class="chips">
  <div class="chip" onclick="ask('Je cherche un boubou élégant pour un mariage')">👗 Boubou mariage</div>
  <div class="chip" onclick="ask('C\u2019est quoi les délais de livraison ?')">🚚 Livraison</div>
  <div class="chip" onclick="ask('Quels sont les codes promo actifs ?')">🏷️ Codes promo</div>
  <div class="chip" onclick="ask('Un cadeau pour ma mère, moins de 20000 F')">🎁 Idée cadeau</div>
  <div class="chip" onclick="ask('Comment devenir vendeur sur SEN TEW ?')">🏬 Vendre</div>
  <div class="chip" onclick="ask('Un smartphone pas cher avec une bonne photo')">📱 Téléphone</div>
</div>

<div class="section-title"><i data-lucide="message-circle" style="width:14px;height:14px"></i> Conversation</div>
<div class="conversation" id="chat"></div>

<div class="input-bar">
  <input type="text" class="input-field" id="msgInput" placeholder="Pose ta question à Nio Far…" autocomplete="off">
  <button class="btn-send" id="sendBtn" onclick="sendIA()"><i data-lucide="send"></i></button>
</div>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
  <a href="categories.html"><i data-lucide="layout-grid"></i><span>Catégories</span></a>
  <a href="recherche-ia.html"><i data-lucide="search"></i><span>Recherche</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
  <a href="profil.html"><i data-lucide="user"></i><span>Compte</span></a>
</nav>

<script>
lucide.createIcons();
var chat=document.getElementById('chat');
var inp=document.getElementById('msgInput');
var sendBtn=document.getElementById('sendBtn');

function now(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function bubble(html,me){
  var b=document.createElement('div');b.className='bubble'+(me?' user':'');
  b.innerHTML=(me?'':'<div class="bubble-avatar"><i data-lucide="bot"></i></div>')+
    '<div><div class="bubble-content">'+html+'</div><div class="bubble-time"'+(me?' style="text-align:right"':'')+'>'+now()+'</div></div>'+
    (me?'<div class="bubble-avatar"><i data-lucide="user"></i></div>':'');
  chat.appendChild(b);lucide.createIcons();
  window.scrollTo(0,document.body.scrollHeight);
  return b;
}
function typingBubble(){
  return bubble('<span class="typing"><span></span><span></span><span></span></span>',false);
}

function greet(){
  var name=localStorage.getItem('st_user_name')||'';
  bubble('Salaam'+(name?' '+esc(name):'')+' ! 👋 Je suis <b>Nio Far</b>, ton assistant SEN TEW. Je connais tout le catalogue, les promos, la livraison, les vendeurs… Demande-moi ce que tu veux !',false);
}
function clearChat(){chat.innerHTML='';greet();}

function ask(q){inp.value=q;sendIA();}

async function sendIA(){
  var txt=(inp.value||'').trim();
  if(!txt)return;
  bubble(esc(txt),true);
  inp.value='';sendBtn.disabled=true;
  var w=typingBubble();
  try{
    var rep=await stAiChat(txt);
    w.querySelector('.bubble-content').innerHTML=esc(rep).replace(/\n/g,'<br>');
  }catch(e){
    w.querySelector('.bubble-content').innerHTML='❌ Petit souci de connexion. Réessaie !';
  }
  sendBtn.disabled=false;
  window.scrollTo(0,document.body.scrollHeight);
  inp.focus();
}

inp.addEventListener('keypress',function(e){if(e.key==='Enter')sendIA();});

/* état IA */
if(typeof stAiHasKey==='function'&&!stAiHasKey()){
  document.getElementById('statusLine').textContent='⚠️ IA non activée sur cet appareil';
  bubble('⚙️ L\u2019IA n\u2019est pas encore activée sur cet appareil. Va sur <a href="config-ia.html" style="color:#6b46c1;font-weight:700">config-ia.html</a> pour coller la clé Gemini (une seule fois).',false);
}else{
  greet();
}
</script>
</body>
</html>
