<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant IA — SEN TEW</title>
<link rel="stylesheet" href="css/app.css?v=50">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-mode">

<header class="topbar" style="background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff">
  <button class="btn-back" onclick="history.back()" style="color:#fff"><i data-lucide="arrow-left" class="icon icon-md icon-blanc"></i></button>
  <h1 style="color:#fff !important;display:flex;align-items:center;gap:8px"><i data-lucide="bot" class="icon icon-md icon-blanc"></i> Assistant IA</h1>
  <button class="icon-btn"><i data-lucide="more-vertical" class="icon icon-md icon-blanc"></i></button>
</header>

<main style="padding:16px;padding-bottom:120px">

  <!-- Card bienvenue -->
  <section style="background:linear-gradient(135deg,#a855f7 0%,#7c3aed 100%);border-radius:20px;padding:20px;color:#fff;text-align:center;margin-bottom:16px;box-shadow:0 12px 32px rgba(168,85,247,0.3)">
    <div style="width:70px;height:70px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px"><i data-lucide="bot" style="width:36px;height:36px;color:#fff"></i></div>
    <h2 style="color:#fff !important;font-size:20px;font-weight:900;margin-bottom:4px">Assistant IA SEN TEW</h2>
    <p style="color:rgba(255,255,255,0.9) !important;font-size:12px;margin-bottom:12px">Disponible 24/7 · Français + Wolof · Réponse instantanée</p>
    <button style="background:#fff;color:#7c3aed;padding:12px 20px;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;gap:8px"><i data-lucide="message-circle" class="icon icon-sm" style="color:#7c3aed"></i> Démarrer une conversation</button>
  </section>

  <!-- Suggestions -->
  <h2 class="section-title"><i data-lucide="sparkles" class="icon icon-sm" style="color:#a855f7"></i> QUESTIONS RAPIDES</h2>
  <div style="background:#fff;border:1px solid #e5e5e0;border-radius:14px;padding:8px;margin-bottom:16px;box-shadow:0 2px 8px rgba(15,107,78,0.05)">
    <button style="width:100%;padding:14px;display:flex;align-items:center;gap:12px;background:transparent;border:none;border-bottom:1px solid #f5f5f0;text-align:left"><i data-lucide="truck" class="icon icon-sm icon-vert"></i><span style="flex:1;color:#0a1f17;font-size:14px;font-weight:600">Où est ma commande ?</span><i data-lucide="chevron-right" class="icon icon-sm" style="color:#4a5a52"></i></button>
    <button style="width:100%;padding:14px;display:flex;align-items:center;gap:12px;background:transparent;border:none;border-bottom:1px solid #f5f5f0;text-align:left"><i data-lucide="undo-2" class="icon icon-sm icon-rouge"></i><span style="flex:1;color:#0a1f17;font-size:14px;font-weight:600">Comment obtenir un remboursement ?</span><i data-lucide="chevron-right" class="icon icon-sm" style="color:#4a5a52"></i></button>
    <button style="width:100%;padding:14px;display:flex;align-items:center;gap:12px;background:transparent;border:none;border-bottom:1px solid #f5f5f0;text-align:left"><i data-lucide="tag" class="icon icon-sm icon-or"></i><span style="flex:1;color:#0a1f17;font-size:14px;font-weight:600">Codes promo actifs ?</span><i data-lucide="chevron-right" class="icon icon-sm" style="color:#4a5a52"></i></button>
    <button style="width:100%;padding:14px;display:flex;align-items:center;gap:12px;background:transparent;border:none;border-bottom:1px solid #f5f5f0;text-align:left"><i data-lucide="wallet" class="icon icon-sm icon-or"></i><span style="flex:1;color:#0a1f17;font-size:14px;font-weight:600">Comment retirer mon solde Wave ?</span><i data-lucide="chevron-right" class="icon icon-sm" style="color:#4a5a52"></i></button>
    <button style="width:100%;padding:14px;display:flex;align-items:center;gap:12px;background:transparent;border:none;text-align:left"><i data-lucide="store" class="icon icon-sm icon-vert"></i><span style="flex:1;color:#0a1f17;font-size:14px;font-weight:600">Devenir vendeur</span><i data-lucide="chevron-right" class="icon icon-sm" style="color:#4a5a52"></i></button>
  </div>

  <!-- Chat démo -->
  <h2 class="section-title"><i data-lucide="message-square" class="icon icon-sm icon-bleu"></i> CONVERSATION</h2>
  <div style="background:#fff;border:1px solid #e5e5e0;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(15,107,78,0.05)">
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="width:36px;height:36px;background:linear-gradient(135deg,#a855f7,#7c3aed);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i data-lucide="bot" class="icon icon-sm icon-blanc"></i></div>
      <div style="background:#f3e8ff;padding:10px 14px;border-radius:14px 14px 14px 4px;max-width:80%">
        <p style="color:#0a1f17;font-size:13px;line-height:1.5">Bonjour Karim ! 👋 Je suis l'assistant IA de SEN TEW. Comment puis-je vous aider aujourd'hui ?</p>
        <small style="color:#7c3aed;font-size:10px;font-weight:700">Assistant · maintenant</small>
      </div>
    </div>
  </div>
</main>

<!-- Input chat fixe -->
<div style="position:fixed;bottom:60px;left:0;right:0;background:#fff;border-top:1px solid #e5e5e0;padding:12px 16px;display:flex;gap:8px;align-items:center;z-index:99">
  <button style="background:#f5f5f0;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center"><i data-lucide="plus" class="icon icon-sm icon-vert"></i></button>
  <input type="text" placeholder="Posez votre question..." style="flex:1;padding:10px 14px;border-radius:20px;background:#f5f5f0;border:none">
  <button style="background:linear-gradient(135deg,#a855f7,#7c3aed);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center"><i data-lucide="send" class="icon icon-sm icon-blanc"></i></button>
</div>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home" class="icon icon-md"></i><span>Accueil</span></a>
  <a href="categories.html"><i data-lucide="layout-grid" class="icon icon-md"></i><span>Catégories</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart" class="icon icon-md"></i><span>Panier</span></a>
  <a href="messages.html" class="active"><i data-lucide="message-circle" class="icon icon-md"></i><span>Messages</span></a>
  <a href="profil.html"><i data-lucide="user" class="icon icon-md"></i><span>Profil</span></a>
</nav>

<script src="js/dark-mode.js?v=50"></script>
<script>lucide.createIcons();</script>
</body>
</html>
