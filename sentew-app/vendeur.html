<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devenir Vendeur - SEN TEW</title>
<link rel="stylesheet" href="css/app.css?v=51">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-mode">

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <h1>Devenir Vendeur</h1>
  <button class="icon-btn" onclick="location.href='support.html'"><i data-lucide="help-circle"></i></button>
</header>

<main class="container">
  <div class="section-card" style="background:linear-gradient(135deg,#0f6b4e,#0a4d38);color:#fff;text-align:center;padding:32px 20px;">
    <i data-lucide="store" style="width:64px;height:64px;color:#d4a574;"></i>
    <h2 style="color:#fff;margin-top:16px;">Devenez vendeur SEN TEW</h2>
    <p style="color:#d4a574;">Vendez à 85 000+ clients au Sénégal</p>
  </div>

  <div class="section-card">
    <h3>💼 Avantages</h3>
    <ul style="list-style:none;padding:0;">
      <li style="padding:12px 0;border-bottom:1px solid #e5e7eb;"><i data-lucide="users" style="color:#0f6b4e;"></i> 85 000+ clients actifs</li>
      <li style="padding:12px 0;border-bottom:1px solid #e5e7eb;"><i data-lucide="percent" style="color:#0f6b4e;"></i> Commission dès 5%</li>
      <li style="padding:12px 0;border-bottom:1px solid #e5e7eb;"><i data-lucide="truck" style="color:#0f6b4e;"></i> Livraison gérée</li>
      <li style="padding:12px 0;border-bottom:1px solid #e5e7eb;"><i data-lucide="shield-check" style="color:#0f6b4e;"></i> Paiement sécurisé</li>
      <li style="padding:12px 0;"><i data-lucide="bar-chart-3" style="color:#0f6b4e;"></i> Stats temps réel</li>
    </ul>
  </div>

  <div class="section-card">
    <h3>📝 Inscription</h3>
    <form onsubmit="submitVendor(event)">
      <input type="text" class="form-input" placeholder="Nom de la boutique" required>
      <select class="form-input" required>
        <option>Catégorie principale</option>
        <option>Électronique</option>
        <option>Mode</option>
        <option>Alimentation</option>
        <option>Beauté</option>
        <option>Maison</option>
      </select>
      <input type="tel" class="form-input" placeholder="Téléphone (+221...)" required>
      <input type="email" class="form-input" placeholder="Email professionnel" required>
      <input type="text" class="form-input" placeholder="Ville" required>
      <textarea class="form-input" rows="3" placeholder="Description de votre boutique"></textarea>
      <label style="display:flex;align-items:center;gap:8px;margin:12px 0;">
        <input type="checkbox" required>
        <span>J'accepte les <a href="cgv.html" style="color:#0f6b4e;">CGV vendeur</a></span>
      </label>
      <button type="submit" class="btn-primary" style="width:100%;padding:14px;">
        <i data-lucide="rocket"></i> Créer ma boutique
      </button>
    </form>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search"></i><span>Recherche</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
  <a href="favoris.html"><i data-lucide="heart"></i><span>Favoris</span></a>
  <a href="profil.html"><i data-lucide="user"></i><span>Profil</span></a>
</nav>

<script>
  lucide.createIcons();
  function submitVendor(e){e.preventDefault();alert('✅ Inscription reçue ! Validation sous 24h.');location.href='profil.html';}
</script>
</body>
</html>
