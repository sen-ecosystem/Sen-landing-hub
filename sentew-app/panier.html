<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panier - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/styles-pays.css">
<style>
:root{--v:#0f6b4e;--vd:#0a4d38;--or:#d4a574;--noir:#0a1f17;--card:#1a2e24;--text:#f5f5f0;--muted:#9ca3af;--border:#2a3e34;--rouge:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',sans-serif}
body{background:var(--noir);color:var(--text);padding-bottom:120px;max-width:600px;margin:0 auto}
.top{background:var(--card);padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.back{background:rgba(255,255,255,.1);border:none;width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--text);cursor:pointer}
.top h1{flex:1;font-size:15px;font-weight:700;color:var(--or)}
.top .heart{background:rgba(255,255,255,.1);border:none;width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--rouge);cursor:pointer}
.section-title{padding:14px 16px 8px;font-size:14px;font-weight:800;color:var(--or)}
.cart-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.cart-empty .emoji{font-size:60px;margin-bottom:14px}
.cart-empty h3{color:var(--text);margin-bottom:8px}
.cart-empty p{font-size:13px;margin-bottom:20px}
.cart-empty a{background:var(--v);color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700}
.item{display:flex;gap:12px;background:var(--card);margin:8px 14px;padding:12px;border-radius:12px;border:1px solid var(--border)}
.item img{width:80px;height:80px;border-radius:10px;object-fit:cover;background:var(--noir)}
.item-body{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3}
.item-seller{font-size:11px;color:var(--or);margin-bottom:6px}
.item-price{font-size:16px;font-weight:900;color:var(--or)}
.item-actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.qty{display:flex;align-items:center;gap:8px;background:var(--noir);border-radius:20px;padding:2px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--v);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty button:active{transform:scale(.9)}
.qty span{font-weight:700;min-width:26px;text-align:center;color:var(--text)}
.del{background:rgba(239,68,68,.15);border:none;color:var(--rouge);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}
.promo-box{background:var(--card);margin:8px 14px;padding:10px;border-radius:12px;display:flex;gap:8px;border:1px solid var(--border)}
.promo-box input{flex:1;background:var(--noir);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:13px}
.promo-box button{background:var(--v);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.summary{background:var(--card);margin:8px 14px;padding:14px;border-radius:12px;border:1px solid var(--border)}
.sum-line{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--text)}
.sum-line.dis{color:#00c060}
.sum-total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);margin-top:8px;font-size:18px;font-weight:900;color:var(--or)}
.suggestions{background:var(--card);margin:8px 14px;padding:14px;border-radius:12px;border:1px solid var(--border)}
.suggestions h4{color:var(--or);margin-bottom:10px;font-size:14px}
.sug-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.sug-scroll::-webkit-scrollbar{display:none}
.sug-item{min-width:120px;background:var(--noir);border-radius:10px;padding:8px;cursor:pointer}
.sug-item img{width:100%;height:100px;border-radius:8px;object-fit:cover}
.sug-name{font-size:11px;color:var(--text);margin-top:6px;font-weight:600}
.sug-price{font-size:12px;color:var(--or);font-weight:800;margin-top:2px}
.bar{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;background:var(--card);padding:12px;box-shadow:0 -4px 16px rgba(0,0,0,.4);z-index:50;border-top:1px solid var(--border)}
.bar-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar-total .lbl{color:var(--muted);font-size:12px}
.bar-total .amt{color:var(--or);font-size:22px;font-weight:900}
.pay-btn{width:100%;background:linear-gradient(135deg,var(--v),var(--vd));color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(15,107,78,.4)}
.pay-btn:active{transform:scale(.98)}
.nav-bar{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;background:var(--card);border-top:1px solid var(--border);padding:8px 0;display:flex;justify-content:space-around;z-index:40;display:none}
</style>
</head>
<body>

<div class="top">
  <button class="back" onclick="history.back()">←</button>
  <h1>🛒 Mon Panier <span id="itemCount"></span></h1>
  <button class="heart" onclick="location.href='favoris.html'">❤️</button>
</div>

<div id="cartContent"></div>

<div class="promo-box" id="promoBox" style="display:none">
  <input type="text" id="promoCode" placeholder="Code promo (ex: RAMADAN30)">
  <button onclick="applyPromo()">Appliquer</button>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="sum-line"><span>Sous-total</span><span id="subtotal">0 FCFA</span></div>
  <div class="sum-line"><span>Livraison</span><span id="delivery">2 500 FCFA</span></div>
  <div class="sum-line dis" id="discountLine" style="display:none"><span>Remise</span><span id="discount">-0 FCFA</span></div>
  <div class="sum-total"><span>TOTAL</span><span id="total">0 FCFA</span></div>
</div>

<div class="suggestions" id="suggestions" style="display:none">
  <h4>⭐ Vous pourriez aimer</h4>
  <div class="sug-scroll" id="sugScroll"></div>
</div>

<div class="bar" id="payBar" style="display:none">
  <div class="bar-total">
    <span class="lbl">Total à payer</span>
    <span class="amt" id="barTotal">0 FCFA</span>
  </div>
  <button class="pay-btn" onclick="checkout()">🔒 Passer la commande</button>
</div>

<script src="js/dark-mode.js"></script>
<script src="js/role-guard.js"></script>
<script>
let cart = JSON.parse(localStorage.getItem('cart')||'[]');

// Produits de démo si panier vide (pour test)
if(cart.length === 0){
  cart = [
    {id:1,name:'Robe Wax Premium',price:25000,img:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=200',qty:1,seller:'Wax & Co'},
    {id:6,name:'Sac cuir artisanal',price:18500,img:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=200',qty:1,seller:'Cuir d\'Afrique'},
    {id:20,name:'Bijoux dorés',price:8000,img:'https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=200',qty:1,seller:'Méda d\'Or'}
  ];
  localStorage.setItem('cart', JSON.stringify(cart));
}

let discount = 0;

function render(){
  const content = document.getElementById('cartContent');
  const itemCount = document.getElementById('itemCount');

  if(cart.length === 0){
    content.innerHTML = `
      <div class="cart-empty">
        <div class="emoji">🛒</div>
        <h3>Votre panier est vide</h3>
        <p>Découvrez nos produits et remplissez votre panier</p>
        <a href="index.html">🏠 Retour à l'accueil</a>
      </div>`;
    itemCount.textContent = '';
    document.getElementById('promoBox').style.display = 'none';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('payBar').style.display = 'none';
    return;
  }

  itemCount.textContent = '('+cart.length+' article'+(cart.length>1?'s':'')+')';

  content.innerHTML = cart.map((item,idx)=>`
    <div class="item">
      <img src="${item.img}" alt="${item.name}" onclick="location.href='produit.html?id=${item.id}'" style="cursor:pointer">
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        <div class="item-seller">Vendeur : ${item.seller||'SEN TEW'}</div>
        <div class="item-price">${(item.price*item.qty).toLocaleString('fr-FR')} FCFA</div>
        <div class="item-actions">
          <div class="qty">
            <button onclick="changeQty(${idx},-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${idx},1)">+</button>
          </div>
          <button class="del" onclick="removeItem(${idx})">🗑️</button>
        </div>
      </div>
    </div>
  `).join('');

  document.getElementById('promoBox').style.display = 'flex';
  document.getElementById('summary').style.display = 'block';
  document.getElementById('payBar').style.display = 'block';
  document.getElementById('suggestions').style.display = 'block';
  updateTotals();
  renderSuggestions();
}

function changeQty(idx, delta){
  cart[idx].qty += delta;
  if(cart[idx].qty <= 0){
    if(confirm('Retirer '+cart[idx].name+' du panier ?')){
      cart.splice(idx,1);
    } else {
      cart[idx].qty = 1;
    }
  }
  localStorage.setItem('cart', JSON.stringify(cart));
  if(navigator.vibrate) navigator.vibrate(15);
  render();
}

function removeItem(idx){
  if(confirm('Retirer '+cart[idx].name+' du panier ?')){
    cart.splice(idx,1);
    localStorage.setItem('cart', JSON.stringify(cart));
    if(navigator.vibrate) navigator.vibrate(30);
    render();
  }
}

function updateTotals(){
  const sub = cart.reduce((s,i)=>s + i.price*i.qty, 0);
  const delivery = sub > 50000 ? 0 : 2500;
  const total = sub + delivery - discount;

  document.getElementById('subtotal').textContent = sub.toLocaleString('fr-FR')+' FCFA';
  document.getElementById('delivery').textContent = delivery === 0 ? 'GRATUITE 🎉' : delivery.toLocaleString('fr-FR')+' FCFA';
  document.getElementById('total').textContent = total.toLocaleString('fr-FR')+' FCFA';
  document.getElementById('barTotal').textContent = total.toLocaleString('fr-FR')+' FCFA';

  if(discount > 0){
    document.getElementById('discountLine').style.display = 'flex';
    document.getElementById('discount').textContent = '-'+discount.toLocaleString('fr-FR')+' FCFA';
  }
}

function applyPromo(){
  const code = document.getElementById('promoCode').value.trim().toUpperCase();
  const promos = {
    'RAMADAN30': 0.30, 'NOUVEAU10': 0.10, 'SOLDES2026': 0.20, 'LIVRAISON0': 'delivery'
  };
  if(promos[code]){
    const sub = cart.reduce((s,i)=>s + i.price*i.qty, 0);
    if(promos[code] === 'delivery'){
      discount = 2500;
      alert('✅ Livraison gratuite appliquée !');
    } else {
      discount = Math.round(sub * promos[code]);
      alert('✅ Promo -'+(promos[code]*100)+'% appliquée ! Économie : '+discount.toLocaleString('fr-FR')+' FCFA');
    }
    updateTotals();
  } else {
    alert('❌ Code promo invalide');
  }
}

function renderSuggestions(){
  const sugs = [
    {id:100,name:'Coussin décoratif',price:7500,img:'https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=200'},
    {id:101,name:'Chapeau traditionnel',price:6500,img:'https://images.unsplash.com/photo-1521369909029-2afed882baee?w=200'},
    {id:102,name:'Ceinture en cuir',price:9000,img:'https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=200'},
    {id:103,name:'Panier tressé',price:10000,img:'https://images.unsplash.com/photo-1622470953794-aa9c70b0fb9d?w=200'},
  ];
  document.getElementById('sugScroll').innerHTML = sugs.map(s=>`
    <div class="sug-item" onclick="location.href='produit.html?id=${s.id}'">
      <img src="${s.img}">
      <div class="sug-name">${s.name}</div>
      <div class="sug-price">${s.price.toLocaleString('fr-FR')} FCFA</div>
    </div>
  `).join('');
}

function checkout(){
  if(cart.length === 0){ alert('Panier vide'); return; }
  const total = cart.reduce((s,i)=>s + i.price*i.qty, 0) + (cart.reduce((s,i)=>s + i.price*i.qty, 0) > 50000 ? 0 : 2500) - discount;
  if(navigator.vibrate) navigator.vibrate([50,30,50]);
  sessionStorage.setItem('checkout_total', total);
  location.href = 'paiement.html?total='+total;
}

// Applique le style pays
document.documentElement.setAttribute('data-country', localStorage.getItem('sen_country')||'SN');

render();
</script>
</body>
</html>
