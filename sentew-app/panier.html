<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panier - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F6B4E">
<link rel="stylesheet" href="css/app.css">
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <div class="app-logo">🛒 Mon Panier</div>
    <button class="header-btn" onclick="if(confirm('Vider ?'))clearCart()">🗑</button>
  </header>

  <main class="app-content">
    <div id="cartList" style="padding:12px;"></div>
    
    <div id="summary" style="margin:16px;background:rgba(255,255,255,.05);border-radius:14px;padding:16px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:rgba(255,255,255,.7);">
        <span>Sous-total</span><span id="subtotal">0 FCFA</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:rgba(255,255,255,.7);">
        <span>Livraison</span><span>2 000 FCFA</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:#22c55e;">
        <span>Réduction GOLD -10%</span><span id="disc">0 FCFA</span>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,.1);margin:8px 0;padding-top:8px;display:flex;justify-content:space-between;font-size:16px;font-weight:800;">
        <span>Total</span><span id="total" style="color:#D4A574;">0 FCFA</span>
      </div>
    </div>

    <div class="card-title">💳 Mode de paiement</div>
    <div class="card">
      <label style="display:flex;align-items:center;padding:12px 16px;cursor:pointer;">
        <input type="radio" name="pay" checked style="margin-right:12px;pointer-events:auto;">
        <div style="flex:1;"><div style="font-weight:600;">🌊 Wave</div><div style="font-size:11px;color:rgba(255,255,255,.6);">Instantané</div></div>
      </label>
      <label style="display:flex;align-items:center;padding:12px 16px;cursor:pointer;border-top:1px solid rgba(255,255,255,.05);">
        <input type="radio" name="pay" style="margin-right:12px;pointer-events:auto;">
        <div style="flex:1;"><div style="font-weight:600;">🍊 Orange Money</div><div style="font-size:11px;color:rgba(255,255,255,.6);">1-2 min</div></div>
      </label>
      <label style="display:flex;align-items:center;padding:12px 16px;cursor:pointer;border-top:1px solid rgba(255,255,255,.05);">
        <input type="radio" name="pay" style="margin-right:12px;pointer-events:auto;">
        <div style="flex:1;"><div style="font-weight:600;">🆓 Free Money</div><div style="font-size:11px;color:rgba(255,255,255,.6);">1-2 min</div></div>
      </label>
      <label style="display:flex;align-items:center;padding:12px 16px;cursor:pointer;border-top:1px solid rgba(255,255,255,.05);">
        <input type="radio" name="pay" style="margin-right:12px;pointer-events:auto;">
        <div style="flex:1;"><div style="font-weight:600;">💵 Cash à la livraison</div><div style="font-size:11px;color:rgba(255,255,255,.6);">Espèces</div></div>
      </label>
    </div>

    <button class="btn btn-gold btn-full" style="margin:16px;width:calc(100% - 32px);font-size:15px;padding:16px;" onclick="checkout()">🔒 Payer maintenant</button>
    <div style="height:20px;"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">📊</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html" class="active"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script>
const cart = [
  {id:1,name:'Sac cuir africain premium',price:15000,qty:1,image:'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=200'},
  {id:2,name:'Écouteurs sans fil Pro',price:12000,qty:2,image:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=200'},
  {id:3,name:'Boubou wax collection été',price:18000,qty:1,image:'https://images.unsplash.com/photo-1596902852634-fc2d10a1cc11?w=200'}
];

function render(){
  const list = document.getElementById('cartList');
  if(!cart.length){list.innerHTML='<div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,.6);"><div style="font-size:60px;">🛒</div><div style="margin-top:12px;">Panier vide</div><a href="index.html" style="display:inline-block;margin-top:16px;color:#D4A574;">Découvrir des produits →</a></div>';update();return}
  list.innerHTML = cart.map((it,i)=>`
    <div style="background:rgba(255,255,255,.05);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;">
      <img src="${it.image}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;pointer-events:auto;">
      <div style="flex:1;">
        <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${it.name}</div>
        <div style="color:#D4A574;font-weight:800;">${it.price.toLocaleString()} FCFA</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
          <button onclick="chg(${i},-1)" style="background:rgba(212,165,116,.15);border:1px solid #D4A574;color:#D4A574;width:28px;height:28px;border-radius:8px;cursor:pointer;">−</button>
          <span style="min-width:24px;text-align:center;font-weight:700;">${it.qty}</span>
          <button onclick="chg(${i},1)" style="background:rgba(212,165,116,.15);border:1px solid #D4A574;color:#D4A574;width:28px;height:28px;border-radius:8px;cursor:pointer;">+</button>
          <button onclick="del(${i})" style="margin-left:auto;background:none;border:none;color:#ef4444;font-size:18px;cursor:pointer;">🗑</button>
        </div>
      </div>
    </div>
  `).join('');
  update();
}
function chg(i,d){cart[i].qty=Math.max(1,cart[i].qty+d);render()}
function del(i){cart.splice(i,1);render()}
function clearCart(){cart.length=0;render()}
function update(){
  const sub = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const disc = Math.round(sub*0.1);
  const total = sub + 2000 - disc;
  document.getElementById('subtotal').textContent = sub.toLocaleString()+' FCFA';
  document.getElementById('disc').textContent = '-'+disc.toLocaleString()+' FCFA';
  document.getElementById('total').textContent = total.toLocaleString()+' FCFA';
}
function checkout(){
  if(!cart.length){alert('Panier vide');return}
  alert('✅ Commande confirmée !\nRedirection vers Wave...');
  setTimeout(()=>window.location.href='commandes.html',1000);
}
render();
</script>
</body>
</html>
