<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panier - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f0;font-family:'Segoe UI',-apple-system,sans-serif;padding-bottom:96px;color:#0a1f17}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:40}
.topbar h1{font-size:17px;font-weight:800;color:#0f6b4e;display:flex;align-items:center;gap:8px;flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#f5f5f0;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0f6b4e}
/* ===== Articles ===== */
.cart-item{display:flex;gap:12px;background:#fff;margin:10px 14px 0;padding:12px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cart-item img{width:86px;height:86px;object-fit:cover;border-radius:12px;flex-shrink:0;cursor:pointer;background:#eee}
.ci-info{flex:1;min-width:0;display:flex;flex-direction:column}
.ci-vendor{font-size:10px;color:#b8860b;font-weight:700;cursor:pointer}
.ci-name{font-size:13px;font-weight:800;color:#0a1f17;line-height:1.3;cursor:pointer}
.ci-price{font-size:15px;font-weight:900;color:#0f6b4e;margin-top:3px}
.ci-ship{font-size:10px;margin-top:2px}
.ci-ship.free{color:#0f6b4e;font-weight:700}
.ci-ship.paid{color:#b45309}
.ci-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.qty-box{display:flex;align-items:center;border:1.5px solid #e5e7eb;border-radius:10px;overflow:hidden}
.qty-box button{width:30px;height:30px;background:#fff;border:none;font-size:15px;font-weight:800;color:#0f6b4e;cursor:pointer}
.qty-box span{padding:0 10px;font-size:13px;font-weight:800;min-width:30px;text-align:center}
.ci-del{width:32px;height:32px;border-radius:50%;background:#fff;border:1.5px solid #fee2e2;color:#e63946;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* ===== Barre livraison gratuite ===== */
.free-bar{background:#fff;margin:12px 14px 0;padding:14px;border-radius:16px;border:1.5px solid #0f6b4e;box-shadow:0 2px 10px rgba(15,107,78,.12)}
.free-bar .fb-txt{font-size:12px;font-weight:800;color:#0a1f17;display:flex;align-items:center;gap:7px}
.free-bar .fb-txt i{color:#0f6b4e;width:17px;height:17px}
.free-bar .fb-sub{font-size:11px;color:#6B7280;margin-top:3px}
.fb-track{height:9px;background:#f0f0ea;border-radius:5px;margin-top:9px;overflow:hidden}
.fb-fill{height:100%;background:linear-gradient(90deg,#0f6b4e,#4ade80);border-radius:5px;transition:width .4s}
.free-bar.won{border-color:#4ade80;background:#f0fdf4}
/* ===== Promo ===== */
.bloc{background:#fff;margin:12px 14px 0;padding:14px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bloc h2{font-size:12px;font-weight:800;color:#b8860b;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.promo-row{display:flex;gap:8px}
.promo-row input{flex:1;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:13px;font-family:inherit;outline:none;text-transform:uppercase}
.promo-row input:focus{border-color:#0f6b4e}
.promo-row button{padding:11px 18px;background:#0f6b4e;color:#fff;border:none;border-radius:12px;font-size:12px;font-weight:800;cursor:pointer}
.promo-ok{display:flex;align-items:center;gap:8px;background:#f0fdf4;border:1.5px dashed #4ade80;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;color:#065f46}
.promo-ok button{margin-left:auto;background:none;border:none;color:#e63946;font-weight:800;cursor:pointer;font-size:12px}
.promo-err{color:#e63946;font-size:11px;font-weight:700;margin-top:6px}
.promo-link{display:block;margin-top:8px;font-size:11px;color:#0f6b4e;font-weight:700;text-decoration:none}
/* ===== Zone de livraison ===== */
.zone-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.zone-opt{padding:11px 6px;border:1.5px solid #e5e7eb;border-radius:12px;text-align:center;cursor:pointer;background:#fff}
.zone-opt.on{border-color:#0f6b4e;background:#e8f5f0}
.zone-opt b{display:block;font-size:11px;color:#0a1f17}
.zone-opt span{font-size:10px;color:#6B7280}
.addr-input{width:100%;margin-top:10px;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box}
.addr-input:focus{border-color:#0f6b4e}
/* ===== Paiement ===== */
.pay-opt{display:flex;align-items:center;gap:12px;padding:13px;border:1.5px solid #e5e7eb;border-radius:14px;cursor:pointer;background:#fff;margin-bottom:8px}
.pay-opt.on{border-color:#0f6b4e;background:#e8f5f0}
.pay-opt .pi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pay-opt b{display:block;font-size:13px;color:#0a1f17}
.pay-opt span{font-size:11px;color:#6B7280;line-height:1.3}
.pay-opt .tag{margin-left:auto;font-size:10px;font-weight:800;padding:4px 9px;border-radius:10px;flex-shrink:0}
.tag-free{background:#d1fae5;color:#065f46}
.tag-fee{background:#fef3c7;color:#92400e}
.pay-radio{width:18px;height:18px;border-radius:50%;border:2px solid #d1d5db;flex-shrink:0;position:relative}
.pay-opt.on .pay-radio{border-color:#0f6b4e}
.pay-opt.on .pay-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#0f6b4e}
/* ===== Résumé ===== */
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:#4b5563;padding:5px 0}
.sum-row.discount{color:#059669;font-weight:700}
.sum-row.total{border-top:2px solid #f0f0ea;margin-top:8px;padding-top:12px;font-size:16px;font-weight:900;color:#0a1f17}
.sum-row.total .tv{color:#0f6b4e}
/* ===== Commander ===== */
.checkout-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e5e7eb;z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.btn-order{width:100%;padding:15px;background:#0f6b4e;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-order:disabled{background:#9aa5a0}
.secure-row{display:flex;justify-content:center;gap:14px;margin-top:8px;font-size:10px;color:#9aa5a0}
.secure-row span{display:flex;align-items:center;gap:4px}
/* ===== Vide / succès ===== */
.empty{text-align:center;padding:60px 24px;color:#9aa5a0}
.empty h3{color:#0a1f17;margin:12px 0 6px;font-size:16px}
.empty a{display:inline-block;margin-top:14px;padding:12px 24px;background:#0f6b4e;color:#fff;border-radius:12px;text-decoration:none;font-weight:800;font-size:13px}
.success{text-align:center;padding:50px 24px}
.success .ok{width:76px;height:76px;border-radius:50%;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.success h2{font-size:19px;color:#0a1f17;margin-bottom:6px}
.success .code{display:inline-block;background:#0a1f17;color:#4ade80;font-family:monospace;font-size:17px;font-weight:900;padding:10px 20px;border-radius:12px;letter-spacing:2px;margin:12px 0}
.success p{font-size:12px;color:#6B7280;line-height:1.6}
.success .btns{display:flex;gap:10px;margin-top:18px}
.success .btns a{flex:1;padding:13px;border-radius:12px;text-decoration:none;font-weight:800;font-size:13px;text-align:center}
.b-green{background:#0f6b4e;color:#fff}
.b-grey{background:#e5e7eb;color:#0a1f17}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <h1><i data-lucide="shopping-cart"></i> Mon Panier <span id="nbItems" style="color:#9aa5a0;font-size:13px;font-weight:700"></span></h1>
  <button class="icon-btn" onclick="clearCart()"><i data-lucide="trash-2"></i></button>
</header>

<div id="page"></div>

<nav class="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e5e7eb;z-index:99;box-shadow:0 -2px 10px rgba(0,0,0,.05)">
  <a href="index.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#6B7280;font-size:10px;font-weight:600;min-height:44px;justify-content:center"><i data-lucide="home"></i><span>Accueil</span></a>
  <a href="categories.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#6B7280;font-size:10px;font-weight:600;min-height:44px;justify-content:center"><i data-lucide="layout-grid"></i><span>Catégories</span></a>
  <a href="favoris.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#6B7280;font-size:10px;font-weight:600;min-height:44px;justify-content:center"><i data-lucide="heart"></i><span>Favoris</span></a>
  <a href="profil.html" style="display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#6B7280;font-size:10px;font-weight:600;min-height:44px;justify-content:center"><i data-lucide="user"></i><span>Profil</span></a>
</nav>

<script>
var PROMOS = {
  'RAMADAN30': { pct: 30, label: '-30% Vente Flash' },
  'SENTEW10':  { pct: 10, label: '-10% Bienvenue' },
  'WELCOME5':  { pct: 5,  label: '-5% Première commande' }
};
var PROMO = null;
var ZONE = 'Dakar';
var PAY = 'online';

function itemShipNote(it){
  // Note livraison par article (indicatif vendeur)
  return null;
}

function render(){
  var items = cartGet();
  var page = document.getElementById('page');
  document.getElementById('nbItems').textContent = items.length ? '(' + cartCount() + ')' : '';

  if (!items.length) {
    page.innerHTML = '<div class="empty"><i data-lucide="shopping-cart" style="width:48px;color:#d1d5db"></i><h3>Ton panier est vide</h3><p>Découvre nos articles et ajoute ce qui te plaît.</p><a href="index.html">Voir les articles</a></div>';
    lucide.createIcons();
    return;
  }

  // Calcul livraison via la fonction centrale (règles SEN TEW)
  var ship = calcShipping(items, ZONE, PAY);
  var subtotal = cartTotal();
  var discount = PROMO ? Math.round(subtotal * PROMO.pct / 100) : 0;
  var total = subtotal - discount + ship.fee + ship.cashFee;

  // ----- Articles -----
  var html = items.map(function(it, i){
    return '<div class="cart-item">' +
      '<img src="' + it.img + '" alt="" onclick="location.href=\'produit.html?pid=' + it.id + '\'">' +
      '<div class="ci-info">' +
        (it.vendor ? '<div class="ci-vendor" onclick="location.href=\'boutique.html?slug=' + it.slug + '\'"><i data-lucide="store" style="width:10px;display:inline"></i> ' + it.vendor + '</div>' : '') +
        '<div class="ci-name" onclick="location.href=\'produit.html?pid=' + it.id + '\'">' + it.name + '</div>' +
        '<div class="ci-price">' + fmtPrix(it.price) + ' FCFA</div>' +
        (it.free_shipping ? '<div class="ci-ship free">🚚 Livraison gratuite vendeur</div>' : '') +
        '<div class="ci-bottom">' +
          '<div class="qty-box"><button onclick="chQty(' + i + ',-1)">−</button><span>' + it.qty + '</span><button onclick="chQty(' + i + ',1)">+</button></div>' +
          '<button class="ci-del" onclick="delItem(' + i + ')"><i data-lucide="trash-2" style="width:13px"></i></button>' +
        '</div>' +
      '</div></div>';
  }).join('');

  // ----- Barre livraison gratuite -----
  if (ship.free) {
    html += '<div class="free-bar won"><div class="fb-txt"><i data-lucide="party-popper"></i> Livraison GRATUITE !</div>' +
      '<div class="fb-sub">' + ship.reason + '</div></div>';
  } else if (ship.progress) {
    html += '<div class="free-bar"><div class="fb-txt"><i data-lucide="target"></i> Plus que <b style="color:#0f6b4e">' + fmtPrix(ship.progress.rest) + ' F</b> pour la LIVRAISON GRATUITE</div>' +
      '<div class="fb-track"><div class="fb-fill" style="width:' + ship.progress.pct + '%"></div></div>' +
      '<div class="fb-sub">ou paie en ligne → livraison offerte à Dakar</div></div>';
  } else {
    html += '<div class="free-bar"><div class="fb-txt"><i data-lucide="truck"></i> ' + ship.reason + '</div></div>';
  }

  // ----- Promo -----
  html += '<div class="bloc"><h2><i data-lucide="ticket" style="width:14px"></i> CODE PROMO</h2>';
  if (PROMO) {
    html += '<div class="promo-ok"><i data-lucide="badge-check" style="width:15px"></i> <span><b>' + PROMO.code + '</b> · ' + PROMO.label + ' appliqué</span><button onclick="rmPromo()">Retirer</button></div>';
  } else {
    html += '<div class="promo-row"><input type="text" id="promoInput" placeholder="Ex : RAMADAN30" maxlength="20"><button onclick="applyPromo()">Appliquer</button></div>' +
      '<div class="promo-err" id="promoErr"></div>' +
      '<a class="promo-link" href="bons-promo.html">Voir mes bons disponibles ›</a>';
  }
  html += '</div>';

  // ----- Zone -----
  html += '<div class="bloc"><h2><i data-lucide="map-pin" style="width:14px"></i> ZONE DE LIVRAISON</h2>' +
    '<div class="zone-grid">' +
      '<div class="zone-opt' + (ZONE==='Dakar'?' on':'') + '" onclick="setZone(\'Dakar\',this)"><b>Dakar</b><span>' + fmtPrix(SHIP.dakar_fee) + ' F · 24-48h</span></div>' +
      '<div class="zone-opt' + (ZONE==='Pikine'?' on':'') + '" onclick="setZone(\'Pikine\',this)"><b>Banlieue</b><span>' + fmtPrix(SHIP.suburb_fee) + ' F · 24-48h</span></div>' +
      '<div class="zone-opt' + (ZONE==='Thiès'?' on':'') + '" onclick="setZone(\'Thiès\',this)"><b>Régions</b><span>' + fmtPrix(SHIP.regions_fee_min) + '+ F · 2-5j</span></div>' +
    '</div>' +
    '<input class="addr-input" id="addrInput" placeholder="Adresse complète (quartier, rue, repère…)" value="' + (localStorage.getItem('sentew_addr') || '') + '">' +
  '</div>';

  // ----- Paiement -----
  html += '<div class="bloc"><h2><i data-lucide="wallet" style="width:14px"></i> MODE DE PAIEMENT</h2>' +
    '<div class="pay-opt' + (PAY==='online'?' on':'') + '" onclick="setPay(\'online\')">' +
      '<div class="pi" style="background:#e8f5f0;color:#0f6b4e"><i data-lucide="smartphone"></i></div>' +
      '<div style="flex:1"><b>Paiement en ligne</b><span>Mobile money ou carte bancaire — sécurisé</span></div>' +
      (ZONE === 'Dakar' ? '<span class="tag tag-free">Livraison GRATUITE</span>' : '<span class="tag tag-free">Recommandé</span>') +
      '<div class="pay-radio"></div></div>' +
    '<div class="pay-opt' + (PAY==='cash'?' on':'') + '" onclick="setPay(\'cash\')">' +
      '<div class="pi" style="background:#fef3c7;color:#92400e"><i data-lucide="banknote"></i></div>' +
      '<div style="flex:1"><b>À la livraison</b><span>Paie en cash à la réception du colis</span></div>' +
      '<span class="tag tag-fee">+' + fmtPrix(SHIP.cash_fee) + ' F</span>' +
      '<div class="pay-radio"></div></div>' +
  '</div>';

  // ----- Résumé -----
  html += '<div class="bloc"><h2><i data-lucide="receipt" style="width:14px"></i> RÉSUMÉ</h2>' +
    '<div class="sum-row"><span>Sous-total (' + cartCount() + ' article' + (cartCount()>1?'s':'') + ')</span><b>' + fmtPrix(subtotal) + ' F</b></div>' +
    (discount ? '<div class="sum-row discount"><span>Code ' + PROMO.code + '</span><b>−' + fmtPrix(discount) + ' F</b></div>' : '') +
    '<div class="sum-row"><span>Livraison · ' + ZONE + '</span><b>' + (ship.free ? '<span style="color:#059669">GRATUITE 🎉</span>' : fmtPrix(ship.fee) + ' F') + '</b></div>' +
    (ship.cashFee ? '<div class="sum-row"><span>Paiement à la livraison</span><b>+' + fmtPrix(ship.cashFee) + ' F</b></div>' : '') +
    '<div class="sum-row total"><span>Total</span><span class="tv">' + fmtPrix(total) + ' FCFA</span></div>' +
  '</div>';

  // ----- Bouton commander -----
  html += '<div style="padding:14px 14px 0">' +
    '<button class="btn-order" id="btnOrder" onclick="order()"><i data-lucide="lock" style="width:16px"></i> Commander · ' + fmtPrix(total) + ' FCFA</button>' +
    '<div class="secure-row"><span><i data-lucide="shield-check" style="width:11px"></i> Paiement sécurisé</span><span><i data-lucide="rotate-ccw" style="width:11px"></i> Retour 7 jours</span><span><i data-lucide="package-check" style="width:11px"></i> Suivi en direct</span></div>' +
  '</div>';

  page.innerHTML = html;
  lucide.createIcons();
}

function chQty(i, d){
  var items = cartGet();
  cartQty(items[i].id, d);
  render();
}
function delItem(i){
  var items = cartGet();
  cartRemove(items[i].id);
  render();
}
function clearCart(){
  if (confirm('Vider tout le panier ?')) { cartSave([]); render(); }
}
function setZone(z, el){
  ZONE = z;
  render();
}
function setPay(p){
  PAY = p;
  render();
}
function applyPromo(){
  var code = document.getElementById('promoInput').value.trim().toUpperCase();
  var err = document.getElementById('promoErr');
  if (!code) return;
  if (PROMOS[code]) {
    PROMO = Object.assign({ code: code }, PROMOS[code]);
    toast('🎉 Code ' + code + ' appliqué !');
    render();
  } else {
    err.textContent = '❌ Code invalide ou expiré';
  }
}
function rmPromo(){ PROMO = null; render(); }

// ===== COMMANDE RÉELLE EN BASE =====
function order(){
  var items = cartGet();
  if (!items.length) return;
  var addr = document.getElementById('addrInput');
  if (addr && !addr.value.trim()) {
    toast('📍 Ajoute ton adresse de livraison');
    addr.focus();
    return;
  }
  if (addr) localStorage.setItem('sentew_addr', addr.value.trim());

  var ship = calcShipping(items, ZONE, PAY);
  var subtotal = cartTotal();
  var discount = PROMO ? Math.round(subtotal * PROMO.pct / 100) : 0;
  var total = subtotal - discount + ship.fee + ship.cashFee;
  var btn = document.getElementById('btnOrder');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" style="width:16px"></i> Création de la commande…';
  lucide.createIcons();

  var payload = {
    client_id: '99999999-9999-9999-9999-999999999999',
    items: items.map(function(i){ return { name: i.name, price: i.price, qty: i.qty, vendor: i.vendor, slug: i.slug }; }),
    subtotal: subtotal,
    discount: discount,
    promo_code: PROMO ? PROMO.code : null,
    shipping_fee: ship.fee,
    cash_fee: ship.cashFee,
    total: total,
    payment_method: PAY === 'online' ? 'mobile_money' : 'cash',
    payment_status: PAY === 'online' ? 'paid' : 'pending',
    status: 'confirmed',
    address: addr ? addr.value.trim() : '',
    city: ZONE
  };

  supaWrite('orders', 'POST', payload).then(function(res){
    var o = Array.isArray(res) ? res[0] : res;
    cartSave([]);
    var page = document.getElementById('page');
    page.innerHTML =
      '<div class="success">' +
        '<div class="ok"><i data-lucide="check" style="width:36px"></i></div>' +
        '<h2>Commande confirmée ! 🎉</h2>' +
        '<p>Merci pour ta confiance. Ton colis est en préparation.</p>' +
        '<div class="code">' + (o && o.tracking_code ? o.tracking_code : 'STW-OK') + '</div>' +
        '<p>🏠 Ton <b>code de livraison</b> : <b style="font-size:16px;color:#0f6b4e">' + (o && o.delivery_code ? o.delivery_code : '----') + '</b><br>Donne-le <b>uniquement</b> au livreur quand tu reçois ton colis.</p>' +
        '<div class="btns">' +
          '<a class="b-green" href="suivi-commande.html?t=' + (o && o.tracking_code ? o.tracking_code : '') + '">📍 Suivre ma commande</a>' +
          '<a class="b-grey" href="index.html">Continuer</a>' +
        '</div>' +
      '</div>';
    lucide.createIcons();
    cartBadge();
    window.scrollTo(0, 0);
  }).catch(function(){
    btn.disabled = false;
    btn.innerHTML = 'Réessayer';
    toast('❌ Erreur de connexion, réessaie');
  });
}

// Règles de livraison depuis la base, puis rendu
loadShippingRules().then(render);
function renderIcons(){ if (window.lucide) lucide.createIcons(); }
renderIcons();
window.addEventListener('load', renderIcons);
setTimeout(renderIcons, 600);
cartBadge();
</script>
<script src="js/dark-mode.js"></script>
</body>
</html>
