<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panier - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#0F6B4E">
<style>
.app-header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid #F3F4F6;position:sticky;top:0;z-index:100;}
.hd-btn{width:38px;height:38px;background:#F9FAFB;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0A4D38;cursor:pointer;}

.cart-item{background:#fff;border-radius:14px;padding:12px;margin:10px 14px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.cart-item-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#F9FAFB;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-name{font-size:13px;font-weight:700;color:#111827;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cart-item-seller{font-size:11px;color:#6B7280;margin:4px 0;}
.cart-item-price{font-weight:900;color:#D4A574;font-size:15px;}
.cart-item-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:#F3F4F6;border-radius:20px;padding:2px;}
.qty-btn{width:28px;height:28px;background:#fff;border:none;border-radius:50%;font-weight:900;cursor:pointer;color:#0F6B4E;}
.qty-val{font-weight:800;min-width:20px;text-align:center;font-size:13px;}
.del-btn{background:none;border:none;color:#EF4444;font-size:16px;cursor:pointer;padding:4px;}

.pay-methods-preview{display:flex;gap:6px;padding:12px 14px;background:#fff;margin:10px 14px;border-radius:14px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.pay-methods-preview .label{font-size:12px;color:#6B7280;font-weight:700;}
.pay-logo-mini{width:32px;height:32px;border-radius:8px;object-fit:contain;padding:4px;background:#F9FAFB;}

.summary{background:#fff;margin:10px 14px;border-radius:14px;padding:16px;}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;}
.summary-total{padding-top:12px;margin-top:8px;border-top:2px solid #F3F4F6;font-size:16px;font-weight:900;}

.checkout-bar{position:fixed;bottom:64px;bottom:calc(64px + env(safe-area-inset-bottom, 0px));left:0;right:0;background:#fff;padding:12px 14px;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:80;display:flex;gap:10px;align-items:center;border-top:1px solid #F3F4F6;}
.checkout-info{flex:1;}
.checkout-total{font-size:11px;color:#6B7280;}
.checkout-amount{font-size:18px;font-weight:900;color:#0A4D38;}
.checkout-btn{background:linear-gradient(135deg,#0F6B4E,#D4A574);color:#fff;border:none;padding:14px 24px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;}

.app-content{padding-bottom:170px;}

.empty-cart{text-align:center;padding:60px 20px;color:#6B7280;}
</style>
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="hd-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:900;color:#0A4D38;">Mon Panier</div>
    <button class="hd-btn" onclick="clearCart()">🗑</button>
  </header>

  <main class="app-content">
    <div id="cartList"></div>

    <div class="pay-methods-preview" id="payPreview" style="display:none;">
      <div class="label">💳 Paiement :</div>
      <img class="pay-logo-mini" src="https://www.genspark.ai/api/files/s/CqMQ0SOO" alt="Wave" title="Wave">
      <img class="pay-logo-mini" src="https://www.genspark.ai/api/files/s/IrEI4SbL" alt="Orange Money" title="OM">
      <img class="pay-logo-mini" src="https://www.genspark.ai/api/files/s/X4q4ZprL" alt="Free Money" title="Free">
      <img class="pay-logo-mini" src="https://www.genspark.ai/api/files/s/EY1h2keG" alt="Wizall" title="Wizall">
      <span style="font-size:13px;">+💳</span>
    </div>

    <div id="summarySection" style="display:none;">
      <div class="summary">
        <div class="summary-row"><span style="color:#6B7280;">Sous-total</span><strong id="subtotal">0 FCFA</strong></div>
        <div class="summary-row"><span style="color:#6B7280;">Livraison Dakar</span><strong>1 500 FCFA</strong></div>
        <div class="summary-row" id="discountRow" style="display:none;color:#10B981;"><span>💰 Réduction</span><strong id="discount">-0 FCFA</strong></div>
        <div class="summary-row summary-total"><span>Total</span><strong style="color:#0F6B4E;" id="total">0 FCFA</strong></div>
      </div>

      <div class="summary">
        <h4 style="margin:0 0 10px;color:#0A4D38;font-size:14px;">🎁 Code promo</h4>
        <div style="display:flex;gap:8px;">
          <input id="promoCode" placeholder="Entrez un code" style="flex:1;padding:10px;border:1px solid #E5E7EB;border-radius:10px;">
          <button onclick="applyPromo()" style="background:#0F6B4E;color:#fff;border:none;padding:0 16px;border-radius:10px;font-weight:800;">Appliquer</button>
        </div>
      </div>
    </div>
  </main>

  <div class="checkout-bar" id="checkoutBar" style="display:none;">
    <div class="checkout-info">
      <div class="checkout-total">Total à payer</div>
      <div class="checkout-amount" id="finalTotal">0 FCFA</div>
    </div>
    <button class="checkout-btn" onclick="checkout()">🚀 Commander</button>
  </div>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html" class="active"><div class="nav-icon">🛒<span class="badge" id="navBadge">0</span></div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script src="js/paydunya.js"></script>
<script>
let cart = JSON.parse(localStorage.getItem('cart')||'[]');
let discountAmount = 0;

function render(){
  const list = document.getElementById('cartList');
  document.getElementById('navBadge').textContent = cart.length;

  if(cart.length === 0){
    list.innerHTML = `
      <div class="empty-cart">
        <div style="font-size:64px;">🛒</div>
        <h3 style="margin:16px 0 6px;">Panier vide</h3>
        <p style="font-size:13px;">Ajoutez des produits pour commencer</p>
        <a href="index.html" style="display:inline-block;margin-top:16px;padding:12px 24px;background:#0F6B4E;color:#fff;text-decoration:none;border-radius:10px;font-weight:800;">Explorer</a>
      </div>
    `;
    document.getElementById('payPreview').style.display='none';
    document.getElementById('summarySection').style.display='none';
    document.getElementById('checkoutBar').style.display='none';
    return;
  }

  list.innerHTML = cart.map((item,idx)=>`
    <div class="cart-item">
      <img class="cart-item-img" src="${item.image||''}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/80/0F6B4E/fff?text=SEN'">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}${item.bundle?' <span style="background:#D4A574;color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;">BUNDLE</span>':''}${item.flashDiscount?' <span style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;">-'+item.flashDiscount+'% LIVE</span>':''}</div>
        <div class="cart-item-seller">Vendu par ${item.seller||'SEN TEW'}</div>
        <div class="cart-item-price">${Number(item.price).toLocaleString()} FCFA</div>
        <div class="cart-item-actions">
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
            <span class="qty-val">${item.qty||1}</span>
            <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
          </div>
          <button class="del-btn" onclick="removeItem(${idx})">🗑</button>
        </div>
      </div>
    </div>
  `).join('');

  document.getElementById('payPreview').style.display='flex';
  document.getElementById('summarySection').style.display='block';
  document.getElementById('checkoutBar').style.display='flex';

  const subtotal = cart.reduce((s,i)=>s+i.price*(i.qty||1),0);
  const delivery = 1500;
  const total = subtotal + delivery - discountAmount;

  document.getElementById('subtotal').textContent = subtotal.toLocaleString()+' FCFA';
  document.getElementById('total').textContent = total.toLocaleString()+' FCFA';
  document.getElementById('finalTotal').textContent = total.toLocaleString()+' FCFA';
  if(discountAmount>0){
    document.getElementById('discountRow').style.display='flex';
    document.getElementById('discount').textContent = '-'+discountAmount.toLocaleString()+' FCFA';
  }
}

function changeQty(idx, delta){
  cart[idx].qty = Math.max(1, (cart[idx].qty||1) + delta);
  localStorage.setItem('cart', JSON.stringify(cart));
  render();
  if(navigator.vibrate) navigator.vibrate(15);
}

function removeItem(idx){
  if(confirm('Retirer cet article ?')){
    cart.splice(idx,1);
    localStorage.setItem('cart', JSON.stringify(cart));
    render();
  }
}

function clearCart(){
  if(cart.length===0)return;
  if(confirm('🗑 Vider tout le panier ?')){
    cart = [];
    localStorage.setItem('cart','[]');
    render();
  }
}

function applyPromo(){
  const code = document.getElementById('promoCode').value.trim().toUpperCase();
  const codes = {
    'SENTEW10':{type:'percent',value:10},
    'SENTEW20':{type:'percent',value:20},
    'WELCOME':{type:'fixed',value:2000},
    'AICHA20':{type:'percent',value:20},
    'MOUSSA20':{type:'percent',value:20}
  };
  const p = codes[code];
  if(!p){alert('❌ Code invalide');return;}
  const subtotal = cart.reduce((s,i)=>s+i.price*(i.qty||1),0);
  discountAmount = p.type==='percent' ? Math.round(subtotal*p.value/100) : p.value;
  alert(`✅ Code ${code} appliqué : -${discountAmount.toLocaleString()} FCFA`);
  render();
}

function checkout(){
  if(cart.length===0)return;
  const subtotal = cart.reduce((s,i)=>s+i.price*(i.qty||1),0);
  const total = subtotal + 1500 - discountAmount;
  if(typeof window.PayDunya!=='undefined'){
    window.PayDunya.showPaymentModal({
      amount: total,
      description: 'Commande SEN TEW ('+cart.length+' articles)',
      items: cart.map(i=>({name:i.name,qty:i.qty||1,price:i.price})),
      orderId: 'ST'+Date.now().toString().slice(-6),
      userId: localStorage.getItem('user_id')||'GUEST'
    });
  } else {
    alert('Système de paiement indisponible');
  }
}

render();
</script>
</body>
</html>
