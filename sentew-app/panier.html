<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1F17">
<link rel="stylesheet" href="css/app.css">
<style>
.cart-item{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:0 20px 12px;display:flex;gap:12px}
.cart-item img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0}
.cart-info{flex:1;min-width:0}
.cart-info h4{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--text-primary)}
.cart-info .seller{font-size:11px;color:var(--emerald-light);margin-bottom:6px}
.cart-info .price{font-size:15px;font-weight:800;color:var(--gold)}
.qty-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--bg-darker);border-radius:20px;padding:4px 8px}
.qty-btn{background:transparent;border:none;color:var(--gold);width:24px;height:24px;font-size:16px;font-weight:700;cursor:pointer}
.qty-val{color:var(--text-primary);font-weight:700;min-width:20px;text-align:center;font-size:13px}
.trash-btn{background:transparent;border:none;color:var(--red);cursor:pointer;font-size:18px}
.promo-input{margin:16px 20px;display:flex;gap:8px}
.promo-input input{flex:1;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);padding:12px 14px;border-radius:12px;font-size:13px}
.promo-input button{background:var(--emerald);color:white;border:none;padding:12px 20px;border-radius:12px;font-weight:700;font-size:13px}
.totals-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 20px 16px}
.total-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:var(--text-secondary)}
.total-row.discount{color:var(--green-success)}
.total-row.final{border-top:1px solid var(--border);margin-top:8px;padding-top:12px;font-size:18px;font-weight:800;color:var(--text-primary)}
.total-row.final .amount{color:var(--gold);font-size:22px}
.empty-cart{text-align:center;padding:80px 20px;color:var(--text-muted)}
.empty-cart .icon{font-size:80px;margin-bottom:20px}
.checkout-fixed{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:14px 20px;background:var(--bg-darker);border-top:1px solid var(--border);z-index:99}
</style>
</head>
<body oncontextmenu="return false" onselectstart="return false">

<div class="app" style="padding-bottom:180px">

  <div class="header-back">
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title">Mon panier (<span id="cartCount">0</span>)</div>
    <button class="notif-btn" style="color:var(--gold)">♡</button>
  </div>

  <div id="cartItems"></div>

  <div class="promo-input" id="promoSection" style="display:none">
    <input type="text" placeholder="🏷️ Code promo" id="promoCode">
    <button onclick="applyPromo()">Appliquer</button>
  </div>

  <div class="totals-card" id="totalsCard" style="display:none">
    <div class="total-row"><span>Sous-total</span><span id="subtotal">0 FCFA</span></div>
    <div class="total-row"><span>Livraison</span><span id="delivery">2 500 FCFA</span></div>
    <div class="total-row discount" id="discountRow" style="display:none"><span>Remise</span><span id="discountAmt">-0 FCFA</span></div>
    <div class="total-row final"><span>TOTAL</span><span class="amount" id="totalFinal">0 FCFA</span></div>
  </div>

  <div class="checkout-fixed" id="checkoutBar" style="display:none">
    <a href="paiement.html" class="btn-primary" style="text-decoration:none">🔒 Passer la commande</a>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Accueil</span></a>
    <a href="categories.html" class="nav-item"><span class="nav-icon">📊</span><span>Catégories</span></a>
    <a href="panier.html" class="nav-item active"><span class="nav-icon">🛒</span><span>Panier</span><span class="nav-badge nav-badge-cart" style="display:none">0</span></a>
    <a href="#" class="nav-item"><span class="nav-icon">💬</span><span>Messages</span></a>
    <a href="#" class="nav-item"><span class="nav-icon">👤</span><span>Profil</span></a>
  </nav>

</div>

<script src="js/data.js"></script>
<script>
let promoApplied = 0;

function renderCart(){
  const cart = getCart();
  const items = cart.map(c => ({...PRODUCTS.find(p=>p.id===c.id), qty:c.quantity})).filter(p=>p.name);
  
  document.getElementById('cartCount').textContent = items.reduce((s,i)=>s+i.qty,0);
  
  if(items.length === 0){
    document.getElementById('cartItems').innerHTML = `
      <div class="empty-cart">
        <div class="icon">🛒</div>
        <h3 style="color:var(--text-primary);margin-bottom:8px">Votre panier est vide</h3>
        <p style="margin-bottom:20px">Ajoutez des produits pour commencer</p>
        <a href="produits.html" class="btn-primary" style="display:inline-flex;text-decoration:none;padding:14px 30px">🛍️ Découvrir les produits</a>
      </div>`;
    return;
  }
  
  document.getElementById('promoSection').style.display = 'flex';
  document.getElementById('totalsCard').style.display = 'block';
  document.getElementById('checkoutBar').style.display = 'block';
  
  document.getElementById('cartItems').innerHTML = items.map(i => `
    <div class="cart-item">
      <img src="${i.photo}" alt="${i.name}" onerror="this.style.display='none'">
      <div class="cart-info">
        <h4>${i.name}</h4>
        <div class="seller">Vendeur : ${i.seller}</div>
        <div class="price">${formatPrice(i.price)}</div>
        <div class="qty-row">
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="updateQty(${i.id},${i.qty-1})">−</button>
            <span class="qty-val">${i.qty}</span>
            <button class="qty-btn" onclick="updateQty(${i.id},${i.qty+1})">+</button>
          </div>
          <button class="trash-btn" onclick="removeItem(${i.id})">🗑️</button>
        </div>
      </div>
    </div>
  `).join('');
  
  const subtotal = items.reduce((s,i)=>s+i.price*i.qty,0);
  const delivery = 2500;
  const total = subtotal + delivery - promoApplied;
  
  document.getElementById('subtotal').textContent = formatPrice(subtotal);
  document.getElementById('totalFinal').textContent = formatPrice(total);
  if(promoApplied > 0){
    document.getElementById('discountRow').style.display = 'flex';
    document.getElementById('discountAmt').textContent = '-' + formatPrice(promoApplied);
  }
}

function updateQty(id, qty){
  if(qty < 1) return removeItem(id);
  let cart = getCart();
  const item = cart.find(c => c.id === id);
  if(item) item.quantity = qty;
  setCart(cart);
  renderCart();
}

function removeItem(id){
  removeFromCart(id);
  renderCart();
}

function applyPromo(){
  const code = document.getElementById('promoCode').value.toUpperCase();
  const codes = {'BIENVENUE': 5000, 'RAMADAN30': 3000, 'NOUVEAU10': 2000};
  if(codes[code]){
    promoApplied = codes[code];
    alert(`✅ Code ${code} appliqué ! -${formatPrice(promoApplied)}`);
    renderCart();
  } else {
    alert('❌ Code promo invalide');
  }
}

renderCart();
</script>

</body>
</html>
