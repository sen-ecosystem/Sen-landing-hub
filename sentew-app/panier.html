<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Panier - SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
  <button class="btn-back" onclick="history.back()">
    <i data-lucide="arrow-left" class="icon icon-md icon-vert"></i>
  </button>
  <h1>Mon panier <span id="cartCount" style="font-size:14px;color:var(--text-muted);"></span></h1>
</header>

<main id="cartMain" style="padding:12px 16px 200px;">
  <!-- Généré par JS -->
</main>

<div id="cartFooter" style="position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;z-index:99;display:none;">
  <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;">
    <span>Sous-total</span>
    <span id="subtotal">0 FCFA</span>
  </div>
  <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;">
    <span>Livraison</span>
    <span id="shipping">1 500 FCFA</span>
  </div>
  <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:16px;font-weight:800;color:var(--v-emeraude);">
    <span>TOTAL</span>
    <span id="total">0 FCFA</span>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:10px;">
    <button style="flex:1;padding:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;">1× · Comptant</button>
    <button style="flex:1;padding:8px;background:var(--bg-card);border:1px solid var(--v-emeraude);border-radius:8px;font-size:12px;font-weight:600;color:var(--v-emeraude);">2× sans frais</button>
    <button style="flex:1;padding:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;">3× sans frais</button>
  </div>
  <button class="btn-primary" style="width:100%;" onclick="checkout()">
    <i data-lucide="lock" class="icon icon-sm icon-blanc" style="margin-right:6px;"></i>
    Passer commande
  </button>
</div>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home" class="icon icon-md"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search" class="icon icon-md"></i><span>Rechercher</span></a>
  <a href="panier.html" class="active"><i data-lucide="shopping-cart" class="icon icon-md icon-or"></i><span>Panier</span></a>
  <a href="favoris.html"><i data-lucide="heart" class="icon icon-md"></i><span>Favoris</span></a>
  <a href="profil.html"><i data-lucide="user" class="icon icon-md"></i><span>Profil</span></a>
</nav>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
function renderCart() {
  const cart = JSON.parse(localStorage.getItem('cart')||'[]');
  const main = document.getElementById('cartMain');
  const footer = document.getElementById('cartFooter');
  const countEl = document.getElementById('cartCount');

  if(cart.length === 0) {
    countEl.textContent = '';
    footer.style.display = 'none';
    main.innerHTML = `
      <div style="text-align:center;padding:60px 20px;">
        <i data-lucide="shopping-cart" class="icon icon-xl icon-vert" style="opacity:0.3;"></i>
        <h2 style="margin-top:16px;">Votre panier est vide</h2>
        <p style="color:var(--text-muted);margin:12px 0 24px;">Découvrez nos produits tendance</p>
        <button class="btn-primary" onclick="location.href='index.html'">Commencer mes achats</button>
      </div>
    `;
    lucide.createIcons();
    return;
  }

  countEl.textContent = `(${cart.length})`;

  main.innerHTML = cart.map((item, i) => `
    <div style="display:flex;gap:12px;padding:12px;background:var(--bg-card);border-radius:12px;margin-bottom:10px;">
      <img src="${item.image}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;">
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:600;margin-bottom:4px;">${item.name}</div>
        <div style="font-size:15px;font-weight:800;color:var(--v-emeraude);margin-bottom:8px;">${item.price.toLocaleString('fr-FR')} FCFA</div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:2px;">
            <button onclick="updateQty(${i},-1)" style="padding:4px 10px;background:transparent;font-size:16px;font-weight:800;color:var(--v-emeraude);">−</button>
            <span style="min-width:20px;text-align:center;font-weight:700;">${item.qty}</span>
            <button onclick="updateQty(${i},1)" style="padding:4px 10px;background:transparent;font-size:16px;font-weight:800;color:var(--v-emeraude);">+</button>
          </div>
          <button onclick="removeItem(${i})" style="background:transparent;color:var(--rouge);padding:6px;">
            <i data-lucide="trash-2" class="icon icon-sm icon-rouge"></i>
          </button>
        </div>
      </div>
    </div>
  `).join('');

  // Code promo + Livraison
  main.innerHTML += `
    <div style="background:var(--bg-card);padding:14px;border-radius:12px;margin:16px 0;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="tag" class="icon icon-sm icon-or"></i>
        Code promo
      </div>
      <div style="display:flex;gap:8px;">
        <input type="text" placeholder="Entrez votre code" style="flex:1;">
        <button class="btn-primary" style="padding:12px 20px;">Appliquer</button>
      </div>
    </div>

    <div style="background:var(--bg-card);padding:14px;border-radius:12px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="truck" class="icon icon-sm icon-or"></i>
        Adresse de livraison
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <i data-lucide="map-pin" class="icon icon-md icon-vert"></i>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:13px;">Domicile</div>
          <div style="font-size:12px;color:var(--text-muted);">Cité Keur Gorgui, Dakar</div>
        </div>
        <button style="color:var(--v-emeraude);font-size:12px;font-weight:600;" onclick="location.href='adresses.html'">Changer</button>
      </div>
    </div>

    <div style="background:var(--bg-card);padding:14px;border-radius:12px;margin-bottom:16px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="credit-card" class="icon icon-sm icon-vert"></i>
        Moyens de paiement
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        <div style="padding:10px;background:var(--v-clair);border-radius:8px;text-align:center;font-size:11px;font-weight:700;">🌊 Wave</div>
        <div style="padding:10px;background:var(--bg);border-radius:8px;text-align:center;font-size:11px;font-weight:700;">🍊 Orange Money</div>
        <div style="padding:10px;background:var(--bg);border-radius:8px;text-align:center;font-size:11px;font-weight:700;">💳 Carte</div>
      </div>
    </div>

    <div style="background:var(--v-clair);padding:12px;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
      <i data-lucide="shield-check" class="icon icon-md icon-vert"></i>
      <div style="font-size:12px;color:var(--v-forest);">
        <strong>Paiement 100 % sécurisé</strong><br>
        Fonds séquestrés jusqu'à confirmation de livraison
      </div>
    </div>
  `;

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const shipping = 1500;
  const total = subtotal + shipping;

  document.getElementById('subtotal').textContent = subtotal.toLocaleString('fr-FR') + ' FCFA';
  document.getElementById('total').textContent = total.toLocaleString('fr-FR') + ' FCFA';
  footer.style.display = 'block';
  lucide.createIcons();
}

function updateQty(idx, delta) {
  let cart = JSON.parse(localStorage.getItem('cart')||'[]');
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
  if(navigator.vibrate) navigator.vibrate(20);
}

function removeItem(idx) {
  let cart = JSON.parse(localStorage.getItem('cart')||'[]');
  cart.splice(idx, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
  if(navigator.vibrate) navigator.vibrate(30);
}

function checkout() {
  location.href = 'paiement-success.html';
}

renderCart();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
