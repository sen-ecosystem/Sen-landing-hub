<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Bons & Promotions - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--v:#00a651;--j:#fcd116;--r:#e31b23;--o:#b8863a}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#f5f5f5;color:#222;padding-bottom:100px;-webkit-overflow-scrolling:touch}
.header{background:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.back{background:#f5f5f5;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;color:#222;display:flex;align-items:center;justify-content:center;transition:0.15s}
.back:active{transform:scale(0.92)}
.back i{width:18px;height:18px}
.header h1{flex:1;font-size:16px;font-weight:700;color:#222;text-align:center;margin-right:36px;display:flex;align-items:center;justify-content:center;gap:8px}
.header h1 i{width:20px;height:20px;color:var(--o)}

.tabs{background:#fff;display:flex;border-bottom:1px solid #eee;position:sticky;top:64px;z-index:80}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:700;color:#666;background:none;border:none;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
.tab i{width:20px;height:20px}
.tab.active{color:var(--v)}
.tab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:3px;background:var(--v);border-radius:3px 3px 0 0}

.section{padding:14px}
.section-title{font-size:13px;color:var(--o);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title i{width:16px;height:16px}

/* ===== BONS CADEAUX ===== */
.gift-card{background:linear-gradient(135deg,#d4a04c,#b8863a);color:#fff;padding:20px;border-radius:16px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(184,134,58,.25)}
.gift-card.green{background:linear-gradient(135deg,#00a651,#005f2f)}
.gift-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.gift-card::after{content:'';position:absolute;bottom:-30px;left:-30px;width:80px;height:80px;background:rgba(255,255,255,.06);border-radius:50%}
.gift-bow{position:absolute;top:16px;left:16px;width:52px;height:52px;background:rgba(255,255,255,.2);border-radius:14px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.gift-bow i{width:28px;height:28px;color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.gift-inner{position:relative;z-index:1;padding-left:70px}
.gift-brand{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:2px;opacity:.95;margin-bottom:4px;color:#fff}
.gift-brand i{width:14px;height:14px;color:var(--j)}
.gift-amount{font-size:24px;font-weight:900;color:#fff;letter-spacing:1px;margin-bottom:14px}
.gift-card.green .gift-amount{color:var(--j)}
.gift-footer{display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}
.gift-block small{font-size:10px;opacity:.9;color:#fff;display:flex;align-items:center;gap:4px}
.gift-block small i{width:11px;height:11px}
.gift-block strong{display:block;font-size:13px;font-weight:800;color:#fff;margin-top:2px}
.copy-btn{background:rgba(255,255,255,.2);border:none;padding:5px 10px;border-radius:6px;color:#fff;font-size:11px;cursor:pointer;margin-left:6px;transition:0.15s;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.copy-btn i{width:12px;height:12px}
.copy-btn:active{background:rgba(255,255,255,.45);transform:scale(1.08)}

.offer-block{background:#fff;border-radius:12px;padding:14px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.offer-title{font-size:14px;color:var(--o);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.offer-title i{width:18px;height:18px}
.amount-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.amount-btn{padding:12px 4px;border:2px solid #e0e0e0;background:#fff;border-radius:10px;text-align:center;cursor:pointer;color:#222;font-weight:700;transition:0.15s}
.amount-btn:active{transform:scale(0.96)}
.amount-btn.active{background:linear-gradient(135deg,var(--o),#d4a04c);color:#fff;border-color:var(--o)}
.amount-btn .val{font-size:13px;display:block}
.amount-btn small{font-size:9px;opacity:.7;display:block;margin-top:2px}
.buy-gift-btn{width:100%;background:linear-gradient(135deg,var(--o),#d4a04c);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;margin-top:14px;cursor:pointer;box-shadow:0 4px 12px rgba(184,134,58,.3);transition:0.15s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.buy-gift-btn i{width:18px;height:18px}
.buy-gift-btn:active{transform:scale(0.98);opacity:.9}

/* ===== CODES PROMO ===== */
.promo-item{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid var(--v);display:flex;justify-content:space-between;align-items:center;gap:12px}
.promo-info{flex:1;min-width:0}
.promo-code-title{color:var(--v);font-weight:800;font-size:16px;letter-spacing:.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.promo-code-title .copy-btn{background:#f5f5f5;color:#222}
.promo-desc{color:#555;font-size:12px;margin:4px 0}
.promo-valid{color:var(--o);font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px}
.promo-valid i{width:12px;height:12px}
.promo-right{text-align:right;flex-shrink:0}
.promo-reduc{color:var(--r);font-weight:900;font-size:20px}
.use-btn{background:var(--v);color:#fff;border:none;padding:8px 16px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;transition:0.15s;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.use-btn i{width:13px;height:13px}
.use-btn:active{transform:scale(0.95);opacity:.85}

.add-code{background:#fff;padding:14px;border-radius:12px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.add-code label{display:flex;align-items:center;gap:6px;color:var(--o);font-weight:800;font-size:13px;margin-bottom:8px}
.add-code label i{width:16px;height:16px}
.add-code-row{display:flex;gap:8px}
.add-code-row input{flex:1;min-width:0;border:1px solid #ddd;padding:10px 14px;border-radius:8px;font-size:14px;color:#222;background:#fff;outline:none}
.add-code-row input::placeholder{color:#999}
.add-btn{background:linear-gradient(135deg,var(--o),#d4a04c);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.add-btn i{width:15px;height:15px}

/* ===== COUPONS (cliquables) ===== */
.coupon{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;align-items:center;gap:12px;border:1px solid #f0f0f0;cursor:pointer;transition:0.15s;text-decoration:none;color:inherit;width:100%;text-align:left;font-family:inherit}
.coupon:active{transform:scale(0.98);background:#fafaf7}
.coupon-avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.coupon-body{flex:1;min-width:0}
.coupon-type{font-size:11px;color:#666;font-weight:600;display:flex;align-items:center;gap:4px}
.coupon-type i{width:11px;height:11px}
.coupon-name{font-size:14px;font-weight:800;color:#222;margin:2px 0}
.coupon-valid{font-size:11px;color:#888}
.coupon-valid.expiring{color:var(--r);font-weight:700}
.coupon-hint{font-size:10px;color:var(--v);font-weight:700;margin-top:4px;display:flex;align-items:center;gap:4px}
.coupon-hint i{width:11px;height:11px}
.coupon-value{text-align:right;flex-shrink:0}
.coupon-value .big{color:var(--o);font-weight:900;font-size:20px}
.coupon-value small{color:#666;font-size:10px;display:block;margin-top:2px}

.parrain-btn{background:#fff;border:2px solid var(--o);color:var(--o);padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:14px;cursor:pointer;margin-top:14px;font-family:inherit;transition:0.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.parrain-btn i{width:18px;height:18px}
.parrain-btn:active{background:#fdf6ea;transform:scale(0.98)}

/* ===== NAVIGATION (icônes Lucide) ===== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0));z-index:90}
.nav-item{flex:1;text-align:center;color:#666;font-size:10px;background:none;border:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav-item i{width:22px;height:22px}
.nav-item.active{color:var(--v);font-weight:700}

html[data-theme="dark"] body{background:#0f1419;color:#e8eaed}
html[data-theme="dark"] .header,html[data-theme="dark"] .tabs,html[data-theme="dark"] .promo-item,
html[data-theme="dark"] .coupon,html[data-theme="dark"] .offer-block,html[data-theme="dark"] .add-code,
html[data-theme="dark"] .bottom-nav{background:#1a2028;color:#e8eaed}
html[data-theme="dark"] .back{background:#232a33;color:#e8eaed}
html[data-theme="dark"] .header h1,html[data-theme="dark"] .coupon-name,html[data-theme="dark"] .promo-code-title{color:#e8eaed}
html[data-theme="dark"] .promo-desc,html[data-theme="dark"] .coupon-valid,html[data-theme="dark"] .coupon-type{color:#9aa0a6}
html[data-theme="dark"] .add-code-row input{background:#232a33;color:#e8eaed;border-color:#2d3540}
html[data-theme="dark"] .amount-btn{background:#232a33;color:#e8eaed;border-color:#2d3540}
html[data-theme="dark"] .promo-code-title .copy-btn{background:#232a33;color:#e8eaed}
</style></head><body>

<header class="header">
  <button class="back" onclick="history.back()" aria-label="Retour"><i data-lucide="arrow-left"></i></button>
  <h1><i data-lucide="gift"></i> Mes Bons & Promotions</h1>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('bons',this)"><i data-lucide="gift"></i>Bons cadeaux</button>
  <button class="tab" onclick="showTab('promo',this)"><i data-lucide="tag"></i>Codes promo</button>
  <button class="tab" onclick="showTab('coupons',this)"><i data-lucide="ticket"></i>Coupons</button>
</div>

<!-- BONS CADEAUX -->
<div class="section" id="bons">
  <div id="myGifts"></div>
  <div class="section-title"><i data-lucide="gift"></i> Vos bons cadeaux (2)</div>

  
  </div>

  
  </div>

  <div class="offer-block">
    <div class="offer-title"><i data-lucide="gift"></i> Offrir un bon cadeau</div>
    <div class="amount-picker">
      <div class="amount-btn"><span class="val">5 000</span><small>FCFA</small></div>
      <div class="amount-btn"><span class="val">10 000</span><small>FCFA</small></div>
      <div class="amount-btn"><span class="val">25 000</span><small>FCFA</small></div>
      <div class="amount-btn active"><span class="val">50 000</span><small>FCFA</small></div>
      <div class="amount-btn"><span class="val">100 000</span><small>FCFA</small></div>
    </div>
    <button class="buy-gift-btn" onclick="buyGift()"><i data-lucide="shopping-bag"></i> Acheter une carte cadeau →</button>
  </div>
</div>

<!-- CODES PROMO -->
<div class="section" id="promo" style="display:none">
  <div class="section-title"><i data-lucide="tag"></i> Codes actifs (3)</div>

  <div id="promoList"></div>

  <div class="add-code">
    <label><i data-lucide="plus-circle"></i> Ajouter un code promo</label>
    <div class="add-code-row">
      <input placeholder="Entrez votre code..." id="newCode">
      <button class="add-btn" onclick="addCode()"><i data-lucide="plus"></i> Ajouter</button>
    </div>
  </div>
</div>

<!-- COUPONS (cliquables vers la boutique) -->
<div class="section" id="coupons" style="display:none">
  <div class="section-title"><i data-lucide="ticket"></i> <span id="couponTitle">Vos coupons</span></div>
  <div id="couponList"></div>

  

  

  

  <button class="coupon" style="border-color:var(--r);border-width:2px" onclick="location.href='parrainage.html'">
    <div class="coupon-avatar" style="background:linear-gradient(135deg,#ff6b35,#e31b23)"><i data-lucide="users" style="width:22px;height:22px;color:#fff"></i></div>
    <div class="coupon-body">
      <div class="coupon-type"><i data-lucide="users"></i> Coupon parrainage</div>
      <div class="coupon-name">Invitation ami</div>
      <div class="coupon-valid expiring">⚠️ Expire dans 3 jours</div>
      <div class="coupon-hint"><i data-lucide="mouse-pointer-click"></i> Toucher pour utiliser</div>
    </div>
    <div class="coupon-value">
      <div class="big">-1000</div>
      <small>FCFA</small>
    </div>
  </button>

  <button class="parrain-btn" onclick="location.href='parrainage.html'"><i data-lucide="users"></i> Parrainer un ami (+2000 FCFA)</button>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='index.html'"><i data-lucide="home"></i>Accueil</button>
  <button class="nav-item" onclick="location.href='categories.html'"><i data-lucide="layout-grid"></i>Catégories</button>
  <button class="nav-item" onclick="location.href='panier.html'"><i data-lucide="shopping-cart"></i>Panier</button>
  <button class="nav-item" onclick="location.href='favoris.html'"><i data-lucide="heart"></i>Favoris</button>
  <button class="nav-item active" onclick="location.href='profil.html'"><i data-lucide="user"></i>Compte</button>
</nav>

<script src="js/dark-mode.js"></script>
<script>
lucide.createIcons();
const SUPA_URL="https://tjqkruhwmjzgfvtouqza.supabase.co",SUPA_KEY="sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j";
const H={"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"};
async function sbGet(t,q){const r=await fetch(SUPA_URL+"/rest/v1/"+t+"?"+q,{headers:H});return r.ok?await r.json():[];}
function getEmail(){try{const u=JSON.parse(localStorage.getItem("sentew_user")||sessionStorage.getItem("sentew_user")||"{}");return u.email||"";}catch(e){return localStorage.getItem("sentew_email")||"";}}
function showTab(id,btn){['bons','promo','coupons'].forEach(function(t){document.getElementById(t).style.display='none';});document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});btn.classList.add('active');lucide.createIcons();}
function toast(m){const t=document.createElement("div");t.textContent=m;t.style.cssText="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f6b4e;color:#fff;padding:12px 20px;border-radius:12px;z-index:9999;font-weight:700;font-size:13px;max-width:88%";document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function copyCode(c){if(navigator.clipboard){navigator.clipboard.writeText(c);}toast('Code « '+c+' » copié');}
function copyCodeSilent(c){if(navigator.clipboard){navigator.clipboard.writeText(c);}}

async function loadGifts(){
  const em=getEmail(),box=document.getElementById("myGifts");
  if(!em){box.innerHTML='';return;}
  const g=await sbGet("gift_cards","select=*&owner_email=eq."+encodeURIComponent(em)+"&status=eq.active&order=created_at.desc");
  if(!g.length){box.innerHTML='';return;}
  box.innerHTML='<div class="section-title"><i data-lucide="gift"></i> Mes cartes cadeaux</div>'+g.map(x=>
   '<div class="gift-card" style="background:linear-gradient(135deg,#0f6b4e,#0a4d38);border-radius:16px;padding:18px;margin-bottom:12px;color:#fff"><div style="font-size:13px;opacity:.85">Carte cadeau</div><div class="gift-amount">'+(+x.amount).toLocaleString("fr-FR")+' FCFA</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><strong>'+x.code+'</strong><button class="copy-btn" onclick="copyCode(\''+x.code+'\')"><i data-lucide="copy"></i> Copier</button></div></div>').join("");
  if(window.lucide)lucide.createIcons();
}

async function loadPromos(){
  const box=document.getElementById("promoList");
  const p=await sbGet("promo_codes","select=*&active=eq.true&order=created_at.desc");
  if(!p.length){box.innerHTML='<p style="color:#666;font-size:13px">Aucun code promo actif pour le moment. Revenez bientôt !</p>';return;}
  box.innerHTML=p.map(x=>{const off=x.percent?('-'+x.percent+'%'):(x.amount?('-'+(+x.amount).toLocaleString("fr-FR")+' F'):(x.type==='shipping'?'GRATUIT':'PROMO'));
   const valid=x.expires_at?('Valable jusqu\'au '+new Date(x.expires_at).toLocaleDateString("fr-FR")):'Valable illimité';
   return '<div class="promo-item"><div class="promo-info"><div class="promo-code-title">'+x.code+' <button class="copy-btn" onclick="copyCode(\''+x.code+'\')"><i data-lucide="copy"></i></button></div><div class="promo-desc">'+(x.description||'Réduction sur vos achats')+'</div><div class="promo-valid"><i data-lucide="calendar"></i> '+valid+'</div></div><div class="promo-right"><div class="promo-reduc">'+off+'</div><button class="use-btn" onclick="usePromo(\''+x.code+'\')"><i data-lucide="check"></i> Utiliser</button></div></div>';}).join("");
  if(window.lucide)lucide.createIcons();
}

async function loadCoupons(){
  const em=getEmail(),box=document.getElementById("couponList"),ti=document.getElementById("couponTitle");
  if(!em){box.innerHTML='<p style="color:#666;font-size:13px">Connecte-toi pour voir tes coupons.</p>';return;}
  const c=await sbGet("coupons","select=*,vendors(name,slug)&user_email=eq."+encodeURIComponent(em)+"&used=eq.false");
  ti.textContent='Vos coupons ('+c.length+')';
  if(!c.length){box.innerHTML='<p style="color:#666;font-size:13px">Aucun coupon pour le moment. Parraine un ami ou suis les lives pour en gagner !</p>';return;}
  box.innerHTML=c.map(x=>{const vn=(x.vendors&&x.vendors.name)||'Boutique';const slug=(x.vendors&&x.vendors.slug)||'';const val=x.percent?('-'+x.percent+'%'):('-'+(+x.amount||0).toLocaleString("fr-FR")+' FCFA');
   return '<button class="coupon" onclick="useCoupon(\''+slug+'\',\''+x.code+'\')"><div class="coupon-avatar" style="background:linear-gradient(135deg,#0f6b4e,#0a4d38)">'+vn.charAt(0)+'</div><div class="coupon-body"><div class="coupon-type"><i data-lucide="store"></i> Coupon vendeur</div><div class="coupon-name">'+vn+'</div><div class="coupon-valid">'+(x.expires_at?('Valable jusqu\'au '+new Date(x.expires_at).toLocaleDateString("fr-FR")):'Valable illimité')+'</div><div class="coupon-hint"><i data-lucide="mouse-pointer-click"></i> Toucher pour utiliser</div></div><div class="coupon-value"><div class="big">'+val+'</div><small>'+(x.scope||'Sur la boutique')+'</small></div></button>';}).join("");
  if(window.lucide)lucide.createIcons();
}

function usePromo(code){copyCodeSilent(code);toast('Code « '+code+' » appliqué — il sera utilisé au paiement.');localStorage.setItem('sentew_promo',code);setTimeout(()=>location.href='panier.html',900);}
function useCoupon(slug,code){copyCodeSilent(code);localStorage.setItem('sentew_coupon',code);location.href='boutique.html?slug='+slug;}
function buyGift(){toast('Achat de carte cadeau : activation bientôt. Contact : contact@sen-ecosystem.com');}

async function addCode(){
  const inp=document.getElementById('newCode');const c=inp.value.trim().toUpperCase();
  if(!c){toast('Entrez un code');return;}
  const p=await sbGet("promo_codes","select=*&code=eq."+encodeURIComponent(c)+"&active=eq.true&limit=1");
  if(!p.length){toast('Code « '+c+' » invalide ou expiré.');return;}
  copyCodeSilent(c);localStorage.setItem('sentew_promo',c);
  toast('Code « '+c+' » appliqué — valable au paiement.');
  inp.value='';
}

document.addEventListener("DOMContentLoaded",function(){loadGifts();loadPromos();loadCoupons();});
document.querySelectorAll('.amount-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.amount-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');});});
</script>
<script src="js/buttons-audit.js?v=51"></script>
  <script src="js/i18n.js"></script>
</body></html>
