<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Administration - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/security-shield.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f2f6f4;color:#12312a;padding-bottom:110px}
.topbar{background:linear-gradient(120deg,#04120c,#0f6b4e);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 3px 16px rgba(0,0,0,.3)}
.topbar h1{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.topbar h1 i{width:19px;height:19px}
.top-actions{display:flex;gap:8px}
.icobtn{position:relative;background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icobtn i{width:18px;height:18px}
.nb{position:absolute;top:-4px;right:-4px;background:#e63946;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 4px}
.nb.on{display:flex}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 6px;scrollbar-width:none;position:sticky;top:70px;background:#f2f6f4;z-index:40}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:9px 15px;border-radius:99px;border:2px solid #e3ede8;background:#fff;font-size:12px;font-weight:800;color:#5b7a70;cursor:pointer;position:relative;transition:.15s}
.tab.on{background:#0f6b4e;border-color:#0f6b4e;color:#fff;box-shadow:0 3px 10px rgba(15,107,78,.3)}
.wrap{max-width:920px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:18px;padding:15px;border-left:4px solid #0f6b4e;box-shadow:0 2px 10px rgba(10,31,23,.06);transition:.15s}
.kpi:active{transform:scale(.97)}
.kpi .kv{font-size:21px;font-weight:900;letter-spacing:-.5px}
.kpi .kl{font-size:10.5px;color:#5b7a70;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.kpi.warn{border-left-color:#e63946}
.kpi.money{border-left-color:#b07a1f}
.kpi.blue{border-left-color:#1a56c4}
.card2{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(10,31,23,.06)}
.card2.sel{outline:3px solid #0f6b4e}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-size:14px;font-weight:800;color:#0a1f17}
.meta{font-size:11.5px;color:#8aa69c;margin-top:2px;line-height:1.5}
.pill{font-size:10px;font-weight:900;padding:4px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.pill.pending{background:#fff4e0;color:#b07a1f}
.pill.active,.pill.approved,.pill.delivered,.pill.paid{background:#eafaf1;color:#0f6b4e}
.pill.suspended,.pill.rejected,.pill.cancelled{background:#fdecec;color:#c0392b}
.pill.in_delivery,.pill.preparing{background:#e8f0fe;color:#1a56c4}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.abtn{border:none;border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.12s}
.abtn:active{transform:scale(.96)}
.abtn i{width:14px;height:14px}
.abtn.ok{background:#0f6b4e;color:#fff}
.abtn.warn{background:#fff4e0;color:#b07a1f}
.abtn.danger{background:#fdecec;color:#c0392b}
.abtn.plain{background:#f0f3f2;color:#12312a}
.abtn.blue{background:#e8f0fe;color:#1a56c4}
.empty{text-align:center;color:#9db8af;font-size:13px;padding:30px 10px}
.sect{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:#0f6b4e;margin:18px 0 10px;display:flex;align-items:center;gap:6px}
.sect i{width:14px;height:14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0a1f17;color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:700;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.on{display:block}
.loading{text-align:center;padding:40px;color:#8aa69c;font-size:13px}
.hidden{display:none!important}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e3ede8;border-radius:13px;padding:10px 13px}
.search i{width:16px;height:16px;color:#8aa69c;flex-shrink:0}
.search input{border:none;outline:none;flex:1;font-size:13.5px;background:none}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;padding:7px 13px;border-radius:99px;border:1.5px solid #e3ede8;background:#fff;font-size:11.5px;font-weight:800;color:#5b7a70;cursor:pointer}
.fchip.on{background:#0a1f17;color:#fff;border-color:#0a1f17}
.selbar{position:fixed;bottom:0;left:0;right:0;background:#0a1f17;color:#fff;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:8px;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.selbar.on{display:flex}
.selbar .cnt{font-size:13px;font-weight:800}
.selbar .acts{display:flex;gap:6px;flex-wrap:wrap}
.selbar button{border:none;border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:800;cursor:pointer}
.selbar .b-all{background:rgba(255,255,255,.15);color:#fff}
.selbar .b-ok{background:#4ade80;color:#04120c}
.selbar .b-warn{background:#fbbf24;color:#3a2800}
.selbar .b-x{background:rgba(255,255,255,.15);color:#fff}
.chk{width:22px;height:22px;border:2px solid #c9dcd3;border-radius:7px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff}
.chk.on{background:#0f6b4e;border-color:#0f6b4e;color:#fff}
.chk i{width:14px;height:14px}
.modal{position:fixed;inset:0;background:rgba(4,18,12,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 18px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:900;color:#0a1f17;margin-bottom:4px}
.sheet .close{float:right;background:#f0f3f2;border:none;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:900;color:#5b7a70}
.drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0f5f2;font-size:13px}
.drow b{color:#0a1f17}
.drow span{color:#5b7a70;text-align:right;word-break:break-all}
.doc{display:flex;align-items:center;gap:10px;background:#f7faf8;border:1.5px solid #e3ede8;border-radius:12px;padding:11px 13px;margin-top:8px;font-size:13px;font-weight:700;color:#0f6b4e;text-decoration:none}
.doc i{width:17px;height:17px;flex-shrink:0}
.tpl{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e3ede8;border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;font-size:13px;font-weight:700;color:#12312a}
.tpl small{display:block;font-weight:500;color:#8aa69c;margin-top:3px;font-size:11.5px;line-height:1.5}
.tpl:active{border-color:#0f6b4e}
textarea,input.sin,select.sin{width:100%;border:2px solid #e3ede8;border-radius:12px;padding:11px 13px;font-size:13.5px;font-family:inherit;outline:none;background:#fbfdfc}
textarea:focus,input.sin:focus,select.sin:focus{border-color:#0f6b4e}
textarea{min-height:90px;resize:vertical}
label.lb{display:block;font-size:11px;font-weight:800;color:#0a1f17;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.bigbtn{width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(120deg,#0a1f17,#0f6b4e);color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:12px;letter-spacing:.4px}
.bigbtn.gold{background:linear-gradient(120deg,#7a5c10,#b07a1f)}
.paycard{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(10,31,23,.06);border-left:4px solid #b07a1f}
/* stats */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{width:64px;font-size:11px;font-weight:800;color:#5b7a70;text-align:right;flex-shrink:0}
.bar-track{flex:1;background:#eef4f1;border-radius:8px;height:22px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#0f6b4e,#3aa87e);border-radius:8px;min-width:3px;transition:width .5s ease}
.bar-val{width:74px;font-size:11.5px;font-weight:800;color:#0a1f17;flex-shrink:0}
.paymethods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pm{border:2px solid #e3ede8;border-radius:13px;padding:11px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:800;color:#5b7a70;background:#fff;transition:.12s}
.pm.on{border-color:#0f6b4e;background:#eafaf1;color:#0f6b4e}
.pm small{display:block;font-weight:600;font-size:10.5px;margin-top:2px;color:#8aa69c}
.kpi-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f5f2;font-size:13.5px}
.kpi-line b{font-weight:900}
.pos{color:#0f6b4e}.neg{color:#c0392b}
</style>
</head>
<body>

<div class="topbar">
  <h1><i data-lucide="shield"></i>SEN TEW Admin</h1>
  <div class="top-actions">
    <button class="icobtn" onclick="silentRefresh();toast('Actualisé ✅')"><i data-lucide="refresh-cw"></i></button>
    <button class="icobtn" onclick="logout()"><i data-lucide="log-out"></i></button>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="showTab('pilotage',this)">Pilotage</button>
  <button class="tab" onclick="showTab('stats',this)">Statistiques</button>
  <button class="tab" onclick="showTab('vendeurs',this)">Vendeurs<span class="nb" id="nbV"></span></button>
  <button class="tab" onclick="showTab('livreurs',this)">Livreurs<span class="nb" id="nbL"></span></button>
  <button class="tab" onclick="showTab('commandes',this)">Commandes</button>
  <button class="tab" onclick="showTab('reversements',this)">Reversements</button>
  <button class="tab" onclick="showTab('compta',this)">Comptabilité</button>
  <button class="tab" onclick="showTab('messages',this)">Messages</button>
  <button class="tab" onclick="showTab('notifs',this)">Notifs<span class="nb" id="nbN"></span></button>
</div>

<div class="wrap">
  <div id="pilotage" class="panel">
    <div class="kpis">
      <div class="kpi"><div class="kv" id="kVendors">–</div><div class="kl">Vendeurs actifs</div></div>
      <div class="kpi warn"><div class="kv" id="kPending">–</div><div class="kl">En attente</div></div>
      <div class="kpi blue"><div class="kv" id="kOrders">–</div><div class="kl">Commandes</div></div>
      <div class="kpi money"><div class="kv" id="kCA">–</div><div class="kl">CA livré (F)</div></div>
    </div>
    <div class="sect"><i data-lucide="zap"></i>À traiter en priorité</div>
    <div id="priorityList"><div class="loading">Chargement…</div></div>
    <button class="bigbtn" onclick="exportCSV()">⬇️ Exporter les données (CSV)</button>
  </div>
  <div id="stats" class="panel hidden"></div>
  <div id="vendeurs" class="panel hidden"></div>
  <div id="livreurs" class="panel hidden"></div>
  <div id="commandes" class="panel hidden"></div>
  <div id="reversements" class="panel hidden"></div>
  <div id="compta" class="panel hidden"></div>
  <div id="messages" class="panel hidden"></div>
  <div id="notifs" class="panel hidden"></div>
</div>

<div class="selbar" id="selbar">
  <span class="cnt" id="selCnt">0 sélectionné</span>
  <div class="acts">
    <button class="b-all" onclick="selAll()">Tout</button>
    <button class="b-ok" onclick="bulkSet('active')">✅ Valider</button>
    <button class="b-warn" onclick="bulkSet('suspended')">⏸️ Suspendre</button>
    <button class="b-x" onclick="selClear()">✖</button>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════ CONFIG ══════════ */
var SUPA='https://tjqkruhwmjzgfvtouqza.supabase.co';
var SUPA_KEY='sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j';
var H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
var COMMISSION=8;
var PAY_METHODS=[
  {id:'wave',lbl:'🌊 Wave',sub:'Mobile'},
  {id:'orange',lbl:'🟠 Orange Money',sub:'Mobile'},
  {id:'free',lbl:'🟣 Free Money',sub:'Mobile'},
  {id:'bank',lbl:'🏦 Virement bancaire',sub:'N° de compte requis'}
];

/* ══════════ GARDE DE SESSION ══════════ */
var sess=sessionStorage.getItem('sentew_admin')||localStorage.getItem('sentew_admin');
if(!sess){location.replace('login-admin.html');}
function logout(){sessionStorage.removeItem('sentew_admin');localStorage.removeItem('sentew_admin');location.replace('login-admin.html');}

/* ══════════ HELPERS ══════════ */
function $(id){return document.getElementById(id);}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2800);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(d){if(!d)return'';try{var x=new Date(d);return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function fmtN(n){return Math.round(n||0).toLocaleString('fr-FR');}
async function api(t,q,o){o=o||{};var r=await fetch(SUPA+'/rest/v1/'+t+(q||''),Object.assign({headers:H},o));if(o.method&&o.method!=='GET')return r;var j=await r.json();return Array.isArray(j)?j:[];}
function setBadge(id,n){var b=$(id);if(!b)return;if(n>0){b.textContent=n;b.classList.add('on');}else{b.classList.remove('on');}}

/* ══════════ ÉTAT ══════════ */
var DATA={vendors:[],drivers:[],orders:[],expenses:[],payouts:[]};
var FILT={vendeurs:'all',livreurs:'all',commandes:'all'};
var SRCH={vendeurs:'',livreurs:''};
var SEL={list:[],table:null};
var CUR='vendeurs';
var PM_CHOICE='wave';

/* ══════════ ONGLETS ══════════ */
function showTab(id,btn){
  selClear();closeModal();
  document.querySelectorAll('.panel').forEach(function(p){p.classList.add('hidden');});
  $(id).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  if(btn)btn.classList.add('on');
  if(id==='stats')renderStats();
  if(id==='vendeurs')renderVendors();
  if(id==='livreurs')renderDrivers();
  if(id==='commandes')renderOrders();
  if(id==='reversements')renderPayouts();
  if(id==='compta')renderCompta();
  if(id==='messages')renderMessages();
  if(id==='notifs')loadNotifs();
}

/* ══════════ CHARGEMENT ══════════ */
async function loadAll(){
  DATA.vendors=await api('vendors','?select=*&order=created_at.desc');
  DATA.drivers=await api('drivers','?select=*&order=created_at.desc');
  DATA.orders=await api('orders','?select=*&order=created_at.desc&limit=300');
  DATA.expenses=await api('expenses','?select=*&order=expense_date.desc&limit=100');
  DATA.payouts=await api('payouts','?select=*&order=created_at.desc&limit=50');
  loadPilotage();
}

function loadPilotage(){
  var v=DATA.vendors,d=DATA.drivers,o=DATA.orders;
  var pendV=v.filter(function(x){return x.status==='pending';}).length;
  var pendD=d.filter(function(x){return x.status==='pending';}).length;
  var ca=o.filter(function(x){return x.status==='delivered';}).reduce(function(s,x){return s+(x.total||0);},0);
  $('kVendors').textContent=v.filter(function(x){return x.status==='active'||x.status==='approved';}).length;
  $('kPending').textContent=pendV+pendD;
  $('kOrders').textContent=o.length;
  $('kCA').textContent=fmtN(ca);
  setBadge('nbV',pendV);setBadge('nbL',pendD);
  var html='';
  v.filter(function(x){return x.status==='pending';}).forEach(function(x){html+='<div class="card2" style="cursor:pointer" onclick="openDetail(\'vendors\',\''+x.id+'\')"><div class="row"><div><div class="nm">🏬 '+esc(x.shop_name||x.full_name||'Vendeur')+'</div><div class="meta">'+esc(x.city||'')+' · '+fmtDate(x.created_at)+'</div></div><span class="pill pending">À valider</span></div></div>';});
  d.filter(function(x){return x.status==='pending';}).forEach(function(x){html+='<div class="card2" style="cursor:pointer" onclick="openDetail(\'drivers\',\''+x.id+'\')"><div class="row"><div><div class="nm">🛵 '+esc(x.full_name||'Livreur')+'</div><div class="meta">'+esc(x.city||x.zone||'')+' · '+fmtDate(x.created_at)+'</div></div><span class="pill pending">À valider</span></div></div>';});
  $('priorityList').innerHTML=html||'<div class="empty">✅ Aucune demande en attente. Tout est à jour !</div>';
}

/* ══════════ STATISTIQUES ══════════ */
function renderStats(){
  var el=$('stats');
  var o=DATA.orders;
  var deliv=o.filter(function(x){return x.status==='delivered';});
  var ca=deliv.reduce(function(s,x){return s+(x.total||0);},0);
  var commission=ca*COMMISSION/100;
  var avg=deliv.length?ca/deliv.length:0;
  /* CA sur 7 derniers jours */
  var days=[],i,d,key;
  for(i=6;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);key=d.toISOString().slice(0,10);days.push({key:key,lbl:d.toLocaleDateString('fr-FR',{weekday:'short'}),val:0});}
  deliv.forEach(function(x){var k=String(x.created_at||'').slice(0,10);var dd=days.find(function(y){return y.key===k;});if(dd)dd.val+=(x.total||0);});
  var maxD=Math.max.apply(null,days.map(function(x){return x.val;}))||1;
  var bars=days.map(function(x){return '<div class="bar-row"><div class="bar-lbl">'+x.lbl+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(3,Math.round(x.val/maxD*100))+'%"></div></div><div class="bar-val">'+fmtN(x.val)+' F</div></div>';}).join('');
  /* répartition statuts */
  var st={};o.forEach(function(x){st[x.status]=(st[x.status]||0)+1;});
  var stHtml=Object.keys(st).map(function(k){return '<div class="kpi-line"><span>'+esc(k)+'</span><b>'+st[k]+'</b></div>';}).join('')||'<div class="empty">Aucune commande</div>';
  /* top vendeurs par solde */
  var top=DATA.vendors.filter(function(v){return (v.pending_balance||0)>0;}).sort(function(a,b){return (b.pending_balance||0)-(a.pending_balance||0);}).slice(0,5);
  var topHtml=top.map(function(v,ix){return '<div class="kpi-line"><span>'+(ix+1)+'. '+esc(v.shop_name||v.full_name||'')+'</span><b>'+fmtN(v.pending_balance)+' F</b></div>';}).join('')||'<div class="empty">Aucun solde vendeur</div>';
  el.innerHTML=
   '<div class="kpis">'+
   '<div class="kpi money"><div class="kv">'+fmtN(ca)+'</div><div class="kl">CA livré total (F)</div></div>'+
   '<div class="kpi"><div class="kv">'+fmtN(commission)+'</div><div class="kl">Commissions ('+COMMISSION+'%)</div></div>'+
   '<div class="kpi blue"><div class="kv">'+deliv.length+'</div><div class="kl">Livrées</div></div>'+
   '<div class="kpi"><div class="kv">'+fmtN(avg)+'</div><div class="kl">Panier moyen (F)</div></div>'+
   '</div>'+
   '<div class="sect"><i data-lucide="bar-chart-3"></i>CA des 7 derniers jours</div><div class="card2">'+bars+'</div>'+
   '<div class="sect"><i data-lucide="pie-chart"></i>Commandes par statut</div><div class="card2">'+stHtml+'</div>'+
   '<div class="sect"><i data-lucide="trophy"></i>Top vendeurs (solde à reverser)</div><div class="card2">'+topHtml+'</div>';
  lucide.createIcons();
}

/* ══════════ FILTRES + RECHERCHE ══════════ */
function toolsHtml(tab){
  var filters=tab==='commandes'
    ?[['all','Toutes'],['pending','Attente'],['preparing','Préparation'],['in_delivery','En livraison'],['delivered','Livrées'],['cancelled','Annulées']]

async function openDetail(table,id){
  var x=(table==='vendors'?DATA.vendors:DATA.drivers).find(function(r){return String(r.id)===String(id);});
  if(!x)return;
  var role=table==='vendors'?'Vendeur':'Livreur';
  var h='<button class="close" onclick="closeModal()">✕</button><h3>'+esc(x.shop_name||x.full_name||role)+'</h3><div class="meta">'+role+' · <span class="pill '+esc(x.status||'')+'">'+esc(x.status||'')+'</span></div><div style="margin-top:10px">';
  var keys=Object.keys(x);
  for(var i=0;i<keys.length;i++){
    var k=keys[i],val=x[k];
    if(val===null||val===''||k==='password_hash')continue;
    if(/_at$/.test(k))val=fmtDate(val);
    if(typeof val==='boolean')val=val?'Oui':'Non';
    h+='<div class="drow"><b>'+esc(k)+'</b><span>'+esc(val)+'</span></div>';
  }
  h+='</div><div class="sect"><i data-lucide="file-check"></i>Documents d\u2019identité</div><div id="kycZone"><div class="loading">Recherche…</div></div>';
  h+='<div class="actions" style="margin-top:14px">'+actionBtns(table,x)+'</div>';
  $('sheet').innerHTML=h;$('modal').classList.add('on');lucide.createIcons();
  var docs=await api('kyc_documents','?select=*&order=created_at.desc&limit=100');
  docs=docs.filter(function(dc){return x.email&&(dc.user_email===x.email||dc.email===x.email||dc.vendor_email===x.email||dc.driver_email===x.email);});
  var z=$('kycZone');if(!z)return;
  if(!docs.length){z.innerHTML='<div class="empty">Aucun document enregistré pour ce compte.</div>';return;}
  z.innerHTML=docs.map(function(dc){var url=dc.file_url||dc.url||dc.document_url||'#';return '<a class="doc" href="'+esc(url)+'" target="_blank"><i data-lucide="file-text"></i>'+esc(dc.doc_type||dc.type||'Document')+'<span style="margin-left:auto;font-size:11px;color:#8aa69c">'+fmtDate(dc.created_at)+'</span></a>';}).join('');
  lucide.createIcons();
}

async function notify(email,title,message){if(!email)return;try{await api('notifications','',{method:'POST',body:JSON.stringify({audience:'user',user_email:email,type:'account',title:title,message:message})});}catch(e){}}
async function setStatus(table,id,status,email,role){
  await api(table,'?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:status})});

function toggleSel(ev,table,id){ev.stopPropagation();var i=SEL.list.indexOf(id);if(i>-1)SEL.list.splice(i,1);else SEL.list.push(id);SEL.table=table;if(CUR==='vendeurs')renderVendors();else renderDrivers();}
function selAll(){
  var f=CUR==='vendeurs'?FILT.vendeurs:FILT.livreurs;
  var rows=(CUR==='vendeurs'?DATA.vendors:DATA.drivers).filter(function(x){return f==='all'||x.status===f;}).filter(matchSrch);
  var ids=rows.map(function(x){return x.id;});
  var allIn=ids.every(function(id){return SEL.list.indexOf(id)>-1;});
  SEL.table=CUR==='vendeurs'?'vendors':'drivers';
  SEL.list=allIn?[]:ids;
  if(CUR==='vendeurs')renderVendors();else renderDrivers();
}
function selClear(){SEL.list=[];SEL.table=null;updateSelbar();}
function updateSelbar(){var b=$('selbar');if(SEL.list.length){b.classList.add('on');$('selCnt').textContent=SEL.list.length+' sélectionné'+(SEL.list.length>1?'s':'');}else{b.classList.remove('on');}}
async function bulkSet(status){
  if(!SEL.list.length)return;
  if(!confirm(SEL.list.length+' compte(s) → '+status+' ?'))return;
  var table=SEL.table,role=table==='vendors'?'vendeur':'livreur',src=table==='vendors'?DATA.vendors:DATA.drivers;
  for(var i=0;i<SEL.list.length;i++){
    var id=SEL.list[i];
    await api(table,'?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:status})});
    var x=src.find(function(r){return String(r.id)===String(id);});
    if(x&&x.email)await notify(x.email,'Statut de votre compte',(MSGS[status]||'Mise à jour.').replace('{role}',role));
  }
  toast(SEL.list.length+' compte(s) mis à jour ✅');selClear();await loadAll();
  if(CUR==='vendeurs')renderVendors();else renderDrivers();
}

async function payNow(vendorId,email,name,amount){
  var mLbl=PAY_METHODS.find(function(m){return m.id===PM_CHOICE;}).lbl;
  var bankInfo='';
  if(PM_CHOICE==='bank'){
    var bi=$('bank_'+vendorId);
    bankInfo=bi?bi.value.trim():'';
    if(!bankInfo){toast('🏦 Saisis le n° de compte bancaire');return;}
  }
  if(!confirm('Payer '+fmtN(amount)+' F à '+name+' via '+mLbl+(bankInfo?' ('+bankInfo+')':'')+' ?'))return;
  await api('payouts','',{method:'POST',body:JSON.stringify({recipient_type:'vendor',recipient_email:email,recipient_name:name,amount:amount,method:mLbl+(bankInfo?' · '+bankInfo:''),status:'paid',paid_at:new Date().toISOString()})});
  await api('vendors','?id=eq.'+vendorId,{method:'PATCH',body:JSON.stringify({pending_balance:0})});
  await notify(email,'Reversement effectué 💸','Votre reversement de '+fmtN(amount)+' FCFA a été effectué via '+mLbl+'. Merci de votre confiance !');
  toast('Reversement enregistré ✅');await loadAll();renderPayouts();
}

}

/* ══════════ EXPORT CSV ══════════ */
function exportCSV(){
  var rows=[['type','nom','email','ville','statut','date']];
  DATA.vendors.forEach(function(v){rows.push(['vendeur',v.shop_name||v.full_name||'',v.email||'',v.city||'',v.status||'',v.created_at||'']);});
  DATA.drivers.forEach(function(d){rows.push(['livreur',d.full_name||'',d.email||'',d.city||d.zone||'',d.status||'',d.created_at||'']);});
  DATA.orders.forEach(function(o){rows.push(['commande','#'+String(o.id).slice(0,8),o.customer_email||o.user_email||'','',o.status+' · '+(o.total||0)+'F',o.created_at||'']);});
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\ufeff'+encodeURIComponent(csv);a.download='sentew-admin-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('Export CSV téléchargé ⬇️');
}

/* ══════════ REFRESH SILENCIEUX ══════════ */
async function silentRefresh(){
  try{
    var n=await api('notifications','?audience=eq.admin&is_read=eq.false&select=id');setBadge('nbN',n.length);
    var v=await api('vendors','?status=eq.pending&select=id');setBadge('nbV',v.length);
    var d=await api('drivers','?status=eq.pending&select=id');setBadge('nbL',d.length);
  }catch(e){}
}

/* ══════════ INIT ══════════ */
lucide.createIcons();
loadAll();
silentRefresh();
setInterval(silentRefresh,45000);
</script>
