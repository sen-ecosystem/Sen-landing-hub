<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Administration - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/security-shield.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f4f7f5;color:#12312a;padding-bottom:80px}
.topbar{background:linear-gradient(120deg,#0a1f17,#0f6b4e);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.topbar h1{font-size:17px;font-weight:900}
.top-actions{display:flex;gap:8px}
.icobtn{position:relative;background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icobtn i{width:18px;height:18px}
.nb{position:absolute;top:-4px;right:-4px;background:#e63946;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 4px}
.nb.on{display:flex}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:9px 16px;border-radius:99px;border:2px solid #e3ede8;background:#fff;font-size:12.5px;font-weight:800;color:#5b7a70;cursor:pointer;position:relative}
.tab.on{background:#0f6b4e;border-color:#0f6b4e;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:16px;padding:14px;border-left:4px solid #0f6b4e;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.kpi .kv{font-size:20px;font-weight:900;letter-spacing:-.5px}
.kpi .kl{font-size:10.5px;color:#5b7a70;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.kpi.warn{border-left-color:#e63946}
.card2{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-size:14px;font-weight:800;color:#0a1f17}
.meta{font-size:11.5px;color:#8aa69c;margin-top:2px}
.pill{font-size:10px;font-weight:900;padding:4px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.pill.pending{background:#fff4e0;color:#b07a1f}
.pill.active,.pill.approved{background:#eafaf1;color:#0f6b4e}
.pill.suspended{background:#fdecec;color:#c0392b}
.pill.delivered{background:#eafaf1;color:#0f6b4e}
.pill.in_delivery{background:#e8f0fe;color:#1a56c4}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.abtn{border:none;border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px}
.abtn i{width:14px;height:14px}
.abtn.ok{background:#0f6b4e;color:#fff}
.abtn.warn{background:#fff4e0;color:#b07a1f}
.abtn.danger{background:#fdecec;color:#c0392b}
.abtn.plain{background:#f0f3f2;color:#12312a}
.empty{text-align:center;color:#9db8af;font-size:13px;padding:30px 10px}
.sect{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:#0f6b4e;margin:16px 0 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a1f17;color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:700;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{display:block}
.loading{text-align:center;padding:40px;color:#8aa69c;font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="topbar">
  <h1>🛡️ SEN TEW Admin</h1>
  <div class="top-actions">
    <button class="icobtn" onclick="silentRefresh()" title="Rafraîchir"><i data-lucide="refresh-cw"></i></button>
    <button class="icobtn" onclick="logout()" title="Déconnexion"><i data-lucide="log-out"></i></button>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab on" data-t="pilotage" onclick="showTab('pilotage',this)">Pilotage</button>
  <button class="tab" data-t="vendeurs" onclick="showTab('vendeurs',this)">Vendeurs <span class="nb" id="nbV"></span></button>
  <button class="tab" data-t="livreurs" onclick="showTab('livreurs',this)">Livreurs <span class="nb" id="nbL"></span></button>
  <button class="tab" data-t="commandes" onclick="showTab('commandes',this)">Commandes</button>
  <button class="tab" data-t="notifs" onclick="showTab('notifs',this)">Notifications <span class="nb" id="nbN"></span></button>
</div>

<div class="wrap">
  <div id="pilotage" class="panel">
    <div class="kpis">
      <div class="kpi"><div class="kv" id="kVendors">–</div><div class="kl">Vendeurs actifs</div></div>
      <div class="kpi warn"><div class="kv" id="kPending">–</div><div class="kl">En attente validation</div></div>
      <div class="kpi"><div class="kv" id="kOrders">–</div><div class="kl">Commandes</div></div>
      <div class="kpi"><div class="kv" id="kCA">–</div><div class="kl">CA livré (FCFA)</div></div>
    </div>
    <div class="sect">À traiter en priorité</div>
    <div id="priorityList"><div class="loading">Chargement…</div></div>
  </div>
  <div id="vendeurs" class="panel hidden"><div class="loading">Chargement…</div></div>
  <div id="livreurs" class="panel hidden"><div class="loading">Chargement…</div></div>
  <div id="commandes" class="panel hidden"><div class="loading">Chargement…</div></div>
  <div id="notifs" class="panel hidden"><div class="loading">Chargement…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════ CONFIG ══════════ */
var SUPA='https://tjqkruhwmjzgfvtouqza.supabase.co';
var SUPA_KEY='sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j';
var H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};

/* ══════════ GARDE DE SESSION — même clé que login-admin ══════════ */
var sess=sessionStorage.getItem('sentew_admin')||localStorage.getItem('sentew_admin');
if(!sess){location.replace('login-admin.html');}

function logout(){sessionStorage.removeItem('sentew_admin');localStorage.removeItem('sentew_admin');location.replace('login-admin.html');}

/* ══════════ HELPERS ══════════ */
function $(id){return document.getElementById(id);}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDate(d){if(!d)return'';try{return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function fmtN(n){return (n||0).toLocaleString('fr-FR');}

async function api(table,query,opts){
  opts=opts||{};
  var r=await fetch(SUPA+'/rest/v1/'+table+(query||''),Object.assign({headers:H},opts));
  if(opts.method&&opts.method!=='GET')return r;
  return r.json();
}

/* ══════════ NAVIGATION ONGLETS ══════════ */
function showTab(id,btn){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.add('hidden');});
  $(id).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  if(btn)btn.classList.add('on');
  if(id==='vendeurs')loadVendors();
  if(id==='livreurs')loadDrivers();
  if(id==='commandes')loadOrders();
  if(id==='notifs')loadNotifs();
}

/* ══════════ PILOTAGE (KPIs) ══════════ */
async function loadPilotage(){
  try{
    var vendors=await api('vendors','?select=id,status');
    var drivers=await api('drivers','?select=id,status');
    var orders=await api('orders','?select=id,total,status');
    vendors=Array.isArray(vendors)?vendors:[];
    drivers=Array.isArray(drivers)?drivers:[];
    orders=Array.isArray(orders)?orders:[];
    var pendV=vendors.filter(function(v){return v.status==='pending';}).length;
    var pendD=drivers.filter(function(d){return d.status==='pending';}).length;
    var ca=orders.filter(function(o){return o.status==='delivered';}).reduce(function(s,o){return s+(o.total||0);},0);
    $('kVendors').textContent=vendors.filter(function(v){return v.status==='active'||v.status==='approved';}).length;
    $('kPending').textContent=pendV+pendD;
    $('kOrders').textContent=orders.length;
    $('kCA').textContent=fmtN(ca);
    setBadge('nbV',pendV);setBadge('nbL',pendD);
    /* priorités */
    var html='';
    vendors.filter(function(v){return v.status==='pending';}).forEach(function(v){
      html+='<div class="card2"><div class="row"><div><div class="nm">🏬 Vendeur en attente</div><div class="meta">ID '+esc(v.id).slice(0,8)+'…</div></div><span class="pill pending">À valider</span></div></div>';
    });
    drivers.filter(function(d){return d.status==='pending';}).forEach(function(d){
      html+='<div class="card2"><div class="row"><div><div class="nm">🛵 Livreur en attente</div><div class="meta">ID '+esc(d.id).slice(0,8)+'…</div></div><span class="pill pending">À valider</span></div></div>';
    });
    $('priorityList').innerHTML=html||'<div class="empty">✅ Aucune demande en attente. Tout est à jour !</div>';
  }catch(e){$('priorityList').innerHTML='<div class="empty">Erreur de chargement.</div>';}
}

function setBadge(id,n){var b=$(id);if(!b)return;if(n>0){b.textContent=n;b.classList.add('on');}else{b.classList.remove('on');}}

/* ══════════ VENDEURS ══════════ */
async function loadVendors(){
  var el=$('vendeurs');
  el.innerHTML='<div class="loading">Chargement…</div>';
  var rows=await api('vendors','?select=id,shop_name,full_name,email,phone,city,status,commission_rate,created_at&order=created_at.desc');
  if(!Array.isArray(rows)||rows.length===0){el.innerHTML='<div class="empty">Aucun vendeur pour le moment.</div>';return;}
  el.innerHTML=rows.map(function(v){
    return '<div class="card2"><div class="row"><div><div class="nm">'+esc(v.shop_name||'Boutique')+'</div><div class="meta">'+esc(v.full_name||'')+' · '+esc(v.city||'')+' · '+esc(v.phone||'')+'<br>'+fmtDate(v.created_at)+' · commission '+(v.commission_rate||8)+'%</div></div><span class="pill '+esc(v.status||'pending')+'">'+esc(v.status||'pending')+'</span></div>'+
    '<div class="actions">'+
    (v.status==='pending'?'<button class="abtn ok" onclick="setStatus(\'vendors\',\''+v.id+'\',\'active\',\''+esc(v.email||'')+'\',\'vendeur\')"><i data-lucide="check"></i>Valider</button><button class="abtn danger" onclick="setStatus(\'vendors\',\''+v.id+'\',\'rejected\',\''+esc(v.email||'')+'\',\'vendeur\')"><i data-lucide="x"></i>Rejeter</button>':'')+
    (v.status==='active'?'<button class="abtn warn" onclick="setStatus(\'vendors\',\''+v.id+'\',\'suspended\',\''+esc(v.email||'')+'\',\'vendeur\')"><i data-lucide="pause"></i>Suspendre</button>':'')+
    (v.status==='suspended'?'<button class="abtn ok" onclick="setStatus(\'vendors\',\''+v.id+'\',\'active\',\''+esc(v.email||'')+'\',\'vendeur\')"><i data-lucide="play"></i>Réactiver</button>':'')+
    '</div></div>';
  }).join('');
  lucide.createIcons();
}

/* ══════════ LIVREURS ══════════ */
async function loadDrivers(){
  var el=$('livreurs');
  el.innerHTML='<div class="loading">Chargement…</div>';
  var rows=await api('drivers','?select=id,full_name,email,phone,city,vehicle_type,status,created_at&order=created_at.desc');
  if(!Array.isArray(rows)||rows.length===0){el.innerHTML='<div class="empty">Aucun livreur pour le moment.</div>';return;}
  el.innerHTML=rows.map(function(d){
    return '<div class="card2"><div class="row"><div><div class="nm">'+esc(d.full_name||'Livreur')+'</div><div class="meta">'+esc(d.vehicle_type||'')+' · '+esc(d.city||'')+' · '+esc(d.phone||'')+'<br>'+fmtDate(d.created_at)+'</div></div><span class="pill '+esc(d.status||'pending')+'">'+esc(d.status||'pending')+'</span></div>'+
    '<div class="actions">'+
    (d.status==='pending'?'<button class="abtn ok" onclick="setStatus(\'drivers\',\''+d.id+'\',\'active\',\''+esc(d.email||'')+'\',\'livreur\')"><i data-lucide="check"></i>Valider</button><button class="abtn danger" onclick="setStatus(\'drivers\',\''+d.id+'\',\'rejected\',\''+esc(d.email||'')+'\',\'livreur\')"><i data-lucide="x"></i>Rejeter</button>':'')+
    (d.status==='active'?'<button class="abtn warn" onclick="setStatus(\'drivers\',\''+d.id+'\',\'suspended\',\''+esc(d.email||'')+'\',\'livreur\')"><i data-lucide="pause"></i>Suspendre</button>':'')+
    (d.status==='suspended'?'<button class="abtn ok" onclick="setStatus(\'drivers\',\''+d.id+'\',\'active\',\''+esc(d.email||'')+'\',\'livreur\')"><i data-lucide="play"></i>Réactiver</button>':'')+
    '</div></div>';
  }).join('');
  lucide.createIcons();
}

/* ══════════ COMMANDES ══════════ */
async function loadOrders(){
  var el=$('commandes');
  el.innerHTML='<div class="loading">Chargement…</div>';
  var rows=await api('orders','?select=id,customer_email,total,status,created_at&order=created_at.desc&limit=50');
  if(!Array.isArray(rows)||rows.length===0){el.innerHTML='<div class="empty">Aucune commande pour le moment.</div>';return;}
  el.innerHTML=rows.map(function(o){
    return '<div class="card2"><div class="row"><div><div class="nm">Commande #'+esc(String(o.id)).slice(0,8)+'</div><div class="meta">'+esc(o.customer_email||'')+' · '+fmtDate(o.created_at)+'</div></div><div style="text-align:right"><div class="nm">'+fmtN(o.total)+' F</div><span class="pill '+esc(o.status||'')+'">'+esc(o.status||'')+'</span></div></div></div>';
  }).join('');
}

/* ══════════ NOTIFICATIONS ══════════ */
async function loadNotifs(){
  var el=$('notifs');
  el.innerHTML='<div class="loading">Chargement…</div>';
  var rows=await api('notifications','?audience=eq.admin&select=*&order=created_at.desc&limit=50');
  if(!Array.isArray(rows)||rows.length===0){el.innerHTML='<div class="empty">Aucune notification.</div>';setBadge('nbN',0);return;}
  var unread=rows.filter(function(n){return !n.is_read;}).length;
  setBadge('nbN',unread);
  el.innerHTML=rows.map(function(n){
    return '<div class="card2" style="'+(n.is_read?'opacity:.65':'border-left:4px solid #0f6b4e')+'"><div class="nm">'+esc(n.title||'Notification')+'</div><div class="meta">'+esc(n.message||'')+'</div><div class="meta" style="margin-top:4px">'+fmtDate(n.created_at)+'</div>'+
    (!n.is_read?'<div class="actions"><button class="abtn plain" onclick="markRead(\''+n.id+'\')"><i data-lucide="check"></i>Marquer lu</button></div>':'')+'</div>';
  }).join('');
  lucide.createIcons();
}

async function markRead(id){
  await api('notifications','?id=eq.'+id,{method:'PATCH',body:JSON.stringify({is_read:true})});
  loadNotifs();
}

/* ══════════ ACTIONS + NOTIFICATION AUTO ══════════ */
async function setStatus(table,id,status,email,role){
  await api(table,'?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:status})});
  if(email&&status!=='pending'){
    var msgs={
      active:'Félicitations ! Votre compte '+role+' SEN TEW est maintenant actif. Vous pouvez commencer.',
      suspended:'Votre compte '+role+' SEN TEW a été suspendu. Contactez le support pour plus d\'informations.',
      rejected:'Votre demande '+role+' SEN TEW n\'a pas été retenue. Contactez le support pour plus de détails.'
    };
    try{
      await api('notifications','',{method:'POST',body:JSON.stringify({audience:'user',user_email:email,type:'account',title:'Statut de votre compte',message:msgs[status]||'Mise à jour de votre compte.'})});
    }catch(e){}
  }
  toast('Statut mis à jour ✅');
  loadPilotage();
  if(table==='vendors')loadVendors();else loadDrivers();
}

/* ══════════ RAFRAÎCHISSEMENT SILENCIEUX (pas de rechargement visible) ══════════ */
async function silentRefresh(){
  try{
    var n=await api('notifications','?audience=eq.admin&is_read=eq.false&select=id');
    setBadge('nbN',Array.isArray(n)?n.length:0);
    var v=await api('vendors','?status=eq.pending&select=id');
    setBadge('nbV',Array.isArray(v)?v.length:0);
    var d=await api('drivers','?status=eq.pending&select=id');
    setBadge('nbL',Array.isArray(d)?d.length:0);
  }catch(e){}
}

/* ══════════ INIT ══════════ */
lucide.createIcons();
loadPilotage();
silentRefresh();
setInterval(silentRefresh,45000); /* badges seulement — la page ne recharge jamais */
</script>
</body>
</html>
