<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f2f6f4;color:#12312a;padding-bottom:110px}
.topbar{background:linear-gradient(120deg,#04120c,#0f6b4e);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 3px 16px rgba(0,0,0,.3)}
.topbar h1{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
.topbar h1 i{width:19px;height:19px}
.top-actions{display:flex;gap:8px}
.icobtn{position:relative;background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icobtn i{width:18px;height:18px}
.nb{position:absolute;top:-4px;right:-4px;background:#e63946;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 4px}
.nb.on{display:flex}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 6px;scrollbar-width:none;position:sticky;top:70px;background:#f2f6f4;z-index:40}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:9px 15px;border-radius:99px;border:2px solid #e3ede8;background:#fff;font-size:12px;font-weight:800;color:#5b7a70;cursor:pointer;position:relative;transition:.15s}
.tab.on{background:#0f6b4e;border-color:#0f6b4e;color:#fff;box-shadow:0 3px 10px rgba(15,107,78,.3)}
.wrap{max-width:920px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:18px;padding:15px;border-left:4px solid #0f6b4e;box-shadow:0 2px 10px rgba(10,31,23,.06);transition:.15s}
.kpi:active{transform:scale(.97)}
.kpi .kv{font-size:21px;font-weight:900;letter-spacing:-.5px}
.kpi .kl{font-size:10.5px;color:#5b7a70;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.kpi.warn{border-left-color:#e63946}
.kpi.money{border-left-color:#b07a1f}
.kpi.blue{border-left-color:#1a56c4}
.card2{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(10,31,23,.06)}
.card2.sel{outline:3px solid #0f6b4e}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-size:14px;font-weight:800;color:#0a1f17}
.meta{font-size:11.5px;color:#8aa69c;margin-top:2px;line-height:1.5}
.pill{font-size:10px;font-weight:900;padding:4px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.pill.pending{background:#fff4e0;color:#b07a1f}
.pill.active,.pill.approved,.pill.delivered,.pill.paid{background:#eafaf1;color:#0f6b4e}
.pill.suspended,.pill.rejected,.pill.cancelled{background:#fdecec;color:#c0392b}
.pill.in_delivery,.pill.preparing{background:#e8f0fe;color:#1a56c4}
.pill.draft{background:#f0f3f2;color:#5b7a70}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.abtn{border:none;border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.12s}
.abtn:active{transform:scale(.96)}
.abtn i{width:14px;height:14px}
.abtn.ok{background:#0f6b4e;color:#fff}
.abtn.warn{background:#fff4e0;color:#b07a1f}
.abtn.danger{background:#fdecec;color:#c0392b}
.abtn.plain{background:#f0f3f2;color:#12312a}
.abtn.blue{background:#e8f0fe;color:#1a56c4}
.empty{text-align:center;color:#9db8af;font-size:13px;padding:30px 10px}
.sect{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:#0f6b4e;margin:18px 0 10px;display:flex;align-items:center;gap:6px}
.sect i{width:14px;height:14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0a1f17;color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:700;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.on{display:block}
.loading{text-align:center;padding:40px;color:#8aa69c;font-size:13px}
.hidden{display:none!important}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e3ede8;border-radius:13px;padding:10px 13px}
.search i{width:16px;height:16px;color:#8aa69c;flex-shrink:0}
.search input{border:none;outline:none;flex:1;font-size:13.5px;background:none}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;padding:7px 13px;border-radius:99px;border:1.5px solid #e3ede8;background:#fff;font-size:11.5px;font-weight:800;color:#5b7a70;cursor:pointer}
.fchip.on{background:#0a1f17;color:#fff;border-color:#0a1f17}
.selbar{position:fixed;bottom:0;left:0;right:0;background:#0a1f17;color:#fff;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:8px;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
.selbar.on{display:flex}
.selbar .cnt{font-size:13px;font-weight:800}
.selbar .acts{display:flex;gap:6px;flex-wrap:wrap}
.selbar button{border:none;border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:800;cursor:pointer}
.selbar .b-all{background:rgba(255,255,255,.15);color:#fff}
.selbar .b-ok{background:#4ade80;color:#04120c}
.selbar .b-warn{background:#fbbf24;color:#3a2800}
.selbar .b-x{background:rgba(255,255,255,.15);color:#fff}
.chk{width:22px;height:22px;border:2px solid #c9dcd3;border-radius:7px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff}
.chk.on{background:#0f6b4e;border-color:#0f6b4e;color:#fff}
.chk i{width:14px;height:14px}
.modal{position:fixed;inset:0;background:rgba(4,18,12,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px 18px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:900;color:#0a1f17;margin-bottom:4px}
.sheet .close{float:right;background:#f0f3f2;border:none;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:900;color:#5b7a70}
.drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #f0f5f2;font-size:13px}
.drow b{color:#0a1f17}
.drow span{color:#5b7a70;text-align:right;word-break:break-all}
.doc{display:flex;align-items:center;gap:10px;background:#f7faf8;border:1.5px solid #e3ede8;border-radius:12px;padding:11px 13px;margin-top:8px;font-size:13px;font-weight:700;color:#0f6b4e;text-decoration:none}
.doc i{width:17px;height:17px;flex-shrink:0}
.tpl{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e3ede8;border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;font-size:13px;font-weight:700;color:#12312a}
.tpl small{display:block;font-weight:500;color:#8aa69c;margin-top:3px;font-size:11.5px;line-height:1.5}
.tpl:active{border-color:#0f6b4e}
textarea,input.sin,select.sin{width:100%;border:2px solid #e3ede8;border-radius:12px;padding:11px 13px;font-size:13.5px;font-family:inherit;outline:none;background:#fbfdfc}
textarea:focus,input.sin:focus,select.sin:focus{border-color:#0f6b4e}
textarea{min-height:90px;resize:vertical}
label.lb{display:block;font-size:11px;font-weight:800;color:#0a1f17;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.5px}
.bigbtn{width:100%;padding:14px;border:none;border-radius:13px;background:linear-gradient(120deg,#0a1f17,#0f6b4e);color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:12px;letter-spacing:.4px}
.bigbtn.gold{background:linear-gradient(120deg,#7a5c10,#b07a1f)}
.paycard{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(10,31,23,.06);border-left:4px solid #b07a1f}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-lbl{width:64px;font-size:11px;font-weight:800;color:#5b7a70;text-align:right;flex-shrink:0}
.bar-track{flex:1;background:#eef4f1;border-radius:8px;height:22px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#0f6b4e,#3aa87e);border-radius:8px;min-width:3px;transition:width .5s ease}
.bar-val{width:74px;font-size:11.5px;font-weight:800;color:#0a1f17;flex-shrink:0}
.paymethods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pm{border:2px solid #e3ede8;border-radius:13px;padding:11px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:800;color:#5b7a70;background:#fff;transition:.12s}
.pm.on{border-color:#0f6b4e;background:#eafaf1;color:#0f6b4e}
.pm small{display:block;font-weight:600;font-size:10.5px;margin-top:2px;color:#8aa69c}
.kpi-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f5f2;font-size:13.5px}
.kpi-line b{font-weight:900}
.pos{color:#0f6b4e}.neg{color:#c0392b}
/* PANORAMIQUE */
.live-dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:#4ade80;margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.feed{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(10,31,23,.06)}
.fitem{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #f0f5f2;align-items:flex-start}
.fitem:last-child{border-bottom:none}
.fico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fico i{width:16px;height:16px}
.fico.g{background:#eafaf1;color:#0f6b4e}.fico.b{background:#e8f0fe;color:#1a56c4}.fico.o{background:#fff4e0;color:#b07a1f}.fico.r{background:#fdecec;color:#c0392b}
.ftxt{flex:1;font-size:13px;line-height:1.5}
.ftxt b{color:#0a1f17}
.ftime{font-size:10.5px;color:#9db8af;flex-shrink:0}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e3ede8;border-radius:13px;padding:10px 13px;margin-bottom:0}
.searchbar i{width:16px;height:16px;color:#8aa69c;flex-shrink:0}
.searchbar input{flex:1;border:none;outline:none;font-size:13.5px;font-family:inherit;background:transparent}
.searchbar .clr{border:none;background:#f0f3f2;color:#5b7a70;width:22px;height:22px;border-radius:99px;display:none;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.searchbar .clr.on{display:flex}
.searchbar .clr i{width:12px;height:12px}
.swiperow{position:relative;overflow:hidden;border-radius:16px;margin-bottom:10px}
.swipe-bg{position:absolute;top:0;bottom:0;display:flex;align-items:stretch;z-index:1}
.swipe-bg.left{left:0}
.swipe-bg.right{right:0}
.swipe-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:76px;color:#fff;font-size:10px;font-weight:800;border:none;cursor:pointer;flex-shrink:0}
.swipe-act i{width:19px;height:19px}
.swipe-act.pin{background:#1a56c4}
.swipe-act.ok{background:#0f6b4e}
.swipe-act.warn{background:#b07a1f}
.swipe-act.msg{background:#5b7a70}
.swipe-act.danger{background:#c0392b}
.swipe-content{position:relative;z-index:2;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(10,31,23,.06);transition:transform .18s ease;touch-action:pan-y}
.swiperow.dragging .swipe-content{transition:none}
.swiperow.pinned .swipe-content{border:2px solid #b07a1f}
.pin-flag{display:inline-flex;align-items:center;gap:3px;color:#b07a1f;font-size:10px;font-weight:900;margin-left:6px}
.pin-flag i{width:11px;height:11px}
.swipehint{font-size:10.5px;color:#9db8af;text-align:center;padding:4px 0 8px;display:flex;align-items:center;justify-content:center;gap:5px}
.swipehint i{width:12px;height:12px}
.selbar{gap:0}
.selbar .acts{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.selbar .acts::-webkit-scrollbar{display:none}
.selbar .b-csv{background:#1a56c4;color:#fff}
.selbar .b-danger{background:#c0392b;color:#fff}
.tools2{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}

.gsbar{position:sticky;top:110px;z-index:39;background:#f2f6f4;padding:4px 14px 8px}
.gscard{background:#fff;border-radius:14px;padding:12px 14px;margin:8px 14px;box-shadow:0 2px 8px rgba(10,31,23,.06);display:flex;gap:10px;align-items:center;cursor:pointer}
.gscard .gico{width:36px;height:36px;border-radius:10px;background:#e8f5ef;color:#0f6b4e;display:flex;align-items:center;justify-content:center;flex:none}
.gscard .gt{font-size:10px;font-weight:800;color:#0f6b4e;text-transform:uppercase;letter-spacing:.5px}
.gscard .gn{font-size:14px;font-weight:800;color:#0a1f17}
.gscard .gs{font-size:11px;color:#777}
.gsd{background:#fff;border-radius:14px;padding:14px;margin:8px 14px;box-shadow:0 2px 8px rgba(10,31,23,.06)}
.gsd h4{margin:0 0 8px;font-size:14px;color:#0f6b4e}
.gsd .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px dashed #eee}
.gsd .kv span{color:#777}.gsd .kv b{color:#0a1f17;text-align:right;word-break:break-all}
.gsback{margin:10px 14px;display:inline-block}
.gsempty{text-align:center;color:#999;font-size:13px;padding:30px 20px}
</style>
</head>

function fiscalGetDone(){try{return JSON.parse(localStorage.getItem('st_fiscal_done')||'{}');}catch(e){return{};}}
function fiscalSetDone(id,yr,st){var d=fiscalGetDone();d[id+'_'+yr]=st;try{localStorage.setItem('st_fiscal_done',JSON.stringify(d));}catch(e){}}
function fiscalNext(f){
  var now=new Date();
  if(f.date.indexOf('MENSUEL:')===0){
    var day=parseInt(f.date.split(':')[1],10);
    var d=new Date(now.getFullYear(),now.getMonth(),day);
    if(d<now)d=new Date(now.getFullYear(),now.getMonth()+1,day);
    return d;
  }
  return new Date(f.date+'T23:59:59');
}
function fiscalStatus(f){
  var now=new Date(),d=fiscalNext(f);
  var yr=d.getFullYear(), key=f.id+'_'+(f.date.indexOf('MENSUEL:')===0?(d.getFullYear()+'-'+(d.getMonth()+1)):yr);
  var done=fiscalGetDone()[key];
  if(done)return {st:done,days:Math.ceil((d-now)/86400000),key:key};
  var days=Math.ceil((d-now)/86400000);
  return {st:days<0?'En retard':'A venir',days:days,key:key};
}

    }).catch(function(e){

      throw e;
    });
}

function countryInfo(code){return COUNTRY_INFO[String(code||'').toUpperCase()]||COUNTRY_INFO.AUTRE;}
function countryFlag(code){return countryInfo(code).flag;}
function countryLang(code){return countryInfo(code).lang;}
function convFromXOF(amountXOF,code){var c=countryInfo(code);return (amountXOF||0)*c.rate;}
function fmtLocal(n,code){
  var c=countryInfo(code);
  if(c.cur==='XOF'||c.cur==='XAF')return Math.round(n||0).toLocaleString(c.lang==='en'?'en-US':'fr-FR')+' '+c.sym;
  var v=convFromXOF(n,code);
  var dec=(c.cur==='EUR'||c.cur==='USD'||c.cur==='GBP'||c.cur==='CAD')?2:0;
  return v.toLocaleString(c.lang==='en'?'en-US':'fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec})+' '+c.sym+' (≈'+Math.round(n||0).toLocaleString('fr-FR')+' FCFA)';
}
function countryOptions(sel){
  return Object.keys(COUNTRY_INFO).filter(function(c){return c!=='AUTRE';}).map(function(c){
    var ci=COUNTRY_INFO[c];
    return '<option value="'+c+'"'+(c===sel?' selected':'')+'>'+ci.flag+' '+ci.name+'</option>';
  }).join('')+'<option value="AUTRE"'+(sel==='AUTRE'?' selected':'')+'>🌍 Autre / International</option>';
}
function findCountryByEmail(email){
  if(!email)return 'SN';
  var em=String(email).toLowerCase();
  var v=(DATA.vendors||[]).find(function(x){return (x.email||'').toLowerCase()===em;});
  if(v&&v.country)return v.country;
  var d=(DATA.drivers||[]).find(function(x){return (x.email||'').toLowerCase()===em;});
  if(d&&d.country)return d.country;
  return 'SN';
}

var PINNED=(function(){try{return JSON.parse(localStorage.getItem('sentew_pins')||'{}');}catch(e){return{};}})();

function sortPinned(table,rows){

  });
}

/* â•â•â•â•â•â•â•â•â•â• GLISSER GAUCHE/DROITE (swipe actions) â•â•â•â•â•â•â•â•â•â• */
function closeSwipes(except){
  document.querySelectorAll('.swiperow.open').forEach(function(r){
    if(r===except)return;
    r.classList.remove('open');
    var c=r.querySelector('.swipe-content');if(c)c.style.transform='';
  });
}
function swipeWrap(table,id,innerHtml,rightActs,pinned){
  var bg=(rightActs||[]).map(function(a){return '<button class="swipe-act '+a.cls+'" onclick="'+a.fn.replace(/"/g,'&quot;')+'"><i data-lucide="'+a.ico+'"></i><span>'+a.lbl+'</span></button>';}).join('');
  return '<div class="swiperow'+(pinned?' pinned':'')+'" data-t="'+table+'" data-id="'+id+'"><div class="swipe-bg right">'+bg+'</div><div class="swipe-content">'+innerHtml+'</div></div>';
}
function initSwipes(root){
  if(!root)return;
  root.querySelectorAll('.swiperow').forEach(function(row){
    if(row.dataset.swInit)return;row.dataset.swInit='1';
    var content=row.querySelector('.swipe-content');
    var bgRight=row.querySelector('.swipe-bg.right');
    var maxR=bgRight?bgRight.children.length*76:0;
    var sx=0,dx=0,dragging=false,open=false;
    function down(e){if(e.target.closest('.chk'))return;dragging=true;sx=(e.touches?e.touches[0].clientX:e.clientX);closeSwipes(row);row.classList.add('dragging');}
    function move(e){
      if(!dragging||!maxR)return;
      var x=(e.touches?e.touches[0].clientX:e.clientX)-sx;
      dx=Math.max(-maxR,Math.min(0,(open?-maxR:0)+x));
      content.style.transform='translateX('+dx+'px)';
    }
    function up(){
      if(!dragging)return;dragging=false;row.classList.remove('dragging');
      if(dx<-maxR*0.35){content.style.transform='translateX(-'+maxR+'px)';open=true;row.classList.add('open');}
      else{content.style.transform='translateX(0px)';open=false;row.classList.remove('open');}
      dx=0;
    }
    content.addEventListener('touchstart',down,{passive:true});
    content.addEventListener('touchmove',move,{passive:true});
    content.addEventListener('touchend',up);
    content.addEventListener('mousedown',down);
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
  });
}

async function openDetail(table,id){
  var x=(table==='vendors'?DATA.vendors:DATA.drivers).find(function(r){return String(r.id)===String(id);});
  if(!x)return;
  var role=table==='vendors'?'Vendeur':'Livreur';
  var ci=countryInfo(x.country||'SN');
  var h='<button class="close" onclick="closeModal()">✕</button><h3>'+esc(x.shop_name||x.full_name||role)+'</h3><div class="meta">'+role+' · <span class="pill '+esc(x.status||'')+'">'+esc(x.status||'')+'</span> · '+ci.flag+' '+esc(ci.name)+'</div><div style="margin-top:10px">';
  var keys=Object.keys(x);
  for(var i=0;i<keys.length;i++){
    var k=keys[i],val=x[k];
    if(val===null||val===''||k==='password_hash')continue;
    if(/_at$/.test(k))val=fmtDate(val);

    h+='<div class="drow"><b>'+esc(k)+'</b><span>'+esc(val)+'</span></div>';
  }
  h+='</div><div class="sect"><i data-lucide="globe"></i>Pays / Langue / Devise</div>';
  h+='<div class="card2" style="margin-bottom:10px"><label class="lb">Pays du compte (détermine langue + devise des notifications et bulletins)</label><select class="sin" id="ctrySel_'+x.id+'">'+countryOptions(x.country||'SN')+'</select><button class="abtn ok" style="margin-top:8px" onclick="saveCountry(\''+table+'\',\''+x.id+'\')"><i data-lucide="save"></i>Enregistrer le pays</button></div>';
  h+='<div class="sect"><i data-lucide="file-check"></i>Documents d\u2019identité</div><div id="kycZone"><div class="loading">Recherche…</div></div>';
  h+='<div class="actions" style="margin-top:14px">'+actionBtns(table,x)+'</div>';
  $('sheet').innerHTML=h;$('modal').classList.add('on');lucide.createIcons();
  var docs=await api('kyc_documents','?select=*&order=created_at.desc&limit=100');
  docs=docs.filter(function(dc){return x.email&&(dc.user_email===x.email||dc.email===x.email||dc.vendor_email===x.email||dc.driver_email===x.email);});
  var z=$('kycZone');if(!z)return;
  if(!docs.length){z.innerHTML='<div class="empty">Aucun document enregistré pour ce compte.</div>';return;}

}

async function notify(email,title,message){if(!email)return;try{await api('notifications','',{method:'POST',body:JSON.stringify({audience:'user',user_email:email,type:'account',title:title,message:message})});}catch(e){}}
async function setStatus(table,id,status,email,role,country){
  await api(table,'?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:status})});
  if(status!=='pending'){
    var lang=countryLang(country||findCountryByEmail(email));
    var roleKey=(role==='vendeur'||role==='vendor')?'vendeur':'livreur';
    var roleWord=tt(roleKey,lang);
    var msgKey=status==='active'?'statusActive':(status==='suspended'?'statusSuspended':(status==='rejected'?'statusRejected':null));
    var msg=msgKey?tt(msgKey,lang,{role:roleWord}):tt(roleKey,lang);
    await notify(email,tt('notifTitle',lang),msg);
  }
  toast('Statut mis à jour ✅');closeModal();await loadAll();
  if(table==='vendors'&&!$('vendeurs').classList.contains('hidden'))renderVendors();
  if(table==='drivers'&&!$('livreurs').classList.contains('hidden'))renderDrivers();
}

function selAll(){
  var f=CUR==='vendeurs'?FILT.vendeurs:FILT.livreurs;

async function bulkSet(status){
  if(!SEL.list.length)return;
  if(!confirm(SEL.list.length+' compte(s) → '+status+' ?'))return;
  var table=SEL.table,role=table==='vendors'?'vendeur':'livreur',src=table==='vendors'?DATA.vendors:DATA.drivers;
  for(var i=0;i<SEL.list.length;i++){
    var id=SEL.list[i];
    await api(table,'?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:status})});
    var x=src.find(function(r){return String(r.id)===String(id);});
    if(x&&x.email){
      var lang=countryLang(x.country||findCountryByEmail(x.email));
      var roleWord=tt(role,lang);
      var msgKey=status==='active'?'statusActive':(status==='suspended'?'statusSuspended':(status==='rejected'?'statusRejected':null));
      var msg=msgKey?tt(msgKey,lang,{role:roleWord}):tt(role,lang);
      await notify(x.email,tt('notifTitle',lang),msg);
    }
  }
  toast(SEL.list.length+' compte(s) mis à jour ✅');selClear();await loadAll();
  if(CUR==='vendeurs')renderVendors();else renderDrivers();
}

function exportCompta(){
  var rows=[['date','type','libelle','montant_F']];
  DATA.orders.filter(function(x){return x.status==='delivered';}).forEach(function(o){rows.push([String(o.created_at||'').slice(0,10),'commission','Commande #'+String(o.id).slice(0,8),Math.round((o.total||0)*COMMISSION/100)]);});
  DATA.expenses.forEach(function(x){rows.push([x.expense_date,'depense-'+x.category,x.label,-(x.amount||0)]);});
  DATA.invoices.forEach(function(x){rows.push([x.invoice_date,'facture-'+(x.type==='sale'?'vente':'depense'),x.number+' '+x.label,(x.type==='sale'?1:-1)*(x.amount||0)]);});

function gsMatch(x,q){
  if(x==null)return false;
  if(typeof x==='object'){var k;for(k in x){if(gsMatch(x[k],q))return true;}return false;}
  return String(x).toLowerCase().indexOf(q)>-1;
}
function gsCollect(q){
  var res=[];
  function add(coll,type,ico,nameFn,subFn,kind){
    (coll||[]).forEach(function(x){
      if(gsMatch(x,q))res.push({type:type,ico:ico,name:nameFn(x),sub:subFn(x),obj:x,kind:kind});
    });
  }
  add(DATA.vendors,'Vendeur','store',function(x){return x.shop_name||x.full_name||x.email||x.id;},function(x){return (x.email||'')+' \u00b7 '+(x.phone||'')+' \u00b7 '+(x.status||'');},'vendor');

  add(DATA.orders,'Commande','package',function(x){return x.id;},function(x){return gsN(x.total)+' F \u00b7 '+(x.status||'')+' \u00b7 '+(x.created_at||'').slice(0,10);},'order');
  add(DATA.expenses,'D\u00e9pense','receipt',function(x){return x.label||x.id;},function(x){return gsN(x.amount)+' F \u00b7 '+(x.category||'');},'expense');
  add(DATA.invoices,'Facture','file-text',function(x){return x.number||x.label||x.id;},function(x){return (x.supplier||'')+' \u00b7 '+gsN(x.amount)+' F \u00b7 '+(x.status||'');},'invoice');

  if(!res.length){box.innerHTML='<div class="gsempty">Aucun dossier trouv\u00e9 pour \u00ab '+esc(GSQ)+' \u00bb</div>';return;}
  var h='<div class="gsempty" style="padding:10px">'+res.length+' r\u00e9sultat(s) — touchez pour ouvrir le dossier complet</div>';
  res.slice(0,100).forEach(function(r,i){
    h+='<div class="gscard" onclick="gsOpen('+i+')"><div class="gico"><i data-lucide="'+r.ico+'"></i></div><div><div class="gt">'+r.type+'</div><div class="gn">'+esc(String(r.name))+'</div><div class="gs">'+esc(String(r.sub))+'</div></div></div>';
  });

}
function gsKV(label,val){if(val==null||val==='')return '';return '<div class="kv"><span>'+esc(label)+'</span><b>'+esc(String(val))+'</b></div>';}
function gsOpen(i){
  var r=window.__gsRes[i];if(!r)return;
  var o=r.obj,box=$('gsResults');
  var h='<button class="btn-outline gsback" onclick="gsRender()">\u2190 Retour aux r\u00e9sultats</button>';
  h+='<div class="gsd"><h4>'+r.type+' — Dossier complet</h4>';
  var k;for(k in o){if(o[k]!=null&&typeof o[k]!=='object')h+=gsKV(k,o[k]);}
  h+='</div>';
  /* tout ce que la personne a fait : liens crois\u00e9s email/t\u00e9l/id */
  var keys=[o.email,o.phone,o.id,o.full_name,o.shop_name,o.employee_name].filter(Boolean);
  function cross(coll,type,ico){
    var hits=(coll||[]).filter(function(x){
      return keys.some(function(key){return gsMatch(x,String(key).toLowerCase());}) && x!==o;
    });
    if(!hits.length)return '';

      s+='<div class="kv"><span>'+esc(String(lbl))+'</span><b>'+esc(String(extra))+'</b></div>';
    });
    return s+'</div>';
  }
  h+=cross(DATA.orders,'Commandes','package');
  h+=cross(DATA.payouts,'Reversements','banknote');
  h+=cross(DATA.invoices,'Factures','file-text');
  h+=cross(DATA.expenses,'D\u00e9penses','receipt');

}

function qrDataUrl(text){
  return new Promise(function(res){
    try{
      var d=document.createElement('div');d.style.display='none';document.body.appendChild(d);
      new QRCode(d,{text:text,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
      setTimeout(function(){
        var cv=d.querySelector('canvas');var img=d.querySelector('img');
        var out=null;if(cv)out=cv.toDataURL('image/png');else if(img)out=img.src;
        document.body.removeChild(d);res(out);
      },350);
    }catch(e){res(null);}
  });
}

  setCur('photosia');
  var el=$('photosia');
  var month = new Date().toISOString().slice(0,7);

  /* --- Bloc quotas par vendeur --- */
  var byVendor = {};
  DATA.aiUsage.filter(function(u){return u.month===month;}).forEach(function(u){ byVendor[u.vendor_id] = u.count||0; });
  var vendorRows = DATA.vendors.map(function(v){
    var plan = v.plan || 'gratuit';
    var quota = AI_PLAN_QUOTAS[plan]!==undefined ? AI_PLAN_QUOTAS[plan] : 0;
    var used = byVendor[v.id] || 0;
    var pct = quota>0 ? Math.min(100, Math.round(used*100/quota)) : (quota===-1?0:100);
    var barColor = quota===0 ? '#c0392b' : (pct>85 ? '#b07a1f' : '#0f6b4e');
    return '<div class="card2"><div class="row"><div style="flex:1"><div class="nm">'+esc(v.shop_name||v.full_name||'Vendeur')+'</div>'+
      '<div class="meta">Plan '+esc(plan)+' · '+(quota===-1?(used+' photos utilisées (illimité)'):(used+' / '+quota+' photos ce mois'))+'</div>'+
      (quota>0?'<div style="height:6px;background:#f0f3f2;border-radius:4px;margin-top:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+barColor+'"></div></div>':'')+
      '</div><span class="pill '+(quota===0?'rejected':(pct>85?'pending':'active'))+'">'+(quota===0?'IA verrouillée':(quota===-1?'Illimité':pct+'%'))+'</span></div></div>';
  }).join('') || '<div class="empty">Aucun vendeur.</div>';

  /* --- Galerie comparative avant/après --- */
  var galleryRows = DATA.photosIA.map(function(p){
    var v = DATA.vendors.find(function(x){return String(x.id)===String(p.vendor_id);});
    return '<div class="card2"><div class="meta" style="margin-bottom:8px"><b>'+esc(p.product_name||'Produit')+'</b> · '+esc((v&&(v.shop_name||v.full_name))||'Vendeur inconnu')+' · '+fmtDate(p.created_at)+'</div>'+
      '<div style="display:flex;gap:8px">'+
        '<div style="flex:1;text-align:center"><img src="'+esc(p.before_url||'')+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid #e5e7eb" loading="lazy"><div style="font-size:9.5px;color:#9db8af;margin-top:3px;font-weight:800">AVANT</div></div>'+
        '<div style="flex:1;text-align:center"><img src="'+esc(p.after_url||'')+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid #8b5cf6" loading="lazy"><div style="font-size:9.5px;color:#8b5cf6;margin-top:3px;font-weight:800">APRÈS (IA)</div></div>'+
      '</div></div>';
  }).join('') || '<div class="empty">Aucune transformation photo IA pour le moment.</div>';

  el.innerHTML =
    '<div class="sect"><i data-lucide="gauge"></i>Quotas Photo IA par vendeur ('+new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+')</div>'+
    vendorRows+
    '<div class="sect"><i data-lucide="images"></i>Galerie comparative Avant / Après ('+DATA.photosIA.length+')</div>'+
    galleryRows;
  lucide.createIcons();
}


/* ══════════════════ PAYS — configuration des taux de paie panafricains ══════════════════ */
async function ensurePayroll(){
  if(!window.PAYROLL || !PAYROLL.ready){ try{ await payrollInit(); }catch(e){} }
}

function renderPays(){
  setCur('pays');
  var el=$('pays');
  ensurePayroll().then(function(){
    var codes = Object.keys(PAYROLL.configs);
    var rows = codes.map(function(code){
      var c = PAYROLL.configs[code];
      var badge = c.fiable ? '<span class="pill active">Taux vérifiés</span>' : '<span class="pill pending">⚠️ À valider localement</span>';
      return '<div class="card2"><div class="row"><div style="flex:1"><div class="nm">'+esc(c.name)+' <span style="font-weight:400;color:#9db8af;font-size:11px">('+esc(c.currency)+')</span></div>'+
        '<div class="meta">'+esc(c.pension_name)+' '+c.pension_employee+'%/'+c.pension_employer+'% · '+esc(c.family_name)+' '+c.family_employer+'% · IR '+(c.ir_brackets.length)+' tranches</div></div>'+badge+'</div>'+
        '<div class="actions"><button class="abtn blue" onclick="openPaysEdit(\''+code+'\')"><i data-lucide="pencil"></i>Modifier les taux</button></div></div>';
    }).join('');
    el.innerHTML = '<div class="sect"><i data-lucide="globe"></i>Configuration des cotisations sociales par pays</div>'+
      '<div class="card2" style="background:#fffbeb;border:1.5px solid #fde68a"><div style="font-size:12px;color:#92400e;line-height:1.6">ℹ️ SEN TEW est panafricain : chaque pays a ses propres taux de retraite, prestations familiales et barème d\'impôt. Le Sénégal est vérifié avec des sources officielles. Les autres pays sont pré-remplis avec des estimations — <b>fais-les valider par un comptable local</b> avant de générer des bulletins officiels dans ce pays.</div></div>'+
      rows;
    lucide.createIcons();
  });
}

function openPaysEdit(code){
  var c = PAYROLL.configs[code];
  var otherLines = (c.other_employer||[]).map(function(o,i){
    return o.name+' : '+(o.flat!=null?('forfait '+o.flat+' F'):(o.rate+'%'));
  }).join(' | ') || 'aucune';
  var h='<button class="close" onclick="closeModal()">✕</button><h3>'+esc(c.name)+'</h3><div class="meta">Devise : '+esc(c.currency)+'</div>'+
   '<div style="margin-top:14px">'+
   '<label class="lb">Nom du régime retraite</label><input class="sin" id="pcPensionName" value="'+esc(c.pension_name)+'">'+
   '<div style="display:flex;gap:8px"><div style="flex:1"><label class="lb">Taux salarié (%)</label><input class="sin" id="pcPensionEmp" type="number" step="0.1" value="'+c.pension_employee+'"></div><div style="flex:1"><label class="lb">Taux employeur (%)</label><input class="sin" id="pcPensionPatr" type="number" step="0.1" value="'+c.pension_employer+'"></div></div>'+
   '<label class="lb">Plafond mensuel cotisable (0 = pas de plafond)</label><input class="sin" id="pcPensionCeil" type="number" value="'+(c.pension_ceiling||0)+'">'+
   '<label class="lb">Nom prestations familiales</label><input class="sin" id="pcFamilyName" value="'+esc(c.family_name)+'">'+
   '<label class="lb">Taux employeur prestations familiales (%)</label><input class="sin" id="pcFamilyPatr" type="number" step="0.1" value="'+c.family_employer+'">'+
   '<label class="lb">Nom accident du travail</label><input class="sin" id="pcAtmpName" value="'+esc(c.at_mp_name)+'">'+
   '<label class="lb">Taux employeur accident du travail (%)</label><input class="sin" id="pcAtmpPatr" type="number" step="0.1" value="'+c.at_mp_employer+'">'+
   '<label class="lb">Autres charges patronales (actuel : '+esc(otherLines)+')</label>'+
   '<div class="meta" style="margin-bottom:8px">Format libre non éditable ici pour l\'instant — contacte le support pour ajouter une ligne personnalisée (ex. CFCE, CMU forfait).</div>'+
   '<label class="lb">TRIMF / taxe fixe additionnelle activée ?</label><select class="sin" id="pcTrimf"><option value="1"'+(c.trimf?' selected':'')+'>Oui</option><option value="0"'+(!c.trimf?' selected':'')+'>Non</option></select>'+
   '<label class="lb">Barème IR (JSON [[min,max,taux%],...], max=null pour infini)</label><textarea class="sin" id="pcIR" style="min-height:70px">'+esc(JSON.stringify(c.ir_brackets))+'</textarea>'+
   '<label class="lb">Notes / source</label><textarea class="sin" id="pcNotes" style="min-height:50px">'+esc(c.notes||'')+'</textarea>'+
   '<button class="bigbtn" onclick="savePaysEdit(\''+code+'\')">💾 Enregistrer ce pays</button>'+
   '</div>';
  $('sheet').innerHTML=h;$('modal').classList.add('on');
  lucide.createIcons();
}

async function savePaysEdit(code){
  var c = PAYROLL.configs[code];
  try{
    c.pension_name = $('pcPensionName').value.trim();
    c.pension_employee = parseFloat($('pcPensionEmp').value)||0;
    c.pension_employer = parseFloat($('pcPensionPatr').value)||0;
    c.pension_ceiling = parseFloat($('pcPensionCeil').value)||0;
    c.family_name = $('pcFamilyName').value.trim();
    c.family_employer = parseFloat($('pcFamilyPatr').value)||0;
    c.at_mp_name = $('pcAtmpName').value.trim();
    c.at_mp_employer = parseFloat($('pcAtmpPatr').value)||0;
    c.trimf = $('pcTrimf').value==='1';
    c.ir_brackets = JSON.parse($('pcIR').value);
    c.notes = $('pcNotes').value.trim();
  }catch(e){ toast('⚠️ Format du barème IR invalide (vérifie le JSON).'); return; }
  var ok = await payrollSaveConfig(code, c);
  toast(ok?'Taux '+c.name+' enregistrés ✅':'⚠️ Sauvegarde locale seulement (table payroll_configs absente sur Supabase)');
  closeModal();
  renderPays();
}

lucide.createIcons();
loadAll().catch(function(e){__diag('loadAll: '+((e&&e.message)||e),false);}).then(function(){renderFiscal();var t='pano';try{t=sessionStorage.getItem('st_admin_tab')||'pano';}catch(e){}if(t&&t!=='pano'&&$(t)){var btn=null;document.querySelectorAll('.tab').forEach(function(b){var oc=b.getAttribute('onclick')||'';if(oc.indexOf("'"+t+"'")>-1)btn=b;});showTab(t,btn);}else{renderPano();}});
silentRefresh();
setInterval(silentRefresh,30000);
</script>
