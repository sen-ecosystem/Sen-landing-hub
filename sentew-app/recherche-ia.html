<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recherche IA - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:900;color:#0A4D38;">🔍 Recherche IA</div>
  </header>
  <main class="app-content" style="padding:16px;">
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input type="text" id="txtSearch" placeholder="Rechercher..." style="flex:1;padding:12px;border:1px solid #E5E7EB;border-radius:12px;">
      <button onclick="voiceSearch()" style="width:44px;background:#0F6B4E;color:#fff;border:none;border-radius:12px;">🎤</button>
    </div>
    <div style="background:#fff;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;">
      <div style="font-size:48px;">📷</div>
      <h3 style="color:#0A4D38;">Recherche par image</h3>
      <p style="font-size:13px;color:#6B7280;">Prenez ou choisissez une photo pour trouver des produits similaires</p>
      <input type="file" id="imgInput" accept="image/*" capture="environment" style="display:none;" onchange="searchByImage(event)">
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button onclick="document.getElementById('imgInput').click()" style="flex:1;padding:14px;background:#0F6B4E;color:#fff;border:none;border-radius:12px;font-weight:700;">📷 Photo</button>
        <button onclick="document.getElementById('imgInput').click()" style="flex:1;padding:14px;background:#D4A574;color:#fff;border:none;border-radius:12px;font-weight:700;">🖼 Galerie</button>
      </div>
    </div>
    <div id="results"></div>
  </main>
  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>
<script src="js/data.js"></script>
<script>
function searchByImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    document.getElementById('results').innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;">
        <img src="${evt.target.result}" style="width:100%;max-height:200px;object-fit:contain;border-radius:12px;">
        <div style="text-align:center;padding:20px;"><div style="font-size:32px;">⏳</div>Analyse IA en cours...</div>
      </div>`;
    setTimeout(() => {
      const list = (typeof products !== 'undefined' ? products : []).slice(0,6);
      document.getElementById('results').innerHTML = `
        <h3 style="color:#0A4D38;">✨ Produits similaires trouvés</h3>
        <div class="grid">
          ${list.map(p=>`
            <a href="produit.html?id=${p.id}" class="product-card">
              <div class="card-image-wrap"><img src="${p.image}" alt=""></div>
              <div class="card-info">
                <div class="card-name">${p.name}</div>
                <div class="card-price">${Number(p.price).toLocaleString()} FCFA</div>
                <div style="font-size:10px;color:#0F6B4E;font-weight:700;margin-top:4px;">🎯 ${85+Math.floor(Math.random()*15)}% similaire</div>
              </div>
            </a>`).join('')}
        </div>`;
    }, 1500);
  };
  reader.readAsDataURL(file);
}

function voiceSearch() {
  if (!('webkitSpeechRecognition' in window)) { alert('Recherche vocale non supportée'); return; }
  const rec = new webkitSpeechRecognition();
  rec.lang = 'fr-FR';
  rec.onresult = e => document.getElementById('txtSearch').value = e.results[0][0].transcript;
  rec.start();
}
</script>
</body>
</html>
