<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Administration - SEN TEW</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#0a1f17;font-family:'Segoe UI',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:22px;padding:30px 24px;width:100%;max-width:380px;color:#0a1f17;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.badge{width:64px;height:64px;border-radius:18px;background:#0f6b4e;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:30px}
h1{font-size:21px;font-weight:900;color:#0f6b4e;text-align:center}
p.sub{font-size:12px;color:#6b7280;text-align:center;margin:5px 0 20px}
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:800;color:#374151;display:block;margin-bottom:6px}
.inp{display:flex;align-items:center;gap:8px;border:1.5px solid #e5e7eb;border-radius:12px;padding:0 12px;background:#f9fafb}
.inp:focus-within{border-color:#0f6b4e;background:#fff}
.inp .ico{font-size:15px}
.inp input{flex:1;border:none;background:transparent;padding:14px 0;font-size:15px;outline:none}
.eye{background:none;border:none;cursor:pointer;font-size:16px;padding:4px}
.btn{width:100%;padding:16px;border-radius:13px;border:none;background:#0f6b4e;color:#fff;font-size:15px;font-weight:900;cursor:pointer;margin-top:6px}
.btn:disabled{opacity:.6}
.err{display:none;background:#fee2e2;border:1px solid #fecaca;color:#b91c1c;font-size:12.5px;font-weight:700;border-radius:11px;padding:12px;margin-bottom:14px;line-height:1.5}
.err.show{display:block}
.tip{display:flex;gap:8px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px;margin-top:16px;font-size:11.5px;color:#92400e;cursor:pointer;line-height:1.55}
.back{display:block;text-align:center;margin-top:15px;font-size:12px;color:#6b7280;text-decoration:none}
.note{text-align:center;font-size:10px;color:#9aa5a0;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="badge">🛡️</div>
  <h1>SEN TEW Admin</h1>
  <p class="sub">Accès réservé à l'équipe dirigeante</p>

  <div class="err" id="errBox"></div>

  <div class="field">
    <label>Email administrateur</label>
    <div class="inp"><span class="ico">✉️</span>
      <input type="email" id="email" placeholder="admin@sen-tew.com" autocapitalize="none" autocorrect="off" spellcheck="false">
    </div>
  </div>

  <div class="field">
    <label>Mot de passe</label>
    <div class="inp"><span class="ico">🔒</span>
      <input type="password" id="pwd" placeholder="Ton mot de passe" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button class="eye" id="eyeBtn" type="button">👁️</button>
    </div>
  </div>

  <button class="btn" id="loginBtn">Se connecter →</button>

  <div class="tip" id="tipBtn">
    <span>ⓘ</span>
    <span>Astuce sécurité : après 5 erreurs, pause de 15 min sur cet appareil. La session dure 2 heures. Ne partage jamais ces identifiants. <b>Clique pour en savoir plus.</b></span>
  </div>

  <a class="back" href="index.html">← Retour à l'application</a>
  <div class="note">🔐 Connexion chiffrée SHA-256 · SEN TEW SUARL</div>
</div>

<script>
/* ============================================================
   IDENTIFIANTS ADMIN — cryptés, jamais en clair
   Email : admin@sen-tew.com
   Le mot de passe est stocké sous forme d'empreinte SHA-256.
   ============================================================ */
var ADMIN_EMAIL = 'admin@sen-tew.com';
var ADMIN_HASH  = '9a527facc1252fe5fa723d0c8b83438b9968b0b8aaf4d27aecec0b63e3100f99';

/* ---- SHA-256 pur JavaScript (marche sur tous les téléphones) ---- */
function sha256(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  var maxWord=Math.pow(2,32),result='';
  var words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[];
  var primeCounter=k.length,isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate){isComposite[i]=candidate}
      hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(var i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(var j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(var i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(var i=0;i<8;i++){hash[i]=(hash[i]+oldHash[i])|0}
  }
  for(var i=0;i<8;i++){
    for(var j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?'0':'')+b.toString(16);
    }
  }
  return result;
}

/* ---- Anti brute-force (sur l'appareil) ---- */
var SEC_KEY='st_admin_lock';
function getSec(){try{return JSON.parse(localStorage.getItem(SEC_KEY))||{fails:0,until:0}}catch(e){return{fails:0,until:0}}}
function setSec(s){localStorage.setItem(SEC_KEY,JSON.stringify(s))}
function showErr(m){var b=document.getElementById('errBox');b.textContent='⚠️ '+m;b.classList.add('show')}

/* ---- Œil : voir/cacher le mot de passe ---- */
document.getElementById('eyeBtn').onclick=function(){
  var p=document.getElementById('pwd');
  p.type=p.type==='password'?'text':'password';
  this.textContent=p.type==='password'?'👁️':'🙈';
};

/* ---- Astuce cliquable ---- */
document.getElementById('tipBtn').onclick=function(){
  alert('🛡️ Sécurité SEN TEW Admin\n\n• Mot de passe jamais visible, même dans le code (empreinte cryptée)\n• 5 essais maximum puis pause de 15 minutes\n• La session se ferme toute seule après 2 heures\n• Pour changer le mot de passe : demande à ton assistant, une seule ligne à modifier');
};

/* ---- CONNEXION ---- */
document.getElementById('loginBtn').onclick=function(){
  var btn=this;
  var sec=getSec();
  if(sec.until&&Date.now()<sec.until){
    showErr('Pause sécurité : réessaie dans '+Math.ceil((sec.until-Date.now())/60000)+' min (ou ouvre en navigation privée).');
    return;
  }
  var email=document.getElementById('email').value.trim().toLowerCase();
  var pwd=document.getElementById('pwd').value;
  if(!email||!pwd){showErr('Remplis les deux champs.');return;}

  btn.disabled=true;btn.textContent='Vérification…';

  /* Vérification locale, instantanée, sans serveur */
  setTimeout(function(){
    if(email===ADMIN_EMAIL && sha256(pwd)===ADMIN_HASH){
      setSec({fails:0,until:0});
      sessionStorage.setItem('st_admin_session',JSON.stringify({
        email:email,name:'Administrateur SEN TEW',role:'superadmin',
        exp:Date.now()+2*60*60*1000
      }));
      window.location.href='admin.html';
    }else{
      sec.fails=(sec.fails||0)+1;
      if(sec.fails>=5){
        setSec({fails:0,until:Date.now()+15*60*1000});
        showErr('Trop de tentatives. Pause de 15 minutes (ou navigation privée).');
      }else{
        setSec(sec);
        showErr('Identifiants incorrects. '+(5-sec.fails)+' essai(s) restant(s).');
      }
      btn.disabled=false;btn.textContent='Se connecter →';
    }
  },300);
};

/* Déjà connecté → direct vers le tableau de bord */
(function(){
  try{
    var s=JSON.parse(sessionStorage.getItem('st_admin_session'));
    if(s&&s.exp>Date.now())window.location.href='admin.html';
  }catch(e){}
})();
</script>
</body>
</html>
