<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Produit - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/app.css">
</head>
<body oncontextmenu="return false">
<div class="app">
<header class="app-header">
  <button class="header-btn" onclick="history.back()">←</button>
  <div style="flex:1;text-align:center;font-weight:800;color:var(--text);font-size:16px;">Produit</div>
  <button class="header-btn" onclick="alert('❤️ Ajouté aux favoris')">🤍</button>
</header>
<main class="app-content" id="content">
  <p style="text-align:center;color:var(--gold-dark);padding:40px;">Chargement...</p>
</main>
<nav class="app-nav">
  <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
  <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
  <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
  <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
  <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
</nav>
</div>
<script src="js/data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const pid = parseInt(params.get('id')) || 1;
const product = (typeof products !== 'undefined' ? products : []).find(p => p.id === pid) || products[0];
const seller = (typeof sellers !== 'undefined' ? sellers : []).find(s => s.id === product.sellerId) || {name:product.seller,avatar:product.sellerAvatar,live:product.sellerLive,rating:4.8,reviews:127,followers:'2.4K',verified:true};

let html = '';
html += '<div style="width:100%;height:340px;overflow:hidden;position:relative;background:#f5f5f5;">';
if (seller.live) html += '<a href="live.html?seller='+seller.id+'" style="position:absolute;top:16px;left:16px;background:#ef4444;color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;text-decoration:none;z-index:2;animation:livePulse 2s infinite;">🔴 EN DIRECT</a>';
html += '<img src="'+product.image+'" style="width:100%;height:100%;object-fit:cover;pointer-events:auto;"></div>';

html += '<div style="padding:16px;">';
html += '<h1 style="font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px;">'+product.name+'</h1>';
html += '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px;">';
html += '<span style="font-size:28px;font-weight:900;color:var(--gold-dark);">'+product.price.toLocaleString()+' FCFA</span>';
if (product.oldPrice) html += '<span style="font-size:14px;color:var(--text-soft);text-decoration:line-through;">'+product.oldPrice.toLocaleString()+' FCFA</span>';
if (product.discount) html += '<span style="background:#ef4444;color:#fff;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:800;">-'+product.discount+'%</span>';
html += '</div>';
html += '<div style="color:var(--gold-dark);font-size:13px;font-weight:700;">⭐ '+product.rating+' ('+product.reviews+' avis)</div>';
html += '</div>';

// Carte vendeur
html += '<a href="boutique.html?id='+seller.id+'" style="background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px;margin:0 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);">';
html += '<div style="position:relative;">';
if (seller.live) html += '<div style="position:absolute;inset:-4px;border:2px solid #ef4444;border-radius:50%;animation:livePulse 2s infinite;pointer-events:none;"></div>';
html += '<img src="'+seller.avatar+'" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);pointer-events:auto;">';
if (seller.live) html += '<div style="position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;font-size:8px;font-weight:900;padding:1px 6px;border-radius:6px;">LIVE</div>';
html += '</div>';
html += '<div style="flex:1;"><div style="font-weight:700;font-size:14px;">'+seller.name+' <span style="color:var(--emerald);">✓</span></div><div style="font-size:12px;color:var(--text-soft);margin-top:2px;">⭐ '+seller.rating+' · '+seller.reviews+' avis · '+seller.followers+' abonnés</div></div>';
html += '<div style="color:var(--gold-dark);font-size:20px;">›</div>';
html += '</a>';

// Description
html += '<div style="background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin:16px;box-shadow:var(--shadow);font-size:13px;line-height:1.6;color:var(--text);">'+product.description+'</div>';

// Actions
html += '<div style="display:flex;gap:8px;padding:12px 16px;background:var(--white);border-top:1px solid var(--border);position:sticky;bottom:0;">';
html += '<button class="btn btn-outline" style="flex:1;" onclick="alert(\'✅ Ajouté au panier\');setTimeout(()=>window.location.href=\'panier.html\',600);">🛒 Panier</button>';
html += '<button class="btn btn-gold" style="flex:1;" onclick="window.location.href=\'panier.html\'">Acheter maintenant</button>';
html += '</div>';

document.getElementById('content').innerHTML = html;
</script>
</body>
</html>
