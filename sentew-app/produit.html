<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Produit - SEN TEW</title>
<style>
:root{--v:#00a651;--j:#fcd116;--r:#e31b23;--o:#b8863a}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#f5f5f5;color:#222;padding-bottom:130px}
.header{background:#fff;padding:12px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.back,.share,.fav{background:#f5f5f5;border:none;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
.header h1{flex:1;font-size:14px;font-weight:600;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gallery{position:relative;background:#fff}
.gallery img{width:100%;height:340px;object-fit:cover;display:block}
.gallery-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.dot.active{background:#fff}
.live-badge{position:absolute;top:12px;left:12px;background:#e31b23;color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.info{background:#fff;padding:16px;margin-bottom:8px}
.price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{color:var(--o);font-size:28px;font-weight:900}
.old-price{color:#999;text-decoration:line-through;font-size:15px}
.discount{background:var(--r);color:#fff;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700}
.currencies{color:#999;font-size:12px;margin-top:4px}
.title{font-size:17px;font-weight:600;color:#222;margin:8px 0;line-height:1.4}
.rating{display:flex;align-items:center;gap:6px;font-size:13px;color:#666}
.rating .stars{color:#fcd116}
.stock-info{margin-top:8px;padding:8px 12px;background:#e8f5ee;border-left:3px solid var(--v);border-radius:6px;font-size:12px;color:#00753d;font-weight:600}

.section{background:#fff;padding:14px 16px;margin-bottom:8px}
.section-title{font-size:14px;font-weight:700;color:#222;margin-bottom:10px}

.variants{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.var-chip{padding:8px 14px;background:#f5f5f5;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#222}
.var-chip.active{background:var(--v);color:#fff;border-color:var(--v)}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px #ddd}
.color-dot.active{box-shadow:0 0 0 3px var(--v)}

.seller-card{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;cursor:pointer}
.seller-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--v),#008a44);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.seller-info{flex:1}
.seller-info h4{font-size:14px;font-weight:700;color:#222;display:flex;align-items:center;gap:4px}
.seller-info .tick{background:#1da1f2;color:#fff;width:14px;height:14px;border-radius:50%;font-size:9px;display:inline-flex;align-items:center;justify-content:center}
.seller-info p{font-size:12px;color:#666;margin-top:2px}
.seller-visit{color:var(--v);font-weight:700;font-size:13px}

.desc-text{font-size:13px;color:#333;line-height:1.6}

.similar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sim-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.sim-card img{width:100%;height:120px;object-fit:cover}
.sim-body{padding:8px}
.sim-body h5{font-size:12px;font-weight:600;color:#222;line-height:1.3;height:32px;overflow:hidden}
.sim-price{color:var(--o);font-weight:800;font-size:13px;margin-top:4px}

.reviews-summary{background:linear-gradient(135deg,#fff9e6,#fff);padding:12px;border-radius:10px;margin-bottom:10px;text-align:center}
.reviews-summary .big{font-size:32px;font-weight:900;color:var(--o)}
.reviews-summary .stars{color:#fcd116;font-size:18px}
.reviews-summary .count{font-size:12px;color:#666;margin-top:4px}

.buy-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));display:flex;gap:8px;box-shadow:0 -2px 12px rgba(0,0,0,.1);z-index:90}
.btn-msg{flex:0 0 52px;height:50px;border-radius:14px;background:#f0f9f4;border:2px solid var(--v);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.btn-cart{flex:1;height:50px;border-radius:14px;background:#fff;border:2px solid var(--v);color:var(--v);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-buy{flex:1.4;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--v),#008a44);color:#fff;border:none;font-weight:700;font-size:16px;cursor:pointer}
</style></head><body>

<header class="header">
  <button class="back" onclick="history.back()">←</button>
  <h1 id="prodTitle">Chargement...</h1>
  <button class="share" onclick="share()">↗</button>
  <button class="fav" onclick="toggleFav(this)">🤍</button>
</header>

<div class="gallery">
  <img id="mainImg" src="" alt="">
  <div class="live-badge" id="liveBadge" style="display:none">🔴 LIVE -30%</div>
  <div class="gallery-dots">
    <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div>
  </div>
</div>

<div class="info">
  <div class="price-row">
    <span class="price" id="prodPrice">—</span>
    <span class="old-price" id="prodOld"></span>
    <span class="discount" id="prodDisc"></span>
  </div>
  <div class="currencies" id="currencies">≈ — EUR · — USD</div>
  <h2 class="title" id="prodName">—</h2>
  <div class="rating">
    <span class="stars">★★★★★</span>
    <span id="rateVal">4.8</span>
    <span>· <span id="reviewCount">124</span> avis · <span id="salesCount">856</span> vendus</span>
  </div>
  <div class="stock-info" id="stockInfo">✅ En stock · Livraison 24h Dakar</div>
</div>

<div class="section">
  <div class="section-title">🏪 Vendu par</div>
  <div class="seller-card">
    <div class="seller-avatar" id="sellerAv">👗</div>
    <div class="seller-info">
      <h4 id="sellerName">— <span class="tick">✓</span></h4>
      <p>⭐ <span id="sellerRate">4.9</span> · <span id="sellerFollowers">856</span> abonnés</p>
    </div>
    <button onclick="toggleFollow(this)" style="background:var(--v);color:#fff;border:none;padding:8px 16px;border-radius:16px;font-weight:700;font-size:12px;cursor:pointer">+ Suivre</button>
  </div>
  
  <!-- Boutons rapides vendeur (SANS voir compte perso) -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px">
    <button onclick="location.href='boutique.html?id='+PROD.shopId+'&tab=products'" style="background:#f0f9f4;border:1px solid var(--v);color:var(--v);padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">
      🛍️ Produits
    </button>
    <button onclick="location.href='boutique.html?id='+PROD.shopId+'&tab=avis'" style="background:#fff9e6;border:1px solid var(--j);color:var(--o);padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">
      ⭐ Avis
    </button>
    <button onclick="location.href='boutique.html?id='+PROD.shopId+'&tab=promo'" style="background:#ffebee;border:1px solid var(--r);color:var(--r);padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">
      🔥 Promo
    </button>
    <button onclick="location.href='boutique.html?id='+PROD.shopId+'&tab=info'" style="background:#e3f2fd;border:1px solid #1976d2;color:#1976d2;padding:8px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">
      ℹ️ Info
    </button>
  </div>
</div>

<script>
// ===== DONNÉES PRODUITS INLINE (Fix bug page vide) =====
const PRODUCTS = {
  '1':{name:'Boubou traditionnel brodé main',price:25000,old:35000,shopId:'1',shop:'Aïcha Fashion',shopIcon:'👗',rate:4.9,followers:856,img:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=600',colors:['Rouge','Bleu','Vert','Jaune','Blanc'],sizes:['M','L','XL','XXL'],desc:'Boubou traditionnel sénégalais brodé main. Tissu bazin premium 100% coton. Broderie artisanale de Dakar. Idéal cérémonies, mariages, fêtes religieuses. Fabriqué avec soin par des artisans locaux.',live:false},
  '2':{name:'Robe wax colorée mariage',price:18500,old:22000,shopId:'1',shop:'Aïcha Fashion',shopIcon:'👗',rate:4.9,followers:856,img:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600',colors:['Rouge','Bleu','Vert','Orange'],sizes:['S','M','L','XL'],desc:'Robe en wax authentique, motifs colorés. Coupe moderne, confortable et élégante. Parfaite pour mariages et cérémonies.',live:true},
  '3':{name:'Sac cuir artisanal',price:15000,shopId:'1',shop:'Aïcha Fashion',shopIcon:'👗',rate:4.9,followers:856,img:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600',colors:['Marron','Noir','Rouge'],sizes:['Unique'],desc:'Sac en cuir véritable, cousu main par les artisans Peul. Fermeture zip, doublure intérieure, 2 poches.',live:false},
  '4':{name:'Sandales cousues main',price:8500,old:12000,shopId:'1',shop:'Aïcha Fashion',shopIcon:'👗',rate:4.9,followers:856,img:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=600',colors:['Marron','Noir','Doré'],sizes:['38','39','40','41','42'],desc:'Sandales en cuir cousues main, semelle confort, pointures 36-45 disponibles.',live:false},
  '5':{name:'iPhone 15 Pro Max 256Go',price:850000,shopId:'2',shop:'Tech Modou',shopIcon:'📱',rate:4.7,followers:650,img:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=600',colors:['Noir','Blanc','Doré','Bleu'],sizes:['256Go','512Go','1To'],desc:'iPhone 15 Pro Max neuf sous emballage. Garantie internationale 1 an. Livré avec câble USB-C et documentation.',live:false},
  '6':{name:'AirPods Pro 2ème génération',price:135000,old:180000,shopId:'2',shop:'Tech Modou',shopIcon:'📱',rate:4.7,followers:650,img:'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=600',colors:['Blanc'],sizes:['Unique'],desc:'AirPods Pro 2 avec réduction active du bruit, USB-C, boîtier MagSafe, autonomie 30h.',live:true}
};

const id = new URLSearchParams(location.search).get('id') || '1';
const PROD = PRODUCTS[id] || PRODUCTS['1'];

document.getElementById('prodTitle').textContent = PROD.name;
document.getElementById('mainImg').src = PROD.img;
document.getElementById('prodName').textContent = PROD.name;
document.getElementById('prodPrice').textContent = PROD.price.toLocaleString() + ' FCFA';
if(PROD.old){
  document.getElementById('prodOld').textContent = PROD.old.toLocaleString() + ' FCFA';
  const pct = Math.round((1-PROD.price/PROD.old)*100);
  document.getElementById('prodDisc').textContent = '-'+pct+'%';
}
const eur = (PROD.price/655.957).toFixed(2);
const usd = (PROD.price/600).toFixed(2);
document.getElementById('currencies').textContent = `≈ ${eur} EUR · ${usd} USD`;
document.getElementById('sellerAv').textContent = PROD.shopIcon;
document.getElementById('sellerName').innerHTML = PROD.shop + ' <span class="tick">✓</span>';
document.getElementById('sellerRate').textContent = PROD.rate;
document.getElementById('sellerFollowers').textContent = PROD.followers;
document.getElementById('prodDesc').textContent = PROD.desc;
if(PROD.live) document.getElementById('liveBadge').style.display = 'block';

// Colors
const cMap = {Rouge:'#e31b23',Bleu:'#1976d2',Vert:'#00a651',Jaune:'#fcd116',Blanc:'#fff',Noir:'#222',Rose:'#e91e63',Orange:'#ff6b35',Violet:'#9c27b0',Marron:'#795548',Gris:'#9e9e9e',Doré:'#b8863a'};
document.getElementById('colorList').innerHTML = PROD.colors.map((c,i) =>
  `<div class="color-dot ${i===0?'active':''}" style="background:${cMap[c]||'#ccc'}" onclick="pickColor(this)" title="${c}"></div>`
).join('');

// Sizes
document.getElementById('sizeList').innerHTML = PROD.sizes.map((s,i) =>
  `<div class="var-chip ${i===0?'active':''}" onclick="pickSize(this)">${s}</div>`
).join('');

// Similar
const similarIds = Object.keys(PRODUCTS).filter(k => k !== id).slice(0,4);
document.getElementById('similar').innerHTML = similarIds.map(k => {
  const p = PRODUCTS[k];
  return `<div class="sim-card" onclick="location.href='produit.html?id=${k}'">
    <img src="${p.img}" alt="${p.name}">
    <div class="sim-body">
      <h5>${p.name}</h5>
      <div class="sim-price">${p.price.toLocaleString()} FCFA</div>
    </div>
  </div>`;
}).join('');

function pickColor(el){document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));el.classList.add('active')}
function pickSize(el){document.querySelectorAll('.var-chip').forEach(d=>d.classList.remove('active'));el.classList.add('active')}
function toggleFav(el){el.textContent = el.textContent==='🤍' ? '❤️' : '🤍'}
function share(){if(navigator.share){navigator.share({title:PROD.name,url:location.href})}else{alert('🔗 Lien copié : '+location.href)}}
function msgSeller(){location.href='messages.html?seller='+PROD.shopId}
function addCart(){alert('✅ '+PROD.name+' ajouté au panier !');location.href='panier.html'}
function buyNow(){location.href='panier.html?buy='+id}
function toggleFollow(btn){
  if(btn.textContent === '+ Suivre'){
    btn.textContent = '✓ Suivi';
    btn.style.background = '#fff';
    btn.style.color = '#00a651';
    btn.style.border = '2px solid #00a651';
    alert('✅ Vous suivez cette boutique. Vous recevrez ses nouveautés.');
  } else {
    btn.textContent = '+ Suivre';
    btn.style.background = '#00a651';
    btn.style.color = '#fff';
    btn.style.border = 'none';
  }
}

</script>
</body></html>
