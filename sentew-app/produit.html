<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Produit - SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
  <button class="btn-back" onclick="history.back()">
    <i data-lucide="arrow-left" class="icon icon-md icon-vert"></i>
  </button>
  <h1 id="productTitle">Produit</h1>
  <button class="icon-btn" onclick="shareProduct()">
    <i data-lucide="share-2" class="icon icon-md icon-vert"></i>
  </button>
</header>

<main id="productMain" style="padding-bottom:100px;">
  <!-- Généré par JS -->
</main>

<!-- BOTTOM BAR ACTIONS -->
<div style="position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;z-index:99;">
  <button class="icon-btn" onclick="toggleFavProduct()" id="favBtn" style="border:1.5px solid var(--rouge);padding:12px;">
    <i data-lucide="heart" class="icon icon-md icon-rouge"></i>
  </button>
  <button class="icon-btn" onclick="location.href='chat.html?vendor='+currentProduct.seller" style="border:1.5px solid var(--v-emeraude);padding:12px;">
    <i data-lucide="message-circle" class="icon icon-md icon-vert"></i>
  </button>
  <button class="btn-primary" style="flex:1;" onclick="addToCart()">
    <i data-lucide="shopping-cart" class="icon icon-sm icon-blanc" style="margin-right:6px;"></i>
    Ajouter au panier
  </button>
  <button class="btn-or" onclick="buyNow()">Acheter</button>
</div>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
const PRODUCTS = [
  {id:1,name:'Boubou wax collection',price:18000,oldPrice:25000,image:'https://images.unsplash.com/photo-1544441893-675973e31985?w=800',seller:'Fatou Fashion',sellerAvatar:'https://i.pravatar.cc/50?img=5',verified:'gold',cat:'mode',stock:12,rating:4.8,reviews:127,city:'Thiès',description:'Magnifique boubou en wax authentique, tissu 100% coton de haute qualité. Coupe traditionnelle sénégalaise. Livraison rapide sur tout le Sénégal.'},
  {id:2,name:'iPhone 15 Pro 256GB',price:750000,image:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=800',seller:'Moussa Tech',sellerAvatar:'https://i.pravatar.cc/50?img=13',verified:'gold',cat:'tech',stock:5,rating:4.9,reviews:89,city:'Dakar',description:'iPhone 15 Pro 256GB - Neuf sous blister - Garantie internationale 1 an. Puce A17 Pro, appareil photo 48MP, écran ProMotion 120Hz.'},
  {id:3,name:'Sac cuir africain premium',price:15000,oldPrice:22000,image:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=800',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',verified:'platinum',cat:'mode',stock:8,rating:5.0,reviews:203,city:'Dakar',description:'Sac en cuir véritable travaillé à la main. Fabrication artisanale sénégalaise. Motifs africains uniques. Pièce numérotée.'},
  {id:4,name:'Écouteurs sans fil Pro',price:12000,image:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=800',seller:'Moussa Tech',sellerAvatar:'https://i.pravatar.cc/50?img=13',verified:'gold',cat:'tech',stock:25,rating:4.6,reviews:312,city:'Dakar',description:'Écouteurs bluetooth 5.3, autonomie 30h avec boîtier, réduction de bruit active, résistants à l\'eau IPX5.'},
  {id:5,name:'Beurre karité 500g',price:4500,image:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=800',seller:'Ibrahim Bio',sellerAvatar:'https://i.pravatar.cc/50?img=8',verified:'silver',cat:'beauty',stock:50,rating:4.9,reviews:456,city:'Saint-Louis',description:'Beurre de karité 100% naturel du Sénégal. Non raffiné, riche en vitamines A et E. Idéal pour hydratation profonde peau et cheveux.'}
];

let currentProduct = null;

function getProductId() {
  const params = new URLSearchParams(location.search);
  return parseInt(params.get('id')) || 1;
}

function renderProduct() {
  const id = getProductId();
  currentProduct = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
  const p = currentProduct;
  const disc = p.oldPrice ? Math.round((1 - p.price/p.oldPrice)*100) : 0;

  document.getElementById('productTitle').textContent = p.name;

  document.getElementById('productMain').innerHTML = `
    <!-- Galerie -->
    <div style="aspect-ratio:1/1;background:var(--bg-card);position:relative;overflow:hidden;">
      <img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">
      ${disc > 0 ? `<div style="position:absolute;top:12px;left:12px;background:var(--rouge);color:white;padding:6px 12px;border-radius:8px;font-weight:800;font-size:14px;">-${disc}%</div>` : ''}
    </div>

    <!-- Prix hero -->
    <div style="padding:16px;background:var(--bg-card);margin-bottom:8px;">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px;">
        <span style="font-size:28px;font-weight:900;color:var(--v-emeraude);">${p.price.toLocaleString('fr-FR')} FCFA</span>
        ${p.oldPrice ? `<span style="font-size:16px;text-decoration:line-through;color:var(--text-muted);">${p.oldPrice.toLocaleString('fr-FR')} FCFA</span>` : ''}
      </div>
      <h2 style="font-size:18px;font-weight:700;margin-bottom:8px;">${p.name}</h2>
      <div style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-muted);">
        <div style="display:flex;align-items:center;gap:4px;">
          <i data-lucide="star" class="icon icon-sm icon-or"></i>
          <span style="font-weight:700;color:var(--text);">${p.rating}</span>
          <span>(${p.reviews} avis)</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <i data-lucide="package" class="icon icon-sm icon-vert"></i>
          <span>Stock : ${p.stock}</span>
        </div>
      </div>
    </div>

    <!-- Options -->
    <div style="padding:16px;background:var(--bg-card);margin-bottom:8px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;">Options</div>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <span style="padding:6px 12px;border:1.5px solid var(--v-emeraude);border-radius:8px;font-size:13px;font-weight:600;color:var(--v-emeraude);">Taille M</span>
        <span style="padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;">Taille L</span>
        <span style="padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;">Taille XL</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span style="padding:6px 12px;border:1.5px solid var(--v-emeraude);border-radius:8px;font-size:13px;font-weight:600;color:var(--v-emeraude);">Bleu</span>
        <span style="padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;">Rouge</span>
        <span style="padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;">Vert</span>
      </div>
    </div>

    <!-- Vendeur -->
    <div style="padding:16px;background:var(--bg-card);margin-bottom:8px;cursor:pointer;" onclick="location.href='boutique.html?id=${p.id}'">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="${p.sellerAvatar}" style="width:50px;height:50px;border-radius:50%;">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-weight:700;">${p.seller}</span>
            ${p.verified === 'platinum' ? '<i data-lucide="badge-check" class="icon icon-sm icon-violet"></i>' : ''}
            ${p.verified === 'gold' ? '<i data-lucide="badge-check" class="icon icon-sm icon-or"></i>' : ''}
          </div>
          <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px;">
            <i data-lucide="map-pin" class="icon icon-sm"></i>
            <span>${p.city}</span>
          </div>
        </div>
        <i data-lucide="chevron-right" class="icon icon-md icon-vert"></i>
      </div>
    </div>

    <!-- Description -->
    <div style="padding:16px;background:var(--bg-card);margin-bottom:8px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="file-text" class="icon icon-sm icon-vert"></i>
        Description
      </div>
      <p style="font-size:14px;line-height:1.6;color:var(--text);">${p.description}</p>
    </div>

    <!-- Avis -->
    <div style="padding:16px;background:var(--bg-card);margin-bottom:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;">
          <i data-lucide="star" class="icon icon-sm icon-or"></i>
          Avis clients (${p.reviews})
        </div>
        <a href="avis.html?id=${p.id}" style="font-size:13px;font-weight:600;">Voir tous</a>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">
        <div style="text-align:center;">
          <div style="font-size:36px;font-weight:900;color:var(--v-emeraude);">${p.rating}</div>
          <div style="display:flex;gap:2px;">
            ${[1,2,3,4,5].map(i => `<i data-lucide="star" class="icon icon-sm ${i <= Math.round(p.rating) ? 'icon-or' : ''}" style="width:14px;height:14px;"></i>`).join('')}
          </div>
        </div>
        <div style="flex:1;">
          ${[5,4,3,2,1].map(n => `
            <div style="display:flex;align-items:center;gap:6px;font-size:11px;">
              <span>${n}★</span>
              <div style="flex:1;background:var(--border);border-radius:4px;height:6px;overflow:hidden;">
                <div style="background:var(--or-royal);height:100%;width:${n === 5 ? 70 : n === 4 ? 20 : n === 3 ? 7 : n === 2 ? 2 : 1}%;"></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- Livraison -->
    <div style="padding:16px;background:var(--bg-card);margin-bottom:8px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="truck" class="icon icon-sm icon-or"></i>
        Livraison
      </div>
      <div style="font-size:13px;line-height:1.6;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span>Dakar</span>
          <span style="font-weight:700;color:var(--v-emeraude);">24-48h · 1 500 FCFA</span>
        </div>
        <div style="display:flex;justify-content:space-between;">
          <span>Autres régions</span>
          <span style="font-weight:700;color:var(--v-emeraude);">3-7 jours · 3 500 FCFA</span>
        </div>
      </div>
    </div>

    <!-- Garanties -->
    <div style="padding:16px;background:var(--bg-card);margin-bottom:8px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="shield-check" class="icon icon-sm icon-vert"></i>
        Garanties SEN TEW
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
          <i data-lucide="rotate-ccw" class="icon icon-sm icon-vert"></i>
          <span>Retour 7 jours</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
          <i data-lucide="shield" class="icon icon-sm icon-vert"></i>
          <span>Paiement sécurisé</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
          <i data-lucide="check-circle" class="icon icon-sm icon-vert"></i>
          <span>Vendeur vérifié</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
          <i data-lucide="phone" class="icon icon-sm icon-vert"></i>
          <span>Support 24/7</span>
        </div>
      </div>
    </div>
  `;

  lucide.createIcons();
}

function addToCart() {
  let cart = JSON.parse(localStorage.getItem('cart')||'[]');
  const existing = cart.find(c => c.id === currentProduct.id);
  if(existing) existing.qty++;
  else cart.push({id: currentProduct.id, name: currentProduct.name, price: currentProduct.price, image: currentProduct.image, qty: 1});
  localStorage.setItem('cart', JSON.stringify(cart));
  if(navigator.vibrate) navigator.vibrate(30);
  alert('✅ Ajouté au panier !');
}

function buyNow() {
  addToCart();
  location.href = 'panier.html';
}

function toggleFavProduct() {
  let favs = JSON.parse(localStorage.getItem('favs')||'[]');
  if(favs.includes(currentProduct.id)) favs = favs.filter(x => x !== currentProduct.id);
  else favs.push(currentProduct.id);
  localStorage.setItem('favs', JSON.stringify(favs));
  if(navigator.vibrate) navigator.vibrate(20);
}

function shareProduct() {
  if(navigator.share) {
    navigator.share({title: currentProduct.name, text: `Découvre ${currentProduct.name} sur SEN TEW`, url: location.href});
  } else {
    navigator.clipboard.writeText(location.href);
    alert('📋 Lien copié !');
  }
}

renderProduct();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
