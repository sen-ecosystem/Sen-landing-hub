<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portefeuille - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#0F6B4E">
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;}
body{background:#F5F5F0;margin:0;font-family:-apple-system,sans-serif;}
.app-header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid #F3F4F6;position:sticky;top:0;z-index:100;}
.hd-btn{width:38px;height:38px;background:#F9FAFB;border:none;border-radius:50%;font-size:16px;color:#0A4D38;cursor:pointer;}

.wallet-card{margin:16px 14px;background:linear-gradient(135deg,#0F6B4E,#0A4D38);border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(15,107,78,.3);}
.wallet-card::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:rgba(212,165,116,.15);border-radius:50%;}
.wallet-card::after{content:'';position:absolute;bottom:-30px;left:-30px;width:150px;height:150px;background:rgba(212,165,116,.1);border-radius:50%;}
.wallet-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;position:relative;z-index:2;}
.wallet-brand img{width:36px;height:36px;border-radius:8px;background:#fff;padding:3px;}
.wallet-brand-name{font-weight:900;font-size:15px;letter-spacing:1px;}
.wallet-balance-label{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:1px;position:relative;z-index:2;}
.wallet-balance{font-size:32px;font-weight:900;color:#D4A574;margin:6px 0;position:relative;z-index:2;}
.wallet-currencies{font-size:12px;opacity:.85;position:relative;z-index:2;}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 14px;}
.qa-btn{background:#fff;padding:14px 6px;border-radius:12px;text-align:center;text-decoration:none;color:#0A4D38;box-shadow:0 2px 8px rgba(0,0,0,.05);border:none;cursor:pointer;}
.qa-icon{width:40px;height:40px;background:linear-gradient(135deg,#0F6B4E,#D4A574);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 6px;color:#fff;}
.qa-label{font-size:10px;font-weight:800;}

.section{background:#fff;margin:12px 14px;border-radius:16px;padding:16px;}
.section h3{margin:0 0 12px;color:#0A4D38;font-size:15px;display:flex;justify-content:space-between;}
.section h3 a{font-size:12px;color:#0F6B4E;text-decoration:none;}

.trans-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #F3F4F6;align-items:center;}
.trans-item:last-child{border-bottom:none;}
.trans-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.trans-in{background:#D1FAE5;color:#065F46;}
.trans-out{background:#FEE2E2;color:#DC2626;}
.trans-info{flex:1;min-width:0;}
.trans-title{font-weight:700;font-size:13px;color:#111827;}
.trans-date{font-size:11px;color:#6B7280;margin-top:2px;}
.trans-amount{font-weight:900;font-size:14px;}
.trans-amount.in{color:#10B981;}
.trans-amount.out{color:#EF4444;}

.pay-logos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.pay-logo-btn{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;}
.pay-logo-btn img{width:36px;height:36px;object-fit:contain;}
.pay-logo-btn div{font-size:10px;font-weight:700;margin-top:4px;color:#111827;}

.app-content{padding-bottom:80px;}
.app-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #F3F4F6;padding:6px 0 max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:90;}
.app-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#6B7280;font-size:10px;font-weight:600;padding:4px;}
.app-nav a.active{color:#0F6B4E;}
.app-nav a.active .nav-icon{background:linear-gradient(135deg,#0F6B4E,#0A4D38);color:#fff;}
.nav-icon{width:34px;height:34px;background:#F9FAFB;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;}
.nav-icon .badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:8px;padding:1px 4px;border-radius:6px;font-weight:900;}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="hd-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:900;color:#0A4D38;">💰 Portefeuille</div>
    <button class="hd-btn" onclick="location.href='parametres.html'">⚙️</button>
  </header>

  <main class="app-content">
    <!-- WALLET CARD -->
    <div class="wallet-card">
      <div class="wallet-brand">
        <img id="walletLogo" alt="SEN TEW Wallet">
        <div class="wallet-brand-name">SEN TEW Wallet</div>
      </div>
      <div class="wallet-balance-label">Solde disponible</div>
      <div class="wallet-balance" id="balance">0 FCFA</div>
      <div class="wallet-currencies" id="balanceCurr">≈ 0 € · 0 $</div>
    </div>

    <!-- ACTIONS RAPIDES -->
    <div class="quick-actions">
      <button class="qa-btn" onclick="deposit()">
        <div class="qa-icon">⬆️</div>
        <div class="qa-label">Recharger</div>
      </button>
      <button class="qa-btn" onclick="withdraw()">
        <div class="qa-icon">⬇️</div>
        <div class="qa-label">Retirer</div>
      </button>
      <button class="qa-btn" onclick="transfer()">
        <div class="qa-icon">↔️</div>
        <div class="qa-label">Envoyer</div>
      </button>
      <button class="qa-btn" onclick="location.href='commandes.html'">
        <div class="qa-icon">📊</div>
        <div class="qa-label">Historique</div>
      </button>
    </div>

    <!-- MÉTHODES ACCEPTÉES -->
    <div class="section">
      <h3>💳 Méthodes de recharge</h3>
      <div class="pay-logos-grid">
        <div class="pay-logo-btn" onclick="depositWith('wave')">
          <img data-pay-logo="wave" alt="Wave">
          <div>Wave</div>
        </div>
        <div class="pay-logo-btn" onclick="depositWith('om')">
          <img data-pay-logo="om" alt="OM">
          <div>OM</div>
        </div>
        <div class="pay-logo-btn" onclick="depositWith('free')">
          <img data-pay-logo="free" alt="Free">
          <div>Free</div>
        </div>
        <div class="pay-logo-btn" onclick="depositWith('wizall')">
          <img data-pay-logo="wizall" alt="Wizall">
          <div>Wizall</div>
        </div>
      </div>
      <button style="width:100%;margin-top:10px;padding:12px;background:#F9FAFB;color:#0F6B4E;border:1px solid #0F6B4E;border-radius:10px;font-weight:800;font-size:13px;" onclick="depositWith('card')">💳 Ajouter par Carte bancaire (Stripe)</button>
    </div>

    <!-- STATS -->
    <div class="section">
      <h3>📊 Ce mois-ci</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div style="padding:12px;background:#F0FDF4;border-radius:10px;">
          <div style="font-size:11px;color:#6B7280;">⬆️ Entrées</div>
          <div style="font-size:18px;font-weight:900;color:#10B981;" id="monthIn">0 FCFA</div>
        </div>
        <div style="padding:12px;background:#FEE2E2;border-radius:10px;">
          <div style="font-size:11px;color:#6B7280;">⬇️ Sorties</div>
          <div style="font-size:18px;font-weight:900;color:#EF4444;" id="monthOut">0 FCFA</div>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE -->
    <div class="section">
      <h3>📋 Transactions récentes <a href="#">Tout voir ›</a></h3>
      <div id="transactions"></div>
    </div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div>Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div>Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div>Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div>Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div>Profil</div></a>
  </nav>
</div>

<script src="js/logo.js"></script>
<script>
// Applique logo SVG immédiatement
setTimeout(()=>{
  const wl = document.getElementById('walletLogo');
  if(wl){
    wl.src = window.SEN_LOGO_SVG || `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230F6B4E'/><text x='50' y='60' text-anchor='middle' font-family='Arial' font-size='28' font-weight='900' fill='%23D4A574'>ST</text></svg>`;
  }
  // Applique logos paiement
  document.querySelectorAll('[data-pay-logo]').forEach(el=>{
    const key = el.getAttribute('data-pay-logo');
    if(window.PAY_LOGOS && window.PAY_LOGOS[key]) el.src = window.PAY_LOGOS[key];
  });
}, 50);

let balance = parseFloat(localStorage.getItem('wallet_balance')||'15000');
let transactions = JSON.parse(localStorage.getItem('wallet_transactions')||'null') || [
  {type:'in',title:'💰 Bonus bienvenue',amount:1000,date:Date.now()-86400000*30},
  {type:'in',title:'💵 Recharge Wave',amount:20000,date:Date.now()-86400000*15},
  {type:'out',title:'🛒 Commande #ST260071',amount:15000,date:Date.now()-86400000*7},
  {type:'in',title:'🎁 Parrainage +Awa',amount:500,date:Date.now()-86400000*3},
  {type:'out',title:'🛒 Commande #ST260073',amount:8500,date:Date.now()-86400000}
];

function refreshBalance(){
  document.getElementById('balance').textContent = balance.toLocaleString('fr-FR')+' FCFA';
  document.getElementById('balanceCurr').textContent = `≈ ${(balance/655).toFixed(2)} € · ${(balance/600).toFixed(2)} $`;
  localStorage.setItem('wallet_balance', balance);
}

function refreshTrans(){
  const now = Date.now();
  const monthMs = 86400000*30;
  const monthTrans = transactions.filter(t=>t.date > now-monthMs);
  const monthIn = monthTrans.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const monthOut = monthTrans.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  document.getElementById('monthIn').textContent = '+'+monthIn.toLocaleString()+' FCFA';
  document.getElementById('monthOut').textContent = '-'+monthOut.toLocaleString()+' FCFA';

  document.getElementById('transactions').innerHTML = transactions.slice(0,10).map(t=>{
    const d = new Date(t.date);
    return `
      <div class="trans-item">
        <div class="trans-icon ${t.type==='in'?'trans-in':'trans-out'}">${t.type==='in'?'↓':'↑'}</div>
        <div class="trans-info">
          <div class="trans-title">${t.title}</div>
          <div class="trans-date">${d.toLocaleDateString('fr-FR')} · ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div class="trans-amount ${t.type}">${t.type==='in'?'+':'-'}${t.amount.toLocaleString()} FCFA</div>
      </div>
    `;
  }).join('');
  localStorage.setItem('wallet_transactions', JSON.stringify(transactions));
}

function deposit(){
  const amount = parseFloat(prompt('💰 Montant à recharger (FCFA) :', '10000'));
  if(!amount || amount<100){alert('❌ Montant minimum 100 FCFA');return;}
  depositWith('wave', amount);
}

function depositWith(method, amount){
  amount = amount || parseFloat(prompt('💰 Montant (FCFA) :','10000'));
  if(!amount || amount<100)return;
  const methods = {wave:'Wave',om:'Orange Money',free:'Free Money',wizall:'Wizall',card:'Carte'};
  if(confirm(`💳 Recharger ${amount.toLocaleString()} FCFA via ${methods[method]} ?`)){
    balance += amount;
    transactions.unshift({type:'in',title:`💵 Recharge ${methods[method]}`,amount,date:Date.now()});
    refreshBalance();refreshTrans();
    navigator.vibrate&&navigator.vibrate([50,30,50]);
    alert(`✅ ${amount.toLocaleString()} FCFA ajoutés !`);
  }
}

function withdraw(){
  const amount = parseFloat(prompt('💵 Montant à retirer (FCFA) :', '5000'));
  if(!amount || amount<500){alert('❌ Retrait minimum 500 FCFA');return;}
  if(amount > balance){alert('❌ Solde insuffisant');return;}
  if(confirm(`💵 Retirer ${amount.toLocaleString()} FCFA ?\nFrais: 1% (${Math.round(amount*0.01)} FCFA)`)){
    balance -= amount;
    transactions.unshift({type:'out',title:'💵 Retrait Wave',amount,date:Date.now()});
    refreshBalance();refreshTrans();
    alert(`✅ Retrait envoyé au +221 77 XXX XX XX`);
  }
}

function transfer(){
  const phone = prompt('📱 Numéro du destinataire :', '+221 77 ');
  if(!phone)return;
  const amount = parseFloat(prompt('💰 Montant :', '5000'));
  if(!amount || amount<100)return;
  if(amount > balance){alert('❌ Solde insuffisant');return;}
  balance -= amount;
  transactions.unshift({type:'out',title:`↔️ Envoyé à ${phone}`,amount,date:Date.now()});
  refreshBalance();refreshTrans();
  alert(`✅ ${amount.toLocaleString()} FCFA envoyés à ${phone}`);
}

refreshBalance();
refreshTrans();
</script>
  <script src="js/dark-mode.js"></script>
<script src="js/role-guard.js"></script>

</body>
</html>
