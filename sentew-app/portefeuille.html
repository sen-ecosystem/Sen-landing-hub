<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Portefeuille - SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
  <button class="btn-back" onclick="history.back()">
    <i data-lucide="arrow-left" class="icon icon-md icon-vert"></i>
  </button>
  <h1 style="display:flex;align-items:center;gap:8px;">
    <i data-lucide="wallet" class="icon icon-md icon-or"></i>
    Portefeuille
  </h1>
  <button class="icon-btn" onclick="location.href='parametres.html'">
    <i data-lucide="settings" class="icon icon-md icon-vert"></i>
  </button>
</header>

<main style="padding:16px;padding-bottom:100px;">

  <!-- Solde principal -->
  <div style="background:linear-gradient(135deg,var(--v-emeraude),var(--v-forest));color:white;padding:24px 20px;border-radius:16px;margin-bottom:14px;box-shadow:0 4px 12px rgba(15,107,78,0.25);">
    <div style="font-size:12px;opacity:0.9;margin-bottom:6px;color:white;">Solde disponible</div>
    <div style="font-size:36px;font-weight:900;margin-bottom:8px;color:white;">15 000 FCFA</div>
    <div style="font-size:12px;opacity:0.9;color:white;">≈ 22,95 € · ≈ 25,05 $</div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button style="flex:1;background:rgba(255,255,255,0.2);color:white;padding:10px;border-radius:10px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;">
        <i data-lucide="plus" class="icon icon-sm icon-blanc"></i>
        Recharger
      </button>
      <button style="flex:1;background:rgba(255,255,255,0.2);color:white;padding:10px;border-radius:10px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px;">
        <i data-lucide="arrow-up-right" class="icon icon-sm icon-blanc"></i>
        Retirer
      </button>
    </div>
  </div>

  <!-- Moyens de recharge -->
  <div style="background:var(--bg-card);padding:14px;border-radius:14px;margin-bottom:14px;">
    <h3 style="font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--v-emeraude);">
      <i data-lucide="credit-card" class="icon icon-sm icon-vert"></i>
      Ajouter des fonds
    </h3>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button style="padding:12px;background:var(--bg);border:1.5px solid var(--v-emeraude);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text);">
        <span style="font-size:20px;" class="emoji-fix">🌊</span> Wave
        <i data-lucide="chevron-right" class="icon icon-sm" style="margin-left:auto;"></i>
      </button>
      <button style="padding:12px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text);">
        <span style="font-size:20px;" class="emoji-fix">🍊</span> Orange Money
        <i data-lucide="chevron-right" class="icon icon-sm" style="margin-left:auto;"></i>
      </button>
      <button style="padding:12px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text);">
        <i data-lucide="credit-card" class="icon icon-md icon-vert"></i> Carte bancaire (Stripe)
        <i data-lucide="chevron-right" class="icon icon-sm" style="margin-left:auto;"></i>
      </button>
    </div>
  </div>

  <!-- Stats mois -->
  <div style="background:var(--bg-card);padding:14px;border-radius:14px;margin-bottom:14px;">
    <h3 style="font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px;color:var(--or-royal);">
      <i data-lucide="bar-chart-3" class="icon icon-sm icon-or"></i>
      Ce mois-ci
    </h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div style="background:var(--v-clair);padding:14px;border-radius:12px;">
        <div style="font-size:11px;color:var(--v-forest);margin-bottom:4px;display:flex;align-items:center;gap:4px;">
          <i data-lucide="arrow-down" class="icon icon-sm" style="width:12px;height:12px;color:var(--v-emeraude);stroke:var(--v-emeraude);"></i>
          Entrées
        </div>
        <div style="font-size:18px;font-weight:800;color:var(--v-emeraude);">+20 500 FCFA</div>
      </div>
      <div style="background:rgba(239,68,68,0.12);padding:14px;border-radius:12px;">
        <div style="font-size:11px;color:var(--rouge);margin-bottom:4px;display:flex;align-items:center;gap:4px;">
          <i data-lucide="arrow-up" class="icon icon-sm" style="width:12px;height:12px;color:var(--rouge);stroke:var(--rouge);"></i>
          Sorties
        </div>
        <div style="font-size:18px;font-weight:800;color:var(--rouge);">-23 500 FCFA</div>
      </div>
    </div>
  </div>

  <!-- Transactions -->
  <div style="background:var(--bg-card);padding:14px;border-radius:14px;margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--or-royal);">
        <i data-lucide="list" class="icon icon-sm icon-or"></i>
        Transactions récentes
      </h3>
      <a href="#" style="font-size:12px;color:var(--v-emeraude);font-weight:700;">Tout voir ›</a>
    </div>

    <div id="txList"></div>
  </div>

</main>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home" class="icon icon-md"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search" class="icon icon-md"></i><span>Rechercher</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart" class="icon icon-md icon-or"></i><span>Panier</span></a>
  <a href="favoris.html"><i data-lucide="heart" class="icon icon-md"></i><span>Favoris</span></a>
  <a href="profil.html"><i data-lucide="user" class="icon icon-md"></i><span>Profil</span></a>
</nav>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
const TRANSACTIONS = [
  {type:'in',label:'Bonus bienvenue',date:'24/07/2026',amount:1000,icon:'gift'},
  {type:'in',label:'Recharge Wave',date:'08/08/2026',amount:20000,icon:'arrow-down-circle'},
  {type:'out',label:'Commande #ST260071',date:'16/08/2026',amount:15000,icon:'shopping-cart'},
  {type:'in',label:'Parrainage +Awa',date:'20/08/2026',amount:500,icon:'gift'},
  {type:'out',label:'Commande #ST260073',date:'21/08/2026',amount:8500,icon:'shopping-cart'},
  {type:'out',label:'Commande #ST260075',date:'22/08/2026',amount:4500,icon:'shopping-cart'}
];

document.getElementById('txList').innerHTML = TRANSACTIONS.map(tx => `
  <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
    <div style="width:36px;height:36px;border-radius:50%;background:${tx.type==='in'?'rgba(15,107,78,0.15)':'rgba(239,68,68,0.15)'};display:flex;align-items:center;justify-content:center;">
      <i data-lucide="${tx.icon}" class="icon icon-sm ${tx.type==='in'?'icon-vert':'icon-rouge'}"></i>
    </div>
    <div style="flex:1;">
      <div style="font-size:13px;font-weight:600;color:var(--text);">${tx.label}</div>
      <div style="font-size:11px;color:var(--text-muted);">${tx.date}</div>
    </div>
    <div style="font-size:14px;font-weight:800;color:${tx.type==='in'?'var(--v-emeraude)':'var(--rouge)'};">
      ${tx.type==='in'?'+':'-'}${tx.amount.toLocaleString('fr-FR')} FCFA
    </div>
  </div>
`).join('');

lucide.createIcons();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
