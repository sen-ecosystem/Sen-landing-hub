<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

.card{background:#fff;border-radius:16px;padding:30px;max-width:420px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
.badge{display:inline-block;background:#e8f5e9;color:#1b5e20;border-radius:20px;padding:8px 18px;font-weight:700;font-size:15px;margin-bottom:15px}
h1{font-size:19px;color:#333;margin:10px 0}
.doc{font-size:22px;font-weight:700;color:#0d47a1;margin:15px 0;letter-spacing:1px}
.info{font-size:13px;color:#666;line-height:1.8;text-align:left;background:#fafafa;border-radius:10px;padding:15px;margin-top:15px}
.date{font-size:12px;color:#999;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<div class="badge">✅ Document authentique</div>

<div class="doc" id="docNum">—</div>

<b>Émetteur :</b> SEN TEW SUARL<br>
<b>RCCM :</b> SN.DKR.2026.B.35565<br>
<b>NINEA :</b> 013373303<br>
<b>Siège :</b> Sacré Cœur 3, Villa N°9947, Dakar — Sénégal<br>

</div>
<div class="date" id="verifDate"></div>
</div>

const p=new URLSearchParams(location.search);
const doc=p.get('doc');

</html>
