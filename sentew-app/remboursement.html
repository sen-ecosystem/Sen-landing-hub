<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remboursement - SEN TEW</title>
<link rel="stylesheet" href="css/app.css?v=51">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-mode">

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <h1>Remboursement</h1>
  <button class="icon-btn" onclick="location.href='support.html'"><i data-lucide="help-circle"></i></button>
</header>

<main class="container">
  <div class="section-card" style="background:linear-gradient(135deg,#0f6b4e,#0a4d38);color:#fff;">
    <h2 style="color:#fff;">Demande de remboursement</h2>
    <p style="color:#d4a574;">Traitement sous 48h ouvrées</p>
  </div>

  <div class="section-card">
    <h3><i data-lucide="package" style="color:#0f6b4e;"></i> Sélectionnez la commande</h3>
    <div class="setting-row" onclick="selectOrder('ST24071')">
      <div><strong>Commande #ST24071</strong><br><small>iPhone 15 Pro - 850 000 FCFA</small></div>
      <i data-lucide="chevron-right"></i>
    </div>
    <div class="setting-row" onclick="selectOrder('ST24072')">
      <div><strong>Commande #ST24072</strong><br><small>AirPods Pro - 145 000 FCFA</small></div>
      <i data-lucide="chevron-right"></i>
    </div>
  </div>

  <div class="section-card">
    <h3><i data-lucide="alert-circle" style="color:#0f6b4e;"></i> Motif</h3>
    <select id="motif" class="form-input">
      <option>Produit défectueux</option>
      <option>Non conforme à la description</option>
      <option>Colis endommagé</option>
      <option>Non reçu</option>
      <option>Autre</option>
    </select>
  </div>

  <div class="section-card">
    <h3><i data-lucide="edit-3" style="color:#0f6b4e;"></i> Description</h3>
    <textarea rows="4" class="form-input" placeholder="Décrivez le problème..."></textarea>
    <button class="btn-outline" onclick="document.getElementById('photos').click()" style="width:100%;margin-top:8px;">
      <i data-lucide="camera"></i> Ajouter photos
    </button>
    <input type="file" id="photos" multiple accept="image/*" style="display:none;">
  </div>

  <button class="btn-primary" onclick="submitRefund()" style="width:100%;padding:16px;font-size:16px;">
    Envoyer la demande
  </button>
</main>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search"></i><span>Recherche</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
  <a href="favoris.html"><i data-lucide="heart"></i><span>Favoris</span></a>
  <a href="profil.html"><i data-lucide="user"></i><span>Profil</span></a>
</nav>

<script>
  lucide.createIcons();
  function selectOrder(id){alert('Commande ' + id + ' sélectionnée');}
  function submitRefund(){alert('✅ Demande envoyée ! Vous recevrez un email de confirmation.');location.href='commandes.html';}
<script src="js/buttons-audit.js?v=51"></script>
</body>
</html>
