<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes commandes - SEN TEW</title>
<link rel="stylesheet" href="css/styles-pays.css">
<style>
:root{--v:#0f6b4e;--vd:#0a4d38;--or:#d4a574;--noir:#0a1f17;--card:#1a2e24;--text:#f5f5f0;--muted:#9ca3af;--border:#2a3e34;--rouge:#ef4444;--menthe:#00c060;--bleu:#1976d2}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:var(--noir);color:var(--text);padding-bottom:100px;max-width:600px;margin:0 auto}
.top{background:var(--card);padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.back{background:rgba(255,255,255,.1);border:none;width:38px;height:38px;border-radius:50%;color:var(--text);font-size:18px;cursor:pointer}
.top h1{flex:1;font-size:15px;font-weight:700;color:var(--or)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}
.stat{background:var(--card);padding:12px;border-radius:12px;text-align:center;border:1px solid var(--border)}
.stat-n{font-size:20px;font-weight:900;color:var(--or)}
.stat-l{font-size:10px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto}
.tab{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--v);border-color:var(--or);color:#fff}
.order{background:var(--card);margin:8px 14px;padding:14px;border-radius:14px;border:1px solid var(--border)}
.order-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.order-id{font-size:13px;font-weight:800;color:var(--or)}
.order-date{font-size:11px;color:var(--muted);margin-left:auto}
.status{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800}
.status.attente{background:rgba(212,165,116,.2);color:var(--or)}
.status.prep{background:rgba(25,118,210,.2);color:var(--bleu)}
.status.livr{background:rgba(0,192,96,.2);color:var(--menthe)}
.status.livre{background:rgba(0,192,96,.3);color:#fff}
.status.annule{background:rgba(239,68,68,.2);color:var(--rouge)}
.order-body{display:flex;gap:10px;margin-bottom:10px}
.order-img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--noir)}
.order-info{flex:1}
.order-name{font-size:13px;font-weight:700;color:var(--text)}
.order-meta{font-size:11px;color:var(--muted);margin-top:2px}
.order-amt{font-size:15px;font-weight:900;color:var(--or);margin-top:4px}
.courier-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.btn-c{padding:8px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;color:#fff}
.btn-call{background:linear-gradient(135deg,var(--menthe),#008a44)}
.btn-chat{background:var(--noir);border:1px solid var(--or);color:var(--or)}
.btn-track{background:linear-gradient(135deg,var(--bleu),#1565c0)}
.info-security{text-align:center;font-size:10px;color:var(--muted);padding:8px 14px;line-height:1.5}
</style>
</head>
<body>

<div class="top">
  <button class="back" onclick="history.back()">←</button>
  <h1>📦 Mes commandes</h1>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n">7</div><div class="stat-l">Total commandes</div></div>
  <div class="stat"><div class="stat-n">287k</div><div class="stat-l">FCFA dépensés</div></div>
  <div class="stat"><div class="stat-n">2</div><div class="stat-l">En livraison</div></div>
</div>

<div class="tabs">
  <div class="tab on" onclick="filter('all')">Toutes (7)</div>
  <div class="tab" onclick="filter('en_livraison')">En livraison (2)</div>
  <div class="tab" onclick="filter('preparation')">Préparation (1)</div>
  <div class="tab" onclick="filter('livre')">Livrées (4)</div>
</div>

<div id="ordersList"></div>

<div class="info-security">
  🛡️ Les appels livreurs utilisent un numéro masqué SEN TEW pour votre sécurité<br>
  📞 Disponible uniquement pendant une livraison active
</div>

<script src="js/dark-mode.js"></script>
<script src="js/role-guard.js"></script>
<script>
const orders = [
  {id:'SEN-2026-8472',date:'26 mai 2026',name:'Sac à main bogolan',img:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=200',amount:45000,status:'en_livraison',courierId:'C124',courierName:'Mamadou Diop',eta:'25 min'},
  {id:'SEN-2026-8465',date:'25 mai 2026',name:'iPhone 15 Pro',img:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=200',amount:750000,status:'en_livraison',courierId:'C089',courierName:'Fatou Ndiaye',eta:'1h 15min'},
  {id:'SEN-2026-8412',date:'24 mai 2026',name:'Robe Wax Premium',img:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=200',amount:25000,status:'preparation'},
  {id:'SEN-2026-8398',date:'20 mai 2026',name:'Sandales cuir Peul',img:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=200',amount:8500,status:'livre'},
  {id:'SEN-2026-8367',date:'18 mai 2026',name:'Beurre de karité 500g',img:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=200',amount:4500,status:'livre'},
  {id:'SEN-2026-8352',date:'15 mai 2026',name:'Écouteurs sans fil Pro',img:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=200',amount:12000,status:'livre'},
  {id:'SEN-2026-8341',date:'12 mai 2026',name:'Maillot Sénégal 2026',img:'https://images.unsplash.com/photo-1517466787929-bc90951d0974?w=200',amount:12000,status:'livre'}
];

const statusLabels = {en_livraison:{lbl:'🛵 En livraison',cls:'livr'},preparation:{lbl:'📦 Préparation',cls:'prep'},livre:{lbl:'✅ Livrée',cls:'livre'},annule:{lbl:'❌ Annulée',cls:'annule'}};

function render(filterVal='all'){
  const list = document.getElementById('ordersList');
  const filtered = filterVal==='all'?orders:orders.filter(o=>o.status===filterVal);
  list.innerHTML = filtered.map(o=>{
    const s = statusLabels[o.status];
    let actions = '';
    if(o.status === 'en_livraison'){
      actions = `<div class="courier-actions">
        <button class="btn-c btn-call" onclick="callCourier('${o.id}','${o.courierId}','${o.courierName}')">📞 Appeler</button>
        <button class="btn-c btn-chat" onclick="location.href='chat.html?courier=${o.courierId}&order=${o.id}'">💬 Chat</button>
        <button class="btn-c btn-track" onclick="location.href='suivi.html?order=${o.id}'">📍 Suivre</button>
      </div>`;
    }
    return `<div class="order">
      <div class="order-h">
        <div class="order-id">#${o.id}</div>
        <span class="status ${s.cls}">${s.lbl}</span>
        <div class="order-date">${o.date}</div>
      </div>
      <div class="order-body" onclick="location.href='suivi.html?order=${o.id}'" style="cursor:pointer">
        <img class="order-img" src="${o.img}">
        <div class="order-info">
          <div class="order-name">${o.name}</div>
          ${o.courierName?`<div class="order-meta">🛵 ${o.courierName} · Arrive dans ${o.eta}</div>`:''}
          <div class="order-amt">${o.amount.toLocaleString('fr-FR')} FCFA</div>
        </div>
      </div>
      ${actions}
    </div>`;
  }).join('');
}

function filter(f){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  event.target.classList.add('on');
  render(f);
}

function callCourier(orderId, courierId, courierName){
  const now = new Date();
  const hour = now.getHours();
  if(hour < 8 || hour >= 22){
    if(!confirm('🌙 Il est '+hour+'h.\nAppel urgent uniquement ?')) return;
  }
  if(confirm('📞 Appeler '+courierName+' ?\n\n✅ Numéro masqué (protection anti-arnaque)\n✅ Appel enregistré (litiges)\n✅ Disponible pendant la livraison uniquement\n\nRappel : soyez courtois et bref.')){
    const virtualNumber = '+22133800' + courierId.replace('C','').padStart(4,'0');
    const callLog = JSON.parse(localStorage.getItem('call_logs')||'[]');
    callLog.push({orderId, courierId, courierName, timestamp: new Date().toISOString(), type:'client_to_courier'});
    localStorage.setItem('call_logs', JSON.stringify(callLog));
    if(navigator.vibrate) navigator.vibrate([50,30,50]);
    location.href = 'tel:'+virtualNumber;
    setTimeout(()=>{
      if(!confirm('📋 Comment s\'est passé l\'appel avec '+courierName+' ?\n\n✅ OK → merci\n🚨 Signaler un problème ?')){
        location.href = 'signaler.html?type=courier&id='+courierId+'&order='+orderId;
      }
    }, 60000);
  }
}

document.documentElement.setAttribute('data-country', localStorage.getItem('sen_country')||'SN');
render();
</script>
</body>
</html>
