<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mes commandes - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF7">
<link rel="stylesheet" href="css/app.css">
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:800;color:var(--text);font-size:16px;">📦 Mes commandes</div>
    <a href="notifications.html" class="header-btn">🔔<span class="badge">3</span></a>
  </header>

  <main class="app-content">
    <div class="chips">
      <button class="chip active" onclick="filt('all',this)">Toutes (5)</button>
      <button class="chip" onclick="filt('pending',this)">⏱ En cours (2)</button>
      <button class="chip" onclick="filt('delivered',this)">✅ Livrées (2)</button>
      <button class="chip" onclick="filt('cancel',this)">❌ Annulées (1)</button>
    </div>

    <div id="orders" style="padding:0 16px;"></div>
    <div style="height:20px;"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html" class="active"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script>
const orders = [
  {id:'SEN2026-0847',status:'pending',statusLabel:'📦 Expédié',statusColor:'#3b82f6',date:'27 juil 2026',product:'Boubou wax premium',price:18000,image:'https://images.unsplash.com/photo-1595777216528-071e0127ccbf?w=200',progress:75,seller:'Fatou Ndiaye'},
  {id:'SEN2026-0846',status:'pending',statusLabel:'🚚 En livraison',statusColor:'#f59e0b',date:'26 juil 2026',product:'Sac cuir africain',price:15000,image:'https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=200',progress:90,seller:'Aïcha Couture'},
  {id:'SEN2026-0845',status:'delivered',statusLabel:'✅ Livrée',statusColor:'#22c55e',date:'22 juil 2026',product:'Écouteurs sans fil Pro',price:12000,image:'https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=200',progress:100,seller:'TechSen Store'},
  {id:'SEN2026-0844',status:'delivered',statusLabel:'✅ Livrée',statusColor:'#22c55e',date:'18 juil 2026',product:'Bracelet ethnique',price:5500,image:'https://images.unsplash.com/photo-1611085583191-a3b181a88401?w=200',progress:100,seller:'Awa Bijoux'},
  {id:'SEN2026-0843',status:'cancel',statusLabel:'❌ Annulée',statusColor:'#ef4444',date:'15 juil 2026',product:'Café touba 500g',price:3500,image:'https://images.unsplash.com/photo-1610889556528-9a770e32642f?w=200',progress:0,seller:'Cheikh Diouf'}
];

function renderOrders(list) {
  let html = '';
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    html += '<div style="background:var(--white);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border);">';
    
    // Header
    html += '<div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:11px;font-weight:700;">';
    html += '<span style="color:var(--gold-dark);">#' + o.id + '</span>';
    html += '<span style="color:var(--text-soft);">' + o.date + '</span>';
    html += '</div>';
    
    // Produit
    html += '<div style="display:flex;gap:12px;">';
    html += '<img src="' + o.image + '" style="width:70px;height:70px;object-fit:cover;border-radius:10px;pointer-events:auto;flex-shrink:0;">';
    html += '<div style="flex:1;">';
    html += '<div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:2px;">' + o.product + '</div>';
    html += '<div style="font-size:11px;color:var(--text-soft);margin-bottom:4px;font-weight:500;">Vendu par ' + o.seller + '</div>';
    html += '<div style="color:var(--gold-dark);font-weight:900;font-size:15px;">' + o.price.toLocaleString() + ' FCFA</div>';
    html += '<div style="display:inline-block;background:' + o.statusColor + ';color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-top:6px;">' + o.statusLabel + '</div>';
    html += '</div>';
    html += '</div>';
    
    // Barre progression (pour commandes en cours)
    if (o.status === 'pending') {
      html += '<div style="margin-top:14px;height:8px;background:var(--border);border-radius:4px;overflow:hidden;">';
      html += '<div style="height:100%;width:' + o.progress + '%;background:linear-gradient(90deg,var(--emerald),var(--gold));transition:.3s;"></div>';
      html += '</div>';
      html += '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--text-soft);font-weight:600;">';
      html += '<span>Confirmée</span><span>Expédiée</span><span>En route</span><span>Livrée</span>';
      html += '</div>';
    }
    
    // Boutons actions
    html += '<div style="display:flex;gap:8px;margin-top:14px;">';
    if (o.status === 'pending') {
      html += '<button class="btn btn-primary" style="flex:1;padding:10px;font-size:12px;" onclick="alert(\'📍 Suivi temps réel\')">📍 Suivre</button>';
    }
    html += '<button class="btn btn-outline" style="flex:1;padding:10px;font-size:12px;" onclick="window.location.href=\'messages.html\'">💬 Contact</button>';
    if (o.status === 'delivered') {
      html += '<button class="btn btn-gold" style="flex:1;padding:10px;font-size:12px;" onclick="window.location.href=\'avis.html\'">⭐ Avis</button>';
    }
    if (o.status === 'cancel') {
      html += '<button class="btn btn-outline" style="flex:1;padding:10px;font-size:12px;color:#ef4444;border-color:#ef4444;" onclick="window.location.href=\'remboursement.html\'">💸 Remboursement</button>';
    }
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('orders').innerHTML = html || '<p style="text-align:center;color:var(--text-soft);padding:40px;">Aucune commande</p>';
}

function filt(type, el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  let list = orders;
  if (type !== 'all') list = orders.filter(o => o.status === type);
  renderOrders(list);
}

renderOrders(orders);
</script>
</body>
</html>
