<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Suivi de commande - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/security-shield.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{background:#f5f5f0;font-family:'Segoe UI',-apple-system,sans-serif;padding-bottom:90px;color:#0a1f17}
/* Header */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:500}
.topbar h1{font-size:16px;font-weight:900;color:#0f6b4e;flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#f5f5f0;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0f6b4e;text-decoration:none;font-size:16px}
/* Statut */
.status-hero{background:linear-gradient(160deg,#0a1f17,#0f6b4e);color:#fff;padding:18px 18px 20px;text-align:center}
.status-hero .sh-ico{font-size:34px;margin-bottom:6px}
.status-hero h2{font-size:18px;font-weight:900}
.status-hero p{font-size:11.5px;opacity:.85;margin-top:4px}
.status-hero .ref{font-family:monospace;font-size:12px;font-weight:900;background:rgba(255,255,255,.14);padding:5px 13px;border-radius:9px;display:inline-block;margin-top:9px;letter-spacing:1.5px}
/* Carte réelle */
#map{width:100%;height:270px;z-index:1;background:#e5e7eb}
/* Fiche livreur */
.driver-card{background:#fff;margin:-30px 14px 0;border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.14);position:relative;z-index:500;display:flex;align-items:center;gap:12px;animation:fadeUp .4s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dc-photo{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid #0f6b4e;flex-shrink:0;background:#f3f4f6}
.dc-info{flex:1;min-width:0}
.dc-info b{font-size:15px;font-weight:900}
.dc-info .dc-sub{font-size:11px;color:#6b7280;margin-top:2px}
.dc-plate{display:inline-flex;align-items:center;gap:5px;background:#0a1f17;color:#fff;font-family:monospace;font-size:12px;font-weight:900;letter-spacing:1.5px;padding:5px 11px;border-radius:8px;margin-top:6px;border:2px solid #4ade80}
.dc-stars{font-size:11px;color:#f59e0b;font-weight:800;margin-top:4px}
.dc-actions{display:flex;flex-direction:column;gap:7px}
.dc-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.dc-call{background:#d1fae5}
.dc-msg{background:#dbeafe}
/* GPS live */
.gps-live{display:flex;align-items:center;gap:8px;background:#f0fdf4;border:1px solid #a7f3d0;border-radius:12px;padding:11px 13px;margin:12px 14px 0;font-size:11.5px;color:#065f46;font-weight:700;line-height:1.45}
.gps-dot{width:9px;height:9px;border-radius:50%;background:#10b981;animation:pulseG 1.4s infinite;flex-shrink:0}
@keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 7px rgba(16,185,129,0)}}
/* Progression 4 étapes */
.progress-card{background:#fff;margin:12px 14px 0;border-radius:16px;padding:16px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.progress-card h3{font-size:13px;font-weight:900;margin-bottom:14px}
.progress{display:flex;align-items:flex-start}
.pstep{flex:1;text-align:center;position:relative}
.pstep .dot{width:28px;height:28px;border-radius:50%;background:#e5e7eb;color:#9aa5a0;display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;z-index:2;font-size:13px}
.pstep.done .dot{background:#0f6b4e;color:#fff}
.pstep.now .dot{background:#e63946;color:#fff;animation:pulse2 1.4s infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.4)}50%{box-shadow:0 0 0 8px rgba(230,57,70,0)}}
.pstep span{font-size:9px;font-weight:700;color:#9aa5a0;display:block;margin-top:5px}
.pstep.done span,.pstep.now span{color:#0a1f17}
.pstep::before{content:'';position:absolute;top:14px;left:-50%;width:100%;height:2.5px;background:#e5e7eb;z-index:1}
.pstep:first-child::before{display:none}
.pstep.done::before{background:#0f6b4e}
/* Code de livraison */
.deliv-code{background:#0a1f17;border-radius:14px;padding:14px;margin:12px 14px 0;display:flex;align-items:center;gap:12px}
.deliv-code .dc-lab{font-size:10.5px;color:#9aa5a0;flex:1;line-height:1.5}
.deliv-code .dc-lab b{color:#fff;display:block;font-size:11.5px;margin-bottom:2px}
.deliv-code .dc-val{font-family:monospace;font-size:22px;font-weight:900;color:#4ade80;letter-spacing:6px}
.deliv-code .dc-eye{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:16px}
/* Articles */
.items-card{background:#fff;margin:12px 14px 0;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.items-card h3{font-size:13px;font-weight:900;margin-bottom:10px}
.item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:12.5px}
.item-row:last-child{border:none}
.item-row .iq{background:#f0fdf4;color:#0f6b4e;font-weight:900;font-size:11px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item-row b{flex:1;font-size:12.5px}
.item-row span{font-weight:900;color:#0f6b4e;font-size:12px}
.total-row{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:2px solid #f3f4f6;font-weight:900;font-size:14px}
.total-row span:last-child{color:#0f6b4e}
/* Astuce */
.tip{display:flex;gap:8px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 12px;margin:12px 14px 0;font-size:11.5px;color:#92400e;cursor:pointer;line-height:1.5}
/* Actions */
.actions{display:flex;gap:9px;margin:12px 14px 0}
.abtn{flex:1;padding:13px;border-radius:13px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:none}
.abtn-green{background:#0f6b4e;color:#fff}
.abtn-line{background:#fff;border:1.5px solid #0f6b4e;color:#0f6b4e}
/* Vide / erreur */
.empty{text-align:center;padding:50px 24px;color:#9aa5a0}
.empty .ei{font-size:44px}
.empty h3{color:#0a1f17;margin:12px 0 6px;font-size:16px}
.empty p{font-size:12.5px;line-height:1.6}
.empty a{display:inline-block;margin-top:14px;padding:12px 24px;background:#0f6b4e;color:#fff;border-radius:12px;text-decoration:none;font-weight:800;font-size:13px}
.loading{text-align:center;padding:40px;color:#9aa5a0;font-size:12px}
/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:600;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#9aa5a0;font-size:9.5px;font-weight:700;padding:4px 0;min-height:44px;justify-content:center}
.bottom-nav a.on{color:#0f6b4e}
.bottom-nav a i{width:20px;height:20px}
</style>
</head>
<body>

<div class="topbar">
  <a class="icon-btn" href="commandes.html">←</a>
  <h1>📍 Suivi de commande</h1>
  <a class="icon-btn" href="messages.html">💬</a>
</div>

<div id="main"><div class="loading">Chargement de ta commande…</div></div>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i>Accueil</a>
  <a href="categories.html"><i data-lucide="grid-2x2"></i>Catégories</a>
  <a href="commandes.html" class="on"><i data-lucide="package"></i>Commandes</a>
  <a href="messages.html"><i data-lucide="message-circle"></i>Messages</a>
  <a href="profil.html"><i data-lucide="user"></i>Profil</a>
</nav>

<script>
lucide.createIcons();
var SUPA_URL='https://tjqkruhwmjzgfvtouqza.supabase.co';
var SUPA_KEY='sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j';

function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
function fmt(n){return (n||0).toLocaleString('fr-FR')+' F'}
function $(id){return document.getElementById(id)}

/* ===== PARAMÈTRE URL : ?id= ou ?ref= ===== */
var PARAMS=new URLSearchParams(location.search);
var ORDER_ID=PARAMS.get('id')||PARAMS.get('ref')||'';

/* ===== STATUTS ===== */
var STEPS=[
  {key:'confirmed',label:'Confirmée',ico:'✓'},
  {key:'preparing',label:'Préparation',ico:'📦'},
  {key:'in_transit',label:'En livraison',ico:'🛵'},
  {key:'delivered',label:'Livrée',ico:'🎉'}
];
var HERO={
  confirmed:['✅','Commande confirmée','Le vendeur a reçu ta commande et va la préparer.'],
  preparing:['📦','Colis en préparation','Le vendeur prépare ton colis. Le livreur le récupérera bientôt.'],
  picked_up:['🛵','Colis récupéré','Le livreur a scanné ton colis chez le vendeur. Il arrive !'],
  in_transit:['🛵','Livreur en route','Ton colis est en chemin. Suis le livreur sur la carte en direct.'],
  delivered:['🎉','Commande livrée','Merci pour ta confiance ! Note ton expérience pour gagner des points.'],
  cancelled:['❌','Commande annulée','Cette commande a été annulée. Contacte le support si tu as payé.']
};
function stepIndex(status){
  if(status==='confirmed')return 0;
  if(status==='preparing')return 1;
  if(status==='picked_up'||status==='in_transit')return 2;
  if(status==='delivered')return 3;
  return -1;
}

/* ===== CHARGEMENT COMMANDE ===== */
var ORDER=null;
async function loadOrder(){
  if(!ORDER_ID){
    $('main').innerHTML='<div class="empty"><div class="ei">🔍</div><h3>Aucune commande précisée</h3><p>Ouvre cette page depuis « Mes commandes » pour suivre ta livraison en direct.</p><a href="commandes.html">Voir mes commandes</a></div>';
    return;
  }
  try{
    var q=ORDER_ID.indexOf('STW')===0?'tracking_code=eq.'+ORDER_ID:'id=eq.'+ORDER_ID;
    var r=await fetch(SUPA_URL+'/rest/v1/orders?'+q+'&select=*',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    var rows=await r.json();
    if(!rows||!rows.length){
      $('main').innerHTML='<div class="empty"><div class="ei">😕</div><h3>Commande introuvable</h3><p>Vérifie le lien ou contacte le support.</p><a href="commandes.html">Mes commandes</a></div>';
      return;
    }
    ORDER=rows[0];
    render();
    startTracking();
  }catch(e){
    $('main').innerHTML='<div class="empty"><div class="ei">📡</div><h3>Erreur réseau</h3><p>Vérifie ta connexion internet et recharge la page.</p></div>';
  }
}

/* ===== AFFICHAGE ===== */
function render(){
  var h=HERO[ORDER.status]||HERO.confirmed;
  var idx=stepIndex(ORDER.status);
  var showMap=(ORDER.status==='in_transit'||ORDER.status==='picked_up')&&ORDER.driver_id;
  var showCode=(ORDER.status!=='delivered'&&ORDER.status!=='cancelled'&&ORDER.delivery_code);

  var html=''
  /* Héro statut */
  +'<div class="status-hero">'
  +'<div class="sh-ico">'+h[0]+'</div>'
  +'<h2>'+h[1]+'</h2>'
  +'<p>'+h[2]+'</p>'
  +'<div class="ref">'+esc(ORDER.tracking_code||ORDER.ref||('STW-'+(ORDER.id||'').slice(0,6).toUpperCase()))+'</div>'
  +'</div>'

  /* Carte + livreur (seulement en livraison) */
  +(showMap
    ?'<div id="map"></div>'
    +'<div class="driver-card">'
    +'<img class="dc-photo" id="dPhoto" src="" alt="Livreur" onerror="this.src=\'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop\'">'
    +'<div class="dc-info">'
    +'<b><span id="dName">Livreur SEN TEW</span> <span style="color:#0f6b4e">✓</span></b>'
    +'<div class="dc-sub" id="dVehicle">Chargement…</div>'
    +'<div class="dc-plate">🏍️ <span id="dPlate">—</span></div>'
    +'<div class="dc-stars" id="dStars"></div>'
    +'</div>'
    +'<div class="dc-actions">'
    +'<a class="dc-btn dc-call" id="dCall" href="#">📞</a>'
    +'<a class="dc-btn dc-msg" id="dMsg" href="#">💬</a>'
    +'</div>'
    +'</div>'
    +'<div class="gps-live"><span class="gps-dot"></span><span id="gpsText">Connexion au GPS du livreur…</span></div>'
    :'')

  /* Progression */
  +'<div class="progress-card"><h3>📊 Progression</h3><div class="progress">'
  +STEPS.map(function(s,i){
    var cls=i<idx?'done':(i===idx?'now':'');
    if(ORDER.status==='cancelled')cls='';
    return '<div class="pstep '+cls+'"><div class="dot">'+(i<idx?'✓':s.ico)+'</div><span>'+s.label+'</span></div>';
  }).join('')
  +'</div></div>'

  /* Code de livraison secret */
  +(showCode
    ?'<div class="deliv-code">'
    +'<div class="dc-lab"><b>🔐 Ton code de livraison secret</b>Donne-le UNIQUEMENT au livreur, en main propre, quand tu as ton colis.</div>'
    +'<div class="dc-val" id="codeVal" data-code="'+esc(ORDER.delivery_code)+'">••••</div>'
    +'<button class="dc-eye" id="eyeCode" type="button">👁️</button>'
    +'</div>'
    :'')

  /* Articles */
  +'<div class="items-card"><h3>🛍️ Ta commande</h3>'
  +((ORDER.items||[]).map(function(it){
    return '<div class="item-row"><div class="iq">'+(it.qty||1)+'</div><b>'+esc(it.name||'Article')+'</b><span>'+fmt((it.price||0)*(it.qty||1))+'</span></div>';
  }).join('')||'<div class="item-row"><b>Commande</b><span></span></div>')
  +'<div class="total-row"><span>Total payé</span><span>'+fmt(ORDER.total)+'</span></div>'
  +'</div>'

  /* Actions */
  +'<div class="actions">'
  +'<a class="abtn abtn-green" href="chat.html?to=support&order='+(ORDER.tracking_code||ORDER.id)+'">💬 Contacter le support</a>'
  +(ORDER.status==='delivered'?'<a class="abtn abtn-line" href="commandes.html">⭐ Noter ma commande</a>':'<a class="abtn abtn-line" href="commandes.html">📦 Mes commandes</a>')
  +'</div>'

  /* Astuce */
  +'<div class="tip" onclick="alert(\'🛡️ Protection anti-fraude\\n\\n• Ne donne JAMAIS ton code avant d\\\'avoir le colis en main\\n• Vérifie la plaque du livreur : elle est affichée sur cette page\\n• Le code libère le paiement au vendeur — c\\\'est ta signature\\n\\nⓘ Problème ? Contacte le support immédiatement, le paiement est bloqué tant que tu n\\\'as pas confirmé.\')">ⓘ<span>Astuce sécurité : ton code libère le paiement — ne le donne qu\'avec le colis en main. Clique pour tout savoir.</span></div>';

  $('main').innerHTML=html;
  lucide.createIcons();

  /* Œil du code secret */
  var eyeBtn=$('eyeCode');
  if(eyeBtn){
    eyeBtn.onclick=function(){
      var v=$('codeVal');
      var shown=v.textContent!=='••••';
      v.textContent=shown?'••••':v.dataset.code;
      this.textContent=shown?'👁️':'🙈';
    };
  }
}

/* ===== CARTE RÉELLE + LIVREUR ===== */
var map,driverMarker,clientMarker,routeLine;
var DAKAR=[14.6928,-17.4467];

function startTracking(){
  if(!(ORDER.status==='in_transit'||ORDER.status==='picked_up')||!ORDER.driver_id)return;
  initMap(ORDER.client_lat||null,ORDER.client_lng||null);
  loadDriver(ORDER.driver_id);
}

function initMap(cLat,cLng){
  var center=(cLat&&cLng)?[cLat,cLng]:DAKAR;
  map=L.map('map',{zoomControl:true}).setView(center,14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:19
  }).addTo(map);
  if(cLat&&cLng){
    clientMarker=L.marker([cLat,cLng],{
      icon:L.divIcon({className:'',html:'<div style="font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">🏠</div>',iconSize:[32,32],iconAnchor:[16,30]})
    }).addTo(map).bindPopup('<b>📍 Toi — adresse de livraison</b>');
  }
}

async function loadDriver(driverId){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/drivers?id=eq.'+driverId+'&select=*',{
      headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    var rows=await r.json();
    if(!rows||!rows.length)return;
    var d=rows[0];
    $('dName').textContent=d.full_name||'Livreur SEN TEW';
    $('dVehicle').textContent=(d.vehicle_model||d.vehicle||'Moto')+' · '+(d.zone||'Dakar');
    $('dPlate').textContent=d.plate||'—';
    var rt=Math.round(d.rating||5);
    $('dStars').textContent='★'.repeat(rt)+'☆'.repeat(5-rt)+' '+(d.rating||5)+' · '+(d.total_deliveries||0)+' livraisons';
    if(d.photo_url)$('dPhoto').src=d.photo_url;
    if(d.phone){
      $('dCall').href='tel:'+d.phone;
      $('dMsg').href='chat.html?to=driver-'+d.id;
    }
    if(d.last_lat&&d.last_lng&&map){
      placeDriver(d.last_lat,d.last_lng,d.full_name||'Livreur');
    }else{
      $('gpsText').textContent='En attente du GPS du livreur (il s\'active au départ de la course)…';
    }
    setInterval(function(){refreshDriverPos(driverId)},15000);
  }catch(e){}
}

function placeDriver(lat,lng,name){
  if(!map)return;
  var icon=L.divIcon({className:'',
    html:'<div style="font-size:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">🛵</div>',
    iconSize:[34,34],iconAnchor:[17,30]});
  if(!driverMarker){
    driverMarker=L.marker([lat,lng],{icon:icon}).addTo(map).bindPopup('<b>🛵 '+esc(name)+'</b><br>En route vers toi');
  }else{
    driverMarker.setLatLng([lat,lng]);
  }
  if(clientMarker){
    if(routeLine)map.removeLayer(routeLine);
    routeLine=L.polyline([driverMarker.getLatLng(),clientMarker.getLatLng()],{
      color:'#0f6b4e',weight:4,dashArray:'8 6',opacity:.85
    }).addTo(map);
    map.fitBounds([driverMarker.getLatLng(),clientMarker.getLatLng()],{padding:[45,45]});
    var km=(map.distance(driverMarker.getLatLng(),clientMarker.getLatLng())/1000).toFixed(1);
    $('gpsText').innerHTML='🛵 <b>'+esc(name)+'</b> est à <b>'+km+' km</b> de toi · mis à jour '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }else{
    map.setView([lat,lng],15);
    $('gpsText').innerHTML='🛵 <b>'+esc(name)+'</b> est en route · mis à jour '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
}

async function refreshDriverPos(driverId){
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/drivers?id=eq.'+driverId+'&select=full_name,last_lat,last_lng',{
      headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    var rows=await r.json();
    if(rows&&rows.length&&rows[0].last_lat){
      placeDriver(rows[0].last_lat,rows[0].last_lng,rows[0].full_name||'Livreur');
    }
  }catch(e){}
}

loadOrder();
</script>
</body>
</html>
