<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi GPS - SEN TEW</title>
  <link rel="stylesheet" href="css/app.css?v=52">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #f5f5f0; margin: 0; font-family: -apple-system, sans-serif; padding-bottom: 80px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .topbar h1 { color: #0f6b4e; font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; color: #0f6b4e; }
    .map { background: linear-gradient(135deg, #dbeafe, #bfdbfe); height: 280px; display: flex; align-items: center; justify-content: center; }
    .map-icon { width: 60px; height: 60px; background: #0f6b4e; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
    .map-icon i { color: #fff; width: 32px; height: 32px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .eta-card { background: #fff; margin: -40px 16px 0; padding: 16px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); position: relative; z-index: 2; }
    .eta-time { font-size: 24px; font-weight: 800; color: #0f6b4e; margin: 4px 0; }
    .card { background: #fff; margin: 12px 16px; padding: 16px; border-radius: 12px; }
    .card h3 { color: #0f6b4e; margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .step { display: flex; gap: 12px; padding: 8px 0; position: relative; }
    .step-dot { width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; z-index: 1; }
    .step-dot.done { background: #0f6b4e; }
    .step-dot.done i { color: #fff; width: 14px; height: 14px; }
    .step-dot.active { background: #d4a574; animation: pulse 2s infinite; }
    .step-content { flex: 1; }
    .step-title { font-weight: 700; font-size: 13px; }
    .step-time { font-size: 11px; color: #666; }
    .step-line { position: absolute; left: 11px; top: 32px; bottom: -8px; width: 2px; background: #e5e7eb; }
    .step:last-child .step-line { display: none; }
    .btn { width: calc(100% - 32px); background: #0f6b4e; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; margin: 12px 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e5e7eb; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #666; font-size: 11px; }
    .bottom-nav a.active { color: #0f6b4e; }
    .bottom-nav a i { width: 22px; height: 22px; }
  </style>
</head>
<body class="light-mode">

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <h1><i data-lucide="map-pin"></i> Suivi GPS</h1>
  <button class="icon-btn"><i data-lucide="refresh-cw"></i></button>
</header>

<div class="map">
  <div class="map-icon"><i data-lucide="truck"></i></div>
</div>

<div class="eta-card">
  <div style="font-size:12px;color:#666">Arrivée estimée</div>
  <div class="eta-time">18h45</div>
  <div style="font-size:12px">Livreur à 2.3 km · 8 min</div>
</div>

<div class="card">
  <h3><i data-lucide="list"></i> Étapes livraison</h3>
  <div class="step">
    <div class="step-dot done"><i data-lucide="check"></i></div>
    <div class="step-line"></div>
    <div class="step-content">
      <div class="step-title">Commande confirmée</div>
      <div class="step-time">14h30</div>
    </div>
  </div>
  <div class="step">
    <div class="step-dot done"><i data-lucide="check"></i></div>
    <div class="step-line"></div>
    <div class="step-content">
      <div class="step-title">Colis préparé</div>
      <div class="step-time">16h15</div>
    </div>
  </div>
  <div class="step">
    <div class="step-dot done"><i data-lucide="check"></i></div>
    <div class="step-line"></div>
    <div class="step-content">
      <div class="step-title">Retrait par livreur</div>
      <div class="step-time">17h20</div>
    </div>
  </div>
  <div class="step">
    <div class="step-dot active"></div>
    <div class="step-line"></div>
    <div class="step-content">
      <div class="step-title">En route</div>
      <div class="step-time">En cours...</div>
    </div>
  </div>
  <div class="step">
    <div class="step-dot"></div>
    <div class="step-content">
      <div class="step-title">Livré</div>
      <div class="step-time">Prévu 18h45</div>
    </div>
  </div>
</div>

<button class="btn" onclick="location.href='tel:+221'">
  <i data-lucide="phone"></i> Appeler le livreur
</button>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
  <a href="categories.html"><i data-lucide="grid"></i><span>Catégories</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
  <a href="messages.html"><i data-lucide="message-circle"></i><span>Messages</span></a>
  <a href="profil.html" class="active"><i data-lucide="user"></i><span>Profil</span></a>
</nav>

<script>lucide.createIcons();</script>
</body>
</html>
