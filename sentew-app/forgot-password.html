<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié - SEN TEW</title>
  <link rel="stylesheet" href="css/app.css?v=52">
  <style>
    body { background: linear-gradient(135deg, #0f6b4e, #0a4d38); margin: 0; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
    .logo { text-align: center; color: #fff; margin-bottom: 24px; }
    .logo h1 { color: #fff; margin: 0; font-size: 32px; font-weight: 900; }
    .card { background: #fff; border-radius: 16px; padding: 24px; }
    .card h2 { color: #0f6b4e; margin: 0 0 8px; font-size: 20px; text-align: center; }
    .card p { text-align: center; color: #666; font-size: 13px; margin: 0 0 16px; }
    .field { margin-bottom: 14px; }
    .label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .input { width: 100%; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    .btn { width: 100%; background: linear-gradient(135deg, #0f6b4e, #0a4d38); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .back { text-align: center; margin-top: 14px; font-size: 13px; }
    .back a { color: #0f6b4e; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

<div class="logo"><h1>SEN TEW</h1></div>

<div class="card">
  <h2>Mot de passe oublié</h2>
  <p>Entrez votre email pour recevoir un lien de réinitialisation</p>

  <div class="field">
    <label class="label">Email</label>
    <input type="email" class="input" placeholder="hello@sen-tew.com">
  </div>

  <button class="btn" onclick="alert('📧 Email envoyé !'); location.href='login.html'">Envoyer le lien</button>

  <div class="back"><a href="login.html">← Retour connexion</a></div>
</div>

</body>
</html>
