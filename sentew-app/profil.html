<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Profil - SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
  <h1>Mon Profil</h1>
  <button class="icon-btn" onclick="toggleTheme()">
    <i data-lucide="moon" class="icon icon-md icon-vert"></i>
  </button>
  <button class="icon-btn" onclick="location.href='parametres.html'">
    <i data-lucide="settings" class="icon icon-md icon-vert"></i>
  </button>
</header>

<main style="padding:16px;padding-bottom:100px;">

  <!-- Carte profil -->
  <div style="background:linear-gradient(135deg,var(--v-emeraude),var(--v-forest));color:white;padding:20px;border-radius:16px;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div id="userAvatar" style="width:70px;height:70px;border-radius:50%;background:var(--or-royal);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--noir-profond);">U</div>
      <div style="flex:1;">
        <h2 id="userName" style="font-size:18px;font-weight:800;color:white;">Utilisateur SEN TEW</h2>
        <div id="userEmail" style="font-size:12px;opacity:0.9;">invite@sen-tew.com</div>
        <div style="margin-top:6px;">
          <span id="userRole" style="background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;">Invité</span>
        </div>
      </div>
      <button class="icon-btn" onclick="location.href='inscription.html'">
        <i data-lucide="log-in" class="icon icon-md icon-blanc"></i>
      </button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;">
      <div style="text-align:center;background:rgba(255,255,255,0.15);padding:10px;border-radius:10px;">
        <div id="userWallet" style="font-size:14px;font-weight:800;color:white;">500</div>
        <div style="font-size:10px;opacity:0.9;">FCFA</div>
      </div>
      <div style="text-align:center;background:rgba(255,255,255,0.15);padding:10px;border-radius:10px;">
        <div style="font-size:14px;font-weight:800;color:white;">0</div>
        <div style="font-size:10px;opacity:0.9;">Commandes</div>
      </div>
      <div style="text-align:center;background:rgba(255,255,255,0.15);padding:10px;border-radius:10px;">
        <div style="font-size:14px;font-weight:800;color:white;">Bronze</div>
        <div style="font-size:10px;opacity:0.9;">Fidélité</div>
      </div>
    </div>
  </div>

  <!-- Actions rapides -->
  <div class="section-title" style="margin:16px 0 12px;">
    <i data-lucide="zap" class="icon icon-md icon-or"></i>
    Actions rapides
  </div>
  <div class="icon-grid">
    <div class="icon-grid-item" onclick="location.href='commandes.html'">
      <div class="icon-bg bg-or-soft"><i data-lucide="package" class="icon icon-md icon-or"></i></div>
      <span class="label">Commandes</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='favoris.html'">
      <div class="icon-bg bg-rouge-soft"><i data-lucide="heart" class="icon icon-md icon-rouge"></i></div>
      <span class="label">Favoris</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='portefeuille.html'">
      <div class="icon-bg bg-vert-soft"><i data-lucide="wallet" class="icon icon-md icon-vert"></i></div>
      <span class="label">Portefeuille</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='parrainage.html'">
      <div class="icon-bg bg-violet-soft"><i data-lucide="gift" class="icon icon-md icon-violet"></i></div>
      <span class="label">Parrainage</span>
    </div>
  </div>

  <!-- Menu principal -->
  <div style="background:var(--bg-card);border-radius:12px;overflow:hidden;margin:16px 0;">
    <div onclick="location.href='adresses.html'" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border);">
      <i data-lucide="map-pin" class="icon icon-md icon-vert"></i>
      <span style="flex:1;font-size:14px;font-weight:600;">Mes adresses</span>
      <i data-lucide="chevron-right" class="icon icon-sm"></i>
    </div>
    <div onclick="location.href='messages.html'" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border);">
      <i data-lucide="message-circle" class="icon icon-md icon-vert"></i>
      <span style="flex:1;font-size:14px;font-weight:600;">Messages</span>
      <i data-lucide="chevron-right" class="icon icon-sm"></i>
    </div>
    <div onclick="location.href='notifications.html'" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border);">
      <i data-lucide="bell" class="icon icon-md icon-or"></i>
      <span style="flex:1;font-size:14px;font-weight:600;">Notifications</span>
      <i data-lucide="chevron-right" class="icon icon-sm"></i>
    </div>
    <div onclick="location.href='vendeur.html'" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border);">
      <i data-lucide="store" class="icon icon-md icon-vert"></i>
      <span style="flex:1;font-size:14px;font-weight:600;">Devenir vendeur</span>
      <i data-lucide="chevron-right" class="icon icon-sm"></i>
    </div>
    <div onclick="location.href='parametres.html'" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;">
      <i data-lucide="settings" class="icon icon-md icon-vert"></i>
      <span style="flex:1;font-size:14px;font-weight:600;">Paramètres</span>
      <i data-lucide="chevron-right" class="icon icon-sm"></i>
    </div>
  </div>

  <!-- Déconnexion -->
  <button onclick="if(confirm('Se déconnecter ?')) window.RoleGuard.logout()" style="width:100%;padding:14px;background:var(--bg-card);color:var(--rouge);border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;">
    <i data-lucide="log-out" class="icon icon-sm icon-rouge"></i>
    Se déconnecter
  </button>

  <div style="text-align:center;color:var(--text-muted);font-size:11px;margin-top:20px;">
    SEN TEW v43 · © SEN ECOSYSTEM 2026
  </div>

</main>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home" class="icon icon-md"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search" class="icon icon-md"></i><span>Rechercher</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart" class="icon icon-md icon-or"></i><span>Panier</span></a>
  <a href="favoris.html"><i data-lucide="heart" class="icon icon-md"></i><span>Favoris</span></a>
  <a href="profil.html" class="active"><i data-lucide="user" class="icon icon-md icon-vert"></i><span>Profil</span></a>
</nav>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
const user = window.RoleGuard.getUser();
if(user) {
  document.getElementById('userName').textContent = user.name || 'Utilisateur SEN TEW';
  document.getElementById('userEmail').textContent = user.email || 'invite@sen-tew.com';
  document.getElementById('userWallet').textContent = (user.wallet || 500).toLocaleString('fr-FR');
  document.getElementById('userAvatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
  const roleLabels = {guest:'Invité', user:'Client', vendeur:'Vendeur', admin:'Admin'};
  document.getElementById('userRole').textContent = roleLabels[user.role] || 'Invité';
}
lucide.createIcons();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
