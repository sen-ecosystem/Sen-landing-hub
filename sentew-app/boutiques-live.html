<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lives - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'Segoe UI',-apple-system,sans-serif;overflow:hidden}
#feed{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.live{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;overflow:hidden}
.live-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 30%,transparent 55%,rgba(0,0,0,.75) 100%)}
/* ===== Barre du haut ===== */
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px 14px 0;z-index:20}
.top .tb{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.4);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);text-decoration:none}
.top .ttl{color:#fff;font-weight:800;font-size:15px;flex:1;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.live-badge{position:absolute;top:60px;left:14px;z-index:15;background:#e63946;color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:16px;display:flex;align-items:center;gap:6px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.viewers{position:absolute;top:60px;right:14px;z-index:15;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:16px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(8px)}
/* ===== Bandeau vendeur (sous le badge LIVE) ===== */
.seller{position:absolute;top:100px;left:14px;right:70px;z-index:15;display:flex;align-items:center;gap:10px;cursor:pointer}
.seller img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.seller .sn{color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.seller .sm{color:rgba(255,255,255,.85);font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.btn-follow{background:#0f6b4e;color:#fff;border:none;font-size:11px;font-weight:800;padding:8px 14px;border-radius:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);flex-shrink:0}
.btn-follow.on{background:rgba(255,255,255,.25);backdrop-filter:blur(6px)}
/* ===== Titre promo du live ===== */
.promo-title{position:absolute;left:14px;right:80px;bottom:210px;z-index:14;color:#fff;font-weight:800;font-size:14px;text-shadow:0 2px 6px rgba(0,0,0,.7);line-height:1.35}
/* ===== Commentaires ===== */
.chat-zone{position:absolute;left:14px;right:80px;bottom:150px;z-index:13;display:flex;flex-direction:column;gap:5px;max-height:130px;overflow:hidden;justify-content:flex-end}
.chat-msg{background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:7px 12px;border-radius:16px;backdrop-filter:blur(6px);max-width:85%;animation:msgIn .25s}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chat-msg b{color:#ffd166}
.chat-input{position:absolute;left:14px;right:80px;bottom:108px;z-index:14;display:flex;gap:6px}
.chat-input input{flex:1;min-width:0;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;padding:9px 14px;border-radius:22px;font-size:13px;outline:none;backdrop-filter:blur(8px);font-family:inherit}
.chat-input input::placeholder{color:rgba(255,255,255,.65)}
.chat-input button{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:none;background:#0f6b4e;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* ===== Actions droite ===== */
.side{position:absolute;right:12px;bottom:150px;z-index:15;display:flex;flex-direction:column;gap:16px;align-items:center}
.side button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:10px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.side button svg{width:28px;height:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.side button.on{color:#ff4d6d}.side button.on svg{fill:#ff4d6d}
/* ===== Barre produits (SES produits réels) ===== */
.prod-bar{position:absolute;left:0;right:0;bottom:0;z-index:16;display:flex;gap:10px;overflow-x:auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));scrollbar-width:none;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.prod-bar::-webkit-scrollbar{display:none}
.pcard{flex-shrink:0;width:150px;background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);position:relative;text-decoration:none;color:inherit;display:block}
.pcard:active{transform:scale(.96)}
.pcard img{width:100%;height:96px;object-fit:cover;display:block}
.pcard .pb{padding:8px 10px}
.pcard .pn{font-size:11px;font-weight:700;color:#1a1a1a;line-height:1.25;height:27px;overflow:hidden}
.pcard .pp{font-size:14px;font-weight:900;color:#0f6b4e;margin-top:2px}
.pcard .po{font-size:10px;color:#9aa5a0;text-decoration:line-through;margin-left:4px}
.ptag{position:absolute;top:6px;left:6px;background:#e63946;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px}
/* Flash */
.flash{position:absolute;top:148px;left:14px;z-index:14;background:linear-gradient(90deg,#e63946,#ff7b00);color:#fff;font-weight:800;font-size:11px;padding:6px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(230,57,70,.5);animation:pulse 1.2s infinite}
.loader{height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="feed"><div class="loader">Chargement des lives…</div></div>

<script>
var TITRES = {
  'aicha-couture': '👗 Nouvelle collection wax 2026 #mode #wax',
  'moussa-tech': '📱 Déstockage Tech #tech #dakar',
  'mariama-b': '💄 Routine beauté 100% naturelle #beauté',
  'fatou-fashion': '✨ Arrivage prêt-à-porter #fashion'
};
var CHATS = {
  'aicha-couture': [['Awa','Ce boubou est magnifique 😍'],['Modou','Tu livres à Thiès ?'],['Fatou','Je viens de commander ! 🔥']],
  'moussa-tech': [['Ibrahima','C\'est neuf ?'],['Aïcha','Prix du MacBook ?'],['Cheikh','Garantie incluse ? 👍']],
  'mariama-b': [['Adja','Le karité sent trop bon'],['Bineta','Résultat en combien de jours ?'],['Omar','C\'est 100% naturel ?']],
  'fatou-fashion': [('Marie'),[''],[]]
};
CHATS['fatou-fashion'] = [['Marie','Trop beau ce bazin 😍'],['Sokhna','Tu as du XXL ?'],['Jean','Commandé ! ✨']];

var feed = document.getElementById('feed');

function followKey(slug){ return 'sentew_follows'; }

function buildLive(v, prods){
  var el = document.createElement('div');
  el.className = 'live';
  var bg = (prods[0] && prods[0].images && prods[0].images[0]) || v.logo_url || '';
  var nbV = 80 + Math.floor(Math.random() * 300);

  var prodsHtml = prods.map(function(p){
    var promo = p.old_price ? '<span class="ptag">-' + Math.round((1-p.price/p.old_price)*100) + '%</span>' : '';
    return '<a class="pcard" href="' + lienProduit(p) + '">' + promo +
      '<img src="' + (p.images && p.images[0] || '') + '" alt="">' +
      '<div class="pb"><div class="pn">' + p.name + '</div>' +
      '<div><span class="pp">' + fmtPrix(p.price) + ' F</span>' +
      (p.old_price ? '<span class="po">' + fmtPrix(p.old_price) + '</span>' : '') + '</div></div></a>';
  }).join('');

  el.innerHTML =
    '<img class="live-bg" src="' + bg + '" alt="">' +
    '<div class="live-shade"></div>' +
    '<div class="top">' +
      '<button class="tb" onclick="location.href=\'index.html\'"><i data-lucide="arrow-left"></i></button>' +
      '<div class="ttl">Boutiques en direct</div>' +
      '<a class="tb" href="panier.html"><i data-lucide="shopping-cart"></i></a>' +
    '</div>' +
    '<span class="live-badge"><i data-lucide="radio" style="width:12px"></i> LIVE</span>' +
    '<span class="viewers"><i data-lucide="eye" style="width:12px"></i> <span class="vc">' + nbV + '</span></span>' +
    '<div class="seller" data-slug="' + v.slug + '">' +
      '<img src="' + (v.logo_url||'') + '" alt="">' +
      '<div style="flex:1;min-width:0">' +
        '<div class="sn">' + v.shop_name + ' <i data-lucide="badge-check" style="width:14px;color:#4ade80"></i></div>' +
        '<div class="sm">⭐ ' + v.rating + ' · ' + fmtPrix(v.followers||0) + ' abonnés</div>' +
      '</div>' +
      '<button class="btn-follow" data-follow="' + v.slug + '">+ Suivre</button>' +
    '</div>' +
    '<div class="flash">⚡ FLASH -30% · <span class="cd">04:59</span></div>' +
    '<div class="promo-title">' + (TITRES[v.slug] || '🔥 Live shopping') + '</div>' +
    '<div class="chat-zone" data-chat="' + v.slug + '"></div>' +
    '<div class="chat-input"><input type="text" placeholder="💬 Écris un commentaire…" maxlength="120"><button type="button"><i data-lucide="send" style="width:15px"></i></button></div>' +
    '<div class="side">' +
      '<button data-like><i data-lucide="heart"></i><span class="lc">' + (120 + Math.floor(Math.random()*400)) + '</span></button>' +
      '<button onclick="location.href=\'boutique.html?slug=' + v.slug + '\'"><i data-lucide="store"></i><span>Boutique</span></button>' +
      '<button data-share><i data-lucide="share-2"></i><span>Partager</span></button>' +
    '</div>' +
    '<div class="prod-bar">' + prodsHtml + '</div>';

  feed.appendChild(el);

  // Clic bandeau vendeur → SA boutique
  el.querySelector('.seller').addEventListener('click', function(e){
    if (e.target.closest('[data-follow]')) return;
    location.href = 'boutique.html?slug=' + v.slug;
  });

  // Suivre (persistant)
  var fb = el.querySelector('[data-follow]');
  if (followHas(v.slug)) { fb.textContent = '✓ Suivi'; fb.classList.add('on'); }
  fb.addEventListener('click', function(e){
    e.stopPropagation();
    var on = followToggle(v);
    fb.textContent = on ? '✓ Suivi' : '+ Suivre';
    fb.classList.toggle('on', on);
  });

  // Like
  var lb = el.querySelector('[data-like]');
  lb.addEventListener('click', function(){
    var on = lb.classList.toggle('on');
    var lc = lb.querySelector('.lc');
    lc.textContent = parseInt(lc.textContent) + (on ? 1 : -1);
  });

  // Partager
  el.querySelector('[data-share]').addEventListener('click', function(){
    var txt = '🔴 ' + v.shop_name + ' est EN LIVE sur SEN TEW ! ' + location.origin + '/sentew-app/boutiques-live.html?v=' + v.slug;
    if (navigator.share) navigator.share({title:'Live SEN TEW', text:txt}).catch(function(){});
    else if (navigator.clipboard) { navigator.clipboard.writeText(txt); toast('✓ Lien du live copié'); }
  });

  // Commentaires défilants
  var zone = el.querySelector('[data-chat]');
  var msgs = CHATS[v.slug] || [];
  var mi = 0;
  function pushMsg(who, txt){
    var d = document.createElement('div');
    d.className = 'chat-msg';
    d.innerHTML = '<b>' + who + '</b> ' + txt.replace(/</g,'&lt;');
    zone.appendChild(d);
    while (zone.children.length > 4) zone.removeChild(zone.firstChild);
  }
  msgs.slice(0,2).forEach(function(m){ pushMsg(m[0], m[1]); });
  var chatTimer = setInterval(function(){
    if (!document.body.contains(el)) { clearInterval(chatTimer); return; }
    var m = msgs[mi % msgs.length]; mi++;
    pushMsg(m[0], m[1]);
  }, 4000);

  // Envoi commentaire
  var input = el.querySelector('.chat-input input');
  var sendBtn = el.querySelector('.chat-input button');
  function send(){
    var t = input.value.trim();
    if (!t) return;
    pushMsg('Toi', t);
    input.value = '';
  }
  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });

  // Countdown flash
  var sec = 299;
  var cd = el.querySelector('.cd');
  setInterval(function(){
    if (sec > 0) sec--;
    var m = Math.floor(sec/60), s = sec%60;
    cd.textContent = m + ':' + (s<10?'0':'') + s;
  }, 1000);
}

// ===== Chargement : vendeurs réels + leurs vrais produits =====
getVendors().then(async function(vendors){
  if (!vendors || !vendors.length) {
    feed.innerHTML = '<div class="loader">Aucun live pour le moment</div>';
    return;
  }
  feed.innerHTML = '';
  // Ordre : vendeur demandé (?v=slug) en premier
  var want = new URLSearchParams(location.search).get('v');
  if (want) vendors.sort(function(a,b){ return a.slug === want ? -1 : b.slug === want ? 1 : 0; });

  for (var i = 0; i < vendors.length; i++) {
    var prods = await getProducts(vendors[i].id);
    buildLive(vendors[i], prods || []);
  }
  lucide.createIcons();
  cartBadge();
});
lucide.createIcons();
</script>
<script src="js/dark-mode.js"></script>
</body>
</html>
