<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Connexion - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/security-shield.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f0;font-family:'Segoe UI',-apple-system,sans-serif;color:#0a1f17;min-height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb}
.topbar img{height:30px}
.topbar h1{font-size:14px;font-weight:900;color:#0f6b4e;flex:1}
.topbar a{color:#9aa5a0;text-decoration:none;font-size:13px;font-weight:700}
.wrap{max-width:440px;margin:0 auto;padding:18px 16px 40px}
.hero{background:linear-gradient(160deg,#0a1f17,#0f6b4e);border-radius:18px;color:#fff;padding:24px 18px;text-align:center;margin-bottom:16px}
.hero img{height:44px;margin-bottom:10px}
.hero h2{font-size:20px;font-weight:900;margin-bottom:5px}
.hero p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.mode{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:14px}
.mode button{flex:1;padding:10px;border:none;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;background:transparent;color:#6b7280;display:flex;align-items:center;justify-content:center;gap:6px}
.mode button svg{width:14px;height:14px}
.mode button.on{background:#fff;color:#0f6b4e;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:800;margin-bottom:5px;color:#374151}
.field input{width:100%;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;font-family:inherit}
.field input:focus{outline:none;border-color:#0f6b4e}
.tel{display:flex;gap:8px}
.tel select{width:105px;padding:13px 8px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:13px;background:#fff}
.tel input{flex:1;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:46px}
.pwd-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#9aa5a0;display:flex;align-items:center}
.pwd-eye svg{width:18px;height:18px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;background:#0f6b4e;color:#fff;font-size:14px;font-weight:900;cursor:pointer}
.btn:disabled{background:#9aa5a0}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:10px;font-weight:800;color:#9aa5a0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
.btn-google{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:12px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;color:#1f2937}
.err{display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:12px;padding:11px 13px;font-size:12px;font-weight:700;margin-bottom:12px;line-height:1.5}
.register-link{text-align:center;margin-top:16px;font-size:12.5px;color:#6b7280}
.register-link a{color:#0f6b4e;font-weight:800;text-decoration:none}
.pro-links{display:flex;gap:9px;margin-top:14px}
.pro-links a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:12px;font-size:11px;font-weight:800;text-decoration:none;border:1.5px solid #e5e7eb;color:#374151;background:#fff}
.pro-links a svg{width:14px;height:14px;color:#0f6b4e}
</style>
</head>
<body>
<div class="topbar">
  <img src="assets/Logo.png" alt="SEN TEW" onerror="this.style.display='none'">
  <h1>Connexion</h1>
  <a href="index.html">✕</a>
</div>
<div class="wrap">
  <div class="err" id="err"></div>
  <div class="hero">
    <img src="assets/Logo.png" alt="" onerror="this.style.display='none'">
    <h2>Bon retour !</h2>
    <p>Connecte-toi pour commander partout en Afrique.</p>
  </div>
  <div class="card">
    <div class="mode">
      <button id="mEmail" class="on" onclick="setMode('email')"><i data-lucide="mail"></i> Email</button>
      <button id="mPhone" onclick="setMode('phone')"><i data-lucide="smartphone"></i> Téléphone</button>
    </div>
    <div class="field" id="fEmail"><label>Email</label><input id="lEmail" type="email" placeholder="exemple@mail.com" autocomplete="email"></div>
    <div class="field" id="fPhone" style="display:none"><label>Téléphone</label>
      <div class="tel">
        <select id="lInd">
          <option value="+221">🇸🇳 +221</option><option value="+33">🇫🇷 +33</option><option value="+1">🇺🇸 +1</option><option value="+44">🇬🇧 +44</option><option value="+225">🇨🇮 +225</option><option value="+223">🇲🇱 +223</option><option value="+224">🇬🇳 +224</option><option value="+220">🇬🇲 +220</option><option value="+245">🇬🇼 +245</option><option value="+222">🇲🇷 +222</option><option value="+226">🇧🇫 +226</option><option value="+32">🇧🇪 +32</option><option value="+41">🇨🇭 +41</option><option value="+34">🇪🇸 +34</option><option value="+39">🇮🇹 +39</option><option value="+212">🇲🇦 +212</option><option value="+216">🇹🇳 +216</option><option value="+237">🇨🇲 +237</option><option value="+228">🇹🇬 +228</option><option value="+229">🇧🇯 +229</option><option value="+227">🇳🇪 +227</option>
        </select>
        <input id="lTel" type="tel" placeholder="77 000 00 00">
      </div>
    </div>
    <div class="field"><label>Mot de passe</label>
      <div class="pwd-wrap">
        <input id="lPwd" type="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="pwd-eye" onclick="togglePwd()"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Se connecter</button>
    <div class="divider"><span>OU CONTINUE AVEC</span></div>
    <button type="button" class="btn-google" onclick="googleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continuer avec Google
    </button>
  </div>
  <div class="pro-links">
    <a href="devenir-vendeur.html"><i data-lucide="store"></i> Vendre sur SEN TEW</a>
    <a href="register-livreur.html"><i data-lucide="bike"></i> Devenir livreur</a>
  </div>
  <div class="register-link">Pas de compte ? <a href="register.html">S'inscrire →</a></div>
</div>
<script>
lucide.createIcons();
var SUPA_URL='https://tjqkruhwmjzgfvtouqza.supabase.co';
var SUPA_KEY='sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j';
var MODE='email';
function v(id){return (document.getElementById(id).value||'').trim();}
function err(m){var e=document.getElementById('err');e.textContent='⚠ '+m;e.style.display=m?'block':'none';window.scrollTo(0,0);}
function togglePwd(){var i=document.getElementById('lPwd');i.type=i.type==='password'?'text':'password';}
function setMode(m){
  MODE=m;
  document.getElementById('mEmail').classList.toggle('on',m==='email');
  document.getElementById('mPhone').classList.toggle('on',m==='phone');
  document.getElementById('fEmail').style.display=m==='email'?'block':'none';
  document.getElementById('fPhone').style.display=m==='phone'?'block':'none';
  err('');
}
async function sha256(m){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
function googleLogin(){location.href=SUPA_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname.replace('login.html','auth-callback.html')+'?role=generic');}
async function findIn(table,field,value){
  var r=await fetch(SUPA_URL+'/rest/v1/'+table+'?'+field+'=eq.'+encodeURIComponent(value)+'&select=*',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
  var rows=await r.json();
  return rows&&rows.length?rows[0]:null;
}
/* ══════════ Connexion clients (table users) — sécurisée via RPC (email: user_login / téléphone: user_login_phone).
   La vérification du mot de passe se fait désormais côté serveur : password_hash n'est plus jamais lu par le navigateur. ══════════ */
async function loginAsClient(field,idValue,hash){
  var fn=field==='email'?'user_login':'user_login_phone';
  var body=field==='email'?{p_email:idValue,p_password_hash:hash}:{p_phone:idValue,p_password_hash:hash};
  var r=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var rows=await r.json();
  if(r.ok&&Array.isArray(rows)&&rows.length)return rows[0];
  return null;
}
async function doLogin(){
  var pwd=v('lPwd');
  if(pwd.length<1)return err('Entre ton mot de passe.');
  var idValue,field;
  if(MODE==='email'){
    idValue=v('lEmail').toLowerCase();field='email';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(idValue))return err('Email invalide.');
  }else{
    idValue=v('lInd')+v('lTel').replace(/\D/g,'');field='phone';
    if(idValue.replace(/\D/g,'').length<10)return err('Numéro invalide.');
  }
  var btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Connexion…';
  try{
    var hash=await sha256(pwd);

    /* 1) Clients (table users) : vérification sécurisée côté serveur */
    var u=await loginAsClient(field,idValue,hash);
    if(u){
      sessionStorage.setItem('sentew_user',JSON.stringify({id:u.id,email:u.email||'',full_name:u.full_name||u.shop_name||'',role:'client',ts:Date.now()}));
      location.href='index.html';
      return;
    }

    /* 2) Vendeurs / Livreurs : recherche directe (à sécuriser prochainement comme la table users) */
    var tables=[['vendors','vendeur'],['drivers','livreur']];
    for(var i=0;i<tables.length;i++){
      var uu=await findIn(tables[i][0],field,idValue);
      if(uu){
        if(uu.password_hash!==hash){btn.disabled=false;btn.textContent='Se connecter';return err('Mot de passe incorrect.');}
        if(uu.status==='pending'){btn.disabled=false;btn.textContent='Se connecter';return err('Ton compte est en cours de validation par l\'équipe SEN TEW (24-48h).');}
        if(uu.status==='suspended'||uu.status==='archived'){btn.disabled=false;btn.textContent='Se connecter';return err('Compte suspendu. Contacte le support.');}
        sessionStorage.setItem('sentew_user',JSON.stringify({id:uu.id,email:uu.email||'',full_name:uu.full_name||uu.shop_name||'',role:tables[i][1],ts:Date.now()}));
        location.href=tables[i][1]==='vendeur'?'vendeur.html':'livreur.html';
        return;
      }
    }
    btn.disabled=false;btn.textContent='Se connecter';
    err('Aucun compte trouvé. Vérifie tes informations ou inscris-toi.');
  }catch(e){btn.disabled=false;btn.textContent='Se connecter';err('Erreur réseau. Réessaie.');}
}
document.getElementById('lPwd').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
</script>
  <script src="js/i18n.js"></script>
</body>
</html>
