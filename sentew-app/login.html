<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion - SEN TEW</title>
<style>
:root{--v:#00a651;--j:#fcd116;--r:#e31b23;--o:#b8863a}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',sans-serif}
body{background:linear-gradient(180deg,#f8fbf9 0%,#fff 40%);min-height:100vh;color:#222;padding:0 24px;padding-top:env(safe-area-inset-top,20px);padding-bottom:env(safe-area-inset-bottom,20px)}
.logo-block{text-align:center;padding:40px 0 24px}
.logo-crown{font-size:60px;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(252,209,22,.4))}
.logo-name{color:var(--v);font-size:32px;font-weight:900;letter-spacing:2px}
.logo-tagline{color:var(--o);font-size:13px;font-weight:600;margin-top:4px;letter-spacing:1px}

.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.06)}
.title{font-size:22px;font-weight:800;color:#222;margin-bottom:6px}
.subtitle{font-size:14px;color:#666;margin-bottom:22px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#666;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.input-wrap{position:relative}
.input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#999}
.field input{width:100%;border:2px solid #e8e8e8;padding:14px 14px 14px 42px;border-radius:12px;font-size:15px;color:#222;background:#fafafa;outline:none;transition:.2s}
.field input:focus{border-color:var(--v);background:#fff;box-shadow:0 0 0 4px rgba(0,166,81,.08)}
.eye-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;color:#999}

.forgot{display:block;text-align:right;color:var(--v);font-size:13px;font-weight:600;text-decoration:none;margin:-6px 0 16px}

.login-btn{width:100%;background:linear-gradient(135deg,var(--v),#008a44);color:#fff;border:none;padding:16px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,166,81,.3);transition:.2s}
.login-btn:active{transform:scale(.98)}

.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#999;font-size:12px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e0e0e0}

.social-btns{display:grid;gap:10px}
.social{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid #e8e8e8;background:#fff;color:#222;transition:.2s}
.social:active{transform:scale(.98)}
.social.google{border-color:#e0e0e0}
.social.apple{background:#000;color:#fff;border-color:#000}
.social.facebook{background:#1877f2;color:#fff;border-color:#1877f2}
.social-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}

.signup-link{text-align:center;margin-top:20px;font-size:14px;color:#666}
.signup-link a{color:var(--v);font-weight:700;text-decoration:none}

.guest-link{text-align:center;margin-top:12px}
.guest-link a{color:#999;font-size:13px;text-decoration:underline}

/* 2FA MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:20px;padding:24px;max-width:400px;width:100%;text-align:center}
.modal-icon{font-size:48px;margin-bottom:10px}
.modal h3{font-size:20px;font-weight:800;margin-bottom:6px}
.modal p{font-size:13px;color:#666;margin-bottom:20px}
.otp-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.otp-row input{width:46px;height:56px;border:2px solid #e0e0e0;border-radius:12px;font-size:22px;font-weight:800;text-align:center;color:#222;background:#fafafa}
.otp-row input:focus{border-color:var(--v);outline:none;background:#fff}
.resend{color:var(--v);font-size:13px;font-weight:600;margin-top:12px;cursor:pointer;background:none;border:none}
</style></head><body>

<div class="logo-block">
  <div class="logo-crown">👑</div>
  <div class="logo-name">SEN TEW</div>
  <div class="logo-tagline">AFRICAN MARKETPLACE</div>
</div>

<div class="card">
  <div class="title">Bon retour ! 👋</div>
  <div class="subtitle">Connectez-vous à votre compte SEN TEW</div>

  <form onsubmit="doLogin(event)">
    <div class="field">
      <label>Email ou téléphone</label>
      <div class="input-wrap">
        <span class="icon">📧</span>
        <input type="text" required placeholder="ousseynou@example.com ou +221 77 XXX XX XX">
      </div>
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input id="pwd" type="password" required placeholder="••••••••" minlength="6">
        <button type="button" class="eye-btn" onclick="togglePwd()">👁️</button>
      </div>
    </div>

    <a href="mot-de-passe-oublie.html" class="forgot">Mot de passe oublié ?</a>

    <button class="login-btn" type="submit">SE CONNECTER →</button>
  </form>

  <div class="divider">OU</div>

  <div class="social-btns">
    <button class="social google" onclick="socialLogin('google')">
      <span class="social-icon">🇬</span> Continuer avec Google
    </button>
    <button class="social apple" onclick="socialLogin('apple')">
      <span class="social-icon">🍎</span> Continuer avec Apple
    </button>
    <button class="social facebook" onclick="socialLogin('facebook')">
      <span class="social-icon">f</span> Continuer avec Facebook
    </button>
  </div>

  <div class="signup-link">
    Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
  </div>

  <div class="guest-link">
    <a href="login-guest.html">Continuer en tant qu'invité →</a>
  </div>
</div>

<!-- MODAL 2FA -->
<div class="modal" id="modal2fa">
  <div class="modal-content">
    <div class="modal-icon">📱</div>
    <h3>Vérification 2FA</h3>
    <p>Entrez le code à 6 chiffres reçu par SMS<br><strong>+221 77 ••• •• 45</strong></p>
    <div class="otp-row">
      <input maxlength="1" oninput="nextOtp(this,0)">
      <input maxlength="1" oninput="nextOtp(this,1)">
      <input maxlength="1" oninput="nextOtp(this,2)">
      <input maxlength="1" oninput="nextOtp(this,3)">
      <input maxlength="1" oninput="nextOtp(this,4)">
      <input maxlength="1" oninput="nextOtp(this,5)">
    </div>
    <button class="login-btn" onclick="verifyOtp()">Vérifier</button>
    <button class="resend" onclick="alert('📩 Code renvoyé au +221 77 ••• •• 45')">↻ Renvoyer le code</button>
  </div>
</div>

<script>
function togglePwd(){
  const p = document.getElementById('pwd');
  p.type = p.type === 'password' ? 'text' : 'password';
}
function doLogin(e){
  e.preventDefault();
  // Simule 2FA
  document.getElementById('modal2fa').classList.add('show');
}
function nextOtp(el,i){
  if(el.value && i<5){
    document.querySelectorAll('.otp-row input')[i+1].focus();
  }
  const all = [...document.querySelectorAll('.otp-row input')].map(x=>x.value).join('');
  if(all.length===6) verifyOtp();
}
function verifyOtp(){
  const code = [...document.querySelectorAll('.otp-row input')].map(x=>x.value).join('');
  if(code.length !== 6){alert('Code incomplet');return}
  localStorage.setItem('sentew_logged','1');
  localStorage.setItem('sentew_role','client');
  alert('✅ Connexion réussie !');
  location.href = 'index.html';
}
function socialLogin(provider){
  const names = {google:'Google',apple:'Apple',facebook:'Facebook'};
  if(confirm('Se connecter avec '+names[provider]+' ?')){
    localStorage.setItem('sentew_logged','1');
    localStorage.setItem('sentew_role','client');
    location.href = 'index.html';
  }
}
</script>
</body></html>
