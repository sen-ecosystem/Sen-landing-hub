<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - SEN TEW</title>
  <link rel="stylesheet" href="css/app.css?v=52">
  <style>
    body { background: linear-gradient(135deg, #0f6b4e, #0a4d38); margin: 0; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
    .logo { text-align: center; color: #fff; margin-bottom: 24px; }
    .logo h1 { color: #fff; margin: 0; font-size: 32px; font-weight: 900; }
    .logo p { color: #d4a574; font-size: 13px; margin: 4px 0 0; }
    .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .card h2 { color: #0f6b4e; margin: 0 0 16px; font-size: 20px; text-align: center; }
    .field { margin-bottom: 14px; }
    .label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .input { width: 100%; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    .forgot { text-align: right; margin-top: 6px; font-size: 12px; }
    .forgot a { color: #0f6b4e; text-decoration: none; font-weight: 600; }
    .btn { width: 100%; background: linear-gradient(135deg, #0f6b4e, #0a4d38); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .divider { text-align: center; margin: 16px 0; color: #999; font-size: 12px; }
    .social { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .social-btn { padding: 10px; border: 1.5px solid #e5e7eb; border-radius: 10px; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    .register { text-align: center; margin-top: 14px; font-size: 13px; }
    .register a { color: #0f6b4e; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

<div class="logo">
  <h1>SEN TEW</h1>
  <p>Marketplace du Sénégal</p>
</div>

<div class="card">
  <h2>Connexion</h2>

  <div class="field">
    <label class="label">Email ou téléphone</label>
    <input type="text" class="input" placeholder="hello@sen-tew.com">
  </div>

  <div class="field">
    <label class="label">Mot de passe</label>
    <input type="password" class="input" placeholder="••••••••">
    <div class="forgot"><a href="forgot-password.html">Mot de passe oublié ?</a></div>
  </div>

  <button class="btn" onclick="location.href='index.html'">Se connecter</button>

  <div class="divider">— ou —</div>

  <div class="social">
    <button class="social-btn">Google</button>
    <button class="social-btn">Facebook</button>
  </div>

  <div class="register">Pas de compte ? <a href="register.html">S'inscrire</a></div>
</div>

</body>
</html>
