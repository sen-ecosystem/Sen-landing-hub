<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Connexion · SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css?v=46">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/dark-mode.js?v=46" defer></script>
<style>
body{background:linear-gradient(135deg,#f5f5f0 0%,#c8f0d8 100%);min-height:100vh;margin:0;font-family:-apple-system,'Segoe UI',sans-serif}
.auth-wrap{max-width:420px;margin:0 auto;padding:32px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.auth-logo{text-align:center;margin-bottom:32px}
.auth-logo .badge{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#0f6b4e 0%,#d4a574 100%);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;box-shadow:0 8px 24px rgba(15,107,78,0.3);margin-bottom:16px}
.auth-logo h1{color:#0f6b4e;font-size:28px;font-weight:900;margin:0;letter-spacing:1px}
.auth-logo p{color:#a67c3a;font-weight:600;margin:4px 0 0;font-size:14px;letter-spacing:2px}
.auth-card{background:#ffffff;border-radius:24px;padding:28px 24px;box-shadow:0 20px 60px rgba(15,107,78,0.15)}
.auth-card h2{color:#0a1f17;font-size:22px;margin:0 0 6px;font-weight:800}
.auth-card .sub{color:#4a5a52;font-size:14px;margin:0 0 24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:#4a5a52;margin-bottom:6px;letter-spacing:.3px}
.field .input-wrap{position:relative;display:flex;align-items:center}
.field .input-wrap i{position:absolute;left:14px;color:#0f6b4e}
.field input{width:100%;padding:14px 14px 14px 42px;border:1.5px solid #e5e5e0;border-radius:12px;font-size:15px;background:#f5f5f0;color:#0a1f17;box-sizing:border-box;transition:.2s}
.field input:focus{border-color:#0f6b4e;background:#ffffff;outline:2px solid #c8f0d8}
.field .toggle-pass{position:absolute;right:14px;color:#4a5a52;background:none;border:none;cursor:pointer;padding:4px}
.opts-row{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.opts-row label{display:flex;align-items:center;gap:6px;font-size:13px;color:#4a5a52;cursor:pointer}
.opts-row a{color:#0f6b4e;font-size:13px;font-weight:700;text-decoration:none}
.btn-connect{width:100%;background:linear-gradient(135deg,#0f6b4e,#0a4d38);color:#fff;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px rgba(15,107,78,0.3)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#4a5a52;font-size:12px}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:#e5e5e0}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.social button{padding:12px;border:1.5px solid #e5e5e0;background:#fff;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:#0a1f17}
.footer-auth{text-align:center;margin-top:20px;color:#4a5a52;font-size:14px}
.footer-auth a{color:#0f6b4e;font-weight:800;text-decoration:none}
.guest-link{text-align:center;margin-top:16px}
.guest-link a{color:#a67c3a;font-size:13px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <div class="badge">SEN<br>TEW</div>
    <h1>SEN TEW</h1>
    <p>MARKETPLACE</p>
  </div>

  <div class="auth-card">
    <h2>Bienvenue 👋</h2>
    <p class="sub">Connectez-vous pour continuer vos achats</p>

    <form onsubmit="event.preventDefault();window.RoleGuard?.login('email')">
      <div class="field">
        <label>Email ou téléphone</label>
        <div class="input-wrap">
          <i data-lucide="mail"></i>
          <input type="text" placeholder="karim@example.com" required>
        </div>
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <div class="input-wrap">
          <i data-lucide="lock"></i>
          <input type="password" id="pwd" placeholder="••••••••" required>
          <button type="button" class="toggle-pass" onclick="const p=document.getElementById('pwd');p.type=p.type==='password'?'text':'password'"><i data-lucide="eye"></i></button>
        </div>
      </div>

      <div class="opts-row">
        <label><input type="checkbox"> Se souvenir de moi</label>
        <a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn-connect">
        <i data-lucide="log-in"></i> Se connecter
      </button>
    </form>

    <div class="divider">ou continuer avec</div>

    <div class="social">
      <button><i data-lucide="smartphone" style="color:#0f6b4e"></i> Wave</button>
      <button><i data-lucide="smartphone" style="color:#f97316"></i> Orange Money</button>
    </div>
  </div>

  <p class="footer-auth">
    Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
  </p>
  <p class="guest-link">
    <a href="login-guest.html"><i data-lucide="user"></i> Continuer en tant qu'invité</a>
  </p>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
