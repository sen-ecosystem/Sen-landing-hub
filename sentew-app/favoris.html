<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Favoris - SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
  <button class="btn-back" onclick="history.back()">
    <i data-lucide="arrow-left" class="icon icon-md icon-vert"></i>
  </button>
  <h1 style="display:flex;align-items:center;gap:8px;">
    <i data-lucide="heart" class="icon icon-md icon-rouge"></i>
    Mes favoris
  </h1>
  <button class="icon-btn" data-theme-toggle onclick="toggleTheme()">
    <i data-lucide="moon" class="icon icon-md icon-vert"></i>
  </button>
  <button class="icon-btn" onclick="clearAll()">
    <i data-lucide="trash-2" class="icon icon-md icon-rouge"></i>
  </button>
</header>

<div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
  <span id="countFav" style="font-size:12px;color:var(--text-muted);">0 produits sauvegardés</span>
  <select id="sortBy" style="width:auto;padding:6px 10px;font-size:11px;">
    <option value="recent">Récents</option>
    <option value="price-asc">Prix ↑</option>
    <option value="price-desc">Prix ↓</option>
    <option value="rating">Meilleures notes</option>
  </select>
</div>

<main style="padding:0 16px 100px;">
  <div id="favGrid" class="pcard-grid"></div>
</main>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home" class="icon icon-md"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search" class="icon icon-md"></i><span>Rechercher</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart" class="icon icon-md icon-or"></i><span>Panier</span></a>
  <a href="favoris.html" class="active"><i data-lucide="heart" class="icon icon-md icon-rouge"></i><span>Favoris</span></a>
  <a href="profil.html"><i data-lucide="user" class="icon icon-md"></i><span>Profil</span></a>
</nav>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
const ALL_PRODUCTS = [
  {id:1,name:'Robe wax mariage',price:35000,image:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400',seller:'Aïcha Couture',rating:4.9},
  {id:2,name:'Sandales cuir Peul',price:8500,image:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400',seller:'Aïcha Couture',rating:4.7},
  {id:3,name:'Boubou grand teint',price:45000,image:'https://images.unsplash.com/photo-1544441893-675973e31985?w=400',seller:'Aïcha Couture',rating:4.8},
  {id:4,name:'Sac cuir africain premium',price:15000,image:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=400',seller:'Aïcha Couture',rating:4.9},
  {id:5,name:'iPhone 15 Pro 256GB',price:750000,image:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=400',seller:'Moussa Tech',rating:4.9},
  {id:6,name:'Écouteurs sans fil Pro',price:12000,image:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400',seller:'Moussa Tech',rating:4.6},
  {id:7,name:'Beurre karité 500g',price:4500,image:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=400',seller:'Ibrahim Bio',rating:4.9},
  {id:8,name:'Masque visage bio',price:6500,image:'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=400',seller:'Mariama Beauté',rating:4.8},
  {id:9,name:'Bracelet ethnique perles',price:5500,image:'https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=400',seller:'Aïcha Couture',rating:4.7},
  {id:10,name:'Chemise brodée homme',price:12000,image:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400',seller:'Aïcha Couture',rating:4.6},
  {id:11,name:'Montre connectée Sport',price:35000,image:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400',seller:'Moussa Tech',rating:4.7},
  {id:12,name:'Robe bogolan traditionnelle',price:22000,image:'https://images.unsplash.com/photo-1585487000160-6ebcfceb0d03?w=400',seller:'Aïcha Couture',rating:5.0},
  {id:13,name:'Huile argan bio 100ml',price:7500,image:'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=400',seller:'Mariama Beauté',rating:4.9},
  {id:14,name:'Samsung Galaxy S24',price:520000,image:'https://images.unsplash.com/photo-1611791484670-ce19b801d192?w=400',seller:'Moussa Tech',rating:4.8},
  {id:15,name:'Pagne wax authentique',price:18000,image:'https://images.unsplash.com/photo-1583391733956-6c78276477e2?w=400',seller:'Fatou Fashion',rating:4.7},
  {id:16,name:'Miel bio Casamance',price:6000,image:'https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=400',seller:'Ibrahim Bio',rating:5.0},
  {id:17,name:'Enceinte Bluetooth JBL',price:45000,image:'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400',seller:'Moussa Tech',rating:4.8},
  {id:18,name:'Bijoux dorés collection',price:8000,image:'https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=400',seller:'Aïcha Couture',rating:4.6},
  {id:19,name:'Café Touba premium 500g',price:5000,image:'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=400',seller:'Ibrahim Bio',rating:4.9},
  {id:20,name:'Tapis berbère fait main',price:65000,image:'https://images.unsplash.com/photo-1600166898405-da9535204843?w=400',seller:'Artisans du Sud',rating:5.0}
];

// Init démo : tous les 20 en favoris
if(!localStorage.getItem('favs')) {
  localStorage.setItem('favs', JSON.stringify(ALL_PRODUCTS.map(p => p.id)));
}

function getFavs() {
  const favIds = JSON.parse(localStorage.getItem('favs')||'[]');
  let favs = ALL_PRODUCTS.filter(p => favIds.includes(p.id));
  const sort = document.getElementById('sortBy').value;
  if(sort === 'price-asc') favs.sort((a,b)=>a.price-b.price);
  else if(sort === 'price-desc') favs.sort((a,b)=>b.price-a.price);
  else if(sort === 'rating') favs.sort((a,b)=>b.rating-a.rating);
  return favs;
}

function renderFavs() {
  const favs = getFavs();
  document.getElementById('countFav').textContent = favs.length + ' produit' + (favs.length > 1 ? 's' : '') + ' sauvegardé' + (favs.length > 1 ? 's' : '');

  if(favs.length === 0) {
    document.getElementById('favGrid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;">
        <i data-lucide="heart" class="icon icon-xl icon-rouge" style="opacity:0.3;"></i>
        <h2 style="margin-top:16px;color:var(--text);">Aucun favori</h2>
        <p style="color:var(--text-muted);margin:12px 0 24px;font-size:13px;">Ajoutez vos coups de cœur ici</p>
        <button class="btn-primary" onclick="location.href='index.html'">Découvrir</button>
      </div>
    `;
    lucide.createIcons();
    return;
  }

  document.getElementById('favGrid').innerHTML = favs.map(p => `
    <a href="produit.html?id=${p.id}" class="pcard" style="text-decoration:none;color:inherit;">
      <div class="pcard-img">
        <button class="pcard-fav" onclick="event.preventDefault();event.stopPropagation();removeFav(${p.id});">
          <i data-lucide="heart" class="icon icon-sm icon-rouge" style="fill:currentColor;"></i>
        </button>
        <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200x200/0f6b4e/ffffff?text=SEN'">
      </div>
      <div class="pcard-info">
        <div class="pcard-name">${p.name}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;">${p.seller}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="pcard-price">${p.price.toLocaleString('fr-FR')} FCFA</div>
          <div style="display:flex;align-items:center;gap:2px;font-size:11px;color:var(--or-royal);">
            <i data-lucide="star" class="icon icon-sm icon-or" style="width:11px;height:11px;"></i>
            ${p.rating}
          </div>
        </div>
      </div>
    </a>
  `).join('');
  lucide.createIcons();
}

function removeFav(id) {
  let favs = JSON.parse(localStorage.getItem('favs')||'[]');
  favs = favs.filter(x => x !== id);
  localStorage.setItem('favs', JSON.stringify(favs));
  if(navigator.vibrate) navigator.vibrate(20);
  renderFavs();
}

function clearAll() {
  if(confirm('Supprimer tous les favoris ?')) {
    localStorage.setItem('favs','[]');
    renderFavs();
  }
}

document.getElementById('sortBy').addEventListener('change', renderFavs);
renderFavs();
</script>
<script>lucide.createIcons();</script>
  <!-- Cookies & Promo (v46) -->
<script src="js/cookies-modal.js?v=46" defer></script>
<script src="js/promo-banner.js?v=46" defer></script>
</body>
</html>
