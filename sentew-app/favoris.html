<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Favoris - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F6B4E">
<link rel="stylesheet" href="css/app.css">
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div class="app-logo" style="text-align:center;">❤️ Mes favoris</div>
    <button class="header-btn" onclick="alert('🔍 Filtrer')">⚙</button>
  </header>

  <main class="app-content">
    <div style="padding:12px 16px;color:rgba(255,255,255,.6);font-size:12px;">
      <span id="count">12</span> produits sauvegardés
    </div>
    <div class="grid" id="grid"></div>
    <div style="height:20px;"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">📊</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html" class="active"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script src="js/data.js"></script>
<script>
const list = (typeof products !== 'undefined' ? products : (typeof produits !== 'undefined' ? produits : [])).slice(0,12);
document.getElementById('count').textContent=list.length;
document.getElementById('grid').innerHTML=list.map(p=>`
  <a href="produit.html?id=${p.id}" class="product-card">
    <div class="card-image-wrap">
      <span class="card-fav" style="background:#ef4444;">❤️</span>
      <img src="${p.image||p.img||''}" alt="${p.name||p.nom||''}">
    </div>
    <div class="card-info">
      <div class="card-name">${p.name||p.nom||'Produit'}</div>
      <div class="card-price">${Number(p.price||p.prix||0).toLocaleString()} FCFA</div>
      <div class="card-rating">⭐ ${p.rating||'4.8'}</div>
    </div>
  </a>
`).join('') || '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(255,255,255,.6);"><div style="font-size:60px;">❤️</div><div>Aucun favori</div></div>';
</script>
</body>
</html>
