<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoris - SEN TEW</title>
  <link rel="stylesheet" href="css/app.css?v=52">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #f5f5f0; margin: 0; font-family: -apple-system, sans-serif; padding-bottom: 80px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .topbar h1 { color: #0f6b4e; font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; color: #0f6b4e; }
    .tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600; color: #666; cursor: pointer; }
    .tab.active { color: #0f6b4e; border-bottom: 2px solid #0f6b4e; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
    .pcard { background: #fff; border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; }
    .pimg { height: 120px; background: #f5f5f0; display: flex; align-items: center; justify-content: center; position: relative; }
    .pimg i { color: #d4a574; width: 40px; height: 40px; }
    .heart { position: absolute; top: 8px; right: 8px; background: #fff; border: none; padding: 6px; border-radius: 50%; color: #dc2626; }
    .pinfo { padding: 10px; }
    .pname { font-size: 12px; font-weight: 600; height: 32px; overflow: hidden; }
    .pprice { color: #0f6b4e; font-weight: 800; font-size: 14px; }
    .pstars { color: #d4a574; font-size: 10px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e5e7eb; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #666; font-size: 11px; }
    .bottom-nav a.active { color: #0f6b4e; }
    .bottom-nav a i { width: 22px; height: 22px; }
  </style>
</head>
<body class="light-mode">

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <h1><i data-lucide="heart"></i> Mes Favoris</h1>
  <button class="icon-btn"><i data-lucide="share-2"></i></button>
</header>

<div class="tabs">
  <div class="tab active">Produits (8)</div>
  <div class="tab">Boutiques (3)</div>
</div>

<div class="grid">
  <a href="produit-detail.html?id=1" class="pcard">
    <div class="pimg">
      <i data-lucide="smartphone"></i>
      <button class="heart"><i data-lucide="heart" style="width:14px;height:14px;fill:currentColor"></i></button>
    </div>
    <div class="pinfo">
      <div class="pname">iPhone 15 Pro 256GB</div>
      <div class="pprice">850k FCFA</div>
      <div class="pstars">★★★★★ (89)</div>
    </div>
  </a>
  <a href="produit-detail.html?id=2" class="pcard">
    <div class="pimg">
      <i data-lucide="headphones"></i>
      <button class="heart"><i data-lucide="heart" style="width:14px;height:14px;fill:currentColor"></i></button>
    </div>
    <div class="pinfo">
      <div class="pname">AirPods Pro 2</div>
      <div class="pprice">145k FCFA</div>
      <div class="pstars">★★★★★ (156)</div>
    </div>
  </a>
  <a href="produit-detail.html?id=3" class="pcard">
    <div class="pimg">
      <i data-lucide="laptop"></i>
      <button class="heart"><i data-lucide="heart" style="width:14px;height:14px;fill:currentColor"></i></button>
    </div>
    <div class="pinfo">
      <div class="pname">MacBook Air M2</div>
      <div class="pprice">1.2M FCFA</div>
      <div class="pstars">★★★★☆ (42)</div>
    </div>
  </a>
  <a href="produit-detail.html?id=4" class="pcard">
    <div class="pimg">
      <i data-lucide="watch"></i>
      <button class="heart"><i data-lucide="heart" style="width:14px;height:14px;fill:currentColor"></i></button>
    </div>
    <div class="pinfo">
      <div class="pname">Apple Watch S9</div>
      <div class="pprice">380k FCFA</div>
      <div class="pstars">★★★★★ (67)</div>
    </div>
  </a>
</div>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
  <a href="categories.html"><i data-lucide="grid"></i><span>Catégories</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
  <a href="messages.html"><i data-lucide="message-circle"></i><span>Messages</span></a>
  <a href="profil.html" class="active"><i data-lucide="user"></i><span>Profil</span></a>
</nav>

<script>lucide.createIcons();</script>
</body>
</html>
