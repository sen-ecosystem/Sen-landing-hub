<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer mot de passe - SEN TEW</title>
  <link rel="stylesheet" href="css/app.css?v=52">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #f5f5f0; margin: 0; font-family: -apple-system, sans-serif; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .topbar h1 { color: #0f6b4e; font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; color: #0f6b4e; }
    .card { background: #fff; margin: 16px; padding: 20px; border-radius: 12px; }
    .field { margin-bottom: 14px; }
    .label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .input { width: 100%; padding: 12px; padding-right: 40px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; }
    .rules { background: #f5f5f0; padding: 12px; border-radius: 8px; margin: 14px 0; font-size: 12px; color: #666; }
    .btn { width: 100%; background: linear-gradient(135deg, #0f6b4e, #0a4d38); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body class="light-mode">

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <h1><i data-lucide="lock"></i> Changer mot de passe</h1>
</header>

<div class="card">
  <div class="field">
    <label class="label">Mot de passe actuel</label>
    <div class="input-wrap">
      <input type="password" class="input" id="p1">
      <button class="eye" onclick="toggle('p1')"><i data-lucide="eye"></i></button>
    </div>
  </div>

  <div class="field">
    <label class="label">Nouveau mot de passe</label>
    <div class="input-wrap">
      <input type="password" class="input" id="p2">
      <button class="eye" onclick="toggle('p2')"><i data-lucide="eye"></i></button>
    </div>
  </div>

  <div class="field">
    <label class="label">Confirmer nouveau mot de passe</label>
    <div class="input-wrap">
      <input type="password" class="input" id="p3">
      <button class="eye" onclick="toggle('p3')"><i data-lucide="eye"></i></button>
    </div>
  </div>

  <div class="rules">
    <strong>Règles :</strong>
    <ul>
      <li>8 caractères minimum</li>
      <li>1 majuscule</li>
      <li>1 chiffre</li>
      <li>1 caractère spécial</li>
    </ul>
  </div>

  <button class="btn" onclick="save()">Mettre à jour</button>
</div>

<script>
  lucide.createIcons();
  function toggle(id) {
    const i = document.getElementById(id);
    i.type = i.type === 'password' ? 'text' : 'password';
  }
  function save() {
    alert('✅ Mot de passe mis à jour');
    location.href = 'confidentialite-app.html';
  }
</script>
</body>
</html>
