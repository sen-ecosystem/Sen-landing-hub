<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email de contact - SEN TEW</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {font-family: 'Segoe UI', -apple-system, sans-serif; background: #F4F6F1; color: #1a1a1a; min-height: 100vh; padding-bottom: 90px;}
        .topbar {background: #ffffff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E8ECE9; position: sticky; top: 0; z-index: 10;}
        .topbar a {color: #1B5E3F; text-decoration: none; display: flex; align-items: center;}
        .topbar h1 {color: #1B5E3F; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .container {padding: 20px; max-width: 520px; margin: 0 auto;}
        .form-card {background: #ffffff; padding: 22px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);}
        .current-email {background: #F4F6F1; border-radius: 12px; padding: 14px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;}
        .current-email i {color: #1B5E3F; width: 20px; height: 20px; flex-shrink: 0;}
        .current-email small {display: block; color: #666; font-size: 11px;}
        .current-email strong {color: #1a1a1a; font-size: 14px;}
        .field {margin-bottom: 16px;}
        .field label {display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;}
        .input-wrapper {position: relative;}
        .input-wrapper i {position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9aa5a0; width: 18px; height: 18px; pointer-events: none;}
        .field input {width: 100%; padding: 13px 12px 13px 40px; border: 1.5px solid #E3E8E4; border-radius: 10px; font-size: 14px; background: #FBFCFB; font-family: inherit;}
        .field input:focus {outline: none; border-color: #1B5E3F; background: #ffffff;}
        .info {background: #FFF8E7; border-radius: 12px; padding: 14px; margin-bottom: 18px; font-size: 12px; color: #6B4423; line-height: 1.5;}
        .btn-primary {width: 100%; background: #14532D; color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; box-shadow: 0 6px 16px rgba(20,83,45,0.3);}
        .bottom-nav {position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #E8ECE9; z-index: 40;}
        .bottom-nav a {display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #666; font-size: 11px;}
        .bottom-nav a.active {color: #1B5E3F;}
        .bottom-nav a i {width: 22px; height: 22px;}
    </style>
</head>
<body class="light-mode">
    <header class="topbar">
        <a href="parametres.html"><i data-lucide="arrow-left"></i></a>
        <h1><i data-lucide="mail" style="width:20px;height:20px"></i> Email de contact</h1>
    </header>
    <div class="container">
        <form class="form-card" onsubmit="event.preventDefault(); alert('✅ Email mis à jour !'); location.href='parametres.html';">
            <div class="current-email">
                <i data-lucide="mail"></i>
                <div>
                    <small>Email actuel</small>
                    <strong>karim@example.com</strong>
                </div>
            </div>
            <div class="info">ℹ️ Un email de confirmation sera envoyé à la nouvelle adresse pour valider le changement.</div>
            <div class="field">
                <label>Nouvel email</label>
                <div class="input-wrapper"><i data-lucide="mail"></i><input type="email" placeholder="nouveau@example.com" required></div>
            </div>
            <div class="field">
                <label>Mot de passe (confirmation)</label>
                <div class="input-wrapper"><i data-lucide="lock"></i><input type="password" placeholder="Ton mot de passe actuel" required></div>
            </div>
            <button type="submit" class="btn-primary"><i data-lucide="check" style="width:18px;height:18px"></i> Changer l'email</button>
        </form>
    </div>
    <nav class="bottom-nav">
        <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
        <a href="categories.html"><i data-lucide="layout-grid"></i><span>Catégories</span></a>
        <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
        <a href="messages.html"><i data-lucide="message-circle"></i><span>Messages</span></a>
        <a href="profil.html" class="active"><i data-lucide="user"></i><span>Profil</span></a>
    </nav>
    <script>lucide.createIcons();</script>
</body>
</html>
