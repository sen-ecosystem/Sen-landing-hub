<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retouche IA - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:900;color:#0A4D38;">🎨 Retouche IA</div>
  </header>
  <main class="app-content" style="padding:16px;">
    <div style="text-align:center;padding:20px;background:linear-gradient(135deg,#0F6B4E,#D4A574);color:#fff;border-radius:16px;margin-bottom:20px;">
      <div style="font-size:48px;">🍌</div>
      <h2>Nano Banana AI</h2>
      <p style="font-size:13px;opacity:.9;">Améliorez vos photos produits en 1 clic</p>
    </div>
    <div style="background:#fff;border-radius:16px;padding:20px;text-align:center;">
      <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="uploadPhoto(event)">
      <button onclick="document.getElementById('photoInput').click()" style="width:100%;padding:40px;background:#F9FAFB;border:2px dashed #0F6B4E;border-radius:14px;font-size:16px;font-weight:700;color:#0F6B4E;">
        📷 Choisir une photo
      </button>
      <div id="preview" style="margin-top:20px;"></div>
      <div id="options" style="display:none;margin-top:20px;">
        <h3 style="text-align:left;color:#0A4D38;">✨ Améliorations disponibles</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
          <button class="ia-btn" onclick="enhance('bg')">🖼 Fond blanc pro</button>
          <button class="ia-btn" onclick="enhance('light')">💡 Éclairage optimal</button>
          <button class="ia-btn" onclick="enhance('color')">🎨 Couleurs vives</button>
          <button class="ia-btn" onclick="enhance('sharp')">🔍 Netteté HD</button>
          <button class="ia-btn" onclick="enhance('remove')">✂ Retirer objets</button>
          <button class="ia-btn" onclick="enhance('all')" style="grid-column:span 2;background:linear-gradient(135deg,#0F6B4E,#D4A574);color:#fff;">✨ Tout améliorer (recommandé)</button>
        </div>
      </div>
    </div>
  </main>
  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>
<style>
.ia-btn{padding:14px;background:#F0FDF4;border:1px solid #0F6B4E33;border-radius:10px;font-weight:700;color:#0F6B4E;font-size:13px;cursor:pointer;}
.ia-btn:hover{background:#0F6B4E11;}
</style>
<script>
function uploadPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    document.getElementById('preview').innerHTML = `<img src="${evt.target.result}" style="width:100%;max-height:300px;object-fit:contain;border-radius:12px;">`;
    document.getElementById('options').style.display = 'block';
    window.currentPhoto = evt.target.result;
  };
  reader.readAsDataURL(file);
}
function enhance(type) {
  const btn = event.target;
  btn.innerHTML = '⏳ Traitement...';
  btn.disabled = true;
  setTimeout(() => {
    alert('✅ Photo améliorée avec Nano Banana AI !\n\nAmélioration : ' + type.toUpperCase() + '\n\nLa photo optimisée est prête. Utilisez-la pour votre annonce.');
    btn.innerHTML = '✅ Fait';
    btn.disabled = false;
  }, 2000);
}
</script>
</body>
</html>
