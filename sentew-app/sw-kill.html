<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Reset SEN TEW</title>
<style>
body{font-family:sans-serif;background:#0F6B4E;color:#fff;text-align:center;padding:40px;margin:0;min-height:100vh;box-sizing:border-box;}
h1{color:#D4A574;}
.log{background:rgba(0,0,0,.3);padding:16px;border-radius:12px;text-align:left;font-family:monospace;font-size:12px;margin:20px 0;}
button{background:#D4A574;color:#fff;border:none;padding:16px 32px;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:20px;}
</style></head><body>
<h1>🔄 Reset SEN TEW</h1>
<div class="log" id="log"></div>
<button onclick="location.href='index.html?t='+Date.now()">🚀 Recharger l'app</button>
<script>
const log = document.getElementById('log');
function L(msg){ log.innerHTML += msg+'<br>'; }
(async ()=>{
  L('▸ Nettoyage en cours...');
  if('serviceWorker' in navigator){
    const regs = await navigator.serviceWorker.getRegistrations();
    for(const r of regs){ await r.unregister(); L('✅ SW supprimé'); }
  }
  if('caches' in window){
    const keys = await caches.keys();
    for(const k of keys){ await caches.delete(k); L('✅ Cache supprimé: '+k); }
  }
  L('<br>🎉 Terminé ! Cliquez sur "Recharger l\'app"');
})();
</script></body></html>
