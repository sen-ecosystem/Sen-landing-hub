<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SEN TEW Marketplace</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div id="admTrig" style="display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--v-emeraude);cursor:pointer;">
    <span style="font-size:24px;">🌍</span> SEN TEW
  </div>
  <div style="flex:1"></div>
  <button class="icon-btn" onclick="cycleLang()"><span id="lFlag">🇫🇷</span></button>
  <button class="icon-btn" onclick="cycleCurr()"><span id="cFlag">💰</span></button>
  <button class="icon-btn" onclick="toggleTheme()">
    <i data-lucide="moon" class="icon icon-md icon-vert"></i>
  </button>
</header>

<!-- SEARCH BAR -->
<div style="padding:12px 16px;">
  <div style="display:flex;gap:8px;background:var(--bg-card);padding:10px 14px;border-radius:12px;cursor:pointer;" onclick="location.href='recherche-ia.html'">
    <i data-lucide="search" class="icon icon-md icon-vert"></i>
    <span style="color:var(--text-muted);flex:1;">Rechercher un produit, vendeur...</span>
    <i data-lucide="sparkles" class="icon icon-md icon-violet"></i>
  </div>
</div>

<!-- QUICK ACTIONS GRID (Temu style) -->
<div style="padding:0 16px;">
  <div class="icon-grid">
    <div class="icon-grid-item" onclick="location.href='commandes.html'">
      <div class="icon-bg bg-or-soft"><i data-lucide="package" class="icon icon-md icon-or"></i></div>
      <span class="label">Commandes</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='portefeuille.html'">
      <div class="icon-bg bg-vert-soft"><i data-lucide="wallet" class="icon icon-md icon-vert"></i></div>
      <span class="label">Portefeuille</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='favoris.html'">
      <div class="icon-bg bg-rouge-soft"><i data-lucide="heart" class="icon icon-md icon-rouge"></i></div>
      <span class="label">Favoris</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='fidelite.html'">
      <div class="icon-bg bg-violet-soft"><i data-lucide="badge-check" class="icon icon-md icon-violet"></i></div>
      <span class="label">Fidélité</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='live.html'">
      <div class="icon-bg bg-rouge-soft"><i data-lucide="video" class="icon icon-md icon-rouge"></i></div>
      <span class="label">Live</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='bons-promo.html'">
      <div class="icon-bg bg-orange-soft"><i data-lucide="tag" class="icon icon-md icon-orange"></i></div>
      <span class="label">Promos</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='retouche-ia.html'">
      <div class="icon-bg bg-gradient-ia"><i data-lucide="wand-2" class="icon icon-md icon-blanc"></i></div>
      <span class="label">Retouche IA</span>
    </div>
    <div class="icon-grid-item" onclick="location.href='panoramique.html'">
      <div class="icon-bg bg-gradient-fintech"><i data-lucide="rotate-3d" class="icon icon-md icon-blanc"></i></div>
      <span class="label">Vue 360°</span>
    </div>
  </div>
</div>

<!-- LIVES -->
<div class="section-title">
  <i data-lucide="video" class="icon icon-md icon-rouge"></i>
  Vendeurs en Live
</div>
<div id="livesBox" style="display:flex;gap:10px;overflow-x:auto;padding:0 16px 16px;"></div>

<!-- TOP SELLERS -->
<div class="section-title">
  <i data-lucide="award" class="icon icon-md icon-or"></i>
  Top Vendeurs
</div>
<div id="topBox" style="display:flex;gap:10px;overflow-x:auto;padding:0 16px 16px;"></div>

<!-- CATÉGORIES -->
<div class="section-title">
  <i data-lucide="layout-grid" class="icon icon-md icon-vert"></i>
  Catégories
</div>
<div id="catsGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 16px;"></div>

<!-- TENDANCES -->
<div class="section-title">
  <i data-lucide="trending-up" class="icon icon-md icon-vert"></i>
  Tendances
</div>
<div id="trendGrid" class="pcard-grid"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html" class="active">
    <i data-lucide="home" class="icon icon-md icon-vert"></i>
    <span>Accueil</span>
  </a>
  <a href="recherche-ia.html">
    <i data-lucide="search" class="icon icon-md"></i>
    <span>Rechercher</span>
  </a>
  <a href="panier.html" class="icon-badge" data-count="0">
    <i data-lucide="shopping-cart" class="icon icon-md icon-or"></i>
    <span>Panier</span>
  </a>
  <a href="favoris.html">
    <i data-lucide="heart" class="icon icon-md"></i>
    <span>Favoris</span>
  </a>
  <a href="profil.html">
    <i data-lucide="user" class="icon icon-md"></i>
    <span>Profil</span>
  </a>
</nav>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
// ===== DONNÉES =====
const SELLERS = [
  {id:1,name:'Aïcha Couture',avatar:'https://i.pravatar.cc/100?img=1',verified:'platinum',live:true,sales:2400000,city:'Dakar'},
  {id:2,name:'Moussa Tech',avatar:'https://i.pravatar.cc/100?img=13',verified:'gold',live:true,sales:1800000,city:'Dakar'},
  {id:3,name:'Fatou Fashion',avatar:'https://i.pravatar.cc/100?img=5',verified:'gold',live:false,sales:1200000,city:'Thiès'},
  {id:4,name:'Ibrahim Bio',avatar:'https://i.pravatar.cc/100?img=8',verified:'silver',live:false,sales:800000,city:'Saint-Louis'},
  {id:5,name:'Mariama Beauté',avatar:'https://i.pravatar.cc/100?img=9',verified:'gold',live:true,sales:1500000,city:'Dakar'}
];
const CATEGORIES = [
  {id:'mode',name:'Mode',icon:'👗',color:'#ef4444'},
  {id:'tech',name:'Tech',icon:'📱',color:'#3b82f6'},
  {id:'beauty',name:'Beauté',icon:'💄',color:'#a855f7'},
  {id:'food',name:'Alimentation',icon:'🍎',color:'#f59e0b'},
  {id:'sport',name:'Sport',icon:'⚽',color:'#0f6b4e'},
  {id:'home',name:'Maison',icon:'🏠',color:'#d4a574'},
  {id:'bio',name:'Bio',icon:'🌿',color:'#00c060'},
  {id:'kids',name:'Enfants',icon:'🧸',color:'#f472b6'}
];
const PRODUCTS = [
  {id:1,name:'Boubou wax collection',price:18000,oldPrice:25000,image:'https://images.unsplash.com/photo-1544441893-675973e31985?w=400',seller:'Fatou Fashion',sellerAvatar:'https://i.pravatar.cc/50?img=5',verified:'gold',cat:'mode',sellerLive:false,local:true},
  {id:2,name:'iPhone 15 Pro 256GB',price:750000,image:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=400',seller:'Moussa Tech',sellerAvatar:'https://i.pravatar.cc/50?img=13',verified:'gold',cat:'tech',sellerLive:true,local:false},
  {id:3,name:'Sac cuir africain premium',price:15000,oldPrice:22000,image:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',verified:'platinum',cat:'mode',sellerLive:true,local:true},
  {id:4,name:'Écouteurs sans fil Pro',price:12000,image:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400',seller:'Moussa Tech',sellerAvatar:'https://i.pravatar.cc/50?img=13',verified:'gold',cat:'tech',sellerLive:true,local:false},
  {id:5,name:'Beurre karité 500g',price:4500,image:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=400',seller:'Ibrahim Bio',sellerAvatar:'https://i.pravatar.cc/50?img=8',verified:'silver',cat:'beauty',sellerLive:false,local:true},
  {id:6,name:'Robe bogolan traditionnelle',price:22000,oldPrice:30000,image:'https://images.unsplash.com/photo-1585487000160-6ebcfceb0d03?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',verified:'platinum',cat:'mode',sellerLive:true,local:true},
  {id:7,name:'Masque visage bio',price:6500,image:'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=400',seller:'Mariama Beauté',sellerAvatar:'https://i.pravatar.cc/50?img=9',verified:'gold',cat:'beauty',sellerLive:true,local:true},
  {id:8,name:'Montre connectée Sport',price:35000,oldPrice:45000,image:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400',seller:'Moussa Tech',sellerAvatar:'https://i.pravatar.cc/50?img=13',verified:'gold',cat:'tech',sellerLive:true,local:false}
];

const CURR = [{c:'FCFA',f:'💰',r:1,s:'FCFA'},{c:'EUR',f:'🇪🇺',r:0.00153,s:'€'},{c:'USD',f:'🇺🇸',r:0.00167,s:'$'}];
const LANGS = [{c:'FR',f:'🇫🇷',n:'Français',d:'ltr'},{c:'EN',f:'🇬🇧',n:'English',d:'ltr'},{c:'AR',f:'🇸🇦',n:'العربية',d:'rtl'}];

function fmt(price) {
  const i = +(localStorage.getItem('curr_idx')||0);
  const c = CURR[i];
  const v = price * c.r;
  return c.c==='FCFA' ? Math.round(v).toLocaleString('fr-FR')+' '+c.s : v.toFixed(2)+' '+c.s;
}

function cycleCurr() {
  let i = +(localStorage.getItem('curr_idx')||0);
  i = (i+1) % CURR.length;
  localStorage.setItem('curr_idx', i);
  document.getElementById('cFlag').textContent = CURR[i].f;
  renderAll();
  if(navigator.vibrate) navigator.vibrate(30);
}

function cycleLang() {
  let i = +(localStorage.getItem('lang_idx')||0);
  i = (i+1) % LANGS.length;
  localStorage.setItem('lang_idx', i);
  document.getElementById('lFlag').textContent = LANGS[i].f;
  document.documentElement.dir = LANGS[i].d;
  if(navigator.vibrate) navigator.vibrate(30);
}

// Init flags
document.getElementById('cFlag').textContent = CURR[+(localStorage.getItem('curr_idx')||0)].f;
document.getElementById('lFlag').textContent = LANGS[+(localStorage.getItem('lang_idx')||0)].f;

// ===== RENDU =====
function renderLives() {
  const lives = SELLERS.filter(s => s.live);
  document.getElementById('livesBox').innerHTML = lives.map(s => `
    <a href="boutique.html?id=${s.id}" style="min-width:80px;text-decoration:none;color:inherit;">
      <div style="position:relative;">
        <img src="${s.avatar}" alt="${s.name}" style="width:70px;height:70px;border-radius:50%;border:3px solid var(--rouge);object-fit:cover;">
        <span style="position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);background:var(--rouge);color:white;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;">LIVE</span>
      </div>
      <div style="text-align:center;font-size:11px;margin-top:6px;font-weight:600;">${s.name.split(' ')[0]}</div>
    </a>
  `).join('');
}

function renderTop() {
  const top = [...SELLERS].sort((a,b) => b.sales - a.sales).slice(0, 5);
  document.getElementById('topBox').innerHTML = top.map((s, i) => `
    <a href="boutique.html?id=${s.id}" style="min-width:120px;background:var(--bg-card);border-radius:12px;padding:10px;text-decoration:none;color:inherit;">
      <div style="text-align:center;">
        <img src="${s.avatar}" alt="${s.name}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;">
        <div style="font-size:12px;font-weight:700;margin-top:6px;">${s.name}</div>
        <div style="font-size:11px;color:var(--v-emeraude);font-weight:800;">${fmt(s.sales)}</div>
      </div>
    </a>
  `).join('');
}

function renderCats() {
  document.getElementById('catsGrid').innerHTML = CATEGORIES.map(c => `
    <a href="produits.html?cat=${c.id}" style="text-decoration:none;color:inherit;">
      <div style="background:${c.color}22;border-radius:12px;padding:12px;text-align:center;">
        <div style="font-size:28px;">${c.icon}</div>
        <div style="font-size:11px;font-weight:700;margin-top:4px;">${c.name}</div>
      </div>
    </a>
  `).join('');
}

function renderTrends() {
  const trend = [...PRODUCTS];
  document.getElementById('trendGrid').innerHTML = trend.map(p => {
    const disc = p.oldPrice ? Math.round((1 - p.price/p.oldPrice)*100) : 0;
    return `
      <a href="produit.html?id=${p.id}" class="pcard" data-id="${p.id}" style="text-decoration:none;color:inherit;">
        <div class="pcard-img">
          <div class="pcard-badges">
            ${p.sellerLive ? '<span class="pcard-badge pcard-badge-live">LIVE</span>' : ''}
            ${p.local ? '<span class="pcard-badge pcard-badge-local">LOCAL</span>' : ''}
            ${disc > 0 ? `<span class="pcard-badge pcard-badge-disc">-${disc}%</span>` : ''}
          </div>
          <button class="pcard-fav" onclick="event.preventDefault();event.stopPropagation();toggleFav(${p.id});">
            <i data-lucide="heart" class="icon icon-sm icon-rouge"></i>
          </button>
          <img src="${p.image}" alt="${p.name}">
        </div>
        <div class="pcard-info">
          <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
            <img src="${p.sellerAvatar}" style="width:16px;height:16px;border-radius:50%;">
            <span style="font-size:10px;color:var(--text-muted);">${p.seller}</span>
            ${p.verified === 'platinum' ? '<i data-lucide="badge-check" class="icon icon-sm icon-violet" style="width:12px;height:12px;"></i>' : ''}
            ${p.verified === 'gold' ? '<i data-lucide="badge-check" class="icon icon-sm icon-or" style="width:12px;height:12px;"></i>' : ''}
          </div>
          <div class="pcard-name">${p.name}</div>
          <div style="display:flex;align-items:baseline;gap:6px;">
            <span class="pcard-price">${fmt(p.price)}</span>
            ${p.oldPrice ? `<span class="pcard-old">${fmt(p.oldPrice)}</span>` : ''}
            ${disc > 0 ? `<span class="pcard-disc">-${disc}%</span>` : ''}
          </div>
        </div>
      </a>
    `;
  }).join('');
  lucide.createIcons();
}

function renderAll() {
  renderLives();
  renderTop();
  renderCats();
  renderTrends();
  lucide.createIcons();
}

function toggleFav(id) {
  let favs = JSON.parse(localStorage.getItem('favs')||'[]');
  if(favs.includes(id)) favs = favs.filter(x => x !== id);
  else favs.push(id);
  localStorage.setItem('favs', JSON.stringify(favs));
  if(navigator.vibrate) navigator.vibrate(20);
}

renderAll();

// ===== ADMIN 7 TAPS =====
(function() {
  let taps = 0, timer = null;
  document.getElementById('admTrig').addEventListener('click', function() {
    taps++;
    clearTimeout(timer);
    timer = setTimeout(() => taps = 0, 3000);
    if(taps >= 7) {
      taps = 0;
      const code = prompt('🔒 Code administrateur :');
      if(!code) return;
      const validCodes = ['SENADMIN2026','ADMIN2026'];
      if(validCodes.includes(code.trim())) {
        sessionStorage.setItem('admin_pro', '1');
        alert('✅ Accès autorisé\n\nRedirection...');
        location.href = 'admin.html';
      } else {
        alert('❌ Code incorrect');
      }
    }
  });
})();

// Auto-update SW
if('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.update()));
}

console.log('✅ SEN TEW v42 chargé :', PRODUCTS.length, 'produits');
</script>
<script>lucide.createIcons();</script>
</body>
</html>
