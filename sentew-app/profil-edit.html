<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier mon profil - SEN TEW</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {font-family: 'Segoe UI', -apple-system, sans-serif; background: #F4F6F1; color: #1a1a1a; min-height: 100vh; padding-bottom: 90px;}
        .topbar {background: #ffffff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E8ECE9; position: sticky; top: 0; z-index: 10;}
        .topbar a {color: #1B5E3F; text-decoration: none; display: flex; align-items: center;}
        .topbar h1 {color: #1B5E3F; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .container {padding: 20px; max-width: 520px; margin: 0 auto;}
        .avatar-section {text-align: center; margin-bottom: 24px;}
        .avatar {width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #1B5E3F 0%, #D4A574 100%); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 32px; font-weight: 800;}
        .avatar-btn {background: #ffffff; border: 1.5px solid #1B5E3F; color: #1B5E3F; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;}
        .form-card {background: #ffffff; padding: 22px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);}
        .field {margin-bottom: 16px;}
        .field-row {display: flex; gap: 12px;}
        .field-row .field {flex: 1; min-width: 0;}
        .field label {display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;}
        .input-wrapper {position: relative;}
        .input-wrapper i {position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9aa5a0; width: 18px; height: 18px; pointer-events: none;}
        .field input {width: 100%; padding: 13px 12px 13px 40px; border: 1.5px solid #E3E8E4; border-radius: 10px; font-size: 14px; background: #FBFCFB; font-family: inherit;}
        .field input:focus {outline: none; border-color: #1B5E3F; background: #ffffff;}
        .btn-primary {width: 100%; background: #14532D; color: #ffffff; border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; box-shadow: 0 6px 16px rgba(20,83,45,0.3); margin-top: 8px;}
        .bottom-nav {position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #E8ECE9; z-index: 40;}
        .bottom-nav a {display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #666; font-size: 11px;}
        .bottom-nav a.active {color: #1B5E3F;}
        .bottom-nav a i {width: 22px; height: 22px;}
    </style>
</head>
<body class="light-mode">
    <header class="topbar">
        <a href="parametres.html"><i data-lucide="arrow-left"></i></a>
        <h1><i data-lucide="user-cog" style="width:20px;height:20px"></i> Modifier mon profil</h1>
    </header>
    <div class="container">
        <div class="avatar-section">
            <div class="avatar">KN</div>
            <button class="avatar-btn" onclick="alert('📷 Changer la photo de profil')">📷 Changer la photo</button>
        </div>
        <form class="form-card" onsubmit="event.preventDefault(); alert('✅ Profil mis à jour !'); location.href='parametres.html';">
            <div class="field-row">
                <div class="field">
                    <label>Prénom</label>
                    <div class="input-wrapper"><i data-lucide="user"></i><input type="text" value="Karim" required></div>
                </div>
                <div class="field">
                    <label>Nom</label>
                    <div class="input-wrapper"><i data-lucide="user"></i><input type="text" value="Niang" required></div>
                </div>
            </div>
            <div class="field">
                <label>Téléphone</label>
                <div class="input-wrapper"><i data-lucide="phone"></i><input type="tel" value="+221 77 456 78 90" required></div>
            </div>
            <div class="field">
                <label>Ville</label>
                <div class="input-wrapper"><i data-lucide="map-pin"></i><input type="text" value="Dakar"></div>
            </div>
            <div class="field">
                <label>Adresse de livraison</label>
                <div class="input-wrapper"><i data-lucide="home"></i><input type="text" placeholder="Quartier, rue, repère..."></div>
            </div>
            <button type="submit" class="btn-primary"><i data-lucide="check" style="width:18px;height:18px"></i> Enregistrer les modifications</button>
        </form>
    </div>
    <nav class="bottom-nav">
        <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
        <a href="categories.html"><i data-lucide="layout-grid"></i><span>Catégories</span></a>
        <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
        <a href="messages.html"><i data-lucide="message-circle"></i><span>Messages</span></a>
        <a href="profil.html" class="active"><i data-lucide="user"></i><span>Profil</span></a>
    </nav>
    <script>lucide.createIcons();</script>
</body>
</html>
