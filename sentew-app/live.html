<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LIVE Shopping - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<style>
body{margin:0;background:#000;overflow:hidden;height:100vh;}
.live-feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.live-feed::-webkit-scrollbar{display:none;}
.live-slide{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#000;}
.live-video{width:100%;height:100%;object-fit:cover;}
.live-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.8) 100%);pointer-events:none;}
.live-top{position:absolute;top:0;left:0;right:0;padding:50px 16px 16px;display:flex;gap:12px;align-items:center;}
.live-badge{background:#ef4444;padding:4px 10px;border-radius:6px;color:#fff;font-weight:900;font-size:11px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.live-viewers{background:rgba(0,0,0,.5);color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;backdrop-filter:blur(10px);}
.live-close{margin-left:auto;background:rgba(0,0,0,.5);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;}
.live-seller{position:absolute;bottom:180px;left:16px;right:80px;color:#fff;}
<div class="live-seller-row" onclick="openBoutique('${L.id}')" style="cursor:pointer;">
  <img src="${L.avatar}" class="live-avatar" alt="">
  <div style="flex:1;">
    <div class="live-name">${L.seller} <span style="font-size:14px;">›</span></div>
    <div style="font-size:11px;opacity:.8;">✅ SEN Verified · ⭐ 4.9 · Voir la boutique</div>
  </div>
  <button class="live-follow" onclick="event.stopPropagation();alert('✅ Vous suivez ${L.seller}')">+ Suivre</button>
</div>
function openBoutique(sellerId){
  location.href = 'boutique.html?id=' + sellerId + '&from=live';
}

.live-avatar{width:44px;height:44px;border-radius:50%;border:2px solid #fff;object-fit:cover;}
.live-name{font-weight:900;font-size:15px;}
.live-title{font-size:13px;opacity:.9;margin-bottom:10px;}
.live-follow{background:#ef4444;color:#fff;padding:6px 14px;border-radius:6px;border:none;font-weight:800;font-size:12px;}
.live-actions{position:absolute;right:12px;bottom:180px;display:flex;flex-direction:column;gap:16px;align-items:center;}
.live-action{width:48px;height:48px;background:rgba(0,0,0,.4);border-radius:50%;color:#fff;border:none;font-size:22px;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;flex-direction:column;}
.live-action span{font-size:10px;margin-top:2px;}
.live-product{position:absolute;bottom:80px;left:16px;right:16px;background:rgba(255,255,255,.95);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(20px);}
.live-product img{width:60px;height:60px;border-radius:10px;object-fit:cover;}
.live-product-info{flex:1;}
.live-product-name{font-weight:800;font-size:13px;color:#0A4D38;}
.live-product-price{color:#ef4444;font-weight:900;font-size:15px;}
.live-buy{background:linear-gradient(135deg,#0F6B4E,#D4A574);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;}
.live-chat{position:absolute;bottom:150px;left:16px;right:80px;max-height:150px;overflow:hidden;display:flex;flex-direction:column;gap:4px;pointer-events:none;}
.chat-msg{background:rgba(0,0,0,.5);color:#fff;padding:6px 10px;border-radius:12px;font-size:12px;max-width:80%;backdrop-filter:blur(10px);animation:slideIn .3s;}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
.live-input{position:absolute;bottom:20px;left:16px;right:16px;display:flex;gap:8px;}
.live-input input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:10px 14px;border-radius:20px;backdrop-filter:blur(10px);}
.live-input input::placeholder{color:rgba(255,255,255,.7);}
.live-input button{background:#ef4444;color:#fff;border:none;width:40px;border-radius:20px;font-size:16px;}
.swipe-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;pointer-events:none;animation:fadeOut 3s forwards;}
@keyframes fadeOut{0%,60%{opacity:1}100%{opacity:0}}
.float-emoji{position:absolute;bottom:200px;right:40px;font-size:24px;animation:floatUp 3s ease-out forwards;pointer-events:none;}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-300px) translateX(-20px);opacity:0}}
</style>
</head>
<body>
<div class="live-feed" id="feed"></div>

<script src="js/data.js"></script>
<script>
const LIVES = [
  { id:1, seller:'Aïcha Boutique', avatar:'https://i.pravatar.cc/100?img=1', title:'🔥 SOLDES -50% robes wax', viewers:1247, product:{img:'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=200',name:'Robe wax premium',price:15000,oldPrice:30000} },
  { id:2, seller:'Moussa Tech', avatar:'https://i.pravatar.cc/100?img:11', title:'📱 iPhone 15 Pro déballage', viewers:892, product:{img:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=200',name:'iPhone 15 Pro 256GB',price:750000,oldPrice:850000} },
  { id:3, seller:'Fatou Beauté', avatar:'https://i.pravatar.cc/100?img=5', title:'💄 Démo maquillage soirée', viewers:634, product:{img:'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=200',name:'Palette 24 couleurs',price:8500,oldPrice:12000} },
  { id:4, seller:'Ibrahima Sport', avatar:'https://i.pravatar.cc/100?img=13', title:'⚽ Maillots officiels 2026', viewers:456, product:{img:'https://images.unsplash.com/photo-1517466787929-bc90951d0974?w=200',name:'Maillot Sénégal 2026',price:18000,oldPrice:25000} },
  { id:5, seller:'Awa Cosmétique', avatar:'https://i.pravatar.cc/100?img=9', title:'✨ Karité pur Bio', viewers:389, product:{img:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=200',name:'Karité 500g',price:4500,oldPrice:6000} }
];

const messages = ['🔥🔥🔥','Trop belle !','Prix svp?','J\'achète !','😍😍','Livraison Dakar?','Combien?','❤️','Wow','C\'est encore dispo?'];
const emojis = ['❤️','🔥','😍','👏','🎉','💯'];

document.getElementById('feed').innerHTML = LIVES.map((L,i)=>`
  <div class="live-slide" data-id="${L.id}">
    <video class="live-video" autoplay muted loop playsinline poster="${L.product.img.replace('w=200','w=800')}">
      <source src="https://cdn.pixabay.com/vimeo/${['427259099','412418543','421534334'][i%3]}/live.mp4" type="video/mp4">
    </video>
    <div class="live-overlay"></div>
    <div class="live-top">
      <span class="live-badge">🔴 LIVE</span>
      <span class="live-viewers">👁 <span class="vc">${L.viewers.toLocaleString()}</span></span>
      <button class="live-close" onclick="location.href='index.html'">✕</button>
    </div>
    <div class="live-seller">
      <div class="live-seller-row">
        <img src="${L.avatar}" class="live-avatar" alt="">
        <div style="flex:1;">
          <div class="live-name">${L.seller}</div>
          <div style="font-size:11px;opacity:.8;">✅ SEN Verified</div>
        </div>
        <button class="live-follow" onclick="alert('✅ Vous suivez maintenant ${L.seller}')">+ Suivre</button>
      </div>
      <div class="live-title">${L.title}</div>
      <button onclick="location.href='boutique.html?id=${L.id}'" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;backdrop-filter:blur(10px);">🏪 Voir la boutique</button>
    </div>
    <div class="live-chat" id="chat${L.id}"></div>
    <div class="live-actions">
      <button class="live-action" onclick="reactEmoji(${L.id},'❤️')">❤️<span>${(L.viewers*8).toLocaleString()}</span></button>
      <button class="live-action" onclick="reactEmoji(${L.id},'🔥')">🔥<span>${(L.viewers*3).toLocaleString()}</span></button>
      <button class="live-action" onclick="reactEmoji(${L.id},'😍')">😍<span>${L.viewers.toLocaleString()}</span></button>
      <button class="live-action" onclick="shareLive(${L.id})">📤<span>Partager</span></button>
    </div>
    <div class="live-product">
      <img src="${L.product.img}" alt="">
      <div class="live-product-info">
        <div class="live-product-name">${L.product.name}</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <span class="live-product-price">${L.product.price.toLocaleString()} FCFA</span>
          <span style="text-decoration:line-through;color:#9CA3AF;font-size:11px;">${L.product.oldPrice.toLocaleString()}</span>
          <span style="background:#ef4444;color:#fff;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:900;">-${Math.round((1-L.product.price/L.product.oldPrice)*100)}%</span>
        </div>
      </div>
      <button class="live-buy" onclick="flashBuy(${L.id})">🛒 ACHAT<br><span style="font-size:10px;">FLASH</span></button>
    </div>
    <div class="live-input">
      <input type="text" placeholder="Envoyer un message..." onkeypress="if(event.key==='Enter')sendMsg(${L.id},this)">
      <button onclick="sendMsg(${L.id},this.previousElementSibling)">➤</button>
    </div>
    ${i===0?'<div class="swipe-hint">👆<br>Glissez vers le haut<br>pour d\'autres LIVEs</div>':''}
  </div>
`).join('');

// Chat auto simulé
setInterval(()=>{
  const slide = document.querySelector('.live-slide:nth-child(1)');
  LIVES.forEach(L=>{
    const chat = document.getElementById('chat'+L.id);
    if(!chat)return;
    const m = document.createElement('div');
    m.className='chat-msg';
    const users=['Awa','Moussa','Fatou','Ibrahima','Aminata','Ousmane'];
    m.innerHTML=`<strong>${users[Math.floor(Math.random()*users.length)]}</strong> ${messages[Math.floor(Math.random()*messages.length)]}`;
    chat.appendChild(m);
    if(chat.children.length>5)chat.removeChild(chat.firstChild);
  });
},2500);

// Viewers count animation
setInterval(()=>{
  document.querySelectorAll('.vc').forEach(vc=>{
    const n = parseInt(vc.textContent.replace(/\D/g,''))+Math.floor(Math.random()*10)-3;
    vc.textContent = Math.max(50,n).toLocaleString();
  });
},3000);

function reactEmoji(id,emoji){
  const slide = document.querySelector(`.live-slide[data-id="${id}"]`);
  const e = document.createElement('div');
  e.className='float-emoji';
  e.textContent=emoji;
  e.style.right = (30+Math.random()*40)+'px';
  slide.appendChild(e);
  setTimeout(()=>e.remove(),3000);
  navigator.vibrate&&navigator.vibrate(20);
}

function sendMsg(id,input){
  if(!input.value.trim())return;
  const chat=document.getElementById('chat'+id);
  const m=document.createElement('div');
  m.className='chat-msg';
  m.style.background='rgba(15,107,78,.8)';
  m.innerHTML=`<strong>Vous</strong> ${input.value}`;
  chat.appendChild(m);
  input.value='';
}

function flashBuy(id){
  const L = LIVES.find(x=>x.id===id);
  if(confirm(`🛒 Achat FLASH -30% supplémentaire\n\n${L.product.name}\nPrix LIVE: ${Math.round(L.product.price*0.7).toLocaleString()} FCFA\n\nAjouter au panier ?`)){
    const cart=JSON.parse(localStorage.getItem('cart')||'[]');
    cart.push({...L.product,flashDiscount:30,ts:Date.now()});
    localStorage.setItem('cart',JSON.stringify(cart));
    alert('✅ Ajouté au panier avec -30% flash !');
  }
}

function shareLive(id){
  const L = LIVES.find(x=>x.id===id);
  if(navigator.share)navigator.share({title:'LIVE '+L.seller,text:L.title,url:location.href+'?live='+id});
  else{navigator.clipboard.writeText(location.href+'?live='+id);alert('Lien copié');}
}
</script>
</body>
</html>
