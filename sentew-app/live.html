<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live — SEN TEW</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',sans-serif}
body{background:#000;color:#fff;height:100dvh;overflow:hidden}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#topBar{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:8px;z-index:10;background:linear-gradient(#000a,transparent)}
#topBar a{color:#fff;text-decoration:none;font-size:22px}
.live-badge{background:#e33;padding:5px 12px;border-radius:8px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
.vinfo{display:flex;align-items:center;gap:8px;background:#0007;padding:5px 10px;border-radius:30px}
.vinfo img{width:32px;height:32px;border-radius:50%}
.vinfo b{font-size:13px}
.follow{background:#0b6b3a;border:none;color:#fff;padding:7px 14px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
#viewers{margin-left:auto;background:#0008;padding:6px 12px;border-radius:8px;font-size:13px}
#title{position:fixed;top:60px;left:12px;right:12px;font-size:14px;font-weight:600;z-index:10;text-shadow:0 1px 4px #000}
#comments{position:fixed;left:10px;bottom:150px;width:75%;max-height:36vh;overflow-y:auto;z-index:10;display:flex;flex-direction:column;gap:6px;mask-image:linear-gradient(transparent,#000 18%)}
.cmt{background:#0009;padding:7px 12px;border-radius:14px;font-size:13px;width:fit-content;max-width:100%;animation:in .25s}
.cmt b{color:#ffd76a;margin-right:5px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#hearts{position:fixed;right:80px;bottom:180px;z-index:9;pointer-events:none}
.heart{position:absolute;font-size:26px;animation:up 2.4s ease-out forwards}
@keyframes up{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-240px) scale(1.3)}}
#sideBar{position:fixed;right:10px;bottom:160px;display:flex;flex-direction:column;gap:16px;z-index:10;text-align:center}
.side-btn{background:#0008;border:none;color:#fff;width:50px;height:50px;border-radius:50%;font-size:22px;cursor:pointer}
.side-btn small{display:block;font-size:10px}
#products{position:fixed;left:0;right:0;bottom:76px;display:flex;gap:10px;padding:0 12px;overflow-x:auto;z-index:10}
.prod{background:#fff;color:#111;border-radius:12px;padding:8px;min-width:140px;display:flex;gap:8px;align-items:center;cursor:pointer}
.prod img{width:46px;height:46px;border-radius:8px;object-fit:cover}
.prod b{font-size:12px;display:block}
.prod span{color:#0b6b3a;font-weight:700;font-size:12px}
#inputBar{position:fixed;left:0;right:0;bottom:0;padding:12px;display:flex;gap:8px;z-index:11;background:linear-gradient(transparent,#000c)}
#cmtInput{flex:1;background:#ffffff18;border:none;border-radius:24px;padding:12px 16px;color:#fff;font-size:14px}
#cmtInput::placeholder{color:#aaa}
#btnSend{background:#0b6b3a;border:none;color:#fff;width:46px;height:46px;border-radius:50%;font-size:18px;cursor:pointer}
#offline{position:fixed;inset:0;background:#0b1410;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:30;text-align:center;padding:20px}
#report{position:fixed;top:60px;right:12px;z-index:10;background:#0008;border:none;color:#f88;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<video id="video" autoplay playsinline controls></video>
<div id="topBar">
  <a href="index.html">←</a>
  <span class="live-badge">● LIVE</span>
  <div class="vinfo"><img src="https://raw.githubusercontent.com/sen-ecosystem/Sen-landing-hub/main/sentew-app/assets/logo.png"><b id="vName">—</b></div>
  <button class="follow" id="btnFollow" onclick="follow()">+ Suivre</button>
  <span id="viewers">👁 0</span>
</div>
<button id="report" onclick="report()">⚠️ Signaler</button>
<div id="title"></div>
<div id="comments"></div>
<div id="hearts"></div>
<div id="sideBar">
  <button class="side-btn" onclick="addHeart()">❤️<small id="likeCount">0</small></button>
  <button class="side-btn" onclick="shareLive()">📤<small>Partager</small></button>
</div>
<div id="products"></div>
<div id="inputBar">
  <input id="cmtInput" placeholder="Écris un commentaire…" maxlength="200">
  <button id="btnSend" onclick="sendComment()">➤</button>
</div>
<div id="offline">
  <div style="font-size:44px">🔴</div>
  <h2>Live terminé ou indisponible</h2>
  <p style="color:#8aa">Ce live n'est pas en cours. Découvre les boutiques sur SEN TEW.</p>
  <a href="index.html" style="background:#0b6b3a;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700">Ouvrir l'app</a>
</div>
<script>
const SUPA_URL="https://tjqkruhwmjzgfvtouqza.supabase.co";
const SUPA_KEY="sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j";
const HLS="https://customer-k4ked423d85xz498.cloudflarestream.com/22984669988fefcad250cafac0644829/manifest/video.m3u8";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);
let liveId=new URLSearchParams(location.search).get("id");
let likes=0,myName=localStorage.getItem("st_name")||"Client"+Math.floor(Math.random()*900+100);

function sanitize(t){return /(\+?\d[\d\s.\-]{6,}\d)|wa\.me|whatsapp|t\.me|telegram/i.test(t);}
function addComment(a,t,cls){const d=document.createElement("div");d.className="cmt"+(cls?" "+cls:"");d.innerHTML="<b>"+a+"</b>"+t;const c=$("comments");c.appendChild(d);c.scrollTop=c.scrollHeight;while(c.children.length>25)c.removeChild(c.firstChild);}
function addHeart(){likes++;$("likeCount").textContent=likes;
 const h=document.createElement("span");h.className="heart";h.textContent="❤️";h.style.left=(Math.random()*40)+"px";$("hearts").appendChild(h);setTimeout(()=>h.remove(),2400);
 if(liveId)sb.from("live_likes").insert({live_id:liveId}).then(()=>{});}
async function sendComment(){
 const t=$("cmtInput").value.trim();if(!t)return;
 if(sanitize(t)){addComment("Système","🔒 Les numéros et liens externes sont masqués.","sys");$("cmtInput").value="";return;}
 if(liveId)await sb.from("live_comments").insert({live_id:liveId,author:myName,text:t});
 addComment(myName,t);$("cmtInput").value="";
}
function follow(){$("btnFollow").textContent="✓ Suivi";$("btnFollow").style.background="#333";}
function shareLive(){const url=location.href;if(navigator.share)navigator.share({title:"Live SEN TEW",url});else{navigator.clipboard.writeText(url);}}
async function report(){
 if(!liveId)return;
 await sb.from("live_reports").insert({live_id:liveId});
 // 5 signalements = suspension auto du live
 const {count}=await sb.from("live_reports").select("*",{count:"exact",head:true}).eq("live_id",liveId);
 if(count>=5)await sb.from("live_streams").update({status:"suspended"}).eq("id",liveId);
 addComment("Système","Signalement envoyé. Merci.","sys");
}
async function init(){
 // Charger le live
 if(liveId){
   const {data}=await sb.from("live_streams").select("*").eq("id",liveId).single();
   if(data){
     $("vName").textContent=data.vendor||"—";
     $("title").textContent=data.title||"";
     if(data.status!=="live"){$("offline").style.display="flex";return;}
     loadProducts(data.shop_id);
   }
 }
 // Vidéo HLS
 const v=$("video");
 if(Hls.isSupported()){const h=new Hls({lowLatencyMode:true});h.loadSource(HLS);h.attachMedia(v);}
 else if(v.canPlayType("application/vnd.apple.mpegurl"))v.src=HLS;
 else{$("offline").style.display="flex";}
 // S'abonner aux commentaires/likes
 if(liveId){
   sb.channel("lv-"+liveId)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"live_comments",filter:"live_id=eq."+liveId},p=>{const c=p.new;if(sanitize(c.text||""))return;addComment(c.author||"Client",c.text);})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"live_likes",filter:"live_id=eq."+liveId},()=>{likes++;$("likeCount").textContent=likes;const h=document.createElement("span");h.className="heart";h.textContent="❤️";h.style.left=(Math.random()*40)+"px";$("hearts").appendChild(h);setTimeout(()=>h.remove(),2400);})
    .subscribe();
   // Enregistrer ce spectateur
   await sb.from("live_viewers").insert({live_id:liveId});
   setInterval(async()=>{const{count}=await sb.from("live_viewers").select("*",{count:"exact",head:true}).eq("live_id",liveId);$("viewers").textContent="👁 "+(count||0);},8000);
 }
}
async function loadProducts(shopId){
 if(!shopId)return;
 const{data}=await sb.from("products").select("id,name,price,image_url").eq("shop_id",shopId).limit(10);
 const bar=$("products");bar.innerHTML="";
 (data||[]).forEach(p=>{const d=document.createElement("div");d.className="prod";d.onclick=()=>location.href="produit.html?id="+p.id;
  d.innerHTML=(p.image_url?`<img src="${p.image_url}">`:"")+`<div><b>${p.name}</b><span>${Number(p.price).toLocaleString("fr-FR")} F</span></div>`;bar.appendChild(d);});
}
init();
</script>
</body>
</html>
