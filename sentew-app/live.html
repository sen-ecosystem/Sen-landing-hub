<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Live — SEN TEW</title><link rel="stylesheet" href="css/app.css?v=51"><script src="https://unpkg.com/lucide@latest"></script></head><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui}
#vid{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.top{position:absolute;top:0;left:0;right:0;padding:14px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:5}
.badge{background:#e02424;color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;animation:pu 1.5s infinite}
@keyframes pu{50%{opacity:.6}}
.ttl{color:#fff;font-size:14px;font-weight:700;flex:1;text-shadow:0 1px 4px #000}
.rail{position:absolute;right:10px;bottom:150px;display:flex;flex-direction:column;gap:18px;z-index:5;align-items:center}
.rail button{background:rgba(255,255,255,.14);border:none;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}
.cnt{color:#fff;font-size:11px;font-weight:700}
.cbox{position:absolute;left:0;right:0;bottom:70px;max-height:200px;overflow-y:auto;padding:0 12px;z-index:4;display:flex;flex-direction:column;gap:6px;mask-image:linear-gradient(transparent,#000 15%)}
.cm{background:rgba(0,0,0,.45);color:#fff;font-size:12.5px;padding:7px 11px;border-radius:14px;max-width:78%;backdrop-filter:blur(4px)}
.cm b{color:#4ade80}
.inp{position:absolute;left:10px;right:10px;bottom:12px;display:flex;gap:8px;z-index:5}
.inp input{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:24px;padding:12px 16px;font-size:13px;backdrop-filter:blur(6px);outline:none}
.inp input::placeholder{color:rgba(255,255,255,.55)}
.inp button{background:#0f6b4e;border:none;color:#fff;border-radius:24px;padding:0 18px;font-weight:700;cursor:pointer}
.prod{position:absolute;left:10px;bottom:60px;z-index:5;display:flex;gap:8px;overflow-x:auto;max-width:calc(100% - 20px)}
.pc{background:rgba(255,255,255,.92);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;min-width:180px;text-decoration:none;color:#0a1f17}
.pc img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.pc b{font-size:12px;display:block}.pc span{font-size:11px;color:#0f6b4e;font-weight:800}
.heart{position:absolute;bottom:160px;font-size:24px;animation:fl 1.6s ease-out forwards;z-index:6;pointer-events:none}
@keyframes fl{to{transform:translateY(-320px) scale(1.6);opacity:0}}
#off{display:none;position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.9);color:#fff;text-align:center;padding-top:45%}
</style>
<body>
<video id="vid" playsinline autoplay muted></video>
<div class="top"><span class="badge">🔴 LIVE</span><span class="ttl" id="ttl">Live SEN TEW</span><button onclick="follow()" id="fbtn" style="background:#4ade80;border:none;color:#06281c;font-weight:800;font-size:12px;padding:8px 14px;border-radius:20px;cursor:pointer">+ Suivre</button></div>
<div class="rail">
<button onclick="like()">❤️</button><div class="cnt" id="lk">0</div>
<button onclick="share()">📤</button><div class="cnt">Partager</div>
</div>
<div class="prod" id="prod"></div>
<div class="cbox" id="cbox"></div>
<div class="inp"><input id="cm" placeholder="Commenter…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
<div id="off"><div style="font-size:40px">📺</div><h2 id="offt">Live terminé ou indisponible</h2><a href="index.html" style="color:#4ade80">← Retour à la boutique</a></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
var SUPA="https://tjqkruhwmjzgfvtouqza.supabase.co",KEY="sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j";
var P=new URLSearchParams(location.search),VID=P.get('v')||'',LID=P.get('id')||'',TTL=P.get('t')||'Live SEN TEW',SLUG=P.get('s')||'';
var LIDKEY=LID||VID, likes=0, hls=null;
document.getElementById('ttl').textContent=TTL;
function H(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};}
function play(u){var v=document.getElementById('vid');if(Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v);hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal)off();});}else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=u;}else off();v.play().catch(function(){});}
function off(){document.getElementById('off').style.display='block';}
function start(){if(VID){play('https://live.api.video/'+VID+'.m3u8');}else if(LID){fetch(SUPA+'/rest/v1/live_streams?id=eq.'+LID+'&select=*',{headers:H()}).then(function(r){return r.json();}).then(function(a){var l=a&&a[0];if(!l||l.status!=='live'){off();return;}document.getElementById('ttl').textContent=l.title||TTL;play(l.playback_url);}).catch(off);}else off();}
function me(){try{var u=JSON.parse(localStorage.getItem('sentew_user')||'null');return (u&&(u.name||u.email))||'Client';}catch(e){return 'Client';}}
function like(){likes++;document.getElementById('lk').textContent=likes;var h=document.createElement('div');h.className='heart';h.textContent=['❤️','💚','🧡'][likes%3];h.style.right=(20+Math.random()*40)+'px';document.body.appendChild(h);setTimeout(function(){h.remove();},1600);try{fetch(SUPA+'/rest/v1/live_messages',{method:'POST',headers:H(),body:JSON.stringify({live_id:LIDKEY,user_name:me(),message:'__like__'})});}catch(e){}}
function send(){var i=document.getElementById('cm'),m=i.value.trim();if(!m)return;i.value='';fetch(SUPA+'/rest/v1/live_messages',{method:'POST',headers:H(),body:JSON.stringify({live_id:LIDKEY,user_name:me(),message:m})}).then(loadCm);}
function loadCm(){fetch(SUPA+'/rest/v1/live_messages?live_id=eq.'+encodeURIComponent(LIDKEY)+'&order=created_at.desc&limit=30',{headers:H()}).then(function(r){return r.json();}).then(function(a){var b=document.getElementById('cbox');b.innerHTML='';var lk=0;(a||[]).slice().reverse().forEach(function(m){if(m.message==='__like__'){lk++;return;}var d=document.createElement('div');d.className='cm';d.innerHTML='<b>'+String(m.user_name||'Client').replace(/</g,'')+'</b> '+String(m.message||'').replace(/</g,'');b.appendChild(d);});if(lk>likes){likes=lk;document.getElementById('lk').textContent=likes;}b.scrollTop=1e5;}).catch(function(){});}
function share(){var u=location.href;if(navigator.share)navigator.share({title:TTL,url:u});else if(navigator.clipboard){navigator.clipboard.writeText(u);alert('Lien copié ✓');}}
function follow(){var b=document.getElementById('fbtn');b.textContent='✓ Suivi';b.style.background='#0f6b4e';b.style.color='#fff';}
function loadProd(){if(!SLUG)return;fetch(SUPA+'/rest/v1/products?vendor_slug=eq.'+encodeURIComponent(SLUG)+'&select=id,name,price,image_url&limit=8',{headers:H()}).then(function(r){return r.json();}).then(function(a){var p=document.getElementById('prod');(a||[]).forEach(function(x){var d=document.createElement('a');d.className='pc';d.href='produit.html?id='+x.id;d.innerHTML=(x.image_url?'<img src="'+x.image_url+'">':'')+'<div><b>'+String(x.name||'').slice(0,22)+'</b><span>'+Math.round(x.price||0).toLocaleString('fr-FR')+' F</span></div>';p.appendChild(d);});}).catch(function(){});}
document.addEventListener('DOMContentLoaded',function(){start();loadCm();setInterval(loadCm,3000);loadProd();});
</script></body></html>
