<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notifications - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F6B4E">
<link rel="stylesheet" href="css/app.css">
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div class="app-logo" style="text-align:center;font-size:16px;">🔔 Notifications</div>
    <button class="header-btn" onclick="markAll()" title="Tout lire">✓</button>
  </header>

  <main class="app-content">
    <div class="chips" style="padding:12px 16px;">
      <button class="chip active" onclick="filter('all',this)">Tout</button>
      <button class="chip" onclick="filter('order',this)">📦 Commandes</button>
      <button class="chip" onclick="filter('promo',this)">🔥 Promos</button>
      <button class="chip" onclick="filter('msg',this)">💬 Messages</button>
    </div>
    <div id="notifList" style="padding:0 16px;"></div>
    <div style="height:20px;"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">📊</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script>
const notifs = [
  {type:'order',icon:'📦',title:'Commande expédiée',desc:'Sac cuir africain en route - Livraison demain',time:'12 min',unread:true},
  {type:'promo',icon:'🔥',title:'Vente flash -30%',desc:'Écouteurs Pro à 8 400 FCFA pendant 2h',time:'1h',unread:true},
  {type:'msg',icon:'💬',title:'Aminata Diop',desc:'"Le produit est-il toujours disponible ?"',time:'2h',unread:true},
  {type:'order',icon:'✅',title:'Paiement Wave confirmé',desc:'15 000 FCFA - Transaction #SEN2026-0847',time:'3h',unread:false},
  {type:'promo',icon:'🎁',title:'500 FCFA offerts',desc:'Crédit SEN TEW ajouté à votre portefeuille',time:'Hier',unread:false},
  {type:'msg',icon:'⭐',title:'Nouvel avis 5 étoiles',desc:'Moussa Sall a évalué votre produit',time:'Hier',unread:false},
  {type:'order',icon:'🚚',title:'Livraison programmée',desc:'Boubou wax - Vendredi 14h-16h',time:'2j',unread:false},
  {type:'promo',icon:'🌟',title:'Bienvenue GOLD',desc:'Niveau atteint : -10% sur toutes vos commandes',time:'3j',unread:false},
  {type:'order',icon:'📍',title:'Colis à retirer',desc:'Point relais Dakar-Plateau ouvert jusqu\'à 19h',time:'5j',unread:false},
  {type:'msg',icon:'👤',title:'Nouveau follower',desc:'Fatou Ndiaye suit maintenant votre boutique',time:'1sem',unread:false}
];

function render(f='all'){
  const l = f==='all'?notifs:notifs.filter(n=>n.type===f);
  document.getElementById('notifList').innerHTML = l.map(n=>`
    <div style="background:${n.unread?'rgba(212,165,116,.1)':'rgba(255,255,255,.05)'};border-left:3px solid ${n.unread?'#D4A574':'transparent'};border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:12px;">
      <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#0F6B4E,#D4A574);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${n.icon}</div>
      <div style="flex:1;">
        <div style="font-weight:700;font-size:14px;margin-bottom:3px;">${n.title}</div>
        <div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.4;margin-bottom:4px;">${n.desc}</div>
        <div style="font-size:10px;color:#D4A574;">Il y a ${n.time}</div>
      </div>
      ${n.unread?'<div style="width:8px;height:8px;background:#ef4444;border-radius:50%;margin-top:6px;"></div>':''}
    </div>
  `).join('') || '<p style="text-align:center;color:#D4A574;padding:40px;">Aucune notification</p>';
}
function filter(t,el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');render(t)}
function markAll(){notifs.forEach(n=>n.unread=false);render();alert('✅ Toutes marquées lues')}
render();
</script>
</body>
</html>
