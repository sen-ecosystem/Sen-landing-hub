<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifications - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/ai.js"></script>
<script src="js/translate-live.js"></script>
<script src="js/security-shield.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f0;font-family:'Segoe UI',-apple-system,sans-serif;color:#0a1f17;padding-bottom:90px}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:50}
.topbar img{height:30px}
.topbar h1{font-size:14px;font-weight:900;color:#0f6b4e;flex:1}
.topbar a{color:#9aa5a0;text-decoration:none;font-size:13px;font-weight:700}
.wrap{max-width:520px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(160deg,#0a1f17,#0f6b4e);border-radius:18px;color:#fff;padding:18px;text-align:center;margin-bottom:14px}
.hero h2{font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.hero h2 svg{width:19px;height:19px}
.hero p{font-size:11px;opacity:.85;margin-top:4px}
.nitem{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;gap:11px;border-left:4px solid #e5e7eb}
.nitem.unread{border-left-color:#0f6b4e;background:#fafffe}
.nitem .ni{width:38px;height:38px;border-radius:11px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nitem .ni svg{width:18px;height:18px;color:#0f6b4e}
.nitem .nc{flex:1;min-width:0}
.nitem b{font-size:12.5px;display:block;margin-bottom:3px}
.nitem p{font-size:11.5px;color:#4b5563;line-height:1.55}
.nitem small{display:block;font-size:9.5px;color:#9aa5a0;margin-top:5px}
.nitem .dot{width:9px;height:9px;border-radius:50%;background:#10b981;flex-shrink:0;margin-top:5px}
.nitem.read .dot{background:#e5e7eb}
.empty{text-align:center;padding:44px 20px;color:#9aa5a0}
.empty svg{width:44px;height:44px;margin-bottom:12px;color:#d1d5db}
.empty h3{color:#0a1f17;font-size:15px;margin-bottom:5px}
.empty p{font-size:12px;line-height:1.6}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:600;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#9aa5a0;font-size:9.5px;font-weight:700;padding:4px 0;min-height:44px;justify-content:center}
.bottom-nav a.on{color:#0f6b4e}
.bottom-nav a svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="topbar">
  <img src="assets/Logo.png" alt="SEN TEW" onerror="this.style.display='none'">
  <h1>Notifications</h1>
  <a href="index.html">✕</a>
</div>
<div class="wrap">
  <div class="hero">
    <h2><i data-lucide="bell"></i> Ton centre de messages</h2>
    <p>Validations, reversements, rappels — tout arrive ici.</p>
  </div>
  <div id="list"></div>
</div>
<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i>Accueil</a>
  <a href="categories.html"><i data-lucide="grid-2x2"></i>Catégories</a>
  <a href="notifications.html" class="on"><i data-lucide="bell"></i>Notifs</a>
  <a href="commandes.html"><i data-lucide="package"></i>Commandes</a>
  <a href="profil.html"><i data-lucide="user"></i>Profil</a>
</nav>
<script>
lucide.createIcons();
var SUPA_URL='https://tjqkruhwmjzgfvtouqza.supabase.co';
var SUPA_KEY='sb_publishable_XCdjFFvg7Wys68uFf4Bs5A_5XHpDz9j';
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
function iconFor(t){
  if(t==='kyc_pending'||t==='admin_msg')return 'mail';
  if(t==='payout')return 'banknote';
  return 'bell';
}
async function load(){
  var u=null;
  try{u=JSON.parse(sessionStorage.getItem('sentew_user')||localStorage.getItem('sentew_user'));}catch(e){}
  var el=document.getElementById('list');
  if(!u||!u.email){
    el.innerHTML='<div class="empty"><i data-lucide="bell-off"></i><h3>Connecte-toi</h3><p>Connecte-toi pour voir tes notifications.</p></div>';
    lucide.createIcons();return;
  }
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/notifications?audience=eq.user&user_email=eq.'+encodeURIComponent(u.email)+'&order=created_at.desc&limit=50',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    var rows=await r.json()||[];
    if(!rows.length){
      el.innerHTML='<div class="empty"><i data-lucide="inbox"></i><h3>Aucune notification</h3><p>Les messages de l\'équipe SEN TEW apparaîtront ici.</p></div>';
      lucide.createIcons();return;
    }
    el.innerHTML=rows.map(function(n,idx){
      return '<div class="nitem '+(n.is_read?'read':'unread')+'" data-id="'+n.id+'">'
        +'<div class="ni"><i data-lucide="'+iconFor(n.type)+'"></i></div>'
        +'<div class="nc"><b>'+esc(n.title)+'</b><p class="st-notif-text" data-idx="'+idx+'">'+esc(n.message)+'</p><span class="st-notif-slot" data-idx="'+idx+'"></span>'
        +'<small>'+new Date(n.created_at).toLocaleString('fr-FR')+'</small></div>'
        +'<div class="dot"></div></div>';
    }).join('');
    lucide.createIcons();
    document.querySelectorAll('.st-notif-slot').forEach(function(slot){
      var el2 = document.querySelector('.st-notif-text[data-idx="'+slot.dataset.idx+'"]');
      if(el2) stTrAttachButton(el2, {container: slot});
    });
    /* marquer lues au toucher */
    document.querySelectorAll('.nitem.unread').forEach(function(it){
      it.addEventListener('click',function(){
        it.classList.remove('unread');it.classList.add('read');
        fetch(SUPA_URL+'/rest/v1/notifications?id=eq.'+it.dataset.id,{method:'PATCH',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({is_read:true})});
      });
    });
  }catch(e){
    el.innerHTML='<div class="empty"><h3>Erreur réseau</h3><p>Vérifie ta connexion et recharge.</p></div>';
  }
}
load();
</script>
  <script src="js/i18n.js"></script>
</body>
</html>
