<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boutique - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#0F6B4E">
<style>
/* ===== HEADER ===== */
.app-header{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px;background:#fff;
  border-bottom:1px solid #F3F4F6;
  position:sticky;top:0;z-index:100;
}
.hd-btn{
  width:38px;height:38px;background:#F9FAFB;
  border:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#0A4D38;text-decoration:none;
}

/* ===== HERO VENDEUR ===== */
.shop-hero{
  background:linear-gradient(135deg,#0F6B4E,#0A4D38);
  padding:20px 16px;color:#fff;
}
.shop-hero-row{display:flex;gap:14px;align-items:center;}
.shop-avatar{
  width:80px;height:80px;border-radius:50%;
  border:3px solid #D4A574;object-fit:cover;
  flex-shrink:0;
}
.shop-name{font-size:20px;font-weight:900;margin:0;}
.shop-bio{font-size:12px;opacity:.9;margin:2px 0;}
.shop-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.shop-bdg{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:900;}
.shop-stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;margin-top:14px;text-align:center;
}
.shop-stat-num{font-weight:900;font-size:16px;}
.shop-stat-lbl{font-size:10px;opacity:.8;}
.shop-actions{display:flex;gap:8px;margin-top:14px;}
.shop-btn{
  flex:1;padding:10px;border:none;border-radius:10px;
  font-weight:800;font-size:12px;cursor:pointer;
}
.btn-follow{background:#D4A574;color:#fff;}
.btn-msg{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);}
.btn-live{background:#ef4444;color:#fff;padding:10px 14px;flex:0 0 auto;}

/* ===== TABS FIX (le bug de ta capture) ===== */
.tabs-bar{
  display:flex;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  position:sticky;
  top:62px;  /* IMPORTANT: sous le header */
  z-index:50;  /* sous les cartes lors du scroll */
  border-bottom:1px solid #F3F4F6;
}
.shop-tab{
  flex:1;padding:14px 4px;
  background:none;border:none;
  border-bottom:3px solid transparent;
  font-weight:700;font-size:12px;
  color:#6B7280;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.shop-tab.active{
  color:#0F6B4E;
  border-bottom-color:#0F6B4E;
}

/* ===== CONTENT — le fix principal ===== */
.tab-panel{
  padding:12px;
  background:#F5F5F0;  /* fond distinct pour éviter la sensation de chevauchement */
  min-height:calc(100vh - 350px);
}

/* Grid produits */
.pgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.pcard{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;
}
.pcard-img{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#F9FAFB;
}
.pcard-img img{
  width:100%;height:100%;
  object-fit:cover;object-position:center;
}
.pcard-badge{
  position:absolute;top:8px;left:8px;
  background:#ef4444;color:#fff;
  padding:3px 8px;border-radius:6px;
  font-size:10px;font-weight:900;z-index:2;
}
.pcard-fav{
  position:absolute;top:8px;right:8px;
  width:30px;height:30px;
  background:rgba(255,255,255,.95);
  border-radius:50%;border:none;
  font-size:14px;z-index:2;
}
.pcard-info{padding:10px;}
.pcard-name{
  font-size:13px;font-weight:700;color:#111827;
  line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  min-height:34px;margin-bottom:6px;
}
.pcard-price{font-weight:900;color:#D4A574;font-size:14px;}
.pcard-old{text-decoration:line-through;color:#9CA3AF;font-size:11px;margin-left:4px;}

/* Promos card */
.promo-hero-shop{
  background:linear-gradient(135deg,#ef4444,#f97316);
  padding:20px;border-radius:14px;color:#fff;
  margin-bottom:14px;
}

/* Avis */
.rating-summary{
  background:#fff;padding:16px;border-radius:14px;
  text-align:center;margin-bottom:12px;
}
.review-card{
  background:#fff;padding:14px;border-radius:12px;
  margin-bottom:8px;
}

/* Infos */
.info-block{
  background:#fff;padding:16px;border-radius:14px;
}
.info-item{padding:10px 0;border-bottom:1px solid #F3F4F6;}
.info-item:last-child{border-bottom:none;}

.app-content{padding-bottom:80px;padding-top:0;}
</style>
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="hd-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:900;color:#0A4D38;" id="hdrName">Boutique</div>
    <button class="hd-btn" onclick="shareShop()">📤</button>
  </header>

  <main class="app-content">
    <!-- HERO -->
    <div class="shop-hero">
      <div class="shop-hero-row">
        <img id="shopAvatar" class="shop-avatar" src="" alt="">
        <div style="flex:1;min-width:0;">
          <h2 class="shop-name" id="shopTitle">—</h2>
          <div class="shop-bio" id="shopBio">—</div>
          <div class="shop-badges">
            <span class="shop-bdg" style="background:#D4A574;">✅ SEN VERIFIED</span>
            <span id="liveBadge" class="shop-bdg" style="background:#ef4444;display:none;">🔴 EN LIVE</span>
          </div>
        </div>
      </div>
      <div class="shop-stats">
        <div><div class="shop-stat-num" id="stF">0</div><div class="shop-stat-lbl">Abonnés</div></div>
        <div><div class="shop-stat-num" id="stP">0</div><div class="shop-stat-lbl">Produits</div></div>
        <div><div class="shop-stat-num" id="stS">0</div><div class="shop-stat-lbl">Ventes</div></div>
        <div><div class="shop-stat-num">⭐ <span id="stR">4.8</span></div><div class="shop-stat-lbl">Note</div></div>
      </div>
      <div class="shop-actions">
        <button id="btnFollow" class="shop-btn btn-follow" onclick="toggleFollow()">+ Suivre</button>
        <button class="shop-btn btn-msg" onclick="messageShop()">💬 Message</button>
        <button id="btnLive" class="shop-btn btn-live" onclick="watchLive()" style="display:none;">🔴 LIVE</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-bar">
      <button class="shop-tab active" data-tab="products">🛍️ Produits</button>
      <button class="shop-tab" data-tab="promos">🎁 Promos</button>
      <button class="shop-tab" data-tab="reviews">⭐ Avis</button>
      <button class="shop-tab" data-tab="about">ℹ️ Infos</button>
    </div>

    <!-- CONTENUS -->
    <div id="panelProducts" class="tab-panel"></div>
    <div id="panelPromos" class="tab-panel" style="display:none;"></div>
    <div id="panelReviews" class="tab-panel" style="display:none;"></div>
    <div id="panelAbout" class="tab-panel" style="display:none;"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒<span class="badge">3</span></div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>
