<!DOCTYPE html>
<html lang="fr">
<head>
  <style>
.shop-tab-wrap{
  display:flex;gap:0;
  background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.05);
  position:relative;
  z-index:2;
}
.shop-tab{
  flex:1;padding:12px 4px;
  background:none;border:none;
  border-bottom:3px solid transparent;
  font-weight:700;font-size:12px;
  color:#6B7280;cursor:pointer;
}
.shop-tab.active{
  color:#0F6B4E;
  border-bottom-color:#0F6B4E;
}
.tab-content{padding:12px !important;}
.tab-content .grid{
  display:grid !important;
  grid-template-columns:repeat(2,1fr) !important;
  gap:10px !important;
}
.tab-content .product-card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  text-decoration:none;
  color:inherit;
  display:flex !important;
  flex-direction:column !important;
}
.tab-content .card-image-wrap{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#F9FAFB;
}
.tab-content .card-image-wrap img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center;
}
.tab-content .card-info{padding:10px;}
.tab-content .card-name{
  font-size:13px;font-weight:700;color:#111827;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:34px;margin-bottom:6px;line-height:1.3;
}
.tab-content .card-price{font-weight:900;color:#D4A574;font-size:14px;}
</style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boutique - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#0F6B4E">
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:900;color:#0A4D38;" id="shopName">Boutique</div>
    <button class="header-btn" onclick="shareBoutique()">📤</button>
  </header>

  <main class="app-content">
    <!-- Header vendeur -->
    <div style="background:linear-gradient(135deg,#0F6B4E,#0A4D38);padding:20px 16px;color:#fff;position:relative;">
      <div style="display:flex;gap:14px;align-items:center;">
        <img id="shopAvatar" src="" style="width:80px;height:80px;border-radius:50%;border:3px solid #D4A574;object-fit:cover;">
        <div style="flex:1;">
          <div style="font-size:20px;font-weight:900;" id="shopTitle">—</div>
          <div style="font-size:12px;opacity:.9;" id="shopBio">—</div>
          <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
            <span style="background:#D4A574;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:900;">✅ SEN VERIFIED</span>
            <span id="liveBadge" style="background:#ef4444;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:900;display:none;">🔴 EN LIVE</span>
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;text-align:center;">
        <div><div style="font-weight:900;font-size:16px;" id="stFollowers">0</div><div style="font-size:10px;opacity:.8;">Abonnés</div></div>
        <div><div style="font-weight:900;font-size:16px;" id="stProducts">0</div><div style="font-size:10px;opacity:.8;">Produits</div></div>
        <div><div style="font-weight:900;font-size:16px;" id="stSales">0</div><div style="font-size:10px;opacity:.8;">Ventes</div></div>
        <div><div style="font-weight:900;font-size:16px;">⭐ <span id="stRating">4.8</span></div><div style="font-size:10px;opacity:.8;">Note</div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button id="btnFollow" onclick="toggleFollow()" style="flex:1;padding:10px;background:#D4A574;color:#fff;border:none;border-radius:10px;font-weight:800;">+ Suivre</button>
        <button onclick="messageShop()" style="flex:1;padding:10px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;font-weight:800;backdrop-filter:blur(10px);">💬 Message</button>
        <button id="btnLive" onclick="watchLive()" style="padding:10px 14px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-weight:800;display:none;">🔴 LIVE</button>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:0;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.05);position:sticky;top:56px;z-index:5;">
      <button class="shop-tab active" data-tab="products">🛍 Produits</button>
      <button class="shop-tab" data-tab="promos">🎁 Promos</button>
      <button class="shop-tab" data-tab="reviews">⭐ Avis</button>
      <button class="shop-tab" data-tab="about">ℹ️ Infos</button>
    </div>

    <!-- Contenu tabs -->
    <div id="tabProducts" class="tab-content" style="padding:12px;"></div>
    <div id="tabPromos" class="tab-content" style="padding:12px;display:none;"></div>
    <div id="tabReviews" class="tab-content" style="padding:12px;display:none;"></div>
    <div id="tabAbout" class="tab-content" style="padding:12px;display:none;"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒<span class="badge">3</span></div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<style>
.shop-tab{flex:1;padding:12px 4px;background:none;border:none;border-bottom:3px solid transparent;font-weight:700;font-size:12px;color:#6B7280;cursor:pointer;}
.shop-tab.active{color:#0F6B4E;border-bottom-color:#0F6B4E;}
</style>

<script src="js/data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const shopId = params.get('id') || params.get('seller') || '1';
const list = (typeof products !== 'undefined' ? products : (typeof PRODUCTS !== 'undefined' ? PRODUCTS : []));

// Données boutique
const SHOPS = {
  '1': { name:'Aïcha Boutique', bio:'Mode africaine premium · Dakar', avatar:'https://i.pravatar.cc/200?img=1', followers:12400, sales:3200, rating:4.9, live:true },
  '2': { name:'Moussa Tech', bio:'Électronique & Smartphones · Plateau', avatar:'https://i.pravatar.cc/200?img=11', followers:8900, sales:2100, rating:4.7, live:false },
  '3': { name:'Fatou Beauté', bio:'Cosmétiques bio · Almadies', avatar:'https://i.pravatar.cc/200?img=5', followers:5600, sales:1400, rating:4.8, live:false },
  'default': { name:'Boutique SEN', bio:'Vendeur SEN TEW', avatar:'https://i.pravatar.cc/200', followers:1200, sales:340, rating:4.6, live:false }
};

const shop = SHOPS[shopId] || SHOPS.default;
const shopProducts = list.slice(0, 12);

document.getElementById('shopName').textContent = shop.name;
document.getElementById('shopTitle').textContent = shop.name;
document.getElementById('shopBio').textContent = shop.bio;
document.getElementById('shopAvatar').src = shop.avatar;
document.getElementById('stFollowers').textContent = shop.followers.toLocaleString();
document.getElementById('stProducts').textContent = shopProducts.length;
document.getElementById('stSales').textContent = shop.sales.toLocaleString();
document.getElementById('stRating').textContent = shop.rating;
if (shop.live) {
  document.getElementById('liveBadge').style.display = 'inline-block';
  document.getElementById('btnLive').style.display = 'block';
}

// Follow status
const followed = JSON.parse(localStorage.getItem('followed')||'[]');
if (followed.includes(shopId)) {
  document.getElementById('btnFollow').textContent = '✓ Suivi';
  document.getElementById('btnFollow').style.background = 'rgba(255,255,255,.2)';
}

// Products tab
document.getElementById('tabProducts').innerHTML = `<div class="grid">${shopProducts.map(p=>`
  <a href="produit.html?id=${p.id}" class="product-card">
    <div class="card-image-wrap"><img src="${p.image}" alt=""></div>
    <div class="card-info">
      <div class="card-name">${p.name}</div>
      <div class="card-price">${Number(p.price).toLocaleString()} FCFA</div>
    </div>
  </a>`).join('')}</div>`;

// Promos tab
document.getElementById('tabPromos').innerHTML = `
  <div style="background:linear-gradient(135deg,#ef4444,#f97316);padding:20px;border-radius:14px;color:#fff;margin-bottom:12px;">
    <div style="font-size:12px;opacity:.9;">Code promo exclusif</div>
    <div style="font-size:28px;font-weight:900;">-20%</div>
    <div>Sur toute la boutique · Code: <strong>${shop.name.split(' ')[0].toUpperCase()}20</strong></div>
  </div>
  <div class="grid">${shopProducts.slice(0,4).map(p=>`
    <a href="produit.html?id=${p.id}" class="product-card">
      <div class="card-image-wrap"><span class="card-badge">PROMO</span><img src="${p.image}" alt=""></div>
      <div class="card-info">
        <div class="card-name">${p.name}</div>
        <div class="card-price">${Math.round(p.price*0.8).toLocaleString()} FCFA</div>
        <div style="text-decoration:line-through;font-size:11px;color:#9CA3AF;">${Number(p.price).toLocaleString()}</div>
      </div>
    </a>`).join('')}</div>`;

// Reviews tab
document.getElementById('tabReviews').innerHTML = `
  <div style="background:#fff;padding:16px;border-radius:14px;text-align:center;margin-bottom:12px;">
    <div style="font-size:36px;font-weight:900;color:#D4A574;">${shop.rating}</div>
    <div style="color:#D4A574;font-size:20px;">${'⭐'.repeat(Math.round(shop.rating))}</div>
    <div style="font-size:12px;color:#6B7280;">Basé sur ${shop.sales} ventes</div>
  </div>
  ${[
    {u:'Awa D.',s:5,t:'Excellent vendeur, livraison rapide !'},
    {u:'Moussa',s:5,t:'Produits conformes à la description'},
    {u:'Fatou',s:4,t:'Bonne qualité, je recommande'}
  ].map(r=>`
    <div style="background:#fff;padding:14px;border-radius:12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;">
        <strong>${r.u}</strong>
        <span style="color:#D4A574;">${'⭐'.repeat(r.s)}</span>
      </div>
      <div style="font-size:13px;color:#374151;margin-top:6px;">${r.t}</div>
    </div>`).join('')}`;

// About tab
document.getElementById('tabAbout').innerHTML = `
  <div style="background:#fff;padding:16px;border-radius:14px;">
    <div style="display:grid;gap:12px;">
      <div><strong>📍 Adresse</strong><br><span style="color:#6B7280;">Dakar, Sénégal</span></div>
      <div><strong>📱 Téléphone</strong><br><a href="tel:+221771234567" style="color:#0F6B4E;">+221 77 123 45 67</a></div>
      <div><strong>⏰ Horaires</strong><br><span style="color:#6B7280;">Lun-Sam : 9h-20h · Dim : 10h-18h</span></div>
      <div><strong>🚚 Livraison</strong><br><span style="color:#6B7280;">Dakar 24h · Régions 2-5j</span></div>
      <div><strong>💳 Paiement</strong><br><span style="color:#6B7280;">Wave · Orange Money · Free Money · CB</span></div>
      <div><strong>🛡 Politique</strong><br><span style="color:#6B7280;">Retour 7j · Garantie qualité</span></div>
    </div>
  </div>`;

document.querySelectorAll('.shop-tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.shop-tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.style.display='none');
    t.classList.add('active');
    document.getElementById('tab'+t.dataset.tab.charAt(0).toUpperCase()+t.dataset.tab.slice(1)).style.display='block';
  };
});

function toggleFollow(){
  const followed = JSON.parse(localStorage.getItem('followed')||'[]');
  const idx = followed.indexOf(shopId);
  const btn = document.getElementById('btnFollow');
  if (idx > -1) { followed.splice(idx,1); btn.textContent='+ Suivre'; btn.style.background='#D4A574'; }
  else { followed.push(shopId); btn.textContent='✓ Suivi'; btn.style.background='rgba(255,255,255,.2)'; }
  localStorage.setItem('followed',JSON.stringify(followed));
  navigator.vibrate&&navigator.vibrate(30);
}

function messageShop(){ location.href='messages.html?seller='+shopId; }
function watchLive(){ location.href='live.html?seller='+shopId; }
function shareBoutique(){
  const url = location.href;
  if(navigator.share)navigator.share({title:shop.name,url});
  else{navigator.clipboard.writeText(url);alert('Lien copié');}
}
</script>
</body>
</html>
