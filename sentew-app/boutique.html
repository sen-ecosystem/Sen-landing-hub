<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boutique - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<style>
:root{--v:#00a651;--j:#fcd116}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding-bottom:100px;-webkit-overflow-scrolling:touch}
.hero{background:linear-gradient(135deg,var(--v),#008a44);color:#fff;padding:20px 16px;position:relative}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;position:absolute;top:16px;left:16px}
.shop-header{display:flex;gap:14px;align-items:center;margin-top:32px}
.shop-avatar{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid var(--j)}
.shop-info h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.verified{background:#1da1f2;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.shop-info p{font-size:13px;opacity:.9;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;background:rgba(255,255,255,.15);padding:12px;border-radius:12px}
.stat{text-align:center;color:#fff}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;opacity:.85}
.tabs{position:sticky;top:0;background:#fff;display:flex;border-bottom:1px solid #eee;z-index:80;overflow-x:auto}
.tab{flex:1;min-width:80px;padding:14px 8px;text-align:center;font-size:13px;font-weight:600;color:#666;border:none;background:none;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--v);border-bottom:3px solid var(--v)}
.section{padding:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card img{width:100%;height:130px;object-fit:cover;background:#eee}
.card-body{padding:8px}
.card-body h4{font-size:13px;font-weight:600;line-height:1.3;height:34px;overflow:hidden}
.price{color:var(--v);font-weight:700;font-size:14px;margin-top:4px}
.old{color:#999;text-decoration:line-through;font-size:11px;margin-left:4px}
.info-item{background:#fff;padding:14px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between}
.info-item b{color:#666;font-size:13px}
.info-item span{font-weight:600;font-size:13px}
.review{background:#fff;padding:14px;border-radius:10px;margin-bottom:8px}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.review-name{font-weight:600;font-size:13px}
.stars{color:#fcd116;font-size:13px}
.review p{font-size:13px;color:#555}
.follow{background:var(--j);color:#222;border:none;padding:10px 20px;border-radius:20px;font-weight:600;position:absolute;top:16px;right:16px;font-size:13px}
</style>
</head>
<body>

<div class="hero">
  <button class="back" onclick="history.back()">←</button>
  <button class="follow" onclick="toggleFollow(this)">+ Suivre</button>
  <div class="shop-header">
    <div class="shop-avatar" id="avatar">🛍️</div>
    <div class="shop-info">
      <h2 id="shopName">Boutique <span class="verified">✓</span></h2>
      <p id="shopDesc">Description</p>
      <p>⭐ <span id="rating">4.8</span> · 📍 <span id="loc">Dakar</span></p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="s1">120</b><span>Produits</span></div>
    <div class="stat"><b id="s2">1.2k</b><span>Ventes</span></div>
    <div class="stat"><b id="s3">856</b><span>Abonnés</span></div>
    <div class="stat"><b id="s4">98%</b><span>Satisfait</span></div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('products',this)">🛒 Produits</button>
  <button class="tab" onclick="showTab('promo',this)">🔥 Promos</button>
  <button class="tab" onclick="showTab('avis',this)">⭐ Avis</button>
  <button class="tab" onclick="showTab('info',this)">ℹ️ Infos</button>
</div>

<div class="section" id="products">
  <div class="grid" id="productGrid"></div>
</div>
<div class="section" id="promo" style="display:none">
  <div class="grid" id="promoGrid"></div>
</div>
<div class="section" id="avis" style="display:none"></div>
<div class="section" id="info" style="display:none"></div>

<script>
const SHOPS = {
  '1':{name:'Aïcha Fashion',avatar:'👗',desc:'Mode & tendances du Sénégal',rating:4.9,loc:'Dakar',stats:[85,2400,1523,99]},
  '2':{name:'Tech Modou',avatar:'📱',desc:'Smartphones & accessoires',rating:4.7,loc:'Dakar',stats:[120,890,650,96]},
  '3':{name:'Mamadou Foods',avatar:'🍲',desc:'Produits locaux frais',rating:4.8,loc:'Thiès',stats:[65,1560,890,98]},
  '4':{name:'Beauty Fatou',avatar:'💄',desc:'Cosmétiques & soins',rating:4.9,loc:'Dakar',stats:[95,3200,2100,99]}
};

const PRODUCTS = [
  {id:1,shop:'1',name:'Boubou traditionnel brodé',price:25000,old:35000,img:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=300'},
  {id:2,shop:'1',name:'Robe wax colorée',price:18500,old:22000,img:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=300'},
  {id:3,shop:'1',name:'Sac cuir artisanal',price:15000,img:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=300'},
  {id:4,shop:'1',name:'Sandales cousues main',price:8500,old:12000,img:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=300'},
  {id:5,shop:'2',name:'iPhone 15 Pro Max',price:850000,img:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=300'},
  {id:6,shop:'2',name:'AirPods Pro 2',price:135000,old:180000,img:'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=300'},
  {id:7,shop:'3',name:'Riz local 25kg',price:18000,img:'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300'},
  {id:8,shop:'3',name:'Huile de palme 5L',price:6500,old:8000,img:'https://images.unsplash.com/photo-1620705242131-3f4f1de5d90c?w=300'},
  {id:9,shop:'4',name:'Kit soin peau naturel',price:22000,img:'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=300'},
  {id:10,shop:'4',name:'Rouge à lèvres mat',price:5500,old:7500,img:'https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=300'}
];

const REVIEWS = [
  {name:'Awa D.',stars:5,text:'Super qualité, livraison rapide 👌'},
  {name:'Ibrahima S.',stars:5,text:'Vendeur pro, produit conforme'},
  {name:'Fatou M.',stars:4,text:'Bien mais colis un peu long'},
  {name:'Moussa K.',stars:5,text:'Rien à dire, parfait !'}
];

const shopId = new URLSearchParams(location.search).get('id') || '1';
const shop = SHOPS[shopId] || SHOPS['1'];

document.getElementById('avatar').textContent = shop.avatar;
document.getElementById('shopName').innerHTML = shop.name + ' <span class="verified">✓</span>';
document.getElementById('shopDesc').textContent = shop.desc;
document.getElementById('rating').textContent = shop.rating;
document.getElementById('loc').textContent = shop.loc;
document.getElementById('s1').textContent = shop.stats[0];
document.getElementById('s2').textContent = shop.stats[1].toLocaleString();
document.getElementById('s3').textContent = shop.stats[2].toLocaleString();
document.getElementById('s4').textContent = shop.stats[3]+'%';

const shopProducts = PRODUCTS.filter(p => p.shop === shopId);
const promoProducts = shopProducts.filter(p => p.old);

function renderGrid(id, list){
  document.getElementById(id).innerHTML = list.map(p => `
    <div class="card" onclick="location.href='produit.html?id=${p.id}'">
      <img src="${p.img}" alt="${p.name}" loading="lazy">
      <div class="card-body">
        <h4>${p.name}</h4>
        <div class="price">${p.price.toLocaleString()} FCFA
          ${p.old ? `<span class="old">${p.old.toLocaleString()}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

renderGrid('productGrid', shopProducts);
renderGrid('promoGrid', promoProducts);

document.getElementById('avis').innerHTML = REVIEWS.map(r => `
  <div class="review">
    <div class="review-head">
      <span class="review-name">${r.name}</span>
      <span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span>
    </div>
    <p>${r.text}</p>
  </div>
`).join('');

document.getElementById('info').innerHTML = `
  <div class="info-item"><b>📍 Localisation</b><span>${shop.loc}, Sénégal</span></div>
  <div class="info-item"><b>📞 Contact</b><span>+221 XX XXX XX XX</span></div>
  <div class="info-item"><b>🕐 Horaires</b><span>8h - 20h</span></div>
  <div class="info-item"><b>🚚 Livraison</b><span>Dakar 24h / Régions 3-5j</span></div>
  <div class="info-item"><b>💳 Paiement</b><span>Wave, OM, Free, Wizall, CB</span></div>
  <div class="info-item"><b>↩️ Retour</b><span>14 jours</span></div>
  <div class="info-item"><b>✅ Vérifié</b><span>Depuis 2024</span></div>
`;

function showTab(id, btn){
  document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
  document.getElementById(id).style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

function toggleFollow(btn){
  if(btn.textContent === '+ Suivre'){
    btn.textContent = '✓ Suivi';
    btn.style.background = '#fff';
  } else {
    btn.textContent = '+ Suivre';
    btn.style.background = '#fcd116';
  }
}
</script>
</body>
</html>
