<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Boutique - SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
  <button class="btn-back" onclick="history.back()">
    <i data-lucide="arrow-left" class="icon icon-md icon-vert"></i>
  </button>
  <h1 id="shopTitle">Boutique</h1>
  <button class="icon-btn">
    <i data-lucide="share-2" class="icon icon-md icon-vert"></i>
  </button>
</header>

<main id="shopMain" style="padding-bottom:100px;">
  <!-- Généré JS -->
</main>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home" class="icon icon-md"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search" class="icon icon-md"></i><span>Rechercher</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart" class="icon icon-md icon-or"></i><span>Panier</span></a>
  <a href="favoris.html"><i data-lucide="heart" class="icon icon-md"></i><span>Favoris</span></a>
  <a href="profil.html"><i data-lucide="user" class="icon icon-md"></i><span>Profil</span></a>
</nav>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
const SELLERS = [
  {id:1,name:'Aïcha Couture',avatar:'https://i.pravatar.cc/200?img=1',cover:'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=800',verified:'platinum',live:true,sales:2400000,city:'Dakar',rating:4.9,reviews:527,followers:2340,products:47,bio:'Créatrice de mode africaine premium. Vêtements traditionnels revisités.',since:'2023'},
  {id:2,name:'Moussa Tech',avatar:'https://i.pravatar.cc/200?img=13',cover:'https://images.unsplash.com/photo-1550009158-9ebf69173e03?w=800',verified:'gold',live:true,sales:1800000,city:'Dakar',rating:4.7,reviews:389,followers:1820,products:32,bio:'High-tech neuf et reconditionné. Garantie 1 an.',since:'2024'},
  {id:3,name:'Fatou Fashion',avatar:'https://i.pravatar.cc/200?img=5',cover:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=800',verified:'gold',live:false,sales:1200000,city:'Thiès',rating:4.6,reviews:245,followers:987,products:28,bio:'Collection wax authentique. Artisanat local.',since:'2024'},
  {id:4,name:'Ibrahim Bio',avatar:'https://i.pravatar.cc/200?img=8',cover:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=800',verified:'silver',live:false,sales:800000,city:'Saint-Louis',rating:4.8,reviews:456,followers:672,products:15,bio:'Produits bio 100% Sénégal. Karité, hibiscus, moringa.',since:'2025'},
  {id:5,name:'Mariama Beauté',avatar:'https://i.pravatar.cc/200?img=9',cover:'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=800',verified:'gold',live:true,sales:1500000,city:'Dakar',rating:4.9,reviews:334,followers:1567,products:41,bio:'Cosmétiques naturels africains.',since:'2024'}
];

const PRODUCTS = [
  {id:1,name:'Boubou wax collection',price:18000,oldPrice:25000,image:'https://images.unsplash.com/photo-1544441893-675973e31985?w=400',sellerId:3,cat:'mode'},
  {id:2,name:'iPhone 15 Pro 256GB',price:750000,image:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=400',sellerId:2,cat:'tech'},
  {id:3,name:'Sac cuir africain premium',price:15000,oldPrice:22000,image:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=400',sellerId:1,cat:'mode'},
  {id:4,name:'Écouteurs sans fil Pro',price:12000,image:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400',sellerId:2,cat:'tech'},
  {id:5,name:'Beurre karité 500g',price:4500,image:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=400',sellerId:4,cat:'beauty'},
  {id:6,name:'Robe bogolan',price:22000,oldPrice:30000,image:'https://images.unsplash.com/photo-1585487000160-6ebcfceb0d03?w=400',sellerId:1,cat:'mode'},
  {id:7,name:'Masque visage bio',price:6500,image:'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=400',sellerId:5,cat:'beauty'},
  {id:8,name:'Montre connectée',price:35000,oldPrice:45000,image:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400',sellerId:2,cat:'tech'}
];

function getSellerId() {
  const params = new URLSearchParams(location.search);
  return parseInt(params.get('id')) || 1;
}

function renderShop() {
  const id = getSellerId();
  const s = SELLERS.find(x => x.id === id) || SELLERS[0];
  const shopProducts = PRODUCTS.filter(p => p.sellerId === s.id);

  document.getElementById('shopTitle').textContent = s.name;

  document.getElementById('shopMain').innerHTML = `
    <!-- Cover -->
    <div style="position:relative;height:160px;background:url('${s.cover}') center/cover;">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(10,31,23,0.7));"></div>
      ${s.live ? '<div style="position:absolute;top:12px;right:12px;background:var(--rouge);color:white;padding:6px 12px;border-radius:8px;font-weight:800;font-size:11px;display:flex;align-items:center;gap:4px;"><span class="pulse">●</span> EN LIVE</div>' : ''}
    </div>

    <!-- Profil vendeur -->
    <div style="padding:16px;background:var(--bg-card);margin-top:-40px;position:relative;border-radius:20px 20px 0 0;">
      <div style="display:flex;align-items:flex-end;gap:16px;margin-bottom:12px;">
        <img src="${s.avatar}" style="width:80px;height:80px;border-radius:50%;border:4px solid var(--bg-card);object-fit:cover;">
        <div style="flex:1;padding-bottom:8px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <h2 style="font-size:20px;font-weight:800;">${s.name}</h2>
            ${s.verified === 'platinum' ? '<i data-lucide="badge-check" class="icon icon-md icon-violet"></i>' : ''}
            ${s.verified === 'gold' ? '<i data-lucide="badge-check" class="icon icon-md icon-or"></i>' : ''}
            ${s.verified === 'silver' ? '<i data-lucide="badge-check" class="icon icon-md" style="color:#9ca3af;stroke:#9ca3af;"></i>' : ''}
          </div>
          <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px;">
            <i data-lucide="map-pin" class="icon icon-sm"></i>
            <span>${s.city} · Depuis ${s.since}</span>
          </div>
        </div>
      </div>

      <p style="font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:16px;">${s.bio}</p>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;">
        <div style="text-align:center;padding:10px;background:var(--bg);border-radius:10px;">
          <div style="font-size:16px;font-weight:800;color:var(--v-emeraude);">${s.products}</div>
          <div style="font-size:10px;color:var(--text-muted);">Produits</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--bg);border-radius:10px;">
          <div style="font-size:16px;font-weight:800;color:var(--v-emeraude);">${s.followers}</div>
          <div style="font-size:10px;color:var(--text-muted);">Abonnés</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--bg);border-radius:10px;">
          <div style="font-size:16px;font-weight:800;color:var(--or-royal);">${s.rating}★</div>
          <div style="font-size:10px;color:var(--text-muted);">${s.reviews} avis</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--bg);border-radius:10px;">
          <div style="font-size:12px;font-weight:800;color:var(--v-emeraude);">${(s.sales/1000).toFixed(0)}K</div>
          <div style="font-size:10px;color:var(--text-muted);">Ventes</div>
        </div>
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn-primary" style="flex:1;" onclick="followSeller(${s.id})">
          <i data-lucide="user-plus" class="icon icon-sm icon-blanc" style="margin-right:4px;"></i>
          Suivre
        </button>
        <button class="btn-secondary" style="flex:1;" onclick="location.href='chat.html?vendor=${s.id}'">
          <i data-lucide="message-circle" class="icon icon-sm icon-vert" style="margin-right:4px;"></i>
          Message
        </button>
      </div>
    </div>

    <!-- Filtres catégories -->
    <div style="display:flex;gap:8px;padding:16px;overflow-x:auto;">
      <button style="padding:8px 16px;background:var(--v-emeraude);color:white;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;">Tous (${shopProducts.length})</button>
      <button style="padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;">Populaires</button>
      <button style="padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;">Nouveautés</button>
      <button style="padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;">Promotions</button>
    </div>

    <!-- Produits -->
    <div class="section-title">
      <i data-lucide="package" class="icon icon-md icon-vert"></i>
      Produits (${shopProducts.length})
    </div>
    <div class="pcard-grid">
      ${shopProducts.length === 0 ? `
        <div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--text-muted);">
          <i data-lucide="package-x" class="icon icon-xl" style="opacity:0.3;"></i>
          <p style="margin-top:16px;">Aucun produit pour le moment</p>
        </div>
      ` : shopProducts.map(p => {
        const disc = p.oldPrice ? Math.round((1 - p.price/p.oldPrice)*100) : 0;
        return `
          <a href="produit.html?id=${p.id}" class="pcard" style="text-decoration:none;color:inherit;">
            <div class="pcard-img">
              ${disc > 0 ? `<div class="pcard-badges"><span class="pcard-badge pcard-badge-disc">-${disc}%</span></div>` : ''}
              <img src="${p.image}" alt="${p.name}">
            </div>
            <div class="pcard-info">
              <div class="pcard-name">${p.name}</div>
              <div style="display:flex;align-items:baseline;gap:6px;">
                <span class="pcard-price">${p.price.toLocaleString('fr-FR')} FCFA</span>
                ${p.oldPrice ? `<span class="pcard-old">${p.oldPrice.toLocaleString('fr-FR')}</span>` : ''}
              </div>
            </div>
          </a>
        `;
      }).join('')}
    </div>
  `;

  lucide.createIcons();
}

function followSeller(id) {
  let follows = JSON.parse(localStorage.getItem('follows')||'[]');
  if(follows.includes(id)) {
    follows = follows.filter(x => x !== id);
    alert('❌ Vous ne suivez plus ce vendeur');
  } else {
    follows.push(id);
    alert('✅ Vous suivez maintenant ce vendeur');
  }
  localStorage.setItem('follows', JSON.stringify(follows));
  if(navigator.vibrate) navigator.vibrate(30);
}

renderShop();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
