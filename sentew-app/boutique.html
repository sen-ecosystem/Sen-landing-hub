<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boutique - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF7">
<link rel="stylesheet" href="css/app.css">
<style>
.shop-hero{position:relative;height:180px;background:linear-gradient(135deg,var(--emerald),var(--emerald-dark));overflow:hidden}
.shop-hero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(212,165,116,.05) 0 15px,transparent 15px 30px)}
.shop-avatar{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;border:4px solid var(--white);object-fit:cover;box-shadow:0 4px 20px rgba(0,0,0,.15);pointer-events:auto}
.live-ring-big{position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);width:108px;height:108px;border:3px solid #ef4444;border-radius:50%;animation:livePulse 2s infinite;pointer-events:none}
.shop-info{text-align:center;padding:52px 16px 20px}
.shop-name{font-size:22px;font-weight:900;color:var(--text);display:flex;align-items:center;justify-content:center;gap:6px}
.verified{color:var(--emerald);font-size:18px}
.shop-stats{display:flex;justify-content:center;gap:20px;margin:12px 0;padding:12px;background:var(--white);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-mini{text-align:center}
.stat-mini .val{font-size:18px;font-weight:900;color:var(--gold-dark)}
.stat-mini .lbl{font-size:10px;color:var(--text-soft);margin-top:2px}
.shop-actions{display:flex;gap:8px;padding:0 16px 16px}
.live-banner-big{margin:0 16px 16px;background:linear-gradient(135deg,#ef4444,#dc2626);border-radius:16px;padding:14px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px rgba(239,68,68,.3);text-decoration:none;animation:livePulse 3s infinite}
</style>
</head>
<body oncontextmenu="return false">

<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:700;">Boutique</div>
    <button class="header-btn" onclick="alert('📤 Partager la boutique')">📤</button>
  </header>

  <main class="app-content" id="content">
    <p style="text-align:center;color:var(--gold-dark);padding:40px;">Chargement...</p>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script src="js/data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const sid = parseInt(params.get('id')) || 1;
const seller = (sellers || []).find(s => s.id === sid) || sellers[0];
const shopProducts = (products || []).filter(p => p.sellerId === sid);

document.getElementById('content').innerHTML = `
  <div class="shop-hero">
    ${seller.live ? '<div class="live-ring-big"></div>' : ''}
    <img class="shop-avatar" src="${seller.avatar}" alt="${seller.name}">
  </div>

  <div class="shop-info">
    <div class="shop-name">
      ${seller.name}
      ${seller.verified ? '<span class="verified" title="Vérifié">✓</span>' : ''}
    </div>
    <div style="color:var(--text-soft);font-size:12px;margin-top:4px;">
      📍 ${seller.city} · Membre depuis ${seller.joined || 'Février 2024'}
    </div>
    ${seller.live ? '<div style="display:inline-block;background:#ef4444;color:#fff;padding:4px 12px;border-radius:16px;font-size:11px;font-weight:800;margin-top:8px;animation:livePulse 2s infinite;">🔴 EN DIRECT MAINTENANT</div>' : ''}
  </div>

  <div class="shop-stats">
    <div class="stat-mini"><div class="val">${shopProducts.length}</div><div class="lbl">Produits</div></div>
    <div class="stat-mini"><div class="val">${seller.rating}</div><div class="lbl">Note</div></div>
    <div class="stat-mini"><div class="val">${seller.reviews}</div><div class="lbl">Avis</div></div>
    <div class="stat-mini"><div class="val">${seller.followers}</div><div class="lbl">Abonnés</div></div>
  </div>

  <div class="shop-actions">
    <button class="btn btn-primary" style="flex:1;" onclick="follow(this)">➕ Suivre</button>
    <button class="btn btn-outline" style="flex:1;" onclick="window.location.href='messages.html'">💬 Message</button>
  </div>

  ${seller.live ? `
    <a href="live.html?seller=${seller.id}" class="live-banner-big">
      <div style="font-size:36px;">🎥</div>
      <div style="flex:1;">
        <div style="font-weight:800;font-size:15px;">Rejoindre le LIVE</div>
        <div style="font-size:11px;opacity:.9;">👁 ${(seller.liveViewers||1200).toLocaleString()} spectateurs · Offres exclusives -30%</div>
      </div>
      <div style="font-size:24px;">›</div>
    </a>
  ` : ''}

  <div style="padding:0 16px 12px;">
    <div style="background:var(--white);border-radius:14px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--border);">
      <div style="font-size:12px;font-weight:700;color:var(--gold-dark);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">À propos</div>
      <div style="font-size:13px;color:var(--text);line-height:1.5;">${seller.description || 'Boutique de confiance sur SEN TEW.'}</div>
    </div>
  </div>

  <div class="chips">
    <button class="chip active">Tous (${shopProducts.length})</button>
    <button class="chip">🔥 Populaires</button>
    <button class="chip">🆕 Nouveautés</button>
    <button class="chip">💰 Promos</button>
    <button class="chip">⭐ Top notés</button>
  </div>

  <div class="section-header">
    <div class="section-title">🛍 Produits de la boutique</div>
    <span style="color:var(--text-soft);font-size:12px;">${shopProducts.length} articles</span>
  </div>

  <div class="grid">
    ${shopProducts.length ? shopProducts.map(p => `
      <a href="produit.html?id=${p.id}" class="product-card">
        <div class="card-image-wrap">
          ${seller.live ? '<span style="position:absolute;top:8px;left:8px;background:#ef4444;color:#fff;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:900;animation:livePulse 2s infinite;z-index:2;">🔴 LIVE</span>' : (p.discount ? '<span class="card-badge">PROMO</span>' : '')}
          <span class="card-fav">🤍</span>
          <img src="${p.image}" alt="${p.name}">
        </div>
        <div class="card-info">
          <div class="card-name">${p.name}</div>
          <div class="card-price">${p.price.toLocaleString()} FCFA</div>
          ${p.oldPrice ? `<div><span class="card-old">${p.oldPrice.toLocaleString()} FCFA</span></div>` : ''}
          <div class="card-rating">⭐ ${p.rating} (${p.reviews})</div>
        </div>
      </a>
    `).join('') : '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-soft);">Aucun produit</div>'}
  </div>

  <div style="text-align:center;padding:20px;">
    <div style="display:inline-flex;align-items:center;gap:8px;background:var(--white);padding:10px 20px;border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow);">
      <span style="color:var(--emerald);font-size:16px;">🛡</span>
      <span style="font-size:12px;font-weight:600;">Vendeur certifié SEN TEW · Paiement escrow garanti</span>
    </div>
  </div>

  <div style="height:20px;"></div>
`;

function follow(el){
  if(el.textContent.includes('Suivre')){
    el.innerHTML = '✓ Suivi';
    el.classList.remove('btn-primary');
    el.classList.add('btn-gold');
  } else {
    el.innerHTML = '➕ Suivre';
    el.classList.remove('btn-gold');
    el.classList.add('btn-primary');
  }
}
</script>
</body>
</html>
