<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat - SEN TEW</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#f5f5f0;font-family:'Segoe UI',-apple-system,sans-serif;display:flex;flex-direction:column;color:#0a1f17}
/* Header contact */
.chat-head{display:flex;align-items:center;gap:11px;padding:12px 14px;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#f5f5f0;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0f6b4e;flex-shrink:0}
.ch-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #0f6b4e;flex-shrink:0}
.ch-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;flex-shrink:0}
.ch-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px}
.ch-status{font-size:11px;color:#6B7280;display:flex;align-items:center;gap:4px}
.ch-status .dot{width:7px;height:7px;border-radius:50%;background:#4ade80}
.ch-shop{margin-left:auto;font-size:11px;font-weight:800;color:#0f6b4e;text-decoration:none;background:#e8f5f0;padding:7px 12px;border-radius:16px;flex-shrink:0}
/* Messages */
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.45;animation:msgIn .2s;word-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:#0f6b4e;color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:#fff;color:#0a1f17;border-bottom-left-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.msg .mt{display:block;font-size:9px;opacity:.6;margin-top:4px;text-align:right}
.msg-day{align-self:center;font-size:10px;font-weight:800;color:#9aa5a0;background:#e5e7eb;padding:4px 12px;border-radius:12px;margin:6px 0}
/* Suggestions rapides */
.quick-row{display:flex;gap:7px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;flex-shrink:0;background:#fff;border-top:1px solid #f0f0ea}
.quick-row::-webkit-scrollbar{display:none}
.quick{flex-shrink:0;padding:8px 13px;border:1.5px solid #e5e7eb;background:#fff;border-radius:18px;font-size:11.5px;font-weight:700;color:#0f6b4e;cursor:pointer;white-space:nowrap}
/* Typing */
.typing{align-self:flex-start;background:#fff;padding:11px 16px;border-radius:18px;border-bottom-left-radius:5px;display:none;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.typing.show{display:flex}
.typing i{width:7px;height:7px;border-radius:50%;background:#9aa5a0;animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
/* Input */
.chat-input{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5e7eb;flex-shrink:0;align-items:center}
.chat-input input{flex:1;min-width:0;padding:12px 16px;border:1.5px solid #e5e7eb;border-radius:24px;font-size:13px;font-family:inherit;outline:none}
.chat-input input:focus{border-color:#0f6b4e}
.chat-input button{width:44px;height:44px;border-radius:50%;border:none;background:#0f6b4e;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<header class="chat-head">
  <button class="icon-btn" onclick="location.href='messages.html'"><i data-lucide="arrow-left"></i></button>
  <div id="chAvatar"></div>
  <div style="min-width:0">
    <div class="ch-name" id="chName">…</div>
    <div class="ch-status"><span class="dot"></span> <span id="chStatus">En ligne</span></div>
  </div>
  <a class="ch-shop" id="chShop" href="#" style="display:none">Voir la boutique ›</a>
</header>

<div class="chat-body" id="chatBody"></div>
<div class="quick-row" id="quickRow"></div>
<div class="chat-input">
  <input type="text" id="msgInput" placeholder="Écris ton message…" maxlength="300">
  <button onclick="send()"><i data-lucide="send" style="width:17px"></i></button>
</div>

<script>
var params = new URLSearchParams(location.search);
var vSlug = params.get('v');
var cKey = params.get('c');
var CONTACT = null, THREAD_KEY = '';

// ===== Identification du contact =====
var SERVICES = {
  'support': { key:'support', name:'Support SEN TEW', av:'S', bg:'#1e40af', status:'Répond en ~2 min',
    quick:['Où est ma commande ?','Faire un retour','Problème de paiement','Parler à un humain'],
    hello:'Bonjour ! 👋 Je suis le support SEN TEW. Comment puis-je t\'aider aujourd\'hui ?',
    replies: [
      ['commande', 'Pour suivre ta commande, va dans « Mes commandes » puis touche « Suivre » — tu verras le livreur sur la carte en direct. Tu as un code de suivi STW-… ?'],
      ['retour', 'Pas de souci ! Tu as 7 jours après réception pour un retour gratuit si le produit est défectueux ou non conforme. Donne-moi ton code de commande STW-… et je lance la procédure.'],
      ['paiement', 'Pour un souci de paiement : vérifie d\'abord que la transaction apparaît dans ton portefeuille. Sinon envoie-moi la référence et l\'heure, je vérifie immédiatement.'],
      ['humain', 'Bien sûr ! Un conseiller humain te répondra sous 15 minutes aux heures ouvrées (9h-20h). Laisse-moi ta question, il la verra.'],
      ['default', 'Bien noté ! Je transmets ta demande. Tu peux aussi consulter l\'aide : livraison 24-48h à Dakar, retours 7 jours, paiement sécurisé. Autre chose ?']
    ]
  },
  'driver_omar': { key:'driver_omar', name:'Omar Ndiaye', av:'ON', bg:'#6d28d9', status:'Livreur · En course',
    quick:['Tu arrives quand ?','Je suis devant le portail','Appelle-moi en arrivant','Merci !'],
    hello:'Salaam ! C\'est Omar, ton livreur SEN TEW 🛵. Pour toute question sur ta livraison, je suis là.',
    replies: [
      ['quand', 'J\'arrive dans environ 15 minutes ! Tu peux suivre ma position sur la carte dans « Suivi de commande ». Prépare ton code de livraison à 4 chiffres 😉'],
      ['portail', 'Parfait, je te repère. J\'arrive dans quelques minutes, garde ton téléphone à portée de main.'],
      ['appelle', 'D\'accord, je t\'appelle dès que je suis devant. À tout de suite !'],
      ['merci', 'Avec plaisir ! N\'oublie pas de noter la livraison, ça m\'aide beaucoup ⭐'],
      ['default', 'Bien reçu ! Je te tiens au courant en direct. Tu peux aussi suivre ma position sur la carte de suivi.']
    ]
  }
};

var VENDOR_REPLIES = {
  'aicha-couture': [
    ['taille', 'Nos boubous taillent normalement. Si tu hésites entre deux tailles, prends la plus grande. Je peux t\'envoyer le guide des mesures !'],
    ['stock', 'Oui, tout ce qui est affiché est en stock à Dakar. Expédition le jour même si tu commandes avant 16h !'],
    ['photo', 'Avec plaisir ! Je te prépare des photos réelles du modèle porté. Dis-moi la couleur qui t\'intéresse.'],
    ['prix', 'Les prix sont déjà les meilleurs du marché, mais avec le code RAMADAN30 tu as -30% en ce moment ! 🎉'],
    ['default', 'Salaam et bienvenue chez Aïcha Couture ! 👗 Pose-moi tes questions : tailles, couleurs, tissu, livraison… je réponds vite.']
  ],
  'moussa-tech': [
    ['garantie', 'Tous nos produits sont neufs avec garantie 1 an. Facture incluse dans le colis.'],
    ['neuf', 'Oui, 100% neufs et scellés. Jamais de reconditionné sans que ce soit écrit.'],
    ['livraison', 'Livraison 24-48h sur Dakar. Pour la tech, je recommande le paiement en ligne : livraison gratuite !'],
    ['default', 'Bienvenue chez Moussa Tech 📱 ! Dis-moi ce que tu cherches, je te conseille le meilleur rapport qualité-prix.']
  ],
  'mariama-b': [
    ['naturel', 'Oui, 100% naturel ! Karité pur du Sénégal, aucun produit chimique, non testé sur les animaux.'],
    ['peau', 'Le kit karité convient à toutes les peaux, même sensibles. Utilise-le matin et soir pour de beaux résultats en 2 semaines.'],
    ['default', 'Bienvenue chez Mariama B 💄 ! Toutes mes formules sont 100% naturelles. Dis-moi ton type de peau, je te conseille.']
  ],
  'fatou-fashion': [
    ['taille', 'Nos ensembles vont du S au XXL. Le bazin riche se reprend facilement chez un tailleur si besoin !'],
    ['commande', 'Pour les cérémonies, commande au moins 5 jours avant pour être tranquille. Livraison express possible !'],
    ['default', 'Bienvenue chez Fatou Fashion ✨ ! Prêt-à-porter et bazin de qualité. Une occasion spéciale ? Je te trouve la tenue parfaite.']
  ]
};

function findReply(contact, text){
  var rules = contact.replies || [];
  var t = text.toLowerCase();
  for (var i = 0; i < rules.length; i++) {
    if (rules[i][0] !== 'default' && t.indexOf(rules[i][0]) !== -1) return rules[i][1];
  }
  return rules.length ? rules[rules.length-1][1] : 'Bien reçu, je reviens vers toi très vite !';
}

function threadGet(){
  try { return JSON.parse(localStorage.getItem('sentew_chat_' + THREAD_KEY) || '[]'); } catch(e){ return []; }
}
function threadSave(msgs){
  localStorage.setItem('sentew_chat_' + THREAD_KEY, JSON.stringify(msgs.slice(-60)));
}
function pushMsg(from, text){
  var msgs = threadGet();
  msgs.push({ from: from, text: text, at: Date.now(), read: from === 'me' });
  threadSave(msgs);
}

function renderMsgs(){
  var body = document.getElementById('chatBody');
  var msgs = threadGet();
  var lastDay = '';
  body.innerHTML = msgs.map(function(m){
    var day = new Date(m.at).toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
    var sep = '';
    if (day !== lastDay) { lastDay = day; sep = '<div class="msg-day">' + day + '</div>'; }
    var time = new Date(m.at).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    return sep + '<div class="msg ' + (m.from === 'me' ? 'me' : 'them') + '">' +
      m.text.replace(/</g,'&lt;') + '<span class="mt">' + time + (m.from === 'me' ? ' ✓✓' : '') + '</span></div>';
  }).join('');
  body.scrollTop = body.scrollHeight;
  // Marquer comme lus
  var all = threadGet();
  all.forEach(function(m){ m.read = true; });
  threadSave(all);
}

function renderQuick(){
  document.getElementById('quickRow').innerHTML = (CONTACT.quick || []).map(function(q){
    return '<button class="quick" onclick="quickSend(\'' + q.replace(/'/g,"\\'") + '\')">' + q + '</button>';
  }).join('');
}

function send(){
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  pushMsg('me', text);
  input.value = '';
  renderMsgs();
  replyWithTyping(text);
}
function quickSend(q){
  pushMsg('me', q);
  renderMsgs();
  replyWithTyping(q);
}

function replyWithTyping(userText){
  // Indicateur "en train d'écrire…"
  var body = document.getElementById('chatBody');
  var tp = document.createElement('div');
  tp.className = 'typing show';
  tp.id = 'tpBubble';
  tp.innerHTML = '<i></i><i></i><i></i>';
  body.appendChild(tp);
  body.scrollTop = body.scrollHeight;
  document.getElementById('chStatus').textContent = 'En train d\'écrire…';

  setTimeout(function(){
    var el = document.getElementById('tpBubble');
    if (el) el.remove();
    document.getElementById('chStatus').textContent = CONTACT.status;
    pushMsg('them', findReply(CONTACT, userText));
    renderMsgs();
  }, 1200 + Math.random() * 1200);
}

// ===== Init =====
function initContact(){
  if (cKey && SERVICES[cKey]) {
    CONTACT = SERVICES[cKey];
    THREAD_KEY = cKey;
    setupUI(null);
  } else if (vSlug) {
    getVendorBySlug(vSlug).then(function(v){
      if (!v) { location.href = 'messages.html'; return; }
      CONTACT = {
        name: v.shop_name, logo: v.logo_url, status: 'Vendeur · Répond vite',
        quick: ['Ce modèle est en stock ?','Quelles tailles dispo ?','Tu peux envoyer une photo réelle ?','C\'est négociable ?'],
        replies: VENDOR_REPLIES[v.slug] || [ ['default','Bienvenue ! Pose-moi ta question, je réponds vite 😊'] ],
        hello: 'Salaam ! Bienvenue chez ' + v.shop_name + ' 🛍️ Comment puis-je t\'aider ?'
      };
      CONTACT.slug = v.slug;
      THREAD_KEY = 'v_' + v.slug;
      setupUI(v);
    });
  } else {
    location.href = 'messages.html';
  }
}

function setupUI(vendor){
  document.title = CONTACT.name + ' - Chat SEN TEW';
  document.getElementById('chName').innerHTML = CONTACT.name + ' <i data-lucide="badge-check" style="width:14px;color:#0f6b4e"></i>';
  document.getElementById('chStatus').textContent = CONTACT.status;
  document.getElementById('chAvatar').innerHTML = CONTACT.logo
    ? '<img class="ch-avatar" src="' + CONTACT.logo + '" alt="">'
    : '<div class="ch-av" style="background:' + CONTACT.bg + '">' + CONTACT.av + '</div>';
  if (vendor) {
    var link = document.getElementById('chShop');
    link.style.display = 'block';
    link.href = lienBoutique(vendor);
  }
  renderQuick();
  // Message d'accueil si conversation vide
  if (!threadGet().length) pushMsg('them', CONTACT.hello);
  renderMsgs();
  lucide.createIcons();
}

document.getElementById('msgInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') send();
});

initContact();
lucide.createIcons();
</script>
<script src="js/dark-mode.js"></script>
</body>
</html>
