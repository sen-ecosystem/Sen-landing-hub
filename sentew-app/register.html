<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - SEN TEW</title>
  <link rel="stylesheet" href="css/app.css?v=52">
  <style>
    body { background: linear-gradient(135deg, #0f6b4e, #0a4d38); margin: 0; font-family: -apple-system, sans-serif; min-height: 100vh; padding: 20px; }
    .logo { text-align: center; color: #fff; margin: 20px 0; }
    .logo h1 { color: #fff; margin: 0; font-size: 28px; font-weight: 900; }
    .card { background: #fff; border-radius: 16px; padding: 24px; }
    .card h2 { color: #0f6b4e; margin: 0 0 16px; font-size: 20px; text-align: center; }
    .field { margin-bottom: 12px; }
    .label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .input { width: 100%; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .checkbox { display: flex; gap: 8px; font-size: 12px; color: #666; margin: 12px 0; }
    .checkbox a { color: #0f6b4e; text-decoration: none; font-weight: 600; }
    .btn { width: 100%; background: linear-gradient(135deg, #0f6b4e, #0a4d38); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .login { text-align: center; margin-top: 14px; font-size: 13px; }
    .login a { color: #0f6b4e; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>

<div class="logo"><h1>SEN TEW</h1></div>

<div class="card">
  <h2>Créer un compte</h2>

  <div class="row-2">
    <div class="field">
      <label class="label">Prénom</label>
      <input type="text" class="input">
    </div>
    <div class="field">
      <label class="label">Nom</label>
      <input type="text" class="input">
    </div>
  </div>

  <div class="field">
    <label class="label">Email</label>
    <input type="email" class="input" placeholder="hello@sen-tew.com">
  </div>

  <div class="field">
    <label class="label">Téléphone</label>
    <input type="tel" class="input" placeholder="+221 77 XXX XX XX">
  </div>

  <div class="field">
    <label class="label">Mot de passe</label>
    <input type="password" class="input">
  </div>

  <div class="field">
    <label class="label">Confirmer</label>
    <input type="password" class="input">
  </div>

  <div class="checkbox">
    <input type="checkbox" id="cgu">
    <label for="cgu">J'accepte les <a href="cgu.html">CGU</a> et la <a href="confidentialite.html">politique</a></label>
  </div>

  <button class="btn" onclick="location.href='index.html'">Créer mon compte</button>

  <div class="login">Déjà inscrit ? <a href="login.html">Se connecter</a></div>
</div>

</body>
</html>
