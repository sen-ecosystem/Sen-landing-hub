<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Produits - SEN TEW</title>
<meta name="theme-color" content="#0f6b4e">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="topbar">
  <button class="btn-back" onclick="history.back()">
    <i data-lucide="arrow-left" class="icon icon-md icon-vert"></i>
  </button>
  <h1 id="catTitle">Produits</h1>
  <a href="panier.html" class="icon-btn icon-badge" id="cartTrig" data-count="0">
    <i data-lucide="shopping-cart" class="icon icon-md icon-or"></i>
  </a>
</header>

<!-- Sous-catégories -->
<div style="display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--border);">
  <button class="cat-chip active" data-cat="all">
    <i data-lucide="layout-grid" class="icon icon-sm"></i> Tous
  </button>
  <button class="cat-chip" data-cat="mode">
    <i data-lucide="shirt" class="icon icon-sm"></i> Mode
  </button>
  <button class="cat-chip" data-cat="tech">
    <i data-lucide="smartphone" class="icon icon-sm"></i> Tech
  </button>
  <button class="cat-chip" data-cat="beauty">
    <i data-lucide="sparkles" class="icon icon-sm"></i> Beauté
  </button>
  <button class="cat-chip" data-cat="home">
    <i data-lucide="home" class="icon icon-sm"></i> Maison
  </button>
  <button class="cat-chip" data-cat="food">
    <i data-lucide="apple" class="icon icon-sm"></i> Alim.
  </button>
  <button class="cat-chip" data-cat="sport">
    <i data-lucide="dumbbell" class="icon icon-sm"></i> Sport
  </button>
</div>

<style>
.cat-chip {
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; background:var(--bg-card);
  border-radius:20px; font-size:12px; font-weight:700;
  white-space:nowrap; cursor:pointer; color:var(--text);
  border:1px solid var(--border);
}
.cat-chip.active { background:var(--v-emeraude); color:white; border-color:var(--v-emeraude); }
.cat-chip.active i { color:white !important; stroke:white !important; }
</style>

<!-- Tri -->
<div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">
  <span id="resultCount" style="font-size:12px;color:var(--text-muted);">0 résultats</span>
  <select id="sortBy" style="width:auto;padding:6px 10px;font-size:12px;">
    <option value="popular">Plus populaires</option>
    <option value="price-asc">Prix croissant</option>
    <option value="price-desc">Prix décroissant</option>
    <option value="new">Nouveautés</option>
  </select>
</div>

<!-- Grid produits -->
<main style="padding:0 16px 100px;">
  <div id="productsGrid" class="pcard-grid"></div>
</main>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home" class="icon icon-md"></i><span>Accueil</span></a>
  <a href="recherche-ia.html"><i data-lucide="search" class="icon icon-md"></i><span>Rechercher</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart" class="icon icon-md icon-or"></i><span>Panier</span></a>
  <a href="favoris.html"><i data-lucide="heart" class="icon icon-md"></i><span>Favoris</span></a>
  <a href="profil.html"><i data-lucide="user" class="icon icon-md"></i><span>Profil</span></a>
</nav>

<script src="js/role-guard.js"></script>
<script src="js/dark-mode.js"></script>
<script>
const PRODUCTS = [
  {id:1,name:'Robe wax mariage',price:35000,image:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',cat:'mode',sellerLive:true},
  {id:2,name:'Sandales cuir Peul',price:8500,image:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',cat:'mode',sellerLive:true},
  {id:3,name:'Chemise brodée homme',price:12000,image:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',cat:'mode'},
  {id:4,name:'Boubou grand teint',price:45000,image:'https://images.unsplash.com/photo-1544441893-675973e31985?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',cat:'mode'},
  {id:5,name:'Bracelet ethnique perles',price:5500,image:'https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',cat:'mode'},
  {id:6,name:'Sac cuir africain premium',price:15000,image:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=400',seller:'Aïcha Couture',sellerAvatar:'https://i.pravatar.cc/50?img=1',cat:'mode'},
  {id:7,name:'iPhone 15 Pro',price:750000,image:'https://images.unsplash.com/photo-1592286927505-1def25115558?w=400',seller:'Moussa Tech',sellerAvatar:'https://i.pravatar.cc/50?img=13',cat:'tech'},
  {id:8,name:'Écouteurs sans fil',price:12000,image:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400',seller:'Moussa Tech',sellerAvatar:'https://i.pravatar.cc/50?img=13',cat:'tech'},
  {id:9,name:'Beurre karité 500g',price:4500,image:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=400',seller:'Ibrahim Bio',sellerAvatar:'https://i.pravatar.cc/50?img=8',cat:'beauty'},
  {id:10,name:'Masque visage bio',price:6500,image:'https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=400',seller:'Mariama Beauté',sellerAvatar:'https://i.pravatar.cc/50?img=9',cat:'beauty'}
];

let currentCat = new URLSearchParams(location.search).get('cat') || 'all';

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('cart')||'[]');
  document.getElementById('cartTrig').dataset.count = cart.reduce((s,i)=>s+(i.qty||1),0);
}

function renderProducts() {
  const filtered = currentCat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === currentCat);
  document.getElementById('resultCount').textContent = filtered.length + ' résultat' + (filtered.length > 1 ? 's' : '');
  document.getElementById('productsGrid').innerHTML = filtered.map(p => `
    <a href="produit.html?id=${p.id}" class="pcard" style="text-decoration:none;color:inherit;">
      <div class="pcard-img">
        ${p.sellerLive ? '<div class="pcard-badges"><span class="pcard-badge pcard-badge-live">LIVE</span></div>' : ''}
        <button class="pcard-fav" onclick="event.preventDefault();event.stopPropagation();toggleFav(${p.id});">
          <i data-lucide="heart" class="icon icon-sm icon-rouge"></i>
        </button>
        <img src="${p.image}" alt="${p.name}">
      </div>
      <div class="pcard-info">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
          <img src="${p.sellerAvatar}" style="width:14px;height:14px;border-radius:50%;">
          <span style="font-size:10px;color:var(--text-muted);">${p.seller}</span>
        </div>
        <div class="pcard-name">${p.name}</div>
        <div class="pcard-price">${p.price.toLocaleString('fr-FR')} FCFA</div>
      </div>
    </a>
  `).join('');
  lucide.createIcons();
}

function toggleFav(id) {
  let favs = JSON.parse(localStorage.getItem('favs')||'[]');
  if(favs.includes(id)) favs = favs.filter(x=>x!==id);
  else favs.push(id);
  localStorage.setItem('favs', JSON.stringify(favs));
  if(navigator.vibrate) navigator.vibrate(20);
}

// Init titre catégorie
const catNames = {all:'Tous les produits',mode:'Mode',tech:'Tech',beauty:'Beauté',home:'Maison',food:'Alimentation',sport:'Sport'};
document.getElementById('catTitle').textContent = catNames[currentCat] || 'Produits';

// Sous-catégories click
document.querySelectorAll('.cat-chip').forEach(chip => {
  if(chip.dataset.cat === currentCat) chip.classList.add('active');
  else chip.classList.remove('active');
  chip.addEventListener('click', () => {
    currentCat = chip.dataset.cat;
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('active', c.dataset.cat === currentCat));
    document.getElementById('catTitle').textContent = catNames[currentCat] || 'Produits';
    renderProducts();
  });
});

// Tri
document.getElementById('sortBy').addEventListener('change', renderProducts);

updateCartCount();
renderProducts();
</script>
<script>lucide.createIcons();</script>
</body>
</html>
