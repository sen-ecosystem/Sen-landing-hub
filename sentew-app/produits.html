<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Produits - SEN TEW</title>
<link rel="stylesheet" href="css/app.css">
<meta name="theme-color" content="#FAFAF7">
<style>
/* ===== LAYOUT STABLE ===== */
.app-content{padding-top:0 !important;}

.filter-bar{
  background:#fff;
  padding:12px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  border-bottom:1px solid #F3F4F6;
  position:relative;
  z-index:2;
}
.filter-bar::-webkit-scrollbar{display:none;}

.filter-chip{
  flex-shrink:0;
  background:#F3F4F6;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  font-weight:700;
  font-size:12px;
  white-space:nowrap;
  color:#374151;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
}
.filter-chip.active{
  background:linear-gradient(135deg,#0F6B4E,#0A4D38);
  color:#fff;
}

.sort-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  background:#FAFAF7;
  font-size:12px;
  color:#6B7280;
  border-bottom:1px solid #F3F4F6;
}
.sort-bar select{
  border:none;
  background:transparent;
  font-weight:700;
  color:#0A4D38;
  font-size:12px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:12px;
}

.pcard{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  text-decoration:none;
  color:inherit;
  display:flex;
  flex-direction:column;
}
.pcard-img{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#F9FAFB;
}
.pcard-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}
.pcard-live{
  position:absolute;
  top:8px;
  left:8px;
  background:#ef4444;
  color:#fff;
  padding:3px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:900;
  z-index:2;
  display:flex;
  align-items:center;
  gap:3px;
}
.pcard-fav{
  position:absolute;
  top:8px;
  right:8px;
  width:32px;
  height:32px;
  background:rgba(255,255,255,.95);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  z-index:2;
  border:none;
}
.pcard-info{
  padding:10px;
  min-height:90px;
  display:flex;
  flex-direction:column;
}
.pcard-seller{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:10px;
  color:#6B7280;
  margin-bottom:4px;
}
.pcard-seller img{width:14px;height:14px;border-radius:50%;object-fit:cover;}
.pcard-name{
  font-size:13px;
  font-weight:700;
  color:#111827;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:6px;
  min-height:34px;
}
.pcard-price{
  font-weight:900;
  color:#D4A574;
  font-size:14px;
  margin-top:auto;
}

.empty-state{
  padding:60px 20px;
  text-align:center;
  color:#6B7280;
}
</style>
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:900;color:#0A4D38;" id="pageTitle">Tous les produits</div>
    <a href="panier.html" class="header-btn">🛒<span class="badge">3</span></a>
  </header>

  <main class="app-content">
    <div class="filter-bar">
      <button class="filter-chip active" data-cat="all">Tous</button>
      <button class="filter-chip" data-cat="mode">👕 Mode</button>
      <button class="filter-chip" data-cat="tech">🎧 Tech</button>
      <button class="filter-chip" data-cat="maison">🛋 Maison</button>
      <button class="filter-chip" data-cat="beauty">💄 Beauté</button>
      <button class="filter-chip" data-cat="food">🧺 Alim.</button>
      <button class="filter-chip" data-cat="sport">⚽ Sport</button>
    </div>

    <div class="sort-bar">
      <span id="resultCount">0 résultats</span>
      <select id="sortSelect">
        <option value="default">Trier par</option>
        <option value="price-asc">Prix ↑</option>
        <option value="price-desc">Prix ↓</option>
        <option value="live">🔴 LIVE d'abord</option>
        <option value="new">🆕 Nouveautés</option>
      </select>
    </div>

    <div class="products-grid" id="prodGrid"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html" class="active"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒<span class="badge">3</span></div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script src="js/data.js"></script>
<script>
const params = new URLSearchParams(location.search);
let currentCat = params.get('cat') || 'all';
let currentSort = 'default';

const list = (typeof products !== 'undefined' ? products : (typeof PRODUCTS !== 'undefined' ? PRODUCTS : []));

const titles = {
  all:'Tous les produits',
  mode:'Mode',
  tech:'Électronique',
  maison:'Maison',
  beauty:'Beauté',
  food:'Alimentation',
  sport:'Sport'
};

function render(){
  document.getElementById('pageTitle').textContent = titles[currentCat] || 'Produits';
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.cat === currentCat));

  let filtered = currentCat === 'all' ? [...list] : list.filter(p => (p.cat||p.category) === currentCat);

  if (currentSort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
  if (currentSort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
  if (currentSort === 'live') filtered.sort((a,b) => (b.sellerLive?1:0) - (a.sellerLive?1:0));
  if (currentSort === 'new') filtered.sort((a,b) => (b.id||0) - (a.id||0));

  document.getElementById('resultCount').textContent = `${filtered.length} résultat${filtered.length>1?'s':''}`;

  if (filtered.length === 0) {
    document.getElementById('prodGrid').innerHTML = '<div class="empty-state" style="grid-column:span 2;"><div style="font-size:48px;">🔍</div><div style="margin-top:12px;">Aucun produit dans cette catégorie</div></div>';
    return;
  }

  document.getElementById('prodGrid').innerHTML = filtered.map(p => `
    <a href="produit.html?id=${p.id}" class="pcard">
      <div class="pcard-img">
        ${p.sellerLive ? '<span class="pcard-live">🔴 LIVE</span>' : ''}
        <button class="pcard-fav" onclick="event.preventDefault();this.textContent=this.textContent==='🤍'?'❤️':'🤍'">🤍</button>
        <img src="${p.image||p.img||''}" alt="${p.name||''}" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=SEN+TEW'">
      </div>
      <div class="pcard-info">
        ${p.seller ? `<div class="pcard-seller">
          ${p.sellerAvatar ? `<img src="${p.sellerAvatar}">` : ''}
          <span>${p.seller}</span>
        </div>` : ''}
        <div class="pcard-name">${p.name||'Produit'}</div>
        <div class="pcard-price">${Number(p.price||0).toLocaleString()} FCFA</div>
      </div>
    </a>
  `).join('');
}

document.querySelectorAll('.filter-chip').forEach(c => {
  c.onclick = () => { currentCat = c.dataset.cat; render(); };
});
document.getElementById('sortSelect').onchange = e => { currentSort = e.target.value; render(); };

render();
</script>
</body>
</html>
