<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Produits - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF7">
<link rel="stylesheet" href="css/app.css">
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <button class="header-btn" onclick="history.back()">←</button>
    <div style="flex:1;text-align:center;font-weight:800;color:var(--text);font-size:16px;" id="pageTitle">Tous les produits</div>
    <button class="header-btn" onclick="alert('⚙ Filtres avancés')">⚙</button>
  </header>

  <main class="app-content">
    <div class="search-box">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Rechercher..." oninput="search(this.value)">
      </div>
    </div>

    <div class="chips">
      <button class="chip active" onclick="filt('all',this)">Tous</button>
      <button class="chip" onclick="filt('live',this)">🔴 LIVE</button>
      <button class="chip" onclick="filt('promo',this)">🔥 Promo</button>
      <button class="chip" onclick="filt('new',this)">🆕 Nouveau</button>
      <button class="chip" onclick="filt('top',this)">⭐ Top</button>
    </div>

    <div style="padding:8px 16px;color:var(--text-soft);font-size:12px;font-weight:600;" id="count">Chargement...</div>

    <div class="grid" id="grid"></div>

    <div style="height:100px;"></div>
  </main>

  <a href="assistant-ia.html" class="fab-ia">✨<br><span style="font-size:9px;">IA</span></a>

  <nav class="app-nav">
    <a href="index.html"><div class="nav-icon">🏠</div><div class="nav-label">Accueil</div></a>
    <a href="categories.html" class="active"><div class="nav-icon">▦</div><div class="nav-label">Catégories</div></a>
    <a href="panier.html"><div class="nav-icon">🛒</div><div class="nav-label">Panier</div></a>
    <a href="messages.html"><div class="nav-icon">💬</div><div class="nav-label">Messages</div></a>
    <a href="profil.html"><div class="nav-icon">👤</div><div class="nav-label">Profil</div></a>
  </nav>
</div>

<script src="js/data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const cat = params.get('cat');
let currentList = products;

if (cat) {
  currentList = products.filter(p => p.category === cat);
  document.getElementById('pageTitle').textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
}

function render(list){
  document.getElementById('count').textContent = `${list.length} produit${list.length>1?'s':''} trouvé${list.length>1?'s':''}`;
  document.getElementById('grid').innerHTML = list.length ? list.map(p => `
    <a href="produit.html?id=${p.id}" class="product-card">
      <div class="card-image-wrap">
        ${p.sellerLive ? `<span class="card-badge" style="background:#ef4444;color:#fff;animation:livePulse 2s infinite;">🔴 LIVE</span>` : (p.discount ? `<span class="card-badge">-${p.discount}%</span>` : '')}
        <span class="card-fav">🤍</span>
        <img src="${p.image}" alt="${p.name}">
      </div>
      <div class="card-info">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
          <img src="${p.sellerAvatar}" style="width:16px;height:16px;border-radius:50%;object-fit:cover;pointer-events:auto;">
          <span style="font-size:10px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;">${p.seller}</span>
        </div>
        <div class="card-name">${p.name}</div>
        <div class="card-price">${p.price.toLocaleString()} FCFA</div>
        ${p.oldPrice ? `<div><span class="card-old">${p.oldPrice.toLocaleString()} FCFA</span></div>` : ''}
        <div class="card-rating">⭐ ${p.rating} (${p.reviews})</div>
      </div>
    </a>
  `).join('') : '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">Aucun produit trouvé</div>';
}

function filt(t,el){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  let l = currentList;
  if(t==='live') l = currentList.filter(p=>p.sellerLive);
  if(t==='promo') l = currentList.filter(p=>p.discount);
  if(t==='top') l = currentList.filter(p=>p.rating>=4.8);
  render(l);
}
function search(q){
  render(currentList.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())));
}
render(currentList);
</script>
</body>
</html>
