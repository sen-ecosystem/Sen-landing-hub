  <style>
    body { background: #f5f5f0; margin: 0; font-family: -apple-system, sans-serif; padding-bottom: 80px; }
    .topbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; color: #0f6b4e; }
    .search { flex: 1; padding: 10px 12px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    .filters { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .chip { background: #f5f5f0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .chip.active { background: #0f6b4e; color: #fff; }
    .result-count { padding: 12px 16px; font-size: 13px; color: #666; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px; }
    .pcard { background: #fff; border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; }
    .pimg { height: 130px; background: #f5f5f0; display: flex; align-items: center; justify-content: center; position: relative; }
    .pimg i { color: #d4a574; width: 40px; height: 40px; }
    .badge { position: absolute; top: 6px; left: 6px; background: #dc2626; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
    .pinfo { padding: 10px; }
    .pname { font-size: 12px; font-weight: 600; height: 32px; overflow: hidden; }
    .pprice { color: #0f6b4e; font-weight: 800; font-size: 14px; }
    .pstars { color: #d4a574; font-size: 10px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e5e7eb; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #666; font-size: 11px; }
    .bottom-nav a.active { color: #0f6b4e; }
    .bottom-nav a i { width: 22px; height: 22px; }
  </style>
</head>
