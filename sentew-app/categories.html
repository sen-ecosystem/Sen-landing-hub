<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/app.css?v=52">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #f5f5f0; margin: 0; font-family: -apple-system, sans-serif; padding-bottom: 80px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .topbar h1 { color: #0f6b4e; font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; color: #0f6b4e; }
    .search-bar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .search-input { width: 100%; padding: 10px 12px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 16px; }
    .cat { background: #fff; border-radius: 12px; padding: 16px 8px; text-align: center; text-decoration: none; color: inherit; }
    .cat-icon { width: 56px; height: 56px; border-radius: 16px; background: #f5f5f0; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
    .cat-icon i { width: 28px; height: 28px; color: #0f6b4e; }
    .cat-mode .cat-icon { background: #fecaca; }
    .cat-mode .cat-icon i { color: #dc2626; }
    .cat-elec .cat-icon { background: #dbeafe; }
    .cat-elec .cat-icon i { color: #1e40af; }
    .cat-food .cat-icon { background: #fef3c7; }
    .cat-food .cat-icon i { color: #92400e; }
    .cat-beaute .cat-icon { background: #fce7f3; }
    .cat-beaute .cat-icon i { color: #be185d; }
    .cat-maison .cat-icon { background: #d1fae5; }
    .cat-maison .cat-icon i { color: #065f46; }
    .cat-sport .cat-icon { background: #e0e7ff; }
    .cat-sport .cat-icon i { color: #4338ca; }
    .cat-name { font-size: 13px; font-weight: 700; }
    .cat-count { font-size: 10px; color: #666; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e5e7eb; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #666; font-size: 11px; }
    .bottom-nav a.active { color: #0f6b4e; }
    .bottom-nav a i { width: 22px; height: 22px; }
  </style>
</head>
<body class="light-mode">

  </a>
  <a href="recherche-resultats.html?cat=maison" class="cat cat-maison">

  </a>
  <a href="recherche-resultats.html?cat=sport" class="cat cat-sport">
    <div class="cat-icon"><i data-lucide="dumbbell"></i></div>

  <a href="recherche-resultats.html?cat=livres" class="cat">

  </a>
  <a href="recherche-resultats.html?cat=jouets" class="cat">

<nav class="bottom-nav">

<script>lucide.createIcons();</script>
<script>
/* ===== PANNEAU FLASH IN-FEED : 1 pub tous les 8 produits (style leader) ===== */
window.addEventListener('load', function(){
  var EVERY = 8; /* ← change ici : 8 = tous les 8 produits (20 = tous les 20) */
  var ADS = [
    {bg:'linear-gradient(135deg,#e63946,#ff7b00)', icon:'⚡', title:'VENTE FLASH -30%', txt:'Code RAMADAN30 · Jusqu\'à ce soir 23h', btn:'J\'EN PROFITE', href:'produits.html?c=mode'},
    {bg:'linear-gradient(135deg,#0f6b4e,#0a4d38)', icon:'🎁', title:'PARRAINAGE : 500 FCFA OFFERTS', txt:'Par ami qui fait sa 1ère commande', btn:'PARRAINER', href:'parrainage.html'},
    {bg:'linear-gradient(135deg,#6b46c1,#4c1d95)', icon:'🔴', title:'LIVE SHOPPING EN DIRECT', txt:'Achète en direct auprès des vendeurs', btn:'REGARDER', href:'boutiques-live.html'},
    {bg:'linear-gradient(135deg,#d4a574,#b8860b)', icon:'🚚', title:'LIVRAISON GRATUITE', txt:'Dès 50 000 FCFA d\'achat · Partout au Sénégal', btn:'COMMANDER', href:'produits.html'}
  ];
  /* Trouve les cartes produits de la page */
  var cards = document.querySelectorAll('.prod-card, .pcard, article[class*="card"], [data-cat]');
  if(cards.length < EVERY) return;
  var grid = cards[0].parentElement;
  var adIndex = 0;
  cards.forEach(function(card, i){
    if((i+1) % EVERY !== 0) return;
    var ad = ADS[adIndex % ADS.length]; adIndex++;
    var banner = document.createElement('a');
    banner.href = ad.href;
    banner.className = 'flash-ad';
    banner.style.cssText = 'grid-column:1/-1;display:flex;align-items:center;gap:12px;background:'+ad.bg+';color:#fff;border-radius:14px;padding:14px 16px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.15);position:relative;overflow:hidden;animation:adGlow 2s infinite';
    banner.innerHTML =
      '<div style="font-size:26px;flex-shrink:0;animation:adBounce 1.5s infinite">'+ad.icon+'</div>'+
      '<div style="flex:1;min-width:0"><div style="font-weight:900;font-size:14px;letter-spacing:.3px">'+ad.title+'</div>'+
      '<div style="font-size:11px;opacity:.9;margin-top:2px">'+ad.txt+'</div></div>'+
      '<span style="background:#fff;color:#0a1f17;font-size:10px;font-weight:800;padding:6px 12px;border-radius:10px;flex-shrink:0">'+ad.btn+' ›</span>';
    card.after(banner);
  });
  /* Animations */
  var st = document.createElement('style');
  st.textContent = '@keyframes adGlow{0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.15)}50%{box-shadow:0 4px 22px rgba(230,57,70,.4)}}@keyframes adBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}';
  document.head.appendChild(st);
});
</script>
</body>
</html>
