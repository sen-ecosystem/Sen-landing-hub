<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catégories - SEN TEW</title>
  <link rel="stylesheet" href="css/app.css?v=52">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: #f5f5f0; margin: 0; font-family: -apple-system, sans-serif; padding-bottom: 80px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .topbar h1 { color: #0f6b4e; font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; color: #0f6b4e; }
    .search-bar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .search-input { width: 100%; padding: 10px 12px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 16px; }
    .cat { background: #fff; border-radius: 12px; padding: 16px 8px; text-align: center; text-decoration: none; color: inherit; }
    .cat-icon { width: 56px; height: 56px; border-radius: 16px; background: #f5f5f0; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
    .cat-icon i { width: 28px; height: 28px; color: #0f6b4e; }
    .cat-mode .cat-icon { background: #fecaca; }
    .cat-mode .cat-icon i { color: #dc2626; }
    .cat-elec .cat-icon { background: #dbeafe; }
    .cat-elec .cat-icon i { color: #1e40af; }
    .cat-food .cat-icon { background: #fef3c7; }
    .cat-food .cat-icon i { color: #92400e; }
    .cat-beaute .cat-icon { background: #fce7f3; }
    .cat-beaute .cat-icon i { color: #be185d; }
    .cat-maison .cat-icon { background: #d1fae5; }
    .cat-maison .cat-icon i { color: #065f46; }
    .cat-sport .cat-icon { background: #e0e7ff; }
    .cat-sport .cat-icon i { color: #4338ca; }
    .cat-name { font-size: 13px; font-weight: 700; }
    .cat-count { font-size: 10px; color: #666; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e5e7eb; }
    .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #666; font-size: 11px; }
    .bottom-nav a.active { color: #0f6b4e; }
    .bottom-nav a i { width: 22px; height: 22px; }
  </style>
</head>
<body class="light-mode">

<header class="topbar">
  <button class="icon-btn" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
  <h1><i data-lucide="grid"></i> Catégories</h1>
  <button class="icon-btn" onclick="location.href='recherche-ia.html'"><i data-lucide="search"></i></button>
</header>

<div class="search-bar">
  <input type="text" class="search-input" placeholder="🔍 Rechercher une catégorie...">
</div>

<div class="categories-grid">
  <a href="recherche-resultats.html?cat=mode" class="cat cat-mode">
    <div class="cat-icon"><i data-lucide="shirt"></i></div>
    <div class="cat-name">Mode</div>
    <div class="cat-count">1 240 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=electronique" class="cat cat-elec">
    <div class="cat-icon"><i data-lucide="smartphone"></i></div>
    <div class="cat-name">Électronique</div>
    <div class="cat-count">890 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=alimentation" class="cat cat-food">
    <div class="cat-icon"><i data-lucide="apple"></i></div>
    <div class="cat-name">Alimentation</div>
    <div class="cat-count">450 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=beaute" class="cat cat-beaute">
    <div class="cat-icon"><i data-lucide="sparkles"></i></div>
    <div class="cat-name">Beauté</div>
    <div class="cat-count">620 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=maison" class="cat cat-maison">
    <div class="cat-icon"><i data-lucide="home"></i></div>
    <div class="cat-name">Maison</div>
    <div class="cat-count">780 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=sport" class="cat cat-sport">
    <div class="cat-icon"><i data-lucide="dumbbell"></i></div>
    <div class="cat-name">Sport</div>
    <div class="cat-count">340 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=livres" class="cat">
    <div class="cat-icon"><i data-lucide="book"></i></div>
    <div class="cat-name">Livres</div>
    <div class="cat-count">180 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=auto" class="cat">
    <div class="cat-icon"><i data-lucide="car"></i></div>
    <div class="cat-name">Auto</div>
    <div class="cat-count">220 produits</div>
  </a>
  <a href="recherche-resultats.html?cat=jouets" class="cat">
    <div class="cat-icon"><i data-lucide="gamepad-2"></i></div>
    <div class="cat-name">Jouets</div>
    <div class="cat-count">160 produits</div>
  </a>
</div>

<nav class="bottom-nav">
  <a href="index.html"><i data-lucide="home"></i><span>Accueil</span></a>
  <a href="categories.html" class="active"><i data-lucide="grid"></i><span>Catégories</span></a>
  <a href="panier.html"><i data-lucide="shopping-cart"></i><span>Panier</span></a>
  <a href="messages.html"><i data-lucide="message-circle"></i><span>Messages</span></a>
  <a href="profil.html"><i data-lucide="user"></i><span>Profil</span></a>
</nav>

<script>lucide.createIcons();</script>
</body>
</html>
