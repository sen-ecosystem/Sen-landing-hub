<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catégories - SEN TEW</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF7">
<link rel="stylesheet" href="css/app.css">
</head>
<body oncontextmenu="return false">
<div class="app">
  <header class="app-header">
    <div class="app-logo">
      <div class="logo-icon">👑</div>
      <div>
        <div class="logo-text">SEN TEW</div>
        <div class="logo-sub">Le marché de chez nous</div>
      </div>
    </div>
    <button class="btn btn-primary" style="padding:8px 16px;font-size:12px;">⚙ Filtrer</button>
  </header>

  <main class="app-content">
    <div style="padding:16px;">
      <h1 style="font-size:28px;font-weight:900;color:var(--text);margin-bottom:12px;">Catégories</h1>
    </div>

    <div class="search-box" style="padding:0 16px 12px;">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Rechercher une catégorie...">
      </div>
    </div>

    <!-- GRID catégories avec images -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px;" id="catGrid"></div>

    <div style="height:100px;"></div>
  </main>

  <!-- BOTTOM NAV avec bouton central SEN TEW -->
  <nav class="app-nav">
    <a href="index.html">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Accueil</div>
    </a>
    <a href="categories.html" class="active">
      <div class="nav-icon">▦</div>
      <div class="nav-label">Catégories</div>
    </a>
    <a href="vendeur.html" class="center">
      <div class="nav-icon">👑<span class="center-txt">SEN TEW</span></div>
      <div class="nav-label" style="visibility:hidden;">.</div>
    </a>
    <a href="favoris.html">
      <div class="nav-icon">❤</div>
      <div class="nav-label">Favoris</div>
    </a>
    <a href="profil.html">
      <div class="nav-icon">👤</div>
      <div class="nav-label">Compte</div>
    </a>
  </nav>
</div>

<script>
const cats=[
  {name:'Mode & Vêtements',count:'1 245',img:'https://images.unsplash.com/photo-1595777216528-071e0127ccbf?w=400',featured:false},
  {name:'Électronique',count:'2 345',img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400',featured:false},
  {name:'Maison & Déco',count:'1 876',img:'https://images.unsplash.com/photo-1600166898405-da9535204843?w=400',featured:false},
  {name:'Beauté & Cosmétique',count:'1 234',img:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=400',featured:false},
  {name:'Alimentation & Boissons',count:'2 987',img:'https://images.unsplash.com/photo-1607532941433-304659e8198a?w=400',featured:false},
  {name:'Bébé & Enfant',count:'1 654',img:'https://images.unsplash.com/photo-1618842676088-c4d48a6a7c9d?w=400',featured:false},
  {name:'Sport & Loisirs',count:'987',img:'https://images.unsplash.com/photo-1614632537190-23e4146777db?w=400',featured:false},
  {name:'Auto & Moto',count:'1 234',img:'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400',featured:false},
  {name:'Artisanat Africain',count:'2 456',img:'https://images.unsplash.com/photo-1590069261209-f8e9b8642343?w=400',featured:true},
  {name:'Livres',count:'1 245',img:'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400',featured:false},
  {name:'Santé',count:'1 034',img:'https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=400',featured:false},
  {name:'Bijoux',count:'1 145',img:'https://images.unsplash.com/photo-1611085583191-a3b181a88401?w=400',featured:false}
];
document.getElementById('catGrid').innerHTML=cats.map(c=>`
  <a href="produits.html?cat=${c.name}" style="background:var(--white);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--text);box-shadow:var(--shadow);border:1px solid var(--border);${c.featured?'border:2px solid var(--gold);position:relative;':''}">
    ${c.featured?'<div style="position:absolute;top:6px;left:6px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--emerald-dark);padding:3px 8px;border-radius:8px;font-size:9px;font-weight:900;z-index:2;">⭐ À la une</div>':''}
    <div style="height:110px;background:url(${c.img}) center/cover;"></div>
    <div style="padding:10px;">
      <div style="font-size:13px;font-weight:700;line-height:1.3;margin-bottom:4px;">${c.name}</div>
      <div style="font-size:11px;color:var(--gold-dark);font-weight:600;">${c.count} produits</div>
    </div>
  </a>
`).join('');
</script>
</body>
</html>
